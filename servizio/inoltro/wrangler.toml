# Il servizio di inoltro delle sfide (docs/arena/multigiocatore.md). `npx wrangler dev` per provarlo in locale,
# `npx wrangler deploy` per metterlo sul tuo account Cloudflare.
name = "sfida"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "STANZE"
class_name = "Stanza"

[[durable_objects.bindings]]
name = "LIMITE"
class_name = "Limite"

[[durable_objects.bindings]]
name = "CODICI"
class_name = "Codice"

[[durable_objects.bindings]]
name = "ERRORI"
class_name = "Errori"

[[durable_objects.bindings]]
name = "PRESENZA"
class_name = "Presenza"

# il piano gratuito vuole i Durable Object con la memoria SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stanza", "Limite"]

# gli amici (docs/core/amici.md): i codici brevi, i tentativi sbagliati e le amicizie
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Codice", "Errori", "Coppia"]

# gli amici con un collegamento solo per telefono: la presenza sostituisce la coppia (mai usata, niente da portare)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Presenza"]
deleted_classes = ["Coppia"]
