# Rilascia la scuola (docs/scuola/architettura.md): un tag `scuola-*` costruisce le due pagine, le allega
# a una release e fa ripubblicare il sito, che è l'unico a scrivere su Pages (pubblica.yml).
name: Scuola

on:
  push:
    tags: ['scuola-*']

permissions:
  contents: write     # la release
  actions: write      # far partire pubblica.yml

jobs:
  rilascia:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unita
      - run: npm run build:scuola
      - name: La release col nome del tag
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "La scuola, versione $GITHUB_REF_NAME" \
            dist-scuola/index.html dist-scuola/maestra.html dist-scuola/versione.json
      # il sito di casa riparte da main e si porta dietro l'ultima release della scuola
      - name: Ripubblica il sito
        run: gh workflow run pubblica.yml --ref main
