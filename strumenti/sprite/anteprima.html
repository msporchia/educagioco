<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima degli sprite — la fattoria</title>
<!--
  QUESTA PAGINA NON HA UN ELENCO DENTRO.

  Legge i moduli veri del gioco — l'atlante, il dizionario delle tessere,
  il catalogo, gli ostacoli — e disegna quello che ci trova. Aggiungere uno
  sprite e rilanciare `atlante.py` basta perche' compaia qui: non c'e'
  niente da aggiornare a mano, e quindi niente che possa restare indietro.
  Se una cosa qui non si vede, non si vede nemmeno in gioco.

  Vuole un server perche' importa dei moduli, e Chrome non lascia importare
  moduli da file://. Uno qualunque va bene, non serve quello di Vite:

      python3 -m http.server 8000     (dalla radice del repo)
      http://localhost:8000/strumenti/sprite/anteprima.html

  `npm run dev` fa lo stesso e in piu' ricarica da se' quando tocchi un file.
-->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body { margin:0; padding:18px 16px 60px; background:#0e1512; color:#e8efe6;
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  main { max-width:1180px; margin:0 auto }
  h1 { font-size:24px; margin:0 0 4px }
  .sotto { color:#8fa691; margin:0 0 18px; font-size:14px }
  h2 { font-size:17px; margin:30px 0 4px; padding-bottom:6px;
    border-bottom:1px solid #24352b; display:flex; align-items:baseline; gap:10px }
  h2 small { color:#7d947f; font-weight:400; font-size:13px }
  h3 { font-size:14px; margin:18px 0 8px; color:#a9c4aa; font-weight:600 }

  .attrezzi { position:sticky; top:0; z-index:5; display:flex; gap:10px; align-items:center;
    flex-wrap:wrap; padding:10px 0; background:#0e1512ee; backdrop-filter:blur(6px);
    border-bottom:1px solid #24352b; margin-bottom:6px }
  .attrezzi input[type=search] { flex:1; min-width:180px; padding:7px 11px; border-radius:9px;
    border:1px solid #2f453a; background:#131e19; color:inherit; font:inherit }
  .attrezzi label { display:flex; align-items:center; gap:6px; font-size:13px; color:#9db69f }

  .fila { display:flex; flex-wrap:wrap; gap:10px }
  .carta { background:#131e19; border:1px solid #24352b; border-radius:12px;
    padding:10px; display:flex; flex-direction:column; gap:7px; min-width:118px }
  .carta.spenta { display:none }
  .tela { display:flex; align-items:flex-end; justify-content:center; gap:8px;
    min-height:78px; background:
      linear-gradient(45deg,#182420 25%,transparent 25%,transparent 75%,#182420 75%),
      linear-gradient(45deg,#182420 25%,#101a16 25%,#101a16 75%,#182420 75%);
    background-size:14px 14px; background-position:0 0,7px 7px;
    border-radius:8px; padding:6px }
  canvas { image-rendering:pixelated; display:block }
  .nome { font-weight:600; font-size:13.5px; line-height:1.25 }
  code { font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:#0b120f; border:1px solid #22322a; border-radius:5px;
    padding:1px 5px; color:#9fd3a8; word-break:break-all }
  .dati { display:flex; flex-wrap:wrap; gap:4px 8px; font-size:11.5px; color:#8fa691 }
  .dati b { color:#cfe0cd; font-weight:600 }
  .cattivo { color:#ffb4b4 }
  .buono { color:#a7dba7 }
  .etichetta { font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:#7d947f; margin-bottom:-2px }
  .varianti { display:flex; gap:6px; align-items:flex-end }
  .variante { text-align:center }
  .variante em { display:block; font-style:normal; font-size:10px; color:#7d947f }
  .guasti { background:#2b1a1a; border:1px solid #5a2f2f; color:#ffc9c9;
    border-radius:10px; padding:10px 12px; margin:14px 0; font-size:13.5px }
  .guasti ul { margin:6px 0 0; padding-left:18px }
  .vuoto { color:#7d947f; font-size:13px }
  #prato { width:100%; border-radius:12px; border:1px solid #24352b;
    display:block; touch-action:none; cursor:crosshair }
  #svuota { padding:6px 12px; border-radius:9px; border:1px solid #2f453a;
    background:#1c2b23; color:inherit; font:inherit; cursor:pointer }
  .carta { cursor:pointer }
  .carta:hover { border-color:#4a6b52 }
</style>
</head>
<body>
<main>
  <h1>Anteprima degli sprite</h1>
  <p class="sotto">Letta dai moduli veri del gioco. Nessun elenco scritto qui
    dentro: quello che c'è nell'atlante compare, quello che non c'è manca.</p>

  <div class="attrezzi">
    <input type="search" id="cerca" placeholder="cerca per nome o codice…" autocomplete="off">
    <label>ingrandimento
      <input type="range" id="zoom" min="1" max="6" value="3" step="1">
      <b id="zoomN">3×</b></label>
    <label><input type="checkbox" id="ferma"> fermi</label>
  </div>

  <section id="campo">
    <h2>Campo di prova
      <small>tocca una carta qui sotto e finisce qui — poi trascinalo, o
        tocca il prato e ci va camminando</small></h2>
    <canvas id="prato" height="300"></canvas>
    <div class="attrezzi" style="position:static;border:0;padding:6px 0">
      <label>ingrandimento del campo
        <input type="range" id="zoomCampo" min="1" max="6" value="3" step="1">
        <b id="zoomCampoN">3×</b></label>
      <button id="svuota">svuota il campo</button>
      <span class="vuoto" id="quantiInCampo">niente in campo</span>
    </div>
  </section>

  <div id="dove"></div>
</main>

<script type="module">
/* ── i file veri, non una copia ────────────────────────────────────── */
import { ATLANTE, PEZZI, ATTORI, VERSI, DA, fotogrammi } from '../../src/giochi/fattoria/dati/atlante.js'
import { CATEGORIE, CATALOGO, guastiDelCatalogo } from '../../src/giochi/fattoria/dati/catalogo.js'
import { OSTACOLI, guastiDegliOstacoli } from '../../src/giochi/fattoria/dati/ostacoli.js'
import { guastiDelMondo } from '../../src/giochi/fattoria/dati/mondo.js'

const dove = document.getElementById('dove')
const atlante = new Image()
const tele = []                    // ogni canvas disegnato, per ridisegnarli allo zoom
let zoom = 3, fermi = false, orologio = 0

/* Un pezzo dell'atlante su un canvas suo. Se il nome non c'è, si vede
   che non c'è: un riquadro rosso col punto interrogativo, non il vuoto. */
function tela(nome, { anima = null } = {}) {
  const c = document.createElement('canvas')
  c.dataset.nome = nome
  if (anima) c.dataset.anima = JSON.stringify(anima)
  tele.push(c)
  return c
}

function disegnaTela(c) {
  let nome = c.dataset.nome
  const anima = c.dataset.anima && JSON.parse(c.dataset.anima)
  if (anima && !fermi) nome = anima[Math.floor(orologio * 4) % anima.length]
  const p = PEZZI[nome]
  const g = c.getContext('2d')
  g.imageSmoothingEnabled = false
  if (!p) {
    c.width = 16 * zoom; c.height = 16 * zoom
    g.fillStyle = '#5a2f2f'; g.fillRect(0, 0, c.width, c.height)
    g.fillStyle = '#ffc9c9'; g.font = `${10 * zoom}px monospace`
    g.textAlign = 'center'; g.fillText('?', c.width / 2, c.height / 2 + 4 * zoom)
    return
  }
  c.width = p[2] * zoom; c.height = p[3] * zoom
  g.imageSmoothingEnabled = false
  if (c.dataset.specchio) { g.translate(c.width, 0); g.scale(-1, 1) }
  g.drawImage(atlante, p[0], p[1], p[2], p[3], 0, 0, c.width, c.height)
}

const el = (tag, cls, testo) => {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (testo != null) e.textContent = testo
  return e
}

function carta(nome, codice, cerca, mette) {
  const d = el('div', 'carta')
  d.dataset.cerca = (cerca || `${nome} ${codice}`).toLowerCase()
  if (mette) d.dataset.mette = mette
  d.title = mette ? 'tocca per provarlo nel campo' : ''
  return d
}

function dati(d, voci) {
  const r = el('div', 'dati')
  for (const [k, v, classe] of voci) {
    const s = el('span', classe)
    s.innerHTML = `${k} <b>${v}</b>`
    r.appendChild(s)
  }
  d.appendChild(r)
}

/* ── i guasti che i dati trovano da soli ──────────────────────────── */
function sezioneGuasti() {
  const tutti = [
    ...guastiDelMondo(),
    ...guastiDelCatalogo(), ...guastiDegliOstacoli(),
  ]
  if (!tutti.length) return
  const d = el('div', 'guasti')
  d.appendChild(el('b', null, `${tutti.length} guasti nei dati:`))
  const ul = el('ul')
  for (const g of tutti) ul.appendChild(el('li', null, g))
  d.appendChild(ul)
  dove.appendChild(d)
}

/* ── gli attori ───────────────────────────────────────────────────── */
function sezioneAttori() {
  const h = el('h2', null, 'Chi cammina')
  h.appendChild(el('small', null,
    `${ATTORI.length} attori · ${VERSI.length} versi`))
  dove.appendChild(h)
  dove.appendChild(el('p', 'sotto',
    'Le pose di lato guardano a destra: «sinistra» non esiste nell\'atlante, ' +
    'è la stessa specchiata. Un quadrupede che di lato sta su due zampe vuol ' +
    'dire foglio importato senza --zampe.'))

  for (const chi of ATTORI) {
    dove.appendChild(el('h3', null, chi))
    const fila = el('div', 'fila')

    // la camminata, un riquadro per verso più lo specchio
    const anda = carta(chi, chi, `${chi} camminata`, chi)
    anda.appendChild(el('div', 'etichetta', 'come cammina'))
    const t1 = el('div', 'tela')
    for (const verso of VERSI) {
      const v = el('div', 'variante')
      v.appendChild(tela(`${chi}_${verso}0`, {
        anima: Array.from({ length: fotogrammi(chi, verso) }, (_, i) => `${chi}_${verso}${i}`) }))
      v.appendChild(el('em', null, verso))
      t1.appendChild(v)
    }
    const sx = el('div', 'variante')
    const cs = tela(`${chi}_lato0`, {
      anima: Array.from({ length: fotogrammi(chi, 'lato') }, (_, i) => `${chi}_lato${i}`) })
    cs.dataset.specchio = '1'
    sx.appendChild(cs)
    sx.appendChild(el('em', null, 'sinistra'))
    t1.appendChild(sx)
    anda.appendChild(t1)
    anda.appendChild(el('div', 'nome', chi))
    const c1 = el('code', null, `${chi}_lato0`)
    anda.appendChild(c1)
    fila.appendChild(anda)

    // tutti i fotogrammi, uno per uno
    for (const verso of VERSI) {
      const d = carta(chi, `${chi}_${verso}`, `${chi} ${verso}`, chi)
      d.appendChild(el('div', 'etichetta', verso))
      const t = el('div', 'tela')
      for (let i = 0; i < fotogrammi(chi, verso); i++) {
        const v = el('div', 'variante')
        v.appendChild(tela(`${chi}_${verso}${i}`))
        v.appendChild(el('em', null, i))
        t.appendChild(v)
      }
      d.appendChild(t)
      d.appendChild(el('code', null, `${chi}_${verso}0…${fotogrammi(chi, verso) - 1}`))
      fila.appendChild(d)
    }
    dove.appendChild(fila)
  }
}

/* ── il catalogo ──────────────────────────────────────────────────── */
function sezioneCatalogo() {
  const h = el('h2', null, 'Quello che si può mettere')
  h.appendChild(el('small', null, `${CATALOGO.length} voci in ${CATEGORIE.length} categorie`))
  dove.appendChild(h)

  for (const cat of CATEGORIE) {
    dove.appendChild(el('h3', null, `${cat.icona || ''} ${cat.nome} · ${cat.chiave}`))
    const fila = el('div', 'fila')
    for (const v of cat.voci) {
      const d = carta(v.nome, v.id, `${v.nome} ${v.id} ${v.pezzo} ${cat.chiave}`, v.pezzo)
      const t = el('div', 'tela')
      if (v.giri) {
        /* le varianti una accanto all'altra, che è il punto di guardarle */
        v.giri.forEach((g, i) => {
          const w = el('div', 'variante')
          w.appendChild(tela(g.pezzo))
          w.appendChild(el('em', null, `${i} · ${g.piede.join('×')}`))
          t.appendChild(w)
        })
      } else {
        t.appendChild(tela(v.pezzo, { anima: v.anima || null }))
      }
      d.appendChild(t)
      d.appendChild(el('div', 'nome', v.nome))
      d.appendChild(el('code', null, v.id))
      dati(d, [
        ['🪙', v.prezzo],
        ['piede', v.piede.join('×')],
        ...(v.sotto ? [['', 'per terra']] : []),
        ...(v.anima ? [['', `${v.anima.length} fotogrammi`]] : []),
        ...(v.giri ? [['', `${v.giri.length} versi`, 'buono']] : []),
      ])
      d.appendChild(el('code', null, `pezzo: ${v.pezzo}`))
      fila.appendChild(d)
    }
    dove.appendChild(fila)
  }
}

/* ── gli ostacoli ─────────────────────────────────────────────────── */
function sezioneOstacoli() {
  const voci = Object.entries(OSTACOLI)
  const h = el('h2', null, 'Quello che c\'è nel bosco')
  h.appendChild(el('small', null,
    `${voci.length} tipi · sgombrare deve rendere più di quanto costa`))
  dove.appendChild(h)
  const fila = el('div', 'fila')
  for (const [id, o] of voci) {
    const d = carta(o.nome, id, `${o.nome} ${id} ${o.pezzo} ostacolo`, o.pezzo)
    const t = el('div', 'tela')
    t.appendChild(tela(o.pezzo))
    d.appendChild(t)
    d.appendChild(el('div', 'nome', o.nome))
    d.appendChild(el('code', null, id))
    const guadagno = o.resa - o.costo
    dati(d, [
      ['costa', o.costo], ['rende', o.resa],
      ['guadagno', guadagno > 0 ? `+${guadagno}` : guadagno, guadagno > 0 ? 'buono' : 'cattivo'],
      ['piede', o.piede.join('×')],
    ])
    fila.appendChild(d)
  }
  dove.appendChild(fila)
}

/* ── tutti i pezzi ────────────────────────────────────────────────── */
function sezioneTessere() {
  /* chi cita cosa si ricava, non si scrive: cosi' un pezzo che nessuno usa
     piu' si vede da solo invece di restare li' per anni */
  const citate = new Set([
    ...CATALOGO.flatMap(v => [v.pezzo, ...(v.anima || []), ...(v.giri || []).map(g => g.pezzo)]),
    ...Object.values(OSTACOLI).map(o => o.pezzo),
  ])
  const nomi = Object.keys(PEZZI).filter(n => !/_\w+\d+$/.test(n)).sort()
  const orfane = nomi.filter(n => !citate.has(n) && !n.startsWith('erba'))

  const h = el('h2', null, 'Tutti i pezzi')
  h.appendChild(el('small', null,
    `${nomi.length} nell'atlante` +
    (orfane.length ? ` · ${orfane.length} non citati da nessuno` : '')))
  dove.appendChild(h)
  dove.appendChild(el('p', 'sotto',
    'Ognuno arriva da un foglio in strumenti/sprite/sorgenti/, ritagliato ' +
    'dove dice il suo foglietto .json. Per cambiarne uno si tocca quello.'))

  const fila = el('div', 'fila')
  for (const n of nomi) {
    const [x, y, w, hh] = PEZZI[n]
    const d = carta(n, n, `${n} ${DA[n] || ''}`, n)
    const t = el('div', 'tela')
    t.appendChild(tela(n))
    d.appendChild(t)
    d.appendChild(el('code', null, n))
    dati(d, [
      ['', `${w}×${hh}`], ['da', DA[n] || '?'],
      ...(orfane.includes(n) ? [['', 'non citato', 'cattivo']] : []),
    ])
    fila.appendChild(d)
  }
  dove.appendChild(fila)
}

/* ══════════════════════════════════════════════════════════════════
   IL CAMPO DI PROVA

   Guardare uno sprite fermo su un fondo a scacchi non dice se funziona:
   un cane si giudica mentre cammina, e un oggetto si giudica appoggiato
   sull'erba vera accanto a qualcos'altro. Qui si tocca una carta e la
   cosa compare, poi la si trascina o le si dice dove andare.

   Il prato e le figure sono le stesse dell'atlante del gioco: se una cosa
   qui sta male, sta male anche in fattoria.
   ══════════════════════════════════════════════════════════════════ */
const prato = document.getElementById('prato')
const gp = prato.getContext('2d')
const inCampo = []
let zoomCampo = 3, presoInCampo = null, sceltoInCampo = null

const ERBE = ['erba0', 'erba0', 'erba0', 'erba0', 'erba1', 'erba2', 'erba3']
function sorte(x, y) {
  let n = (x * 73856093) ^ (y * 19349663)
  n = (n ^ (n >>> 13)) * 1274126177
  return ((n ^ (n >>> 16)) >>> 0) % 100000 / 100000
}

const eAttore = nome => ATTORI.includes(nome)

function metti(nome) {
  const c = prato.width / (16 * zoomCampo)
  const voce = {
    nome, attore: eAttore(nome),
    x: 2 + inCampo.length * 2.2 % Math.max(4, c - 4), y: 3 + (inCampo.length % 3),
    verso: 'giu', passo: 0, meta: null,
  }
  inCampo.push(voce)
  sceltoInCampo = voce
  aggiornaConta()
  return voce
}

function aggiornaConta() {
  const q = document.getElementById('quantiInCampo')
  q.textContent = inCampo.length
    ? `${inCampo.length} in campo · ${sceltoInCampo ? sceltoInCampo.nome : '—'}`
    : 'niente in campo'
}

function pezzoDiVoce(v) {
  if (!v.attore) return PEZZI[v.nome]
  const fr = v.meta ? 1 + (Math.floor(v.passo * 6) % 3) : 0
  const verso = v.verso === 'sinistra' ? 'lato' : v.verso
  return PEZZI[`${v.nome}_${verso}${fr}`]
}

function riquadroDiVoce(v) {
  const p = pezzoDiVoce(v)
  if (!p) return { x: 0, y: 0, w: 0, h: 0 }
  const C = 16 * zoomCampo
  return { x: v.x * C - (p[2] * zoomCampo) / 2 + C / 2,
           y: (v.y + 1) * C - p[3] * zoomCampo,
           w: p[2] * zoomCampo, h: p[3] * zoomCampo }
}

function disegnaCampo(dt) {
  const C = 16 * zoomCampo
  gp.imageSmoothingEnabled = false
  const cx = Math.ceil(prato.width / C), cy = Math.ceil(prato.height / C)
  for (let x = 0; x < cx; x++)
    for (let y = 0; y < cy; y++) {
      const e = PEZZI[ERBE[Math.floor(sorte(x, y) * 100) % ERBE.length]]
      gp.drawImage(atlante, e[0], e[1], e[2], e[3], x * C, y * C, C, C)
    }

  for (const v of inCampo) {
    if (!v.attore || !v.meta) continue
    const dx = v.meta.x - v.x, dy = v.meta.y - v.y
    const d = Math.hypot(dx, dy)
    if (d < .12) { v.meta = null; continue }
    const p = 3.4 * dt
    v.x += dx / d * Math.min(p, d); v.y += dy / d * Math.min(p, d); v.passo += dt
    if (Math.abs(dx) > Math.abs(dy)) v.verso = dx > 0 ? 'lato' : 'sinistra'
    else v.verso = dy > 0 ? 'giu' : 'su'
  }

  for (const v of [...inCampo].sort((a, b) => a.y - b.y)) {
    const p = pezzoDiVoce(v)
    if (!p) continue
    const r = riquadroDiVoce(v)
    if (v.verso === 'sinistra') {
      gp.save(); gp.translate(Math.round(r.x) + r.w, Math.round(r.y)); gp.scale(-1, 1)
      gp.drawImage(atlante, p[0], p[1], p[2], p[3], 0, 0, r.w, r.h); gp.restore()
    } else {
      gp.drawImage(atlante, p[0], p[1], p[2], p[3],
        Math.round(r.x), Math.round(r.y), r.w, r.h)
    }
    if (v === sceltoInCampo) {
      gp.save(); gp.setLineDash([5, 4]); gp.lineWidth = 2
      gp.strokeStyle = 'rgba(255,255,255,.8)'
      gp.strokeRect(Math.round(r.x) + 1, Math.round(r.y) + 1, r.w - 2, r.h - 2)
      gp.restore()
    }
  }
}

function sottoIlDito(sx, sy) {
  for (let i = inCampo.length - 1; i >= 0; i--) {
    const r = riquadroDiVoce(inCampo[i])
    if (sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) return inCampo[i]
  }
  return null
}

function doveNelPrato(e) {
  const b = prato.getBoundingClientRect()
  return { x: (e.clientX - b.left) * (prato.width / b.width),
           y: (e.clientY - b.top) * (prato.height / b.height) }
}

prato.addEventListener('pointerdown', e => {
  const p = doveNelPrato(e)
  const v = sottoIlDito(p.x, p.y)
  if (v) { presoInCampo = v; sceltoInCampo = v; v.meta = null; aggiornaConta() }
  else if (sceltoInCampo && sceltoInCampo.attore) {
    const C = 16 * zoomCampo
    sceltoInCampo.meta = { x: p.x / C - .5, y: p.y / C - .5 }
  }
})
addEventListener('pointermove', e => {
  if (!presoInCampo) return
  const p = doveNelPrato(e), C = 16 * zoomCampo
  presoInCampo.x = p.x / C - .5; presoInCampo.y = p.y / C - .5
})
addEventListener('pointerup', () => { presoInCampo = null })

document.getElementById('svuota').addEventListener('click', () => {
  inCampo.length = 0; sceltoInCampo = null; aggiornaConta()
})
document.getElementById('zoomCampo').addEventListener('input', e => {
  zoomCampo = +e.target.value
  document.getElementById('zoomCampoN').textContent = zoomCampo + '×'
})

/* ogni carta porta il suo pezzo nel campo: e' la stessa carta che lo
   descrive, cosi' non c'e' un secondo elenco da tenere allineato */
dove.addEventListener('click', e => {
  const c = e.target.closest('.carta')
  if (!c || !c.dataset.mette) return
  metti(c.dataset.mette)
})

function misuraPrato() {
  prato.width = Math.round(prato.getBoundingClientRect().width)
}
addEventListener('resize', misuraPrato)

/* ── il giro ──────────────────────────────────────────────────────── */
function ridisegna() { for (const c of tele) disegnaTela(c) }

document.getElementById('zoom').addEventListener('input', e => {
  zoom = +e.target.value
  document.getElementById('zoomN').textContent = zoom + '×'
  ridisegna()
})
document.getElementById('ferma').addEventListener('change', e => { fermi = e.target.checked })
document.getElementById('cerca').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase()
  for (const d of document.querySelectorAll('.carta'))
    d.classList.toggle('spenta', !!q && !d.dataset.cerca.includes(q))
})

atlante.onload = () => {
  sezioneGuasti()
  sezioneAttori()
  sezioneCatalogo()
  sezioneOstacoli()
  sezioneTessere()
  ridisegna()
  misuraPrato()
  metti('bambina'); metti('cane-bobtail'); metti('panchina')
  let ultimo = 0, ultimoCampo = 0
  const giro = ora => {
    if (!fermi && ora - ultimo > 120) {
      ultimo = ora; orologio = ora / 1000
      for (const c of tele) if (c.dataset.anima) disegnaTela(c)
    }
    disegnaCampo(Math.min(.05, (ora - ultimoCampo) / 1000 || 0))
    ultimoCampo = ora
    requestAnimationFrame(giro)
  }
  requestAnimationFrame(giro)
}
atlante.src = ATLANTE
</script>
</body>
</html>
