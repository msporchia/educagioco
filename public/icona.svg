<!-- L'icona dell'app: un dado disegnato con forme vere.

     Prima era l'emoji 🎲 dentro un <text>, e sui telefoni non si vedeva:
     chi rasterizza un SVG per farne un'icona non ha i font di sistema a
     disposizione, quindi il glifo spariva e restava solo lo sfondo
     sfumato. Un rettangolo e cinque cerchi si disegnano ovunque allo
     stesso modo — e sono quattro righe.

     I colori sono quelli del tema (`src/style.css`): il giallo e il blu
     del fondo, i pallini nel blu scuro dei titoli. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Educagioco">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#4f6bd0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <!-- storto, perché un dado fermo e dritto sembra un quadrato -->
  <g transform="rotate(-12 256 256)">
    <rect x="132" y="132" width="248" height="248" rx="54" fill="#fffdf8"/>
    <g fill="#37509f">
      <circle cx="194" cy="194" r="25"/>
      <circle cx="318" cy="194" r="25"/>
      <circle cx="256" cy="256" r="25"/>
      <circle cx="194" cy="318" r="25"/>
      <circle cx="318" cy="318" r="25"/>
    </g>
  </g>
</svg>
