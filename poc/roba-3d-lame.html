<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roba 3D: le lame</title>
<style>
  :root { --fondo: #14161b; --carta: #1b1e25; --riga: #2c313a; --testo: #e2e5e0; --tenue: #98a09c; --male: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--fondo); color: var(--testo); font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 8px; color: var(--tenue); }
  #esito.male { color: var(--male); }
  #griglia { display: flex; flex-wrap: wrap; gap: 6px; }
  figure { margin: 0; background: var(--carta); border: 1px solid var(--riga); border-radius: 4px; padding: 3px; }
  canvas { display: block; border-radius: 3px; }
  figcaption { font-size: 10px; color: var(--tenue); margin-top: 2px; max-width: 100%; }
  figcaption b { color: var(--testo); }
</style>
</head>
<body>
<h1>Roba 3D: le lame (spada-* e ascia-*)</h1>
<p>Parametri: <code>?id=spada-05</code> una sola grande, <code>?da=0&amp;n=12</code> un sottoinsieme, <code>?pausa</code>, <code>?t=</code>.</p>
<div id="esito">in corso…</div>
<div id="griglia"></div>
<script type="module">
import { WebGLRenderer, Scene, PerspectiveCamera, HemisphereLight, DirectionalLight, Box3, Vector3, Color, CircleGeometry, Mesh, ShadowMaterial, PCFSoftShadowMap, SRGBColorSpace, ACESFilmicToneMapping, Group } from 'three'
import { crea, FIGURE } from './roba-3d/lame.js'

const url = new URLSearchParams(location.search)
const pausa = url.has('pausa'), T0 = Number(url.get('t') || 0)
const errori = []
const vecchio = console.error
console.error = (...a) => { errori.push(a.map(String).join(' ').slice(0, 300)); vecchio.apply(console, a) }
addEventListener('error', e => errori.push(String(e.message)))
const risultato = window.__prova = { ok: false, errori, figure: {} }

const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = PCFSoftShadowMap
renderer.outputColorSpace = SRGBColorSpace; renderer.toneMapping = ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1

function nuovaScena () {
  const s = new Scene(); s.background = new Color(0x2a3038)
  s.add(new HemisphereLight(0xfff0d8, 0x6a5a3a, 1.9))
  const sole = new DirectionalLight(0xfff1dc, 2.6); sole.position.set(3, 6, 5); sole.castShadow = true
  sole.shadow.mapSize.set(1024, 1024); sole.shadow.radius = 4; sole.shadow.bias = -0.0008
  const c = sole.shadow.camera; c.left = -2.5; c.right = 2.5; c.top = 2.5; c.bottom = -2.5; c.near = 0.5; c.far = 20
  s.add(sole)
  const fredda = new DirectionalLight(0xa8c8ff, 0.8); fredda.position.set(-4, 2, -3); s.add(fredda)
  return s
}

try {
  let lista = FIGURE
  if (url.get('id')) lista = FIGURE.filter(f => f.id === url.get('id'))
  else if (url.has('da') || url.has('n')) { const da = Number(url.get('da') || 0); lista = FIGURE.slice(da, da + Number(url.get('n') || 12)) }
  const singola = !!url.get('id')
  const LATO = singola ? 800 : 330
  renderer.setSize(LATO, LATO, false)
  const cont = document.getElementById('griglia')
  const celle = []
  for (const fig of FIGURE) {   // tutte vengono costruite (per i triangoli), solo la lista scelta viene mostrata
    const arma = crea(fig), tri = arma.userData.triangoli
    risultato.figure[fig.id] = { triangoli: tri }
    if (!lista.includes(fig)) continue
    const s = nuovaScena(), cam = new PerspectiveCamera(30, 1, 0.05, 50)
    const ruota = new Group(); ruota.add(arma); s.add(ruota)
    const b = new Box3(); for (const m of arma.userData.dentro.children) if (!arma.userData.liberi.includes(m)) b.expandByObject(m)
    const c = b.getCenter(new Vector3()), d = b.getSize(new Vector3())
    arma.position.set(-c.x, -c.y, -c.z)
    const suolo = new Mesh(new CircleGeometry(0.7, 32), new ShadowMaterial({ opacity: 0.35 })); suolo.rotation.x = -Math.PI / 2; suolo.position.y = -d.y / 2 - 0.04; suolo.receiveShadow = true; s.add(suolo)
    const raggio = Math.max(d.y, d.x * 1.1, d.z) * 0.58
    cam.position.set(0, d.y * 0.08, raggio / Math.tan(15 * Math.PI / 180) + 0.1); cam.lookAt(0, 0, 0)
    const fig_ = document.createElement('figure'), tela = document.createElement('canvas')
    tela.width = tela.height = LATO; tela.style.width = tela.style.height = (singola ? LATO : 330) + 'px'
    const did = document.createElement('figcaption')
    did.style.width = (singola ? LATO : 330) + 'px'
    did.innerHTML = `<b>${fig.id}</b> ${fig.nome} · ${fig.cosa}<br>${fig.elemento} · ${fig.materia} · pregio ${fig.pregio} · ${tri} tri`
    fig_.append(tela, did); cont.append(fig_)
    celle.push({ arma, ruota, s, cam, tela })
  }
  const disegna = t => {
    for (const k of celle) {
      k.ruota.rotation.y = singola ? 0.5 + t * 0.4 : 0.55
      if (k.arma.userData.anima) k.arma.userData.anima(t)
      renderer.render(k.s, k.cam); k.tela.getContext('2d').drawImage(renderer.domElement, 0, 0, k.tela.width, k.tela.height)
    }
  }
  disegna(T0)
  if (!pausa) { const t0 = performance.now(); const giro = () => { disegna(T0 + (performance.now() - t0) / 1000); requestAnimationFrame(giro) }; requestAnimationFrame(giro) }
  risultato.ok = true
} catch (e) { errori.push(String(e.stack || e)) }
const es = document.getElementById('esito')
es.textContent = errori.length ? 'errori: ' + errori.join(' | ') : 'ok'
es.className = errori.length ? 'male' : ''
risultato.ok = risultato.ok && !errori.length
</script>
</body>
</html>
