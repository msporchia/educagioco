<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La roba in 3D: bastoni e archi</title>
<style>
  :root { --fondo: #14161b; --carta: #1b1e25; --riga: #2c313a; --testo: #e2e5e0; --tenue: #98a09c; --male: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--fondo); color: var(--testo); font: 12px/1.35 system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 8px; color: var(--tenue); max-width: 120ch; }
  #esito.male { color: var(--male); }
  #griglia { display: grid; grid-template-columns: repeat(auto-fill, var(--lato)); gap: 6px; }
  figure { margin: 0; background: var(--carta); border: 1px solid var(--riga); border-radius: 4px; padding: 3px; }
  canvas { display: block; border-radius: 3px; width: var(--lato); height: var(--lato); }
  figcaption { font-size: 10.5px; color: var(--tenue); margin-top: 2px; }
  figcaption b { color: var(--testo); font-weight: 600; }
</style>
</head>
<body>
<h1>La roba in 3D: bastoni e archi (PoC)</h1>
<p>Un modello per figura (<code>poc/roba-3d/bastoni.js</code>). Parametri: <code>?id=bastone-05</code> (una sola, grande, ruota), <code>?da=0&amp;n=12</code>, <code>?solo=arco</code>, <code>?pausa</code>, <code>?t=</code>, <code>?giri=0.6</code> (rotazione), <code>?lato=330</code>.</p>
<div id="esito">in corso…</div>
<div id="griglia"></div>
<script type="module">
import { WebGLRenderer, Scene, PerspectiveCamera, HemisphereLight, DirectionalLight, Box3, Vector3, Color, Group, CircleGeometry, Mesh, ShadowMaterial, PCFSoftShadowMap, SRGBColorSpace, ACESFilmicToneMapping } from 'three'
import roba from '../strumenti/sprite/sorgenti/sotterraneo/generati/roba.json'
import { crea } from './roba-3d/bastoni.js'

const url = new URLSearchParams(location.search)
const pausa = url.has('pausa'), T0 = Number(url.get('t') || 0), giri = Number(url.get('giri') ?? 0.6)
const errori = []
const vecchio = console.error
console.error = (...a) => { errori.push(a.map(String).join(' ').slice(0, 300)); vecchio.apply(console, a) }
addEventListener('error', e => errori.push(String(e.message)))
const risultato = window.__prova = { ok: false, errori, figure: {} }

let lista = roba.figure.filter(f => /^(bastone|arco)-/.test(f.id))
if (url.get('solo')) lista = lista.filter(f => f.id.startsWith(url.get('solo')))
if (url.get('id')) lista = lista.filter(f => url.get('id').split(',').includes(f.id))
else lista = lista.slice(Number(url.get('da') || 0), url.has('n') ? Number(url.get('da') || 0) + Number(url.get('n')) : undefined)
const uno = url.has('id') && lista.length === 1
const LATO = Number(url.get('lato') || (uno ? 720 : 330))

const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = PCFSoftShadowMap
renderer.outputColorSpace = SRGBColorSpace; renderer.toneMapping = ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1
renderer.setSize(LATO, LATO, false)

function nuovaScena () {
  const s = new Scene(); s.background = new Color(0x2a3038)
  s.add(new HemisphereLight(0xfff0d8, 0x6a5a3a, 1.9))
  const sole = new DirectionalLight(0xfff1dc, 2.6); sole.position.set(3, 6, 5); sole.castShadow = true
  sole.shadow.mapSize.set(1024, 1024); sole.shadow.radius = 4; sole.shadow.bias = -0.0008
  const c = sole.shadow.camera; c.left = -2.5; c.right = 2.5; c.top = 2.5; c.bottom = -2.5; c.near = 0.5; c.far = 24
  s.add(sole)
  const fredda = new DirectionalLight(0xa8c8ff, 0.8); fredda.position.set(-4, 2, -3); s.add(fredda)
  return s
}
const celle = []
const cont = document.getElementById('griglia'); cont.style.setProperty('--lato', LATO + 'px')
for (const fig of lista) {
  try {
    const oggetto = crea(fig), tri = oggetto.userData.triangoli
    risultato.figure[fig.id] = { triangoli: tri }
    const s = nuovaScena(), cam = new PerspectiveCamera(30, 1, 0.05, 50)
    const ruota = new Group(); ruota.add(oggetto); s.add(ruota)
    if (oggetto.userData.anima) oggetto.userData.anima(T0)
    ruota.rotation.y = 0.6; ruota.updateMatrixWorld(true)
    const b = new Box3().setFromObject(oggetto), c = b.getCenter(new Vector3()), d = b.getSize(new Vector3())
    oggetto.position.set(-c.x, -c.y, -c.z)
    const m = new Mesh(new CircleGeometry(0.6, 32), new ShadowMaterial({ opacity: 0.35 })); m.rotation.x = -Math.PI / 2; m.position.y = -d.y / 2 - 0.04; m.receiveShadow = true; s.add(m)
    const raggio = Math.max(d.y, d.x * 1.15, d.z) * 0.6
    cam.position.set(0, d.y * 0.04, raggio / Math.tan(15 * Math.PI / 180) + 0.1); cam.lookAt(0, 0, 0)
    const fg = document.createElement('figure'), tela = document.createElement('canvas'); tela.width = tela.height = LATO
    const did = document.createElement('figcaption')
    did.innerHTML = `<b>${fig.id}</b> ${fig.nome}<br>${fig.cosa} · ${fig.elemento} · ${fig.materia} · p${fig.pregio} · ${tri} tri`
    fg.append(tela, did); cont.append(fg)
    celle.push({ oggetto, ruota, s, cam, tela })
  } catch (e) { errori.push(fig.id + ': ' + String(e.stack || e)) }
}
const disegna = t => {
  for (const k of celle) {
    k.ruota.rotation.y = 0.6 + t * giri
    if (k.oggetto.userData.anima) k.oggetto.userData.anima(t)
    renderer.render(k.s, k.cam); k.tela.getContext('2d').drawImage(renderer.domElement, 0, 0, k.tela.width, k.tela.height)
  }
}
try {
  disegna(T0)
  if (!pausa) { const t0 = performance.now(); const anima = () => { disegna(T0 + (performance.now() - t0) / 1000); requestAnimationFrame(anima) }; requestAnimationFrame(anima) }
} catch (e) { errori.push(String(e.stack || e)) }
const tris = Object.values(risultato.figure).map(x => x.triangoli)
risultato.ok = !errori.length
const es = document.getElementById('esito')
es.textContent = errori.length ? 'errori: ' + errori.join(' | ') : `ok — ${tris.length} figure, al massimo ${Math.max(0, ...tris)} tri`
es.className = errori.length ? 'male' : ''
</script>
</body>
</html>
