<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mischia — come la vede un gioco</title>
<style>
  body { margin: 0; min-height: 100vh; padding: 22px 16px;
    background: radial-gradient(120% 80% at 50% 0%, #1d2a4a 0%, #0d1220 60%, #080b14 100%);
    color: #e8edf7; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 460px; margin: 0 auto; position: relative; min-height: 80vh; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sotto { color: #93a0bd; font-size: 14px; margin: 0 0 20px; }
  .riga { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  input[type=range] { flex: 1; }
  button.via { width: 100%; min-height: 56px; border: none; border-radius: 16px;
    background: #4ed680; color: #0d1a12; font: inherit; font-size: 18px; font-weight: 750; }
  .conto { margin-top: 16px; color: #93a0bd; font-size: 13.5px; line-height: 1.8; }
  code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<!-- Pagina di prova del PONTE fra i quiz e i giochi: qui non si prova un
     modulo, si prova quello che vede un gioco — `domandaPerGioco()` che
     pesca da solo fra tutti i moduli, e `<Domanda>` che la mostra. -->
<div id="app"></div>
<script type="module">
  import { createApp, h, ref } from 'vue'
  import Domanda from '../src/quiz/Domanda.vue'
  import { domandaPerGioco } from '../src/quiz/scelta.js'

  const q = ref(null)
  const difficolta = ref(0.5)
  const ok = ref(0), no = ref(0)
  const usciti = ref([])
  let ultimo = null

  function chiedi() {
    q.value = domandaPerGioco({ difficolta: Number(difficolta.value), evita: ultimo })
    ultimo = q.value.modulo
    usciti.value = [q.value.nome, ...usciti.value].slice(0, 12)
  }
  function incassa(e) {
    e.giusto ? ok.value++ : no.value++
    q.value = null
    setTimeout(chiedi, 250)
  }

  createApp({
    setup: () => () => h('main', [
      h('h1', 'La mischia'),
      h('p', { class: 'sotto' }, 'Quello che vede un gioco: una manopola di difficoltà, e le domande arrivano da tutti i moduli.'),
      h('div', { class: 'riga' }, [
        h('span', 'facile'),
        h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: difficolta.value,
                     onInput: e => (difficolta.value = e.target.value) }),
        h('span', 'tosta'),
      ]),
      h('button', { class: 'via', onClick: chiedi }, `difficoltà ${Number(difficolta.value).toFixed(2)} — fammi una domanda`),
      h('div', { class: 'conto' }, [
        h('div', `giuste ${ok.value} · sbagliate ${no.value}`),
        h('div', 'usciti: ' + (usciti.value.join(' · ') || '—')),
      ]),
      q.value ? h(Domanda, {
        domanda: q.value.domanda, pittori: q.value.pittori,
        titolo: `${q.value.icona} ${q.value.nome} · grado ${q.value.grado}`,
        onRisposto: incassa,
      }) : null,
    ]),
  }).mount('#app')
</script>
</body>
</html>
