<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Il castello con gli sprite</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
  body {
    margin: 0; background: #12161c; color: #e8eef5; overflow: hidden;
    font: 15px/1.45 system-ui, sans-serif; touch-action: manipulation;
    display: flex; flex-direction: column; height: 100dvh;
  }
  #campo { flex: 1; display: flex; align-items: center; justify-content: center;
           overflow: auto; position: relative }
  canvas { display: block; image-rendering: pixelated; touch-action: none }

  .barra {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; background: #182029; border-top: 1px solid #26313d;
  }
  .barra b { font-variant-numeric: tabular-nums }
  button {
    font: inherit; color: #e8eef5; background: #26313d; border: 1px solid #35424f;
    border-radius: 9px; padding: 6px 11px; cursor: pointer;
  }
  button:active { transform: translateY(1px) }
  button.acceso { background: #2f6f4a; border-color: #47a06a }
  .spazio { flex: 1 }
  .nota { font-size: 12.5px; color: #93a3b4 }

  /* il foglio che sale dal basso: come nel gioco vero, si compra toccando
     il campo e il conto sale da sotto */
  .foglio {
    position: absolute; left: 0; right: 0; bottom: 0; background: #1c242eee;
    border-top: 1px solid #35424f; padding: 10px; display: none;
    backdrop-filter: blur(3px);
  }
  .foglio.aperto { display: block }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }
  .scelta {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #26313d; border: 1px solid #3a4756; border-radius: 10px; padding: 6px 9px;
  }
  .scelta canvas { image-rendering: pixelated }
  .scelta small { color: #9fb0c2 }
  h1 { font-size: 15px; margin: 0 0 8px; text-align: center; font-weight: 600 }
</style>
</head>
<body>

<div id="campo">
  <canvas id="tela"></canvas>
  <div class="foglio" id="foglio">
    <h1 id="titolo">Che cosa ci costruisci?</h1>
    <div class="fila" id="scelte"></div>
  </div>
</div>

<div class="barra">
  <span>onda <b id="onda">1</b></span>
  <span>⚡ <b id="energia">120</b></span>
  <span>❤ <b id="vite">10</b></span>
  <div class="spazio"></div>
  <button id="zoom">zoom ×2</button>
  <button id="vetrina">vetrina</button>
  <button id="pausa">pausa</button>
</div>
<div class="barra">
  <span class="nota" id="nota">Sprite generati, ritagliati da <code>strumenti/sprite/torri.py</code>. I mostri
  non esistono nei fogli: qui camminano dei golem presi in prestito dalle torri.</span>
</div>

// ─────────────────────────────────────────────────────────── il mondo
const COL = 12, RIG = 18

/* La strada, cella per cella, dall'alto fino al castello. Due celle di
   fila differiscono di uno solo su un asse: è quello che permette di
   scegliere il pezzo di strada guardando da dove si viene e dove si va. */
const VIA = [
  [5,0],[5,1],[5,2],[5,3],
  [6,3],[7,3],[8,3],[9,3],
  [9,4],[9,5],[9,6],[9,7],
  [8,7],[7,7],[6,7],[5,7],[4,7],[3,7],[2,7],
  [2,8],[2,9],[2,10],[2,11],
  [3,11],[4,11],[5,11],[6,11],
  [6,12],[6,13],[6,14],[6,15],[6,16],
]
const SU_STRADA = new Set(VIA.map(([x,y]) => x + ',' + y))

/* Le piazzole: dove si può costruire. Scelte a mano, tutte a ridosso
   della strada — una torre che non arriva a toccarla non serve. */
const PIAZZOLE = [
  [4,2],[6,2],[3,4],[7,4],[8,5],[10,5],[4,6],[7,8],[3,8],[1,9],
  [4,9],[5,10],[7,10],[3,12],[5,13],[8,13],[4,15],[8,15],
]

/* Le famiglie di torre che il castello ha davvero, con i loro due rami.
   Il nome del pezzo è la colonna del foglio: il ramo cambia il disegno,
   che è poi il motivo per cui i rami esistono. */
const TORRI = {
  add: { nome: 'Arciere',  base: 'arciere',  colore: '#5ecb7a', gittata: 3.2, ricarica: .55,
         rami: { cecchino: 'cecchino', raffica: 'raffica' } },
  sub: { nome: 'Magica',   base: 'magica',   colore: '#b78cff', gittata: 3.6, ricarica: 1.2,
         rami: { veleno: 'veleno', catena: 'fulmine' } },
  mul: { nome: 'Ghiaccio', base: 'ghiaccio', colore: '#6cc3ff', gittata: 3.0, ricarica: 1.4,
         rami: { bufera: 'arcana', brina: 'ghiaccio' } },
  div: { nome: 'Bomba',    base: 'bomba',    colore: '#ffa14e', gittata: 3.4, ricarica: 1.7,
         rami: { mortaio: 'mortaio', napalm: 'fuoco' } },
}
const CHIAVI = Object.keys(TORRI)

// i nemici: golem e piante prese in prestito dalle torri del secondo
// foglio, perché di mostri non ce n'è. Si vede che sono in prestito, ed è
// giusto che si veda.
const BESTIE = {
  golem:  { pezzo: 'golem1',  vita: 26, passo: 1.9, premio: 9 },
  golemone:{ pezzo: 'golem2', vita: 70, passo: 1.4, premio: 18 },
  pianta: { pezzo: 'pianta1', vita: 40, passo: 2.4, premio: 12 },
  statua: { pezzo: 'golem3',  vita: 150, passo: 1.0, premio: 40 },
}

// ────────────────────────────────────────────────────── caso seminato
// stesso posto, stessa erba: un prato che cambia a ogni ridisegno è un
// prato sbagliato
function caso(x, y, k = 0) {
  let n = (x * 374761393 + y * 668265263 + k * 2246822519) | 0
  n = (n ^ (n >>> 13)) * 1274126177 | 0
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296
}
const scegli = (lista, x, y, k = 0) => lista[Math.floor(caso(x, y, k) * lista.length) % lista.length]

// ───────────────────────────────────────────────────────── la tela
const tela = document.getElementById('tela')
const ctx = tela.getContext('2d')
const atlante = new Image()
let pronto = false
let SCALA = 2
let orologio = 0, gioca = true

/* Lo zoom fa 1, 2, 3 e niente in mezzo: la pixel art ingrandita di 1,4
   sfrangia i bordi, e sfrangiata è più brutta di piccola. Nel gioco vero
   la telecamera si stringe di quanto le serve — è la differenza che
   questo poc serve a far vedere. */
function misura(primaVolta) {
  const box = document.getElementById('campo').getBoundingClientRect()
  if (primaVolta) {
    SCALA = Math.max(1, Math.min(3, Math.floor(box.height / (RIG * TESSERA)),
                                    Math.floor(box.width / (COL * TESSERA))))
  }
  const w = COL * TESSERA * SCALA, h = RIG * TESSERA * SCALA
  const dpr = Math.min(3, window.devicePixelRatio || 1)
  tela.width = w * dpr; tela.height = h * dpr
  tela.style.width = w + 'px'; tela.style.height = h + 'px'
  ctx.setTransform(dpr * SCALA, 0, 0, dpr * SCALA, 0, 0)
  ctx.imageSmoothingEnabled = false
  document.getElementById('zoom').textContent = 'zoom ×' + SCALA
}

/* Il pezzo si appoggia col fondo dove gli dici, e centrato: gli sprite
   hanno altezze diverse — una torre di terzo stadio è alta il doppio di
   una di primo — e senza questo crescerebbero verso il basso, dentro il
   terreno. */
function posa(nome, cx, cy, opz = {}) {
  const p = PEZZI[nome]; if (!p) return
  const [sx, sy, w, h] = p
  const x = Math.round(cx - w / 2 + (opz.dx || 0))
  const y = Math.round(cy - h + (opz.dy || 0))
  if (opz.alfa != null) ctx.globalAlpha = opz.alfa
  if (opz.specchia) {
    ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1)
    ctx.drawImage(atlante, sx, sy, w, h, 0, 0, w, h); ctx.restore()
  } else {
    ctx.drawImage(atlante, sx, sy, w, h, x, y, w, h)
  }
  if (opz.alfa != null) ctx.globalAlpha = 1
}
const tessera = (nome, cx, cy, opz) => posa(nome, cx * TESSERA + TESSERA / 2,
                                            cy * TESSERA + TESSERA, opz)

// ───────────────────────────────────────────── il fondale, una volta sola
let fondale = null

/* Da dove entra e da dove esce la strada, in questa cella: è tutto quello
   che serve per sapere che pezzo posarci. Le tessere del foglio coprono
   NS, OE e tre curve su quattro — la quarta è una curva specchiata, e
   specchiare costa una riga invece di un disegno. */
function pezzoStrada(i) {
  const lati = new Set()
  const qui = VIA[i]
  for (const altro of [VIA[i - 1], VIA[i + 1]]) {
    if (!altro) continue
    if (altro[1] < qui[1]) lati.add('N')
    if (altro[1] > qui[1]) lati.add('S')
    if (altro[0] < qui[0]) lati.add('O')
    if (altro[0] > qui[0]) lati.add('E')
  }
  if (i === 0) lati.add('N')                     // entra dal bordo di sopra
  if (i === VIA.length - 1) lati.add('S')
  const k = [...lati].sort().join('')
  return ({ NS: ['strada-v'], EO: ['strada-o'], OS: ['strada-curva-se'],
            ES: ['strada-curva-so'], NO: ['strada-esse'],
            EN: ['strada-esse', true] })[k] || ['strada-v']
}

/* Il prato è quasi tutto una tessera piatta: le varianti spuntano di
   rado, se no da lontano si vede il motivo che si ripete e il prato
   sembra una tabella. */
const ERBE = ['erba0','erba0','erba0','erba0','erba0','erba0','erba0','erba0',
              'erba1','erba1','erba-fiori']
/* I nomi dei pezzi dicono dove stavano sul foglio, non che cosa sono: il
   ritaglio li conta a occhio e la lista dei nomi gliela diamo noi, quindi
   qualcuno è finito storto (`erba-alta` è un lastricato). Qui dentro
   stanno solo quelli guardati uno per uno — è la ragione per cui questa
   parte va rifatta col foglietto di FORMATO.md, dove ogni sprite ha il
   suo nome scritto accanto alle sue coordinate. */
const BOSCO = ['pino1','pino2','pino3','pino4','pino5','pino7','pino8',
               'albero-tondo','albero-piccolo']
const SOTTOBOSCO = ['acqua2','sassi','sasso-tondo']
const PIAZZOLA = 'erba-alta'      // il lastricato: «qui si costruisce»

function fondaleSu(g) {
  const salva = ctx2
  ctx2 = g
  for (let y = 0; y < RIG; y++)
    for (let x = 0; x < COL; x++)
      tess(scegli(ERBE, x, y, 1), x, y)

  // la strada
  VIA.forEach((c, i) => {
    const [nome, specchia] = pezzoStrada(i)
    tess(nome, c[0], c[1], { specchia })
  })

  // le piazzole: una lastra di pietra, che è il modo di dire «qui si
  // costruisce» senza scriverlo
  for (const [x, y] of PIAZZOLE) tess(PIAZZOLA, x, y)

  // il bosco: fitto sui bordi, rado dentro, mai sulla strada né sulle
  // piazzole — un albero che copre una torre è un albero che dà fastidio
  for (let y = 0; y < RIG; y++)
    for (let x = 0; x < COL; x++) {
      if (SU_STRADA.has(x + ',' + y)) continue
      if (PIAZZOLE.some(p => p[0] === x && p[1] === y)) continue
      if (vicinoAllaStrada(x, y, 1)) continue
      const bordo = x === 0 || x === COL - 1 || y === 0 || y === RIG - 1
      const soglia = bordo ? 0.78 : 0.24
      const c = caso(x, y, 3)
      if (c < soglia) tess(scegli(BOSCO, x, y, 4), x, y, { dy: 2 })
      else if (c < soglia + 0.10) tess(scegli(SOTTOBOSCO, x, y, 5), x, y)
    }
  ctx2 = salva
}

function vicinoAllaStrada(x, y, r) {
  for (let dx = -r; dx <= r; dx++)
    for (let dy = -r; dy <= r; dy++)
      if (SU_STRADA.has((x + dx) + ',' + (y + dy))) return true
  return false
}

// piccolo trucco: `tess` e `posa` disegnano su `ctx2`, che di solito è il
// contesto vero e per il fondale è quello nascosto
let ctx2 = ctx
function tess(nome, cx, cy, opz = {}) {
  const p = PEZZI[nome]; if (!p) return
  const [sx, sy, w, h] = p
  const x = Math.round(cx * TESSERA + (TESSERA - w) / 2 + (opz.dx || 0))
  const y = Math.round((cy + 1) * TESSERA - h + (opz.dy || 0))
  if (opz.alfa != null) ctx2.globalAlpha = opz.alfa
  if (opz.specchia) {
    ctx2.save(); ctx2.translate(x + w, y); ctx2.scale(-1, 1)
    ctx2.drawImage(atlante, sx, sy, w, h, 0, 0, w, h); ctx2.restore()
  } else ctx2.drawImage(atlante, sx, sy, w, h, x, y, w, h)
  if (opz.alfa != null) ctx2.globalAlpha = 1
}

function preparaFondale() {
  const f = document.createElement('canvas')
  f.width = COL * TESSERA; f.height = RIG * TESSERA
  const g = f.getContext('2d')
  g.imageSmoothingEnabled = false
  fondaleSu(g)
  fondale = f
}

// ─────────────────────────────────────────────────────── lo stato del gioco
const S = {
  torri: [],        // { x, y, chiave, stadio, ramo, ricarica }
  nemici: [],       // { d, bestia, vita, max, gelo }
  colpi: [],
  energia: 120, vite: 10, onda: 1,
  daFare: [], inizioOnda: 1.5,
  scelta: null,     // la piazzola aperta
  vetrina: false,
}

const LUNGHEZZA = VIA.length - 1
function puntoA(d) {
  const t = Math.max(0, Math.min(d, LUNGHEZZA))
  const i = Math.min(VIA.length - 2, Math.floor(t))
  const f = t - i
  const a = VIA[i], b = VIA[i + 1]
  return { x: (a[0] + (b[0] - a[0]) * f + .5) * TESSERA,
           y: (a[1] + (b[1] - a[1]) * f + .5) * TESSERA }
}

function onda(n) {
  const roba = []
  const quanti = 5 + n * 2
  for (let i = 0; i < quanti; i++) {
    let b = 'golem'
    if (n >= 2 && i % 3 === 2) b = 'pianta'
    if (n >= 3 && i % 5 === 4) b = 'golemone'
    if (n >= 5 && i === quanti - 1) b = 'statua'
    roba.push({ bestia: b, quando: i * (0.85 - Math.min(.4, n * .05)) })
  }
  return roba
}
function partiOnda() {
  S.daFare = onda(S.onda)
  document.getElementById('onda').textContent = S.onda
}

function costoDi(t) { return t ? 20 + t.stadio * 30 : 45 }

// ───────────────────────────────────────────────────────────── il giro
let ultimo = 0
function passo(ora) {
  requestAnimationFrame(passo)
  const dt = Math.min(.05, (ora - ultimo) / 1000) || 0
  ultimo = ora
  if (!pronto) return
  if (gioca) { orologio += dt; muovi(dt) }
  disegna()
}

function muovi(dt) {
  // chi entra in scena: ognuno ha la sua ora, contata da quando l'onda è
  // partita
  while (S.daFare.length && S.daFare[0].quando <= orologio - S.inizioOnda) {
    const v = S.daFare.shift()
    const vita = BESTIE[v.bestia].vita * (1 + S.onda * .35)
    S.nemici.push({ d: 0, bestia: v.bestia, vita, max: vita, gelo: 0 })
  }
  if (!S.daFare.length && !S.nemici.length) {
    S.onda++
    S.inizioOnda = orologio + 1.2
    partiOnda()
  }

  // chi cammina
  for (const n of S.nemici) {
    const b = BESTIE[n.bestia]
    n.gelo = Math.max(0, n.gelo - dt)
    n.d += b.passo * dt * (n.gelo > 0 ? .45 : 1)
    if (n.d >= LUNGHEZZA) { n.morto = true; S.vite--; }
  }

  // chi spara
  for (const t of S.torri) {
    t.ricarica -= dt
    const T = TORRI[t.chiave]
    if (t.ricarica > 0) continue
    const centro = { x: (t.x + .5) * TESSERA, y: (t.y + .5) * TESSERA }
    const gittata = (T.gittata + t.stadio * .55) * TESSERA
    let bersaglio = null, avanti = -1
    for (const n of S.nemici) {
      if (n.morto) continue
      const p = puntoA(n.d)
      if (Math.hypot(p.x - centro.x, p.y - centro.y) > gittata) continue
      if (n.d > avanti) { avanti = n.d; bersaglio = n }
    }
    if (!bersaglio) continue
    t.ricarica = T.ricarica / (1 + t.stadio * .3)
    const danno = (6 + t.stadio * 7) * (1 + S.onda * .18)
    S.colpi.push({ da: centro, verso: bersaglio, t: 0, colore: T.colore,
                   chiave: t.chiave, danno })
  }

  // i colpi
  for (const c of S.colpi) {
    c.t += dt * 4.5
    if (c.t >= 1) {
      c.finito = true
      const n = c.verso
      if (n && !n.morto) {
        n.vita -= c.danno
        if (c.chiave === 'mul') n.gelo = 1.4
        if (n.vita <= 0) {
          n.morto = true
          S.energia += BESTIE[n.bestia].premio
        }
      }
    }
  }
  S.colpi = S.colpi.filter(c => !c.finito)
  S.nemici = S.nemici.filter(n => !n.morto)

  document.getElementById('energia').textContent = Math.round(S.energia)
  document.getElementById('vite').textContent = Math.max(0, S.vite)
}

// ────────────────────────────────────────────────────────── il disegno
function disegna() {
  ctx2 = ctx
  ctx.clearRect(0, 0, COL * TESSERA, RIG * TESSERA)
  if (fondale) ctx.drawImage(fondale, 0, 0)

  // il castello in fondo alla strada
  const fine = VIA[VIA.length - 1]
  tess('cittadella2', fine[0], fine[1], { dy: 6 })

  /* Tutto quello che sta in piedi si ordina per quota: chi sta più in
     basso passa davanti. È l'unica riga che serve perché una torre
     davanti a un mostro sembri davvero davanti. */
  const scena = []
  for (const t of S.torri) {
    const T = TORRI[t.chiave]
    const nome = (t.ramo ? T.rami[t.ramo] : T.base) + Math.min(3, t.stadio)
    scena.push({ y: t.y, disegna: () => {
      tess(nome, t.x, t.y, { dy: 3 })
      if (t === S.scelta?.torre) anello(t.x, t.y, (T.gittata + t.stadio * .55), T.colore)
    } })
  }
  for (const n of S.nemici) {
    const p = puntoA(n.d)
    const b = BESTIE[n.bestia]
    scena.push({ y: p.y / TESSERA, disegna: () => {
      // niente camminata: questi sono sprite fermi. Il saltello è il
      // trucco che li fa sembrare vivi, e si vede che è un trucco.
      const salto = Math.abs(Math.sin(orologio * 5 + n.d)) * 2.5
      ctx.globalAlpha = .28
      ctx.fillStyle = '#000'
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 3, 9, 4, 0, 0, 6.29); ctx.fill()
      ctx.globalAlpha = 1
      if (n.gelo > 0) ctx.filter = 'hue-rotate(150deg) saturate(1.6)'
      posa(b.pezzo, p.x, p.y + 4 - salto)
      ctx.filter = 'none'
      if (n.vita < n.max) barra(p.x, p.y - 26, n.vita / n.max)
    } })
  }
  scena.sort((a, b) => a.y - b.y)
  for (const c of scena) c.disegna()

  // i colpi: una scia e un lampo, niente di più
  for (const c of S.colpi) {
    const p = puntoA(c.verso.d)
    const x = c.da.x + (p.x - c.da.x) * c.t
    const y = c.da.y - 10 + (p.y - (c.da.y - 10)) * c.t - Math.sin(c.t * 3.14) * 10
    ctx.fillStyle = c.colore
    ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.29); ctx.fill()
    ctx.globalAlpha = .35
    ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.29); ctx.fill()
    ctx.globalAlpha = 1
  }

  // la piazzola scelta
  if (S.scelta && !S.scelta.torre) {
    const { x, y } = S.scelta
    ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.5
    ctx.setLineDash([4, 3]); ctx.lineDashOffset = -orologio * 8
    ctx.strokeRect(x * TESSERA + 2, y * TESSERA + 2, TESSERA - 4, TESSERA - 4)
    ctx.setLineDash([])
  }
}

function anello(cx, cy, r, colore) {
  ctx.strokeStyle = colore + '99'; ctx.lineWidth = 1.5
  ctx.beginPath()
  ctx.arc((cx + .5) * TESSERA, (cy + .5) * TESSERA, r * TESSERA, 0, 6.29)
  ctx.stroke()
}

function barra(x, y, q) {
  ctx.fillStyle = '#00000088'; ctx.fillRect(x - 11, y, 22, 4)
  ctx.fillStyle = q > .5 ? '#6ddb7a' : q > .25 ? '#e8c84a' : '#e05a4a'
  ctx.fillRect(x - 10, y + 1, 20 * q, 2)
}

// ──────────────────────────────────────────────────────────── il dito
tela.addEventListener('pointerdown', e => {
  const r = tela.getBoundingClientRect()
  const x = Math.floor((e.clientX - r.left) / (TESSERA * SCALA))
  const y = Math.floor((e.clientY - r.top) / (TESSERA * SCALA))
  const torre = S.torri.find(t => t.x === x && t.y === y)
  if (torre) { S.scelta = { x, y, torre }; apriFoglio() ; return }
  if (PIAZZOLE.some(p => p[0] === x && p[1] === y)) {
    S.scelta = { x, y, torre: null }; apriFoglio(); return
  }
  chiudiFoglio()
})

const foglio = document.getElementById('foglio')
function chiudiFoglio() { S.scelta = null; foglio.classList.remove('aperto') }

function apriFoglio() {
  const scelte = document.getElementById('scelte')
  scelte.innerHTML = ''
  const t = S.scelta.torre
  document.getElementById('titolo').textContent = t
    ? `${TORRI[t.chiave].nome} — gradino ${t.stadio}`
    : 'Che cosa ci costruisci?'

  if (!t) {
    for (const k of CHIAVI) {
      const T = TORRI[k]
      scelte.appendChild(bottone(T.base + '1', T.nome, '⚡ ' + costoDi(null), () => {
        if (S.energia < costoDi(null)) return
        S.energia -= costoDi(null)
        S.torri.push({ x: S.scelta.x, y: S.scelta.y, chiave: k, stadio: 1,
                       ramo: null, ricarica: 0 })
        chiudiFoglio()
      }))
    }
  } else {
    const T = TORRI[t.chiave]
    if (t.stadio < 3) {
      const dopo = t.stadio + 1
      const nome = (t.ramo ? T.rami[t.ramo] : T.base) + dopo
      scelte.appendChild(bottone(nome, 'sali', '⚡ ' + costoDi(t), () => {
        if (S.energia < costoDi(t)) return
        S.energia -= costoDi(t); t.stadio++
        chiudiFoglio()
      }))
    }
    // il ramo si sceglie a metà scaletta, come nel gioco vero
    if (t.stadio >= 2 && !t.ramo)
      for (const [ramo, pezzo] of Object.entries(T.rami))
        scelte.appendChild(bottone(pezzo + Math.min(3, t.stadio), ramo, 'ramo', () => {
          t.ramo = ramo; chiudiFoglio()
        }))
    scelte.appendChild(bottone(null, 'chiudi', '', chiudiFoglio))
  }
  foglio.classList.add('aperto')
}

function bottone(pezzo, testo, sotto, azione) {
  const b = document.createElement('button')
  b.className = 'scelta'
  if (pezzo && PEZZI[pezzo]) {
    const [sx, sy, w, h] = PEZZI[pezzo]
    const c = document.createElement('canvas')
    const k = 2
    c.width = w * k; c.height = h * k
    c.style.width = (w * k) + 'px'
    const g = c.getContext('2d')
    g.imageSmoothingEnabled = false
    g.drawImage(atlante, sx, sy, w, h, 0, 0, w * k, h * k)
    b.appendChild(c)
  }
  const t = document.createElement('span'); t.textContent = testo; b.appendChild(t)
  if (sotto) { const s = document.createElement('small'); s.textContent = sotto; b.appendChild(s) }
  b.onclick = azione
  return b
}

// ─────────────────────────────────────────────────────────── i tasti
document.getElementById('zoom').onclick = () => {
  SCALA = SCALA % 3 + 1
  misura()
}
document.getElementById('pausa').onclick = e => {
  gioca = !gioca
  e.target.textContent = gioca ? 'pausa' : 'riprendi'
}
document.getElementById('vetrina').onclick = e => {
  S.vetrina = !S.vetrina
  e.target.classList.toggle('acceso', S.vetrina)
  if (S.vetrina) {
    // una torre per piazzola, tutte le famiglie a tutti i gradini: è il
    // modo più corto di guardarle insieme sul terreno vero
    S.torri = PIAZZOLE.map(([x, y], i) => ({
      x, y, chiave: CHIAVI[i % CHIAVI.length], stadio: (i % 3) + 1,
      ramo: i >= CHIAVI.length * 3
        ? Object.keys(TORRI[CHIAVI[i % CHIAVI.length]].rami)[i % 2] : null,
      ricarica: 0,
    }))
  } else S.torri = []
}
addEventListener('resize', () => misura(false))

// ───────────────────────────────────────────────────────────── avvio
atlante.onload = () => {
  pronto = true
  misura(true)
  preparaFondale()
  S.inizioOnda = 1.5
  partiOnda()
}
atlante.onerror = () => {
  document.getElementById('nota').textContent =
    'L\'atlante non c\'è: lancia `python3 strumenti/sprite/torri.py`.'
}
atlante.src = ATLANTE
requestAnimationFrame(passo)
</script>
