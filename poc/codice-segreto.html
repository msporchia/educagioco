<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Codice Segreto</title>
<!-- ═══════════════════════════════════════════════════════════════════
     CODICE SEGRETO — Mastermind a emoji, prototipo autonomo.

     Il gioco nasconde un codice di 3 o 4 animali. Il bambino prova una
     combinazione, il gioco risponde con i pallini: verde pieno = animale
     giusto al posto giusto, cerchio arancione = animale giusto ma nel
     posto sbagliato. Sei tentativi.

     Non c'è matematica e non c'è un regolamento da leggere: la prima
     partita si apre con un esempio animato di pochi secondi che mostra
     da dove vengono i due pallini. È la scommessa di questo prototipo.

     File a sé: non fa parte del build, si apre col doppio click.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --carta:  #fffdf7;
    --fondo:  #f0e6d2;
    --inchiostro: #33291f;
    --tenue:  #a4917a;
    --bordo:  #e0d2ba;
    --buca:   #ece0c9;
    --pieno:  #17a34a;
    --vuoto:  #f0900e;
    --evidenza: #4b8bf5;
    --raggio: 16px;
  }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--fondo);
    color: var(--inchiostro);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .em { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", "Twemoji Mozilla", sans-serif; line-height: 1; }

  /* ── impianto verticale: tutto sta nello schermo, niente scorrimento ── */
  .telefono {
    position: relative;
    height: 100%; max-width: 430px; margin: 0 auto;
    padding: 8px 10px 10px;
    display: flex; flex-direction: column; gap: 7px;
    background: var(--carta);
    box-shadow: 0 0 40px rgba(0,0,0,.10);
  }

  /* ── barra ── */
  .barra { display: flex; align-items: center; gap: 8px; height: 44px; flex: 0 0 auto; }
  .barra h1 { flex: 1; text-align: center; font-size: 19px; letter-spacing: .5px; font-weight: 800; }
  .tondo {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 50%; background: var(--fondo);
    display: grid; place-items: center; font-size: 21px; font-weight: 800;
    transition: transform .12s;
  }
  .tondo:active { transform: scale(.9); }

  /* ── il codice nascosto: sta in cima, coperto, e si scopre alla fine ── */
  .segreto {
    flex: 0 0 auto; height: 58px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(180deg, #3b3026, #2a221a);
    border-radius: var(--raggio);
    padding: 0 12px;
  }
  .segreto .lucchetto { font-size: 22px; margin-right: 2px; }
  .coperta {
    width: 40px; height: 40px; border-radius: 11px;
    background: #55483a; color: #9d8b76;
    display: grid; place-items: center;
    font-size: 22px; font-weight: 800;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
    transition: transform .45s, background .45s;
  }
  .coperta.scoperta { background: #fff6e0; color: var(--inchiostro); transform: rotateY(0); }
  .segreto.svelato .coperta { animation: gira .5s backwards; }
  @keyframes gira { 0% { transform: rotateY(90deg) scale(.7); } 100% { transform: none; } }

  /* ── i tre scaglioni, sempre in vista ── */
  .livelli { flex: 0 0 auto; display: flex; gap: 7px; height: 44px; }
  .livelli button {
    flex: 1; border-radius: 12px; background: var(--fondo);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 14px; font-weight: 700; color: var(--tenue);
    border: 2px solid transparent;
    transition: transform .12s;
  }
  .livelli button .em { font-size: 19px; }
  .livelli button[aria-pressed="true"] {
    background: #fff; border-color: var(--evidenza); color: var(--inchiostro);
    box-shadow: 0 2px 0 rgba(75,139,245,.35);
  }
  .livelli button:active { transform: scale(.95); }

  /* ── il tabellone: sei righe, quella attiva in rilievo ── */
  .tabellone {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px;
    --c: 56px;
  }
  .riga {
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px;
    border-radius: 14px;
    background: #faf5ea;
    border: 2px solid transparent;
  }
  .riga.fatta { background: #f4ecdc; }
  .riga.attiva { background: #fff; border-color: var(--evidenza); box-shadow: 0 3px 0 rgba(75,139,245,.30); }
  .caselle { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .casella {
    width: var(--c); height: var(--c);
    border-radius: 13px;
    background: var(--buca);
    box-shadow: inset 0 3px 5px rgba(0,0,0,.10);
    display: grid; place-items: center;
    font-size: calc(var(--c) * .62);
  }
  .casella.piena { background: #fff; box-shadow: 0 2px 0 var(--bordo); }
  .riga.attiva .casella.prossima {
    box-shadow: inset 0 0 0 3px var(--evidenza);
    animation: respira 1.5s infinite;
  }
  @keyframes respira { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .casella.posata { animation: tonfo .22s; }
  @keyframes tonfo { 0% { transform: scale(.5); } 60% { transform: scale(1.14); } 100% { transform: none; } }

  /* ── i pallini: l'unico appunto che il bambino ha ── */
  .indizi {
    flex: 0 0 54px; height: 46px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    align-content: center; justify-items: center;
    border-radius: 10px;
  }
  .riga.fatta .indizi { background: rgba(0,0,0,.045); }
  .pallino { width: 19px; height: 19px; border-radius: 50%; }
  .pallino.p { background: var(--pieno); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .pallino.v { background: #fff; border: 4px solid var(--vuoto); }
  /* «ho risposto, e la risposta è niente»: senza questo il riquadro vuoto
     sembra una domanda rimasta senza risposta */
  .pallino.zero { width: 22px; height: 6px; border-radius: 3px; background: #cbbda4; grid-column: 1 / -1; }
  .pallino.nuovo { animation: pop .3s backwards; }
  @keyframes pop { 0% { transform: scale(0); } 65% { transform: scale(1.4); } 100% { transform: none; } }

  /* ── la tastiera degli animali ── */
  .tastiera { flex: 0 0 auto; display: flex; justify-content: center; gap: 6px; }
  .tasto {
    flex: 1 1 0; max-width: 62px; aspect-ratio: 1; min-height: 46px;
    border-radius: 15px; background: #fff;
    box-shadow: 0 3px 0 #d5c3a4, inset 0 0 0 2px var(--bordo);
    display: grid; place-items: center;
    font-size: 32px;
    transition: transform .1s, box-shadow .1s;
  }
  .tasto:active { transform: translateY(3px); box-shadow: none; }

  /* ── conferma ── */
  .conferma {
    flex: 0 0 auto; height: 56px; border-radius: var(--raggio);
    background: var(--pieno); color: #fff;
    font-size: 28px; font-weight: 800;
    box-shadow: 0 4px 0 #0f7a36;
    transition: transform .1s, box-shadow .1s;
  }
  .conferma:disabled { background: #ded2bd; color: #b6a68e; box-shadow: 0 4px 0 #cdbfa6; cursor: default; }
  .conferma:not(:disabled):active { transform: translateY(4px); box-shadow: none; }
  .scossa { animation: scuoti .3s; }
  @keyframes scuoti { 0%,100% { transform: none; } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* ── velo comune a fine partita e alla spiegazione ── */
  .velo {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(38,30,22,.72);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 18px;
    animation: entra .25s;
  }
  .velo[hidden] { display: none; }
  @keyframes entra { from { opacity: 0; } to { opacity: 1; } }
  .cartello {
    background: var(--carta); border-radius: 24px; padding: 20px 16px;
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .faccia { font-size: 52px; }
  .fila-codice { display: flex; gap: 8px; }
  .fila-codice span {
    width: 52px; height: 52px; border-radius: 14px; background: #fff6e0;
    display: grid; place-items: center; font-size: 32px;
    box-shadow: 0 2px 0 var(--bordo);
    animation: pop .4s backwards;
  }
  .stelle { font-size: 24px; letter-spacing: 3px; min-height: 30px; }
  .grosso {
    height: 60px; min-width: 200px; padding: 0 26px; border-radius: 18px;
    background: var(--evidenza); color: #fff; font-size: 22px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 0 #2f6ed0;
  }
  .grosso:active { transform: translateY(4px); box-shadow: none; }

  /* ── la spiegazione senza parole ── */
  .dimo {
    background: var(--carta); border-radius: 24px; padding: 16px 14px;
    width: 100%; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    position: relative;
  }
  .drigo {
    display: flex; align-items: center; gap: 8px;
    border-radius: 14px; padding: 7px 8px;
  }
  .drigo.seg { background: #3b3026; }
  .drigo.prova { background: #faf5ea; border: 2px solid var(--bordo); }
  .dicona { font-size: 20px; width: 24px; text-align: center; }
  .dcaselle { flex: 1; display: flex; gap: 8px; justify-content: center; }
  .dcas {
    width: 52px; height: 52px; border-radius: 13px;
    background: #fff; display: grid; place-items: center; font-size: 30px;
    box-shadow: 0 2px 0 rgba(0,0,0,.12);
    position: relative;
    transition: transform .35s, opacity .35s, box-shadow .25s;
  }
  .drigo.seg .dcas { background: #fff6e0; }
  .dcas.acceso { box-shadow: 0 0 0 4px var(--pieno); z-index: 2; }
  .dcas.acceso-v { box-shadow: 0 0 0 4px var(--vuoto); z-index: 2; }
  .dcas.spento { opacity: .28; }
  .dcas.no { animation: scuoti .4s; }
  .dcas.scoperta { animation: pop .32s; }
  .dcas.salta { animation: salta 1.5s ease-in-out; z-index: 3; }
  @keyframes salta {
    0%   { transform: none; }
    28%  { transform: translate(calc(var(--dx) / 2), -34px) scale(1.1) rotate(-8deg); }
    55%  { transform: translateX(var(--dx)) scale(1.05); }
    72%  { transform: translateX(var(--dx)) scale(1.05); }
    100% { transform: none; }
  }
  .dindizi {
    flex: 0 0 54px; height: 46px; border-radius: 10px; background: rgba(0,0,0,.05);
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    align-content: center; justify-items: center;
  }
  .dvolante {
    position: absolute; width: 19px; height: 19px; border-radius: 50%;
    z-index: 9; pointer-events: none;
    transition: transform .55s cubic-bezier(.5,-0.3,.4,1.3);
  }

  /* il canvas ha una misura sua (300×150): `inset:0` non lo stira, ci vuole width/height */
  canvas.coriandoli { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; }
</style>

<div class="telefono">
  <div class="barra">
    <button class="tondo" id="aiuto" aria-label="come si gioca">?</button>
    <h1>Codice Segreto</h1>
    <button class="tondo" id="ancora" aria-label="un altro codice">↻</button>
  </div>

  <div class="segreto" id="segreto"><span class="lucchetto em">🔒</span></div>

  <div class="livelli" id="livelli"></div>

  <div class="tabellone" id="tabellone"></div>

  <div class="tastiera" id="tastiera"></div>

  <button class="conferma" id="conferma" disabled aria-label="conferma">✓</button>

  <canvas class="coriandoli" id="coriandoli" hidden></canvas>

  <!-- fine partita -->
  <div class="velo" id="finale" hidden>
    <div class="cartello">
      <div class="faccia em" id="faccia">🎉</div>
      <div class="stelle em" id="stelle"></div>
      <div class="fila-codice em" id="filaCodice"></div>
      <button class="grosso" id="unAltro"><span class="em">↻</span> un altro</button>
    </div>
  </div>

  <!-- la spiegazione: nessuna parola, solo un esempio che si muove -->
  <div class="velo" id="spiega" hidden>
    <div class="dimo" id="dimo">
      <div class="drigo seg">
        <span class="dicona em" id="dOcchio">🔒</span>
        <div class="dcaselle" id="dSeg"></div>
        <div style="flex:0 0 54px"></div>
      </div>
      <div class="drigo prova">
        <span class="dicona em">👆</span>
        <div class="dcaselle" id="dProva"></div>
        <div class="dindizi" id="dIndizi"></div>
      </div>
    </div>
    <button class="grosso" id="viaSpiega"><span class="em">▶</span> gioca</button>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════ dati e stato ═══════════════════════ */

const ANIMALI = ['🐶', '🐱', '🐰', '🦊', '🐼', '🐸'];
const PROVE = 6;

const LIVELLI = {
  facile:  { caselle: 3, animali: 4, icona: '🐣', nome: 'facile'  },
  normale: { caselle: 4, animali: 5, icona: '🐨', nome: 'normale' },
  tosto:   { caselle: 4, animali: 6, icona: '🦁', nome: 'tosto'   },
};

const STATO = {
  livello: 'normale',
  codice: [],        // i simboli nascosti
  tentativi: [],     // [{ simboli, pieni, vuoti }]
  corrente: [],      // la riga che si sta componendo (null = buca)
  finita: null,      // null | 'vinta' | 'persa'
};

const $ = (id) => document.getElementById(id);
const tabellone = $('tabellone'), tastiera = $('tastiera'), conferma = $('conferma');
const segreto = $('segreto'), veloFinale = $('finale'), veloSpiega = $('spiega');

/* ═══════════════════════ il cuore: gli indizi ═══════════════════════

   Il conteggio dei doppioni è il punto in cui questo gioco si sbaglia
   sempre. La regola: prima si contano i pieni e si tolgono di mezzo,
   poi i vuoti si cercano solo fra quello che resta, consumando ogni
   simbolo una volta sola. Così pieni + vuoti non supera mai la
   lunghezza del codice.                                              */

function calcolaIndizi(codice, tentativo) {
  let pieni = 0;
  const restoCodice = [], restoTentativo = [];
  for (let i = 0; i < codice.length; i++) {
    if (codice[i] === tentativo[i]) pieni++;
    else { restoCodice.push(codice[i]); restoTentativo.push(tentativo[i]); }
  }
  let vuoti = 0;
  for (const simbolo of restoTentativo) {
    const dove = restoCodice.indexOf(simbolo);
    if (dove >= 0) { vuoti++; restoCodice.splice(dove, 1); }
  }
  return { pieni, vuoti };
}
/* esposta per il collaudo da fuori */
window.calcolaIndizi = calcolaIndizi;

/* ═══════════════════════ suoni ═══════════════════════ */

let ctxAudio = null;
function svegliaAudio() {
  if (ctxAudio) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) ctxAudio = new C();
  } catch (e) { ctxAudio = null; }
}
document.addEventListener('pointerdown', svegliaAudio, { once: true });

function nota(hz, quando, durata, volume, forma) {
  if (!ctxAudio) return;
  try {
    const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    o.type = forma || 'triangle';
    o.frequency.value = hz;
    const t = ctxAudio.currentTime + quando;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durata);
    o.connect(g); g.connect(ctxAudio.destination);
    o.start(t); o.stop(t + durata + 0.03);
  } catch (e) { /* un prototipo non muore per un suono */ }
}

function suono(che, dato) {
  if (!ctxAudio) return;
  if (che === 'posa')     nota(520 + (dato || 0) * 90, 0, 0.10, 0.10);
  if (che === 'togli')    nota(300, 0, 0.09, 0.08, 'sine');
  if (che === 'conferma') { nota(600, 0, 0.10, 0.09); nota(800, 0.09, 0.12, 0.09); }
  if (che === 'niente')   nota(180, 0, 0.14, 0.07, 'sawtooth');
  if (che === 'vittoria') [523, 659, 784, 1047, 1319].forEach((f, i) => nota(f, i * 0.11, 0.42, 0.12));
  if (che === 'persa')    [420, 350, 280, 210].forEach((f, i) => nota(f, i * 0.16, 0.34, 0.09, 'sine'));
}

/* ═══════════════════════ partita ═══════════════════════ */

function animaliInGioco() { return ANIMALI.slice(0, LIVELLI[STATO.livello].animali); }

let attesaFinale = 0;   /* il cartello di fine partita arriva con un ritardo: va disdetto */

function nuovaPartita() {
  clearTimeout(attesaFinale);
  const L = LIVELLI[STATO.livello];
  const pool = animaliInGioco();
  STATO.codice = Array.from({ length: L.caselle }, () => pool[Math.floor(Math.random() * pool.length)]);
  STATO.tentativi = [];
  STATO.corrente = Array(L.caselle).fill(null);
  STATO.finita = null;
  veloFinale.hidden = true;
  fermaCoriandoli();
  disegnaTutto();
}

function posa(simbolo) {
  if (STATO.finita) return;
  const buca = STATO.corrente.indexOf(null);
  if (buca < 0) { conferma.classList.remove('scossa'); void conferma.offsetWidth; conferma.classList.add('scossa'); suono('niente'); return; }
  STATO.corrente[buca] = simbolo;
  suono('posa', buca);
  disegnaTabellone(buca);
  aggiornaConferma();
}

function togli(indice) {
  if (STATO.finita || STATO.corrente[indice] == null) return;
  /* si toglie e si compatta a sinistra: le buche in mezzo confondono */
  STATO.corrente.splice(indice, 1);
  STATO.corrente.push(null);
  suono('togli');
  disegnaTabellone();
  aggiornaConferma();
}

function invia() {
  if (STATO.finita || STATO.corrente.includes(null)) return;
  const simboli = STATO.corrente.slice();
  const { pieni, vuoti } = calcolaIndizi(STATO.codice, simboli);
  STATO.tentativi.push({ simboli, pieni, vuoti });
  STATO.corrente = Array(STATO.codice.length).fill(null);
  suono('conferma');

  if (pieni === STATO.codice.length) STATO.finita = 'vinta';
  else if (STATO.tentativi.length >= PROVE) STATO.finita = 'persa';

  disegnaTutto();

  if (STATO.finita) attesaFinale = setTimeout(mostraFinale, 700);
}

function mostraFinale() {
  if (!STATO.finita) return;          /* nel frattempo è già cominciata un'altra partita */
  const vinta = STATO.finita === 'vinta';
  $('faccia').textContent = vinta ? '🎉' : '🙈';
  const usati = STATO.tentativi.length;
  $('stelle').textContent = vinta
    ? '⭐'.repeat(Math.max(1, 4 - Math.ceil(usati / 2)))
    : '';
  const fila = $('filaCodice');
  fila.innerHTML = '';
  STATO.codice.forEach((s, i) => {
    const c = document.createElement('span');
    c.textContent = s;
    c.style.animationDelay = (i * 90) + 'ms';
    fila.appendChild(c);
  });
  veloFinale.hidden = false;
  suono(vinta ? 'vittoria' : 'persa');
  if (vinta) lanciaCoriandoli();
}

/* ═══════════════════════ disegno ═══════════════════════ */

function elemento(tag, classe, testo) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (testo != null) e.textContent = testo;
  return e;
}

function disegnaLivelli() {
  const box = $('livelli');
  box.innerHTML = '';
  for (const chiave of Object.keys(LIVELLI)) {
    const L = LIVELLI[chiave];
    const b = elemento('button');
    b.setAttribute('aria-pressed', String(chiave === STATO.livello));
    b.appendChild(elemento('span', 'em', L.icona));
    b.appendChild(elemento('span', null, L.nome));
    b.onclick = () => { if (chiave !== STATO.livello) { STATO.livello = chiave; nuovaPartita(); } };
    box.appendChild(b);
  }
}

function disegnaTastiera() {
  tastiera.innerHTML = '';
  for (const animale of animaliInGioco()) {
    const b = elemento('button', 'tasto em', animale);
    b.setAttribute('aria-label', 'animale ' + animale);
    b.onclick = () => posa(animale);
    tastiera.appendChild(b);
  }
}

function disegnaSegreto() {
  segreto.innerHTML = '';
  segreto.classList.toggle('svelato', !!STATO.finita);
  segreto.appendChild(elemento('span', 'lucchetto em', STATO.finita ? '👁️' : '🔒'));
  STATO.codice.forEach((s, i) => {
    const c = elemento('div', 'coperta em');
    if (STATO.finita) { c.textContent = s; c.classList.add('scoperta'); c.style.animationDelay = (i * 80) + 'ms'; }
    else c.textContent = '?';
    segreto.appendChild(c);
  });
}

function disegnaTabellone(appenaPosata) {
  const L = LIVELLI[STATO.livello];
  tabellone.innerHTML = '';
  const attiva = STATO.finita ? -1 : STATO.tentativi.length;
  const prossima = STATO.corrente.indexOf(null);

  for (let r = 0; r < PROVE; r++) {
    const fatto = STATO.tentativi[r];
    const riga = elemento('div', 'riga' + (fatto ? ' fatta' : '') + (r === attiva ? ' attiva' : ''));

    const caselle = elemento('div', 'caselle');
    for (let i = 0; i < L.caselle; i++) {
      const simbolo = fatto ? fatto.simboli[i] : (r === attiva ? STATO.corrente[i] : null);
      const c = elemento('button', 'casella em');
      if (simbolo) { c.textContent = simbolo; c.classList.add('piena'); }
      if (r === attiva && i === prossima) c.classList.add('prossima');
      if (r === attiva && i === appenaPosata) c.classList.add('posata');
      if (r === attiva && simbolo) {
        c.setAttribute('aria-label', 'togli ' + simbolo);
        c.onclick = () => togli(i);
      } else {
        c.tabIndex = -1;
      }
      caselle.appendChild(c);
    }
    riga.appendChild(caselle);

    const indizi = elemento('div', 'indizi');
    if (fatto) {
      const nuovo = (r === STATO.tentativi.length - 1);
      let n = 0;
      for (let k = 0; k < fatto.pieni; k++) indizi.appendChild(pallino('p', nuovo, n++));
      for (let k = 0; k < fatto.vuoti; k++) indizi.appendChild(pallino('v', nuovo, n++));
      if (n === 0) indizi.appendChild(pallino('zero', nuovo, 0));
    }
    riga.appendChild(indizi);

    tabellone.appendChild(riga);
  }
  misura();
}

function pallino(tipo, animato, ordine) {
  const p = elemento('div', 'pallino ' + tipo + (animato ? ' nuovo' : ''));
  if (animato) p.style.animationDelay = (140 + ordine * 130) + 'ms';
  return p;
}

function aggiornaConferma() {
  conferma.disabled = !!STATO.finita || STATO.corrente.includes(null);
}

function disegnaTutto() {
  disegnaLivelli();
  disegnaSegreto();
  disegnaTastiera();
  disegnaTabellone();
  aggiornaConferma();
}

/* La casella si dimensiona sullo spazio che c'è davvero: sei righe più
   la tastiera devono stare nello schermo senza scorrimento, sempre. */
function misura() {
  const righe = tabellone.querySelectorAll('.riga');
  if (!righe.length) return;
  const n = LIVELLI[STATO.livello].caselle;
  const altezzaRiga = righe[0].clientHeight;
  const larghezza = tabellone.clientWidth - 54 - 8 - 16;   /* indizi, gap, padding */
  const perLarghezza = Math.floor((larghezza - 8 * (n - 1)) / n);
  const c = Math.max(34, Math.min(66, perLarghezza, Math.floor(altezzaRiga * 0.84)));
  tabellone.style.setProperty('--c', c + 'px');
}
window.addEventListener('resize', misura);

/* ═══════════════════════ coriandoli ═══════════════════════ */

const tela = $('coriandoli');
let pezzi = [], animazione = 0;

function lanciaCoriandoli() {
  tela.hidden = false;                    /* prima si mostra, poi si misura: da nascosta è larga zero */
  const r = tela.getBoundingClientRect();
  if (!r.width || !r.height) { tela.hidden = true; return; }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  tela.width = r.width * dpr; tela.height = r.height * dpr;
  const ctx = tela.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colori = ['#17a34a', '#f0900e', '#4b8bf5', '#e2467a', '#f5d33c', '#8b5cf6'];
  pezzi = Array.from({ length: 130 }, () => ({
    x: Math.random() * r.width,
    y: -20 - Math.random() * r.height * 0.6,
    vx: (Math.random() - 0.5) * 2.4,
    vy: 2 + Math.random() * 3.4,
    l: 6 + Math.random() * 7,
    a: Math.random() * Math.PI,
    va: (Math.random() - 0.5) * 0.3,
    col: colori[Math.floor(Math.random() * colori.length)],
  }));
  const fine = performance.now() + 4200;
  cancelAnimationFrame(animazione);
  (function passo(ora) {
    ctx.clearRect(0, 0, r.width, r.height);
    for (const p of pezzi) {
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.045;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.l / 2, -p.l / 4, p.l, p.l / 2);
      ctx.restore();
    }
    if (ora < fine) animazione = requestAnimationFrame(passo);
    else fermaCoriandoli();
  })(performance.now());
}

function fermaCoriandoli() {
  cancelAnimationFrame(animazione);
  animazione = 0;
  tela.hidden = true;
}

/* ═══════════════════════ la spiegazione senza parole ═══════════════════════

   Il bambino di sei anni non legge un regolamento. Quello che vede è un
   codice coperto che si scopre, un tentativo sotto, e poi — uno alla
   volta — i tre casi: l'animale che combacia in colonna (pallino pieno),
   l'animale che c'è ma sta altrove e infatti salta di casella (pallino
   vuoto), l'animale che non c'è e si spegne (niente). Poi ricomincia.  */

const D_SEGRETO = ['🐶', '🐱', '🐰'];
const D_PROVA   = ['🐶', '🐰', '🦊'];
let orologi = [];

function fra(ms, cosa) { orologi.push(setTimeout(cosa, ms)); }
function fermaSpiegazione() { orologi.forEach(clearTimeout); orologi = []; }

function preparaSpiegazione() {
  const seg = $('dSeg'), prova = $('dProva');
  seg.innerHTML = ''; prova.innerHTML = '';
  D_SEGRETO.forEach((s) => { const c = elemento('div', 'dcas em'); c.dataset.vero = s; c.textContent = '?'; seg.appendChild(c); });
  D_PROVA.forEach((s) => prova.appendChild(elemento('div', 'dcas em', s)));
  $('dIndizi').innerHTML = '';
  $('dOcchio').textContent = '🔒';
}

function giroSpiegazione() {
  const seg = [...$('dSeg').children], prova = [...$('dProva').children];
  const indizi = $('dIndizi');

  /* si riparte da capo: tutto coperto e spento */
  seg.forEach((c) => { c.textContent = '?'; c.className = 'dcas em'; });
  prova.forEach((c, i) => { c.className = 'dcas em'; c.textContent = D_PROVA[i]; c.style.removeProperty('--dx'); });
  indizi.innerHTML = '';
  $('dOcchio').textContent = '🔒';

  /* 0.4s — si sbircia il codice: qui è scoperto perché è solo un esempio */
  fra(400, () => {
    $('dOcchio').textContent = '👁️';
    seg.forEach((c, i) => fra(i * 120, () => { c.textContent = D_SEGRETO[i]; c.classList.add('scoperta'); }));
  });

  /* 1.4s — colonna 0: stesso animale, stessa colonna → pallino pieno */
  fra(1400, () => {
    seg[0].classList.add('acceso'); prova[0].classList.add('acceso');
    suono('posa', 0);
  });
  fra(2000, () => volaPallino(prova[0], indizi, 'p'));
  fra(2700, () => { seg[0].classList.remove('acceso'); prova[0].classList.remove('acceso'); });

  /* 3.0s — il 🐰 c'è ma sta nell'altra colonna: salta di là e torna */
  fra(3000, () => {
    const larghezza = prova[1].getBoundingClientRect().width + 8;
    prova[1].style.setProperty('--dx', larghezza + 'px');
    prova[1].classList.add('acceso-v', 'salta');
    seg[2].classList.add('acceso-v');
    suono('posa', 2);
  });
  fra(4100, () => volaPallino(prova[1], indizi, 'v'));
  fra(4900, () => { prova[1].classList.remove('acceso-v', 'salta'); seg[2].classList.remove('acceso-v'); });

  /* 5.2s — il 🦊 non c'è da nessuna parte: si spegne, nessun pallino */
  fra(5200, () => { prova[2].classList.add('no'); suono('niente'); });
  fra(5700, () => { prova[2].classList.remove('no'); prova[2].classList.add('spento'); });

  /* 7.4s — da capo */
  fra(7400, giroSpiegazione);
}

/* Un pallino che parte dalla casella e atterra nel riquadro degli indizi:
   è il pezzo che lega la causa all'effetto senza dirlo a parole. */
function volaPallino(daElemento, versoElemento, tipo) {
  const cornice = $('dimo').getBoundingClientRect();
  const a = daElemento.getBoundingClientRect();

  const finto = elemento('div', 'dvolante');
  finto.style.background = tipo === 'p' ? 'var(--pieno)' : '#fff';
  if (tipo === 'v') { finto.style.border = '4px solid var(--vuoto)'; }
  finto.style.left = (a.left - cornice.left + a.width / 2 - 9.5) + 'px';
  finto.style.top = (a.top - cornice.top + a.height / 2 - 9.5) + 'px';
  $('dimo').appendChild(finto);

  /* il posto d'arrivo è la prossima cella libera del riquadro */
  const segnaposto = elemento('div', 'pallino ' + tipo);
  segnaposto.style.visibility = 'hidden';
  versoElemento.appendChild(segnaposto);

  requestAnimationFrame(() => {
    const b = segnaposto.getBoundingClientRect();
    const dx = (b.left - cornice.left + b.width / 2 - 9.5) - parseFloat(finto.style.left);
    const dy = (b.top - cornice.top + b.height / 2 - 9.5) - parseFloat(finto.style.top);
    finto.style.transform = `translate(${dx}px, ${dy}px)`;
  });

  fra(620, () => {
    segnaposto.style.visibility = '';
    segnaposto.classList.add('nuovo');
    finto.remove();
  });
}

function apriSpiegazione() {
  fermaSpiegazione();
  veloSpiega.hidden = false;
  preparaSpiegazione();
  fra(150, giroSpiegazione);
}

function chiudiSpiegazione() {
  fermaSpiegazione();
  veloSpiega.hidden = true;
  try { localStorage.setItem('codice-segreto:vista', '1'); } catch (e) { /* file:// senza deposito */ }
}

/* ═══════════════════════ avvio ═══════════════════════ */

conferma.onclick = invia;
$('unAltro').onclick = nuovaPartita;
$('ancora').onclick = nuovaPartita;
$('aiuto').onclick = apriSpiegazione;
$('viaSpiega').onclick = chiudiSpiegazione;

nuovaPartita();
requestAnimationFrame(misura);          /* la prima volta il tabellone non è ancora disposto */

let giaVista = false;
try { giaVista = localStorage.getItem('codice-segreto:vista') === '1'; } catch (e) { giaVista = false; }
if (!giaVista) apriSpiegazione();
</script>
