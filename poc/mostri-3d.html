<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostri 3D — prova</title>
<style>
  :root { --fondo: #14161b; --carta: #1b1e25; --riga: #2c313a; --testo: #e2e5e0; --tenue: #98a09c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: var(--fondo); color: var(--testo); font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--tenue); max-width: 90ch; }
  #griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 10px; }
  figure { margin: 0; background: var(--carta); border: 1px solid var(--riga); border-radius: 4px; padding: 6px; display: grid; grid-template-columns: 150px 1fr; gap: 6px; }
  figure.solo { grid-template-columns: 1fr; }
  canvas { width: 100%; height: auto; display: block; border-radius: 3px; }
  canvas.sprite { image-rendering: auto; background: #2a3038; align-self: center; }
  figcaption { grid-column: 1 / -1; font-size: 11px; color: var(--tenue); }
</style>
</head>
<body>
<h1>Mostri del sotterraneo in 3D — prova</h1>
<p>A sinistra lo sprite dipinto di adesso, a destra lo stesso mostro come modello in codice. <code>?mostro=drago</code> (uno solo), <code>?t=2</code> (il tempo), <code>?pausa</code>, <code>?lato=720</code>, <code>?ang=0.6</code> (giro della vista), <code>?senzasprite</code>.</p>
<div id="griglia"></div>
<script type="module">
import { WebGLRenderer, Scene, PerspectiveCamera, HemisphereLight, DirectionalLight, Box3, Vector3, Color, CircleGeometry, MeshStandardMaterial, Mesh, ACESFilmicToneMapping, PCFSoftShadowMap, SRGBColorSpace, ShadowMaterial, Fog } from 'three'
import { MOSTRI } from './mostri-3d/mostri.js'

const url = new URLSearchParams(location.search)
const solo = url.get('mostro') || '', tempo = Number(url.get('t') || 1.2), LATO = Number(url.get('lato') || 560)
const attacco = url.has('attacco'), fissa = url.has('attacca') ? Number(url.get('attacca')) : null
const ang = Number(url.get('ang') ?? 0.55), conSprite = !url.has('senzasprite'), pausa = url.has('pausa')
const errori = []
const vecchio = console.error
console.error = (...a) => { errori.push(a.map(String).join(' ').slice(0, 300)); vecchio.apply(console, a) }
window.__prova = { ok: false, errori, mostri: {} }

const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(LATO, LATO, false); renderer.setPixelRatio(1)
renderer.toneMapping = ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = SRGBColorSpace
renderer.shadowMap.enabled = true; renderer.shadowMap.type = PCFSoftShadowMap

const foglio = new Image(); foglio.src = '/strumenti/sprite/sorgenti/creature/mostri-1.png'
await new Promise(r => { foglio.onload = foglio.onerror = r })

const griglia = document.getElementById('griglia')
for (const m of MOSTRI.filter(m => !solo || m.chiave === solo)) {
  const fig = document.createElement('figure'); if (!conSprite) fig.className = 'solo'
  const tela = document.createElement('canvas'); tela.width = tela.height = LATO
  const cap = document.createElement('figcaption')
  if (conSprite) {
    const sp = document.createElement('canvas'); sp.className = 'sprite'; const [x, y, w, h] = m.sprite[1]
    sp.width = 150; sp.height = 150; const c = sp.getContext('2d'), k = Math.min(140 / w, 140 / h)
    c.fillStyle = '#2a3038'; c.fillRect(0, 0, 150, 150); c.imageSmoothingEnabled = true
    c.drawImage(foglio, x, y, w, h, (150 - w * k) / 2, 145 - h * k, w * k, h * k)
    fig.append(sp)
  }
  fig.append(tela, cap); griglia.append(fig)

  const scena = new Scene(); scena.background = new Color(0x383e49); scena.fog = new Fog(0x383e49, 9, 24)
  scena.add(new HemisphereLight(0xcfe4ff, 0x6a5a3a, 1.35))
  const sole = new DirectionalLight(0xfff1dc, 2.6); sole.position.set(3.5, 6, 4.5); sole.castShadow = true
  sole.shadow.mapSize.set(2048, 2048); Object.assign(sole.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20 }); sole.shadow.bias = -0.0006; sole.shadow.radius = 4
  scena.add(sole)
  const controluce = new DirectionalLight(0x8fb4ff, 1.3); controluce.position.set(-4, 3, -4); scena.add(controluce)
  const suolo = new Mesh(new CircleGeometry(40, 40), new MeshStandardMaterial({ color: 0x3b4048, roughness: 1 })); suolo.rotation.x = -Math.PI / 2; suolo.receiveShadow = true; scena.add(suolo)
  const o = m.crea(); scena.add(o)
  o.userData.anima?.(tempo)
  o.rotation.y += ang
  const sc = new Box3().setFromObject(o), c = sc.getCenter(new Vector3()), d = sc.getSize(new Vector3())
  const cam = new PerspectiveCamera(30, 1, 0.1, 100)
  const r = d.length() * 0.5 / Math.tan(15 * Math.PI / 180) * 0.88
  const zm = Number(url.get('zoom') || 1), ya = url.has('alt') ? sc.min.y + d.y * Number(url.get('alt')) : c.y + d.y * 0.25
  cam.position.set(c.x + r * 0.15 / zm, ya + r * 0.22 / zm, c.z + r / zm); cam.lookAt(c.x, url.has('alt') ? sc.min.y + d.y * Number(url.get('alt')) : c.y - d.y * 0.04, c.z)

  const disegna = t => {
    o.userData.anima?.(t)
    if (attacco && o.userData.attacca) { const d = o.userData.attacco ? o.userData.attacco.durata : 0.8; o.userData.attacca(Math.min(1, (t % 2) / d)) }
    else if (fissa != null && o.userData.attacca) o.userData.attacca(fissa)
    renderer.render(scena, cam)
    const ctx = tela.getContext('2d'); ctx.clearRect(0, 0, LATO, LATO); ctx.drawImage(renderer.domElement, 0, 0)
  }
  disegna(tempo)
  let tris = 0; o.traverse(x => { if (x.isMesh) { const g = x.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 } })
  window.__prova.mostri[m.chiave] = { triangoli: Math.round(tris) }
  cap.textContent = `${m.nome} — ${Math.round(tris)} triangoli`
  if (!pausa) { const t0 = performance.now(); const giro = () => { disegna(tempo + (performance.now() - t0) / 1000); requestAnimationFrame(giro) }; giro() }
}
window.__prova.ok = errori.length === 0
</script>
</body>
</html>
