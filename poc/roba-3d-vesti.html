<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le vesti in 3D</title>
<style>
  :root { --fondo: #14161b; --carta: #1b1e25; --riga: #2c313a; --testo: #e2e5e0; --tenue: #98a09c; --male: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; background: var(--fondo); color: var(--testo); font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--tenue); max-width: 110ch; }
  #esito.male { color: var(--male); }
  .griglia { display: grid; grid-template-columns: repeat(4, var(--lato)); gap: 8px; margin-bottom: 8px; }
  figure { margin: 0; background: var(--carta); border: 1px solid var(--riga); border-radius: 4px; padding: 4px; }
  canvas { display: block; border-radius: 3px; width: var(--lato); height: var(--lato); }
  figcaption { font-size: 11px; color: var(--tenue); margin-top: 3px; }
  figcaption b { color: var(--testo); font-weight: 600; }
</style>
</head>
<body>
<h1>Le vesti in 3D (PoC)</h1>
<p>Le 39 figure <code>veste-*</code> (<code>poc/roba-3d/vesti.js</code>) addosso a un eroe. Parametri: <code>?id=veste-12</code> (una sola, grande), <code>?da=0&amp;n=12</code>, <code>?eroe=mago</code> (cavaliere, elfa, mago, nano; di serie ruotano), <code>?su=eroe</code> (è già così), <code>?vista=dietro|lato|davanti</code>, <code>?pausa</code>, <code>?t=</code>.</p>
<div id="esito">in corso…</div>
<div id="contenuto"></div>
<script type="module">
import { WebGLRenderer, Scene, PerspectiveCamera, HemisphereLight, DirectionalLight, Color, CircleGeometry, Mesh, ShadowMaterial, PCFSoftShadowMap, SRGBColorSpace, ACESFilmicToneMapping } from 'three'
import { vesti, FIGURE } from './roba-3d/vesti.js'
import { creaEroe, posaGuardia, CHIAVI } from './eroi-3d/eroi.js'

const url = new URLSearchParams(location.search)
const pausa = url.has('pausa'), T0 = Number(url.get('t') || 0), vista = url.get('vista') || 'tre-quarti'
const errori = []
const vecchio = console.error
console.error = (...a) => { errori.push(a.map(String).join(' ').slice(0, 300)); vecchio.apply(console, a) }
addEventListener('error', e => errori.push(String(e.message)))
const risultato = window.__prova = { ok: false, errori, figure: {} }

const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = PCFSoftShadowMap
renderer.outputColorSpace = SRGBColorSpace; renderer.toneMapping = ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1

function nuovaScena () {
  const s = new Scene(); s.background = new Color(0x2a3038)
  s.add(new HemisphereLight(0xfff0d8, 0x6a5a3a, 1.9))
  const sole = new DirectionalLight(0xfff1dc, 2.6); sole.position.set(3, 6, 5); s.add(sole)
  const fredda = new DirectionalLight(0xa8c8ff, 0.8); fredda.position.set(-4, 2, -3); s.add(fredda)
  const frontale = new DirectionalLight(0xffffff, 0.9); frontale.position.set(0, 1, 6); s.add(frontale)
  const suolo = new Mesh(new CircleGeometry(1.2, 32), new ShadowMaterial({ opacity: 0.0 })); suolo.rotation.x = -Math.PI / 2; s.add(suolo)
  return s
}
const copia = tela => tela.getContext('2d').drawImage(renderer.domElement, 0, 0, tela.width, tela.height)

let lista = FIGURE
const id = url.get('id')
if (id) lista = FIGURE.filter(f => f.id === id)
else { const da = Number(url.get('da') || 0), n = Number(url.get('n') || FIGURE.length); lista = FIGURE.slice(da, da + n) }
const grande = !!id, LATO = grande ? 640 : 360, CSS = grande ? 560 : 300
const giraV = { 'tre-quarti': 0.45, davanti: 0, dietro: Math.PI + 0.4, lato: Math.PI / 2 }[vista] ?? 0.45

renderer.setSize(LATO, LATO, false)
const cont = document.getElementById('contenuto')
const gr = document.createElement('div'); gr.className = 'griglia'; gr.style.setProperty('--lato', CSS + 'px'); if (grande) gr.style.gridTemplateColumns = 'var(--lato)'
cont.append(gr)
const celle = []
lista.forEach((figura, i) => {
  const s = nuovaScena(), cam = new PerspectiveCamera(30, 1, 0.02, 50)
  const chiave = url.get('eroe') && CHIAVI.includes(url.get('eroe')) ? url.get('eroe') : CHIAVI[FIGURE.indexOf(figura) % CHIAVI.length]
  const eroe = creaEroe(chiave); s.add(eroe)
  let togli = null
  try { togli = vesti(eroe, figura) } catch (e) { errori.push(figura.id + ': ' + String(e.stack || e)) }
  posaGuardia(eroe, T0)
  const u = eroe.userData
  const alto = (u.altezzaBusto + u.th + u.R * 2.9) * (chiave === 'nano' ? 1.12 : 1), cy = alto * 0.5 - 0.04
  cam.position.set(0, cy + 0.04, alto * 1.95); cam.lookAt(0, cy, 0)
  const tri = u.triangoliArmatura || 0
  risultato.figure[figura.id] = { triangoli: tri, eroe: chiave }
  const fig = document.createElement('figure'), tela = document.createElement('canvas')
  tela.width = tela.height = LATO
  const did = document.createElement('figcaption'); did.innerHTML = `<b>${figura.id} · ${figura.nome}</b> (${chiave})<br>${figura.cosa} · ${figura.elemento} · ${figura.materia} · pregio ${figura.pregio} · ${tri} tri`
  fig.append(tela, did); gr.append(fig)
  celle.push({ s, cam, tela, eroe, togli })
})
window.__celle = celle
const giro = t => {
  for (const k of celle) {
    k.eroe.rotation.y = giraV + (grande && !pausa ? t * 0.4 : 0)
    posaGuardia(k.eroe, t)
    if (k.eroe.userData.animaArmatura) k.eroe.userData.animaArmatura(t)
    if (k.eroe.userData.anima) k.eroe.userData.anima(t)
    renderer.render(k.s, k.cam); copia(k.tela)
  }
}
try {
  giro(T0)
  if (!pausa) { const t0 = performance.now(); const anima = () => { giro(T0 + (performance.now() - t0) / 1000); requestAnimationFrame(anima) }; requestAnimationFrame(anima) }
  risultato.ok = true
} catch (e) { errori.push(String(e.stack || e)) }
const es = document.getElementById('esito')
const tris = Object.values(risultato.figure).map(f => f.triangoli)
es.textContent = errori.length ? 'errori: ' + errori.join(' | ') : `ok — ${tris.length} vesti, al massimo ${Math.max(0, ...tris)} tri`
es.className = errori.length ? 'male' : ''
risultato.ok = risultato.ok && !errori.length
</script>
</body>
</html>
