<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Survivors — prototipo</title>
<style>
  /* ═══ la pagina: verticale, ferma, senza barre di scorrimento ═══ */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #14213d; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #scena {
    position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(100%, 430px); overflow: hidden; touch-action: none;
    box-shadow: 0 0 60px #0008;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* ═══ il cruscotto in alto ═══ */
  #cruscotto {
    position: absolute; top: 0; left: 0; right: 0; padding: 8px 10px 10px;
    pointer-events: none;
    background: linear-gradient(#000000a8, #0000);
    color: #fff; text-shadow: 0 2px 4px #000a;
  }
  .riga { display: flex; align-items: center; gap: 10px; font-weight: 900; }
  #cuori { font-size: 22px; letter-spacing: -2px; }
  #cuori .vuoto { filter: grayscale(1) brightness(.55); }
  .spazio { flex: 1; }
  .gettone {
    background: #0006; border-radius: 999px; padding: 3px 10px; font-size: 15px;
    display: flex; align-items: center; gap: 4px;
  }
  #barra {
    margin-top: 7px; height: 12px; border-radius: 99px; background: #0007;
    border: 2px solid #ffffff30; overflow: hidden;
  }
  #pieno {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #6ee7ff, #4f8bff);
    transition: width .12s linear;
  }
  #livello {
    position: absolute; left: 10px; top: 62px; font-size: 13px; font-weight: 900;
    color: #ffe98a;
  }

  /* ═══ pannelli sopra il gioco ═══ */
  .pannello {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 16px;
    background: #0b1030d9; backdrop-filter: blur(2px);
  }
  .nascosto { display: none !important; }
  .titolo {
    font-size: 30px; font-weight: 900; color: #ffe98a; text-align: center;
    text-shadow: 0 3px 0 #00000060; letter-spacing: .5px;
  }
  .sottotitolo { font-size: 15px; color: #cbd5ff; text-align: center; margin-top: -6px; }

  /* le carte: grandi, colorate, una sotto l'altra */
  .carta {
    width: 100%; max-width: 340px; min-height: 92px; border: 0; border-radius: 20px;
    padding: 12px 14px; display: flex; align-items: center; gap: 14px;
    background: linear-gradient(160deg, #ffffff, #e8eeff);
    box-shadow: 0 6px 0 #00000055, inset 0 0 0 4px #ffffff80;
    cursor: pointer; text-align: left; font-family: inherit;
  }
  .carta:active { transform: translateY(4px); box-shadow: 0 2px 0 #00000055, inset 0 0 0 4px #ffffff80; }
  .carta .icona {
    font-size: 40px; line-height: 1; flex: 0 0 auto; width: 56px;
    text-align: center; white-space: nowrap;
  }
  /* due emoji una accanto all'altra vanno rimpicciolite, se no vanno a capo */
  .carta .icona.doppia { font-size: 25px; }
  .carta .testi { flex: 1; min-width: 0; }
  .carta .nome { font-size: 21px; font-weight: 900; color: #17204a; line-height: 1.1; }
  .carta .grado { font-size: 13px; font-weight: 900; margin-top: 5px; letter-spacing: .6px; }
  .nuovo { color: #d1481f; }
  .salita { color: #2b6cb0; }
  .carta.c0 { background: linear-gradient(160deg, #fff3c4, #ffd66b); }
  .carta.c1 { background: linear-gradient(160deg, #d8f6ff, #8fd8ff); }
  .carta.c2 { background: linear-gradient(160deg, #ffe0ee, #ffabc9); }

  /* il bottone grosso (ancora / via) */
  .bottone {
    min-height: 60px; min-width: 200px; border: 0; border-radius: 18px;
    background: linear-gradient(#ffd257, #ff9f1c);
    box-shadow: 0 6px 0 #b35c00; color: #4a2200; font-family: inherit;
    font-size: 24px; font-weight: 900; cursor: pointer; padding: 10px 26px;
  }
  .bottone:active { transform: translateY(4px); box-shadow: 0 2px 0 #b35c00; }

  #rapporto { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .dato {
    background: #ffffff14; border: 2px solid #ffffff22; border-radius: 16px;
    padding: 10px 14px; min-width: 92px; text-align: center; color: #fff;
  }
  .dato b { display: block; font-size: 26px; color: #ffe98a; }
  .dato span { font-size: 12px; color: #b9c4ee; }

  /* il messaggio in chiaro dopo la scelta */
  #brindisi {
    position: absolute; left: 12px; right: 12px; top: 92px; pointer-events: none;
    background: #101a44e8; border: 3px solid #ffe98a; border-radius: 16px;
    padding: 10px 12px; color: #fff; font-size: 15px; font-weight: 700;
    text-align: center; opacity: 0; transition: opacity .25s;
  }
  #brindisi b { color: #ffe98a; }
  #brindisi.mostra { opacity: 1; }

  #dritta {
    position: absolute; left: 0; right: 0; bottom: 76px; text-align: center;
    color: #fff; font-size: 17px; font-weight: 800; text-shadow: 0 2px 6px #000b;
    pointer-events: none; transition: opacity .5s;
  }
  #presi {
    position: absolute; left: 8px; right: 8px; bottom: 8px; text-align: center;
    font-size: 18px; pointer-events: none; opacity: .95; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="scena">
  <canvas id="tela"></canvas>

  <div id="cruscotto">
    <div class="riga">
      <div id="cuori">❤️❤️❤️</div>
      <div class="spazio"></div>
      <div class="gettone">⏱ <span id="orologio">0:00</span></div>
      <div class="gettone">💀 <span id="uccisi">0</span></div>
    </div>
    <div id="barra"><div id="pieno"></div></div>
  </div>
  <div id="livello">LIVELLO 1</div>

  <div id="presi"></div>
  <div id="dritta">tieni premuto e trascina 👆</div>
  <div id="brindisi"></div>

  <div id="carte" class="pannello nascosto">
    <div class="titolo">LEVEL UP! ⭐</div>
    <div class="sottotitolo">choose one</div>
    <div id="scelte" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px"></div>
  </div>

  <div id="fine" class="pannello nascosto">
    <div class="titolo">GAME OVER 💀</div>
    <div id="rapporto"></div>
    <button class="bottone" id="ancora">ANCORA ▶</button>
  </div>
</div>

<script>
'use strict'
/* ═══════════════════════════════════════════════════════════════════
   SURVIVORS — prototipo (bullet heaven per bambini)

   L'eroe sta al centro dello schermo e spara da solo al mostro più
   vicino: il bambino ha una cosa sola da fare col dito, schivare. I
   mostri lasciano gemme, le gemme fanno salire di livello, e a ogni
   livello il gioco si ferma e chiede di scegliere fra tre carte
   **scritte in inglese**: è quello il punto del prototipo.

   Tutto in un file: niente librerie, niente rete, canvas 2D e basta.
   ═══════════════════════════════════════════════════════════════════ */

/* ══════════ la taratura, tutta qui ══════════ */
const CFG = {
  velocitaEroe: 152,          // pixel al secondo, prima degli stivali
  raggioEroe: 15,
  cuoriIniziali: 3,
  invulnerabilita: 1.7,       // secondi di lampeggio dopo un colpo preso
  cadenza: 0.34,              // secondi fra un tiro e l'altro
  gittata: 275,
  velocitaFreccia: 430,
  calamita: 115,              // da quanto lontano le gemme volano di scatto
  derivaGemma: 55,            // e quanto svelte si incamminano quelle lontane
  natePerSecondo: t => Math.min(4.6, 1.3 + t / 27),
  vitaNemico: t => 1 + t / 80,       // moltiplicatore della vita col passare del tempo
  frettaNemico: t => Math.min(1.4, 1 + t / 200),
  maxNemici: 95,
}

/* quanto serve per passare dal livello l al successivo */
const soglia = l => Math.round(4 + 2 * l + 0.6 * l * l)

/* ══════════ IL MAZZO ══════════
   Nome in inglese sulla carta, spiegazione in italiano *solo dopo* la
   scelta. `max` è quante volte si può cumulare. */
const MAZZO = [
  { k: 'frecce',   nome: '+1 arrow',      icona: '🏹',   max: 5, chiaro: 'una freccia in più a ogni tiro' },
  { k: 'mani',     nome: 'fast hands',    icona: '⚡',   max: 5, chiaro: 'mani veloci: spari molto più spesso' },
  { k: 'stivali',  nome: 'faster boots',  icona: '👟',   max: 5, chiaro: 'stivali veloci: corri di più' },
  { k: 'cuore',    nome: 'bigger heart',  icona: '❤️',   max: 3, chiaro: 'un cuore in più (e te lo riempie)' },
  { k: 'mela',     nome: 'healing apple', icona: '🍎',   max: 9, chiaro: 'mela curativa: ti torna un cuore subito' },
  { k: 'magnete',  nome: 'magnet',        icona: '🧲',   max: 4, chiaro: 'calamita: le gemme volano da te da lontano' },
  { k: 'lunghe',   nome: 'long arrows',   icona: '🏹➡️', max: 4, chiaro: 'frecce lunghe: arrivano molto più lontano' },
  { k: 'grandi',   nome: 'big arrows',    icona: '💥',   max: 4, chiaro: 'frecce grosse: fanno più male' },
  { k: 'gelo',     nome: 'frozen shield', icona: '❄️',   max: 4, chiaro: 'scudo di ghiaccio: chi ti si avvicina rallenta' },
  { k: 'spine',    nome: 'spiky armor',   icona: '🦔',   max: 3, chiaro: 'armatura a spine: chi ti tocca si punge' },
  { k: 'monete',   nome: 'double coins',  icona: '🪙',   max: 3, chiaro: 'monete doppie: ogni gemma vale di più' },
  { k: 'stella',   nome: 'lucky star',    icona: '⭐',   max: 4, chiaro: 'stella fortunata: certi colpi fanno il doppio' },
  { k: 'palla',    nome: 'bouncing ball', icona: '⚽',   max: 4, chiaro: 'una palla gira intorno a te e picchia' },
  { k: 'fuoco',    nome: 'fire ring',     icona: '🔥',   max: 4, chiaro: 'anello di fuoco: ogni tanto esplodi intorno a te' },
  { k: 'fulmine',  nome: 'lightning',     icona: '🌩️',  max: 4, chiaro: 'fulmine: ogni tanto ne incenerisce uno' },
  { k: 'occhi',    nome: 'sharp eyes',    icona: '👀',   max: 3, chiaro: 'occhi acuti: le frecce passano attraverso' },
  { k: 'topo',     nome: 'tiny body',     icona: '🐭',   max: 3, chiaro: 'corpo piccolo: sei più difficile da prendere' },
  { k: 'fantasma', nome: 'ghost feet',    icona: '👻',   max: 3, chiaro: 'piedi fantasma: dopo un colpo resti intoccabile di più' },
]

/* ══════════ I MOSTRI ══════════ */
const MOSTRI = {
  melma:       { colore: '#63d16b', scuro: '#2f9a49', r: 15, vita: 1, passo: 62,  da: 0 },
  pipistrello: { colore: '#a97ce8', scuro: '#6b45a8', r: 12, vita: 1, passo: 96,  da: 15 },
  fungo:       { colore: '#ff7b6b', scuro: '#c33a34', r: 17, vita: 3, passo: 54,  da: 32 },
  spettro:     { colore: '#8fdcff', scuro: '#3f8fc4', r: 14, vita: 2, passo: 76,  da: 50 },
  roccia:      { colore: '#b9b2a6', scuro: '#6f685e', r: 22, vita: 6, passo: 40,  da: 75 },
}

/* ══════════ I SUONI ══════════
   Oscillatori brevissimi, volumi bassi: il «pew» deve far ridere, non
   stancare. Si accendono al primo tocco (regola dei browser). */
const suoni = (() => {
  let ac = null, rumoreBuf = null, ultimoTiro = 0
  function accendi() {
    if (!ac) {
      const A = window.AudioContext || window.webkitAudioContext
      if (!A) return
      ac = new A()
      const n = ac.sampleRate * 0.3
      rumoreBuf = ac.createBuffer(1, n, ac.sampleRate)
      const d = rumoreBuf.getChannelData(0)
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n)
    }
    if (ac.state === 'suspended') ac.resume()
  }
  function nota(f, f2, tipo, dur, vol, ritardo = 0) {
    if (!ac) return
    const t = ac.currentTime + ritardo
    const o = ac.createOscillator(), g = ac.createGain()
    o.type = tipo; o.frequency.setValueAtTime(f, t)
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur)
    g.gain.setValueAtTime(0.0001, t)
    g.gain.linearRampToValueAtTime(vol, t + 0.008)
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
    o.connect(g); g.connect(ac.destination)
    o.start(t); o.stop(t + dur + 0.03)
  }
  function fruscio(dur, vol, taglio) {
    if (!ac || !rumoreBuf) return
    const t = ac.currentTime
    const s = ac.createBufferSource(); s.buffer = rumoreBuf
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = taglio
    const g = ac.createGain()
    g.gain.setValueAtTime(vol, t)
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur)
    s.connect(f); f.connect(g); g.connect(ac.destination)
    s.start(t); s.stop(t + dur)
  }
  return {
    accendi,
    tiro() {                                   // il pew pew, con un pizzico di caso
      if (!ac || ac.currentTime - ultimoTiro < 0.055) return
      ultimoTiro = ac.currentTime
      const f = 780 + Math.random() * 180
      nota(f, f * 0.32, 'triangle', 0.07, 0.030)
    },
    morto()   { fruscio(0.10, 0.045, 900); nota(220, 90, 'square', 0.09, 0.020) },
    gemma()   { nota(1180, 1760, 'sine', 0.055, 0.028) },
    livello() { [523, 659, 784, 1047].forEach((f, i) => nota(f, f, 'triangle', 0.14, 0.038, i * 0.075)) },
    ahia()    { nota(300, 70, 'sawtooth', 0.22, 0.055); fruscio(0.16, 0.04, 400) },
    fine()    { [523, 415, 330, 196].forEach((f, i) => nota(f, f * 0.9, 'sawtooth', 0.28, 0.045, i * 0.16)) },
    fuoco()   { fruscio(0.22, 0.035, 320) },
    tuono()   { fruscio(0.18, 0.045, 1800); nota(120, 50, 'square', 0.16, 0.025) },
  }
})()

/* ══════════ tela e misure ══════════ */
const tela = document.getElementById('tela')
const ctx = tela.getContext('2d')
let W = 0, H = 0

function ridimensiona() {
  const r = tela.parentElement.getBoundingClientRect()
  W = r.width; H = r.height
  const dpr = window.devicePixelRatio || 1
  tela.width = Math.floor(W * dpr); tela.height = Math.floor(H * dpr)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
}
addEventListener('resize', ridimensiona)

/* ══════════ lo stato della partita ══════════ */
let stato, eroe, nemici, colpi, gemme, effetti, potenziamenti, tempo, uccisi, schermo

function nuovaPartita() {
  potenziamenti = {}
  eroe = {
    x: 0, y: 0, vx: 0, vy: 0, cuori: CFG.cuoriIniziali, cuoriMax: CFG.cuoriIniziali,
    invulnA: 0, guarda: 1, passi: 0, ricarica: 0.25, mira: 0,
  }
  nemici = []; colpi = []; gemme = []; effetti = []
  tempo = 0; uccisi = 0
  stato = { xp: 0, livello: 1, prossima: soglia(1), aNascere: 0, orbita: 0, tFuoco: 0, tFulmine: 0 }
  schermo = 'gioca'
  document.getElementById('carte').classList.add('nascosto')
  document.getElementById('fine').classList.add('nascosto')
  const d = document.getElementById('dritta')
  d.style.opacity = '1'; d.textContent = 'tieni premuto e trascina 👆'
  aggiornaCruscotto()
}

/* quanto vale un potenziamento adesso */
const lv = k => potenziamenti[k] || 0

/* i numeri dell'eroe, ricalcolati da quello che ha preso */
const forza = {
  get velocita()  { return CFG.velocitaEroe * (1 + 0.17 * lv('stivali')) },
  get raggio()    { return CFG.raggioEroe * Math.pow(0.86, lv('topo')) },
  get cadenza()   { return CFG.cadenza * Math.pow(0.80, lv('mani')) },
  get frecce()    { return 1 + lv('frecce') },
  get danno()     { return 1 + 1.1 * lv('grandi') },
  get gittata()   { return CFG.gittata * (1 + 0.26 * lv('lunghe')) },
  get velColpo()  { return CFG.velocitaFreccia * (1 + 0.16 * lv('lunghe')) },
  get calamita()  { return CFG.calamita + 48 * lv('magnete') },
  get gelo()      { return lv('gelo') ? 66 + 20 * lv('gelo') : 0 },
  get freno()     { return Math.max(0.30, 1 - 0.20 * lv('gelo')) },
  get spine()     { return lv('spine') ? 2 + 3 * lv('spine') : 0 },
  get valoreGemma() { return 1 + lv('monete') },
  get fortuna()   { return 0.14 * lv('stella') },
  get perfora()   { return lv('occhi') },
  get invuln()    { return CFG.invulnerabilita + 0.5 * lv('fantasma') },
}

/* ══════════ il dito e le frecce ══════════ */
const tasti = {}
let dito = null                       // {x, y} in coordinate di schermo
const scenaEl = document.getElementById('scena')

function daSchermo(e) {
  const r = tela.getBoundingClientRect()
  return { x: e.clientX - r.left, y: e.clientY - r.top }
}
scenaEl.addEventListener('pointerdown', e => {
  suoni.accendi()
  if (schermo !== 'gioca') return
  dito = daSchermo(e)
  try { scenaEl.setPointerCapture(e.pointerId) } catch (_) { /* pazienza */ }
  document.getElementById('dritta').style.opacity = '0'
})
scenaEl.addEventListener('pointermove', e => { if (dito) dito = daSchermo(e) })
const molla = () => { dito = null }
scenaEl.addEventListener('pointerup', molla)
scenaEl.addEventListener('pointercancel', molla)
addEventListener('keydown', e => { suoni.accendi(); tasti[e.key] = true })
addEventListener('keyup', e => { tasti[e.key] = false })

/* ══════════ il caso ripetibile per l'erba ══════════ */
function seme(i, j, k = 0) {
  let s = (i * 374761393 + j * 668265263 + k * 1442695041) | 0
  s = Math.imul(s ^ s >>> 13, 1274126177)
  return ((s ^ s >>> 16) >>> 0) / 4294967296
}

/* ══════════ NASCERE ══════════
   I mostri arrivano da fuori schermo, in cerchio intorno all'eroe. */
function tipoDelMomento() {
  const buoni = Object.keys(MOSTRI).filter(k => tempo >= MOSTRI[k].da)
  // gli ultimi arrivati sono più probabili, ma i primi non spariscono mai
  const pesi = buoni.map((k, i) => 1 + i * 0.7)
  let s = pesi.reduce((a, b) => a + b, 0) * Math.random()
  for (let i = 0; i < buoni.length; i++) { s -= pesi[i]; if (s <= 0) return buoni[i] }
  return buoni[0]
}

function nasceNemico() {
  if (nemici.length >= CFG.maxNemici) return
  const t = tipoDelMomento(), m = MOSTRI[t]
  /* appena fuori dal bordo dello schermo, non su un cerchio largo: da
     un angolo lontano ci metterebbero dieci secondi ad arrivare, e i
     primi quindici secondi sono quelli che decidono se il gioco piace */
  const mx = W / 2 + 34, my = H / 2 + 34
  const perimetro = 2 * (mx + my)
  let u = Math.random() * perimetro, ox, oy
  if (u < 2 * mx) { ox = u - mx; oy = -my }
  else if ((u -= 2 * mx) < 2 * mx) { ox = u - mx; oy = my }
  else if ((u -= 2 * mx) < 2 * my) { ox = -mx; oy = u - my }
  else { ox = mx; oy = u - 2 * my - my }
  const vita = Math.ceil(m.vita * CFG.vitaNemico(tempo))
  nemici.push({
    tipo: t, x: eroe.x + ox, y: eroe.y + oy,
    r: m.r, vita, vitaMax: vita,
    passo: m.passo * (0.85 + Math.random() * 0.3) * CFG.frettaNemico(tempo),
    spx: 0, spy: 0, lampo: 0, gelato: 0, cdPalla: 0, fase: Math.random() * 6.3,
  })
}

/* ══════════ EFFETTI (le cosine che volano via) ══════════ */
function scoppio(x, y, colore, quanti = 8) {
  for (let i = 0; i < quanti; i++) {
    const a = Math.random() * 6.3, v = 40 + Math.random() * 110
    effetti.push({ che: 'briciola', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   r: 2 + Math.random() * 3, colore, vita: 0.45 })
  }
}
const anello = (x, y, r, colore) => effetti.push({ che: 'anello', x, y, r0: 8, r, colore, vita: 0.4, tot: 0.4 })

/* ══════════ AVANZARE ══════════ */
function avanza(dt) {
  tempo += dt

  /* — l'eroe segue il dito (o le frecce della tastiera) — */
  let dx = 0, dy = 0
  if (dito) {
    const bx = eroe.x + (dito.x - W / 2), by = eroe.y + (dito.y - H / 2)
    dx = bx - eroe.x; dy = by - eroe.y
    if (Math.hypot(dx, dy) < 6) { dx = 0; dy = 0 }
  }
  if (tasti.ArrowLeft || tasti.a) dx -= 1
  if (tasti.ArrowRight || tasti.d) dx += 1
  if (tasti.ArrowUp || tasti.w) dy -= 1
  if (tasti.ArrowDown || tasti.s) dy += 1
  const l = Math.hypot(dx, dy)
  if (l > 0.001) {
    const v = forza.velocita
    eroe.vx = dx / l * v; eroe.vy = dy / l * v
    eroe.x += eroe.vx * dt; eroe.y += eroe.vy * dt
    eroe.guarda = dx > 0.5 ? 1 : dx < -0.5 ? -1 : eroe.guarda
    eroe.passi += v * dt
    // polvere sotto i piedi: si vede che gli stivali fanno effetto
    if (Math.random() < dt * (6 + v / 26))
      effetti.push({ che: 'briciola', x: eroe.x - eroe.vx * 0.06, y: eroe.y + 12,
                     vx: -eroe.vx * 0.15, vy: -12, r: 2.5, colore: '#e9dcae', vita: 0.35 })
  } else { eroe.vx = eroe.vy = 0 }

  if (eroe.invulnA > 0) eroe.invulnA -= dt

  /* — nascite — */
  stato.aNascere += CFG.natePerSecondo(tempo) * dt
  while (stato.aNascere >= 1) { stato.aNascere -= 1; nasceNemico() }

  /* — i mostri camminano verso l'eroe — */
  const rg = forza.gelo, freno = forza.freno
  const troppoLontano = Math.hypot(W, H) * 1.15
  for (const n of nemici) {
    const ddx = eroe.x - n.x, ddy = eroe.y - n.y
    const d = Math.hypot(ddx, ddy) || 1
    /* chi è rimasto indietro di due schermi non tornerà mai: si toglie di
       mezzo e lascia il posto a uno che nasce davanti. Senza questo, chi
       scappa sempre nella stessa direzione si porta dietro un codazzo
       fuori tiro e il gioco si impianta. */
    if (d > troppoLontano) { n.sparito = true; continue }
    n.gelato = rg && d < rg ? 1 : Math.max(0, n.gelato - dt * 2)
    const p = n.passo * (n.gelato ? freno : 1)
    n.x += ddx / d * p * dt + n.spx * dt
    n.y += ddy / d * p * dt + n.spy * dt
    n.spx *= Math.pow(0.02, dt); n.spy *= Math.pow(0.02, dt)   // la spinta si spegne
    n.lampo = Math.max(0, n.lampo - dt * 4)
    n.cdPalla = Math.max(0, n.cdPalla - dt)
    n.fase += dt * 6

    /* — contatto con l'eroe — */
    if (d < n.r + forza.raggio) {
      if (forza.spine && n.cdPalla <= 0) { n.cdPalla = 0.5; ferisci(n, forza.spine, '#ffd257') }
      if (eroe.invulnA <= 0) {
        eroe.cuori--; eroe.invulnA = forza.invuln
        suoni.ahia(); anello(eroe.x, eroe.y, 70, '#ff5470')
        for (const m of nemici) {            // tutti indietro: un attimo di respiro
          const sx = m.x - eroe.x, sy = m.y - eroe.y, sd = Math.hypot(sx, sy) || 1
          if (sd < 160) { m.spx += sx / sd * 460; m.spy += sy / sd * 460 }
        }
        aggiornaCruscotto()
        if (eroe.cuori <= 0) return finePartita()
      } else {
        n.spx += ddx / d * -140; n.spy += ddy / d * -140
      }
    }
  }

  /* — l'arco spara da solo al più vicino — */
  eroe.ricarica -= dt
  const bersaglio = piuVicino(eroe.x, eroe.y, forza.gittata * 1.1)
  if (bersaglio) eroe.mira = Math.atan2(bersaglio.y - eroe.y, bersaglio.x - eroe.x)
  if (bersaglio && eroe.ricarica <= 0) {
    eroe.ricarica = forza.cadenza
    const n = forza.frecce, apertura = 0.16
    for (let i = 0; i < n; i++) {
      const a = eroe.mira + (i - (n - 1) / 2) * apertura
      const fortunato = Math.random() < forza.fortuna
      colpi.push({
        x: eroe.x + Math.cos(a) * 14, y: eroe.y + Math.sin(a) * 14,
        vx: Math.cos(a) * forza.velColpo, vy: Math.sin(a) * forza.velColpo,
        a, danno: forza.danno * (fortunato ? 2 : 1), oro: fortunato,
        r: 5 + 1.6 * lv('grandi'), vita: forza.gittata / forza.velColpo, restano: forza.perfora, presi: [],
      })
    }
    suoni.tiro()
  }

  /* — le frecce — */
  for (const c of colpi) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.vita -= dt
    for (const n of nemici) {
      if (n.vita <= 0 || c.presi.includes(n)) continue
      if (Math.hypot(n.x - c.x, n.y - c.y) < n.r + c.r) {
        ferisci(n, c.danno, c.oro ? '#ffd257' : '#fff')
        n.spx += c.vx * 0.18; n.spy += c.vy * 0.18
        c.presi.push(n)
        if (c.restano-- <= 0) { c.vita = 0; break }
      }
    }
  }
  colpi = colpi.filter(c => c.vita > 0)

  /* — la palla che gira — */
  const palle = lv('palla')
  stato.orbita += dt * 2.3
  if (palle) {
    const R = 64 + 6 * palle, danno = 1.5 + 1.5 * palle
    for (let i = 0; i < palle; i++) {
      const a = stato.orbita + i * (6.283 / palle)
      const px = eroe.x + Math.cos(a) * R, py = eroe.y + Math.sin(a) * R
      for (const n of nemici) {
        if (n.cdPalla <= 0 && Math.hypot(n.x - px, n.y - py) < n.r + 13) {
          n.cdPalla = 0.45; ferisci(n, danno, '#fff')
          const sx = n.x - eroe.x, sy = n.y - eroe.y, sd = Math.hypot(sx, sy) || 1
          n.spx += sx / sd * 180; n.spy += sy / sd * 180
        }
      }
    }
  }

  /* — l'anello di fuoco — */
  if (lv('fuoco')) {
    stato.tFuoco -= dt
    if (stato.tFuoco <= 0) {
      stato.tFuoco = Math.max(1.5, 3.4 - 0.45 * lv('fuoco'))
      const R = 78 + 20 * lv('fuoco'), danno = 2 + 1.6 * lv('fuoco')
      anello(eroe.x, eroe.y, R, '#ff9f1c')
      suoni.fuoco()
      for (const n of nemici) if (Math.hypot(n.x - eroe.x, n.y - eroe.y) < R) {
        ferisci(n, danno, '#ffb347')
        const sx = n.x - eroe.x, sy = n.y - eroe.y, sd = Math.hypot(sx, sy) || 1
        n.spx += sx / sd * 220; n.spy += sy / sd * 220
      }
    }
  }

  /* — il fulmine — */
  if (lv('fulmine')) {
    stato.tFulmine -= dt
    if (stato.tFulmine <= 0) {
      stato.tFulmine = Math.max(0.7, 2.3 - 0.4 * lv('fulmine'))
      const vicini = nemici.filter(n => n.vita > 0 && Math.abs(n.x - eroe.x) < W && Math.abs(n.y - eroe.y) < H)
      if (vicini.length) {
        const n = vicini[Math.floor(Math.random() * vicini.length)]
        effetti.push({ che: 'saetta', x: n.x, y: n.y, vita: 0.22, tot: 0.22 })
        ferisci(n, 3 + 2 * lv('fulmine'), '#ffffff')
        suoni.tuono()
      }
    }
  }

  /* — chi è morto lascia la gemma — */
  for (const n of nemici) if (n.vita <= 0) {
    uccisi++
    scoppio(n.x, n.y, MOSTRI[n.tipo].colore, 9)
    gemme.push({ x: n.x, y: n.y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60,
                 val: forza.valoreGemma, fase: Math.random() * 6.3 })
    suoni.morto()
  }
  nemici = nemici.filter(n => n.vita > 0 && !n.sparito)

  /* — le gemme: la calamita è la sensazione da non perdere — */
  const cal = forza.calamita
  for (const g of gemme) {
    const gdx = eroe.x - g.x, gdy = eroe.y - g.y, gd = Math.hypot(gdx, gdy) || 1
    if (gd < cal) {
      const tira = 260 + (cal - gd) * 5.5
      g.vx += gdx / gd * tira * dt; g.vy += gdy / gd * tira * dt
    } else {
      /* fuori dalla calamita si incamminano lo stesso, piano, e tanto più
         in fretta quanto più sono rimaste indietro: una gemma persa per
         sempre è una fatica buttata, e a sette anni non si torna indietro
         a raccogliere quella dietro l'angolo. Il codino di gemme che
         insegue è anche una bella cosa da vedere. */
      const deriva = Math.min(135, CFG.derivaGemma + gd * 0.22)
      g.x += gdx / gd * deriva * dt
      g.y += gdy / gd * deriva * dt
    }
    g.vx *= Math.pow(0.25, dt); g.vy *= Math.pow(0.25, dt)
    g.x += g.vx * dt; g.y += g.vy * dt
    g.fase += dt * 4
    if (gd < forza.raggio + 12) { g.presa = true; prendiGemma(g) }
  }
  gemme = gemme.filter(g => !g.presa)

  /* — le cosine che volano — */
  for (const e of effetti) {
    e.vita -= dt
    if (e.che === 'briciola') { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 220 * dt }
  }
  effetti = effetti.filter(e => e.vita > 0)
}

function ferisci(n, danno, colore) {
  n.vita -= danno; n.lampo = 1
  scoppio(n.x, n.y, colore, 3)
}

function piuVicino(x, y, entro) {
  let migliore = null, md = entro * entro
  for (const n of nemici) {
    const d = (n.x - x) ** 2 + (n.y - y) ** 2
    if (d < md) { md = d; migliore = n }
  }
  return migliore
}

function prendiGemma(g) {
  stato.xp += g.val
  suoni.gemma()
  if (stato.xp >= stato.prossima) salgoDiLivello()
  aggiornaCruscotto()
}

/* ══════════ LIVELLO E CARTE ══════════ */
function salgoDiLivello() {
  stato.xp -= stato.prossima
  stato.livello++
  stato.prossima = soglia(stato.livello)
  suoni.livello()
  anello(eroe.x, eroe.y, 120, '#ffe98a')
  mostraCarte()
}

function tirafuoriTre() {
  const disponibili = MAZZO.filter(c => lv(c.k) < c.max)
  const mescolate = disponibili.slice()
  for (let i = mescolate.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[mescolate[i], mescolate[j]] = [mescolate[j], mescolate[i]]
  }
  return mescolate.slice(0, 3)
}

function mostraCarte() {
  schermo = 'carte'; dito = null
  document.getElementById('brindisi').classList.remove('mostra')   // quello di prima ha finito
  const scelte = document.getElementById('scelte')
  scelte.innerHTML = ''
  tirafuoriTre().forEach((c, i) => {
    const b = document.createElement('button')
    b.className = 'carta c' + i
    const grado = lv(c.k) === 0
      ? '<div class="grado nuovo">NEW!</div>'
      : `<div class="grado salita">level ${lv(c.k) + 1}</div>`
    b.innerHTML = `<div class="icona${[...c.icona].length > 2 ? ' doppia' : ''}">${c.icona}</div>
      <div class="testi"><div class="nome">${c.nome}</div>${grado}</div>`
    b.addEventListener('click', () => prendiCarta(c))
    scelte.appendChild(b)
  })
  document.getElementById('carte').classList.remove('nascosto')
  aggiornaCruscotto()
}

function prendiCarta(c) {
  potenziamenti[c.k] = lv(c.k) + 1
  if (c.k === 'cuore') { eroe.cuoriMax++; eroe.cuori = eroe.cuoriMax }
  if (c.k === 'mela') eroe.cuori = Math.min(eroe.cuoriMax, eroe.cuori + 1)
  document.getElementById('carte').classList.add('nascosto')
  schermo = 'gioca'
  brinda(`${c.icona} <b>${c.nome}</b> = ${c.chiaro}`)
  aggiornaCruscotto()
}

let orologioBrindisi = 0
function brinda(html) {
  const b = document.getElementById('brindisi')
  b.innerHTML = html; b.classList.add('mostra')
  clearTimeout(orologioBrindisi)
  orologioBrindisi = setTimeout(() => b.classList.remove('mostra'), 2600)
}

/* ══════════ FINE ══════════ */
function finePartita() {
  schermo = 'fine'; dito = null
  suoni.fine()
  document.getElementById('carte').classList.add('nascosto')
  document.getElementById('brindisi').classList.remove('mostra')
  const m = Math.floor(tempo / 60), s = Math.floor(tempo % 60)
  document.getElementById('rapporto').innerHTML = `
    <div class="dato"><b>${m}:${String(s).padStart(2, '0')}</b><span>durata</span></div>
    <div class="dato"><b>${uccisi}</b><span>mostri</span></div>
    <div class="dato"><b>${stato.livello}</b><span>livello</span></div>`
  document.getElementById('fine').classList.remove('nascosto')
}
document.getElementById('ancora').addEventListener('click', () => { suoni.accendi(); nuovaPartita() })

/* ══════════ IL CRUSCOTTO ══════════ */
function aggiornaCruscotto() {
  let c = ''
  for (let i = 0; i < eroe.cuoriMax; i++)
    c += i < eroe.cuori ? '❤️' : '<span class="vuoto">❤️</span>'
  document.getElementById('cuori').innerHTML = c
  const m = Math.floor(tempo / 60), s = Math.floor(tempo % 60)
  document.getElementById('orologio').textContent = `${m}:${String(s).padStart(2, '0')}`
  document.getElementById('uccisi').textContent = uccisi
  document.getElementById('pieno').style.width = Math.min(100, stato.xp / stato.prossima * 100) + '%'
  document.getElementById('livello').textContent = 'LIVELLO ' + stato.livello
  document.getElementById('presi').innerHTML = MAZZO
    .filter(x => lv(x.k)).map(x => `${x.icona}${lv(x.k) > 1 ? '<sub>' + lv(x.k) + '</sub>' : ''}`).join(' ')
}

/* ═══════════════════════════════════════════════════════════════════
   IL DISEGNO
   Tutto in coordinate di mondo, con l'eroe al centro dello schermo.
   ═══════════════════════════════════════════════════════════════════ */
function disegna() {
  const cx = W / 2 - eroe.x, cy = H / 2 - eroe.y      // da mondo a schermo
  prato(cx, cy)
  ctx.save(); ctx.translate(cx, cy)

  aloneGelo()
  for (const g of gemme) gemma(g)
  const ordinati = nemici.slice().sort((a, b) => a.y - b.y)
  for (const n of ordinati) mostro(n)
  disegnaEroe()
  for (const c of colpi) freccia(c)
  pallaGirante()
  for (const e of effetti) effetto(e)

  ctx.restore()
  bordoRosso()
}

/* — il prato: erba, ciuffi e fiorellini, che scorrono col mondo — */
function prato(cx, cy) {
  ctx.fillStyle = '#6dbd5c'; ctx.fillRect(0, 0, W, H)
  const passo = 44
  const i0 = Math.floor((eroe.x - W / 2) / passo) - 1, i1 = Math.floor((eroe.x + W / 2) / passo) + 1
  const j0 = Math.floor((eroe.y - H / 2) / passo) - 1, j1 = Math.floor((eroe.y + H / 2) / passo) + 1
  ctx.lineCap = 'round'
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const a = seme(i, j, 1), b = seme(i, j, 2), c = seme(i, j, 3)
    const x = i * passo + a * passo + cx, y = j * passo + b * passo + cy
    if ((i + j) % 2 === 0) {                       // chiazze appena più chiare
      ctx.fillStyle = '#78c964'
      ctx.beginPath(); ctx.ellipse(x, y, 26, 18, a * 3, 0, 6.29); ctx.fill()
    }
    if (c < 0.62) {                                // ciuffo d'erba a V
      ctx.strokeStyle = c < 0.3 ? '#4f9c53' : '#8ed97a'; ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(x, y); ctx.quadraticCurveTo(x - 2, y - 5, x - 4, y - 9)
      ctx.moveTo(x + 2, y); ctx.quadraticCurveTo(x + 3, y - 5, x + 6, y - 8)
      ctx.stroke()
    } else if (c < 0.70) {                         // un fiorellino
      const col = ['#fff6d8', '#ffd9e8', '#ffe9a0'][Math.floor(a * 3)]
      for (let k = 0; k < 5; k++) {
        const t = k / 5 * 6.29
        cerchio(x + Math.cos(t) * 3, y + Math.sin(t) * 3, 2.2, col)
      }
      cerchio(x, y, 1.6, '#e8a33c')
    }
  }
}

const cerchio = (x, y, r, col) => {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill()
}
const ellisse = (x, y, rx, ry, col) => {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.29); ctx.fill()
}

/* — l'alone di ghiaccio, se comprato — */
function aloneGelo() {
  const r = forza.gelo
  if (!r) return
  const g = ctx.createRadialGradient(eroe.x, eroe.y, r * 0.2, eroe.x, eroe.y, r)
  g.addColorStop(0, '#bff0ff10'); g.addColorStop(0.75, '#8fe0ff45'); g.addColorStop(1, '#6ecdff70')
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(eroe.x, eroe.y, r, 0, 6.29); ctx.fill()
  ctx.strokeStyle = '#d8f6ffcc'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.arc(eroe.x, eroe.y, r, 0, 6.29); ctx.stroke()
  ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  for (let i = 0; i < 4; i++) {
    const a = tempo * 0.7 + i * 1.57
    ctx.fillText('❄️', eroe.x + Math.cos(a) * r * 0.86, eroe.y + Math.sin(a) * r * 0.86)
  }
}

/* — l'eroe: un bambino arciere — */
function disegnaEroe() {
  const x = eroe.x, y = eroe.y
  const dondolo = Math.sin(eroe.passi * 0.06) * 2 * (eroe.vx || eroe.vy ? 1 : 0)
  const s = forza.raggio / CFG.raggioEroe                  // rimpicciolisce con «tiny body»
  const lampeggia = eroe.invulnA > 0 && Math.floor(eroe.invulnA * 12) % 2 === 0
  ellisse(x, y + 15 * s, 13 * s, 5 * s, '#00000033')
  ctx.save(); ctx.translate(x, y + dondolo); ctx.scale(s * eroe.guarda, s)
  ctx.globalAlpha = lampeggia ? 0.4 : 1

  if (forza.spine) {                                        // le spine si vedono
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * 6.283 + tempo
      ctx.fillStyle = '#ffd257'
      ctx.beginPath()
      ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 16 - 2)
      ctx.lineTo(Math.cos(a + 0.28) * 11, Math.sin(a + 0.28) * 11 - 2)
      ctx.lineTo(Math.cos(a - 0.28) * 11, Math.sin(a - 0.28) * 11 - 2)
      ctx.closePath(); ctx.fill()
    }
  }
  // gambe, tunica, testa
  ctx.fillStyle = '#3a5fc8'
  ctx.fillRect(-6, 4, 4.5, 8); ctx.fillRect(1.5, 4, 4.5, 8)
  ctx.fillStyle = '#7b4a2a'
  ctx.fillRect(-6.5, 11, 5.5, 3.5); ctx.fillRect(1, 11, 5.5, 3.5)
  ctx.fillStyle = '#ff9f1c'
  ctx.beginPath(); ctx.roundRect(-9, -6, 18, 13, 5); ctx.fill()
  ctx.fillStyle = '#ffcf70'
  ctx.beginPath(); ctx.roundRect(-9, -6, 18, 5, 3); ctx.fill()
  cerchio(0, -12, 8.5, '#ffd9a8')
  ctx.fillStyle = '#6b3f22'                                 // capelli
  ctx.beginPath(); ctx.arc(0, -13, 8.6, Math.PI * 1.03, Math.PI * 2.05); ctx.fill()
  cerchio(2.6, -11.5, 1.5, '#20242e'); cerchio(-3.2, -11.5, 1.5, '#20242e')
  ctx.strokeStyle = '#c9622e'; ctx.lineWidth = 1.4                  // bocca
  ctx.beginPath(); ctx.arc(0, -9, 2.6, 0.3, 2.84); ctx.stroke()
  ctx.restore()

  // l'arco, sempre puntato dove si spara
  ctx.save(); ctx.translate(x, y); ctx.rotate(eroe.mira)
  ctx.globalAlpha = lampeggia ? 0.4 : 1
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3.2 * s; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.arc(14 * s, 0, 9 * s, -1.15, 1.15); ctx.stroke()
  ctx.strokeStyle = '#f4e6c8'; ctx.lineWidth = 1.2 * s
  ctx.beginPath()
  ctx.moveTo(14 * s + Math.cos(-1.15) * 9 * s, Math.sin(-1.15) * 9 * s)
  ctx.lineTo(10 * s, 0)
  ctx.lineTo(14 * s + Math.cos(1.15) * 9 * s, Math.sin(1.15) * 9 * s)
  ctx.stroke()
  ctx.restore()
  ctx.globalAlpha = 1
}

/* — un mostro — */
function mostro(n) {
  const m = MOSTRI[n.tipo]
  const salto = Math.abs(Math.sin(n.fase * 0.5)) * 3
  const x = n.x, y = n.y - salto
  ellisse(n.x, n.y + n.r * 0.85, n.r * 0.85, n.r * 0.3, '#00000030')
  const colore = n.lampo > 0.35 ? '#ffffff' : (n.gelato ? mescola(m.colore, '#9fe4ff', 0.55) : m.colore)
  const scuro = n.gelato ? '#4a9dc8' : m.scuro

  if (n.tipo === 'pipistrello') {                     // ali che sbattono
    const ap = Math.sin(n.fase) * 5
    ctx.fillStyle = scuro
    for (const lato of [-1, 1]) {
      ctx.beginPath()
      ctx.moveTo(x, y)
      ctx.quadraticCurveTo(x + lato * n.r * 1.6, y - 8 - ap, x + lato * n.r * 2.0, y + 2)
      ctx.quadraticCurveTo(x + lato * n.r * 1.1, y + 2 + ap, x, y + 4)
      ctx.closePath(); ctx.fill()
    }
  }
  if (n.tipo === 'spettro') {                         // codina ondulata
    ctx.fillStyle = colore
    ctx.beginPath()
    ctx.moveTo(x - n.r, y)
    ctx.lineTo(x - n.r, y + n.r * 0.9)
    for (let k = 0; k <= 4; k++) {
      const px = x - n.r + (k / 4) * n.r * 2
      ctx.lineTo(px, y + n.r * (0.9 + 0.35 * Math.sin(n.fase + k)))
    }
    ctx.lineTo(x + n.r, y); ctx.closePath(); ctx.fill()
  }

  /* il corpo, uno per tipo — un cerchio uguale per tutti li faceva
     sembrare tutti la stessa palla con gli occhi */
  let occhiY = -0.1
  if (n.tipo === 'fungo') {                           // gambo chiaro e cappello a pois
    const gambo = n.lampo > 0.35 ? '#fff' : '#f6efdc'
    ctx.fillStyle = gambo
    ctx.beginPath(); ctx.roundRect(x - n.r * 0.52, y - n.r * 0.1, n.r * 1.04, n.r * 1.15, n.r * 0.4); ctx.fill()
    ctx.fillStyle = colore                            // cappello: mezza cupola
    ctx.beginPath(); ctx.ellipse(x, y - n.r * 0.1, n.r * 1.15, n.r * 0.9, 0, Math.PI, 0); ctx.fill()
    ctx.fillRect(x - n.r * 1.15, y - n.r * 0.16, n.r * 2.3, n.r * 0.1)
    for (const [dx, dy] of [[-0.55, -0.42], [0.5, -0.38], [0, -0.68], [-0.05, -0.2]])
      ellisse(x + dx * n.r, y + dy * n.r, n.r * 0.2, n.r * 0.16, '#fff6e0')
    occhiY = 0.42
  } else if (n.tipo === 'roccia') {                   // un sasso spigoloso
    ctx.fillStyle = colore; ctx.beginPath()
    const spigoli = [[-1, -.35], [-.55, -.95], [.4, -1], [1, -.25], [.75, .8], [-.35, 1], [-.95, .5]]
    spigoli.forEach(([dx, dy], i) => {
      const px = x + dx * n.r, py = y + dy * n.r
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)
    })
    ctx.closePath(); ctx.fill()
    ctx.strokeStyle = scuro; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'
    ctx.beginPath()
    ctx.moveTo(x - n.r * 0.75, y - n.r * 0.55); ctx.lineTo(x - n.r * 0.3, y - n.r * 0.15)
    ctx.lineTo(x - n.r * 0.6, y + n.r * 0.55); ctx.stroke()
  } else if (n.tipo === 'melma') {                    // una gelatina che si schiaccia
    const molla = Math.sin(n.fase * 0.5) * 0.08
    ellisse(x, y + n.r * 0.1, n.r * (1.08 - molla), n.r * (0.92 + molla), colore)
  } else {
    cerchio(x, y, n.r, colore)
  }
  // il lucido in alto: dà volume a una figura piatta
  if (n.tipo !== 'fungo')
    ellisse(x - n.r * 0.3, y - n.r * 0.42, n.r * 0.34, n.r * 0.24, '#ffffff55')
  // occhi che guardano l'eroe
  const a = Math.atan2(eroe.y - n.y, eroe.x - n.x)
  const ox = Math.cos(a) * n.r * 0.16, oy = Math.sin(a) * n.r * 0.16
  const ro = n.r * (n.tipo === 'fungo' ? 0.21 : 0.27)
  for (const lato of [-1, 1]) {
    const ex = x + lato * ro * 1.2, ey = y + n.r * occhiY
    cerchio(ex, ey, ro, '#fff')
    cerchio(ex + ox, ey + oy, ro * 0.52, '#1a1d26')
  }
  // barra della vita solo per chi ne ha tanta
  if (n.vitaMax >= 4 && n.vita < n.vitaMax) {
    const w = n.r * 1.7
    ctx.fillStyle = '#00000055'; ctx.fillRect(x - w / 2, y - n.r - 8, w, 4)
    ctx.fillStyle = '#7bf07b'; ctx.fillRect(x - w / 2, y - n.r - 8, w * Math.max(0, n.vita / n.vitaMax), 4)
  }
}

const mescola = (a, b, q) => {
  const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16))
  const A = p(a), B = p(b)
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * q).toString(16).padStart(2, '0')).join('')
}

/* — una freccia — */
function freccia(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a)
  const L = c.r * 2.6
  ctx.strokeStyle = c.oro ? '#ffd257' : '#fff3c4'
  ctx.lineWidth = c.r * 0.7; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L * 0.5, 0); ctx.stroke()
  ctx.fillStyle = c.oro ? '#ffb703' : '#ffffff'
  ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(L * 0.1, -c.r * 0.85); ctx.lineTo(L * 0.1, c.r * 0.85)
  ctx.closePath(); ctx.fill()
  ctx.globalAlpha = 0.35
  ctx.strokeStyle = c.oro ? '#ffd25755' : '#ffffff55'; ctx.lineWidth = c.r * 1.5
  ctx.beginPath(); ctx.moveTo(-L * 2.4, 0); ctx.lineTo(-L, 0); ctx.stroke()
  ctx.globalAlpha = 1
  ctx.restore()
}

/* — la palla (o le palle) che girano — */
function pallaGirante() {
  const q = lv('palla')
  if (!q) return
  const R = 64 + 6 * q
  ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  for (let i = 0; i < q; i++) {
    const a = stato.orbita + i * (6.283 / q)
    const x = eroe.x + Math.cos(a) * R, y = eroe.y + Math.sin(a) * R
    cerchio(x, y, 15, '#ffffff40')
    ctx.fillText('⚽', x, y)
  }
}

/* — le cosine che volano via — */
function effetto(e) {
  if (e.che === 'briciola') {
    ctx.globalAlpha = Math.max(0, e.vita / 0.45)
    cerchio(e.x, e.y, e.r, e.colore)
    ctx.globalAlpha = 1
  } else if (e.che === 'anello') {
    const q = 1 - e.vita / e.tot
    ctx.globalAlpha = e.vita / e.tot
    ctx.strokeStyle = e.colore; ctx.lineWidth = 7 * (1 - q) + 2
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r0 + (e.r - e.r0) * q, 0, 6.29); ctx.stroke()
    ctx.globalAlpha = 1
  } else if (e.che === 'saetta') {
    ctx.globalAlpha = e.vita / e.tot
    ctx.strokeStyle = '#fff59a'; ctx.lineWidth = 5; ctx.lineJoin = 'round'
    ctx.beginPath(); ctx.moveTo(e.x, e.y - H)
    for (let k = 1; k <= 6; k++) ctx.lineTo(e.x + (k % 2 ? 12 : -12) * (1 - k / 7), e.y - H * (1 - k / 6))
    ctx.stroke()
    cerchio(e.x, e.y, 20, '#fff59a88')
    ctx.globalAlpha = 1
  }
}

/* — una gemma di esperienza — */
function gemma(g) {
  const s = 6 + Math.min(4, g.val) + Math.sin(g.fase) * 0.8
  const oro = g.val > 1
  ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(0.78)
  ctx.fillStyle = oro ? '#ffd257' : '#4fc3ff'
  ctx.fillRect(-s / 2, -s / 2, s, s)
  ctx.fillStyle = oro ? '#fff2b8' : '#b6ecff'
  ctx.fillRect(-s / 2, -s / 2, s * 0.45, s * 0.45)
  ctx.restore()
  ctx.globalAlpha = 0.25
  cerchio(g.x, g.y, s, oro ? '#ffd257' : '#4fc3ff')
  ctx.globalAlpha = 1
}

/* — il bordo rosso quando si è appena presi — */
function bordoRosso() {
  if (eroe.invulnA <= 0) return
  const q = Math.min(1, eroe.invulnA / forza.invuln)
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.7)
  g.addColorStop(0, '#ff000000'); g.addColorStop(1, `rgba(255,40,60,${0.45 * q})`)
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
}

/* ══════════ IL GIRO ══════════ */
let ultimo = 0, dallOrologio = 0
function giro(ora) {
  requestAnimationFrame(giro)
  const dt = Math.min(0.05, (ora - ultimo) / 1000 || 0)
  ultimo = ora
  if (schermo === 'gioca') {
    avanza(dt)
    dallOrologio += dt
    if (dallOrologio > 0.25) { dallOrologio = 0; aggiornaCruscotto() }
    if (tempo > 9) document.getElementById('dritta').style.opacity = '0'   // ha capito, o non lo capirà
  }
  disegna()
}

ridimensiona()
nuovaPartita()
requestAnimationFrame(giro)

/* comodità per le prove automatiche: forza il livello successivo */
window.__provaLivello = () => { stato.xp = stato.prossima; salgoDiLivello() }
</script>
