<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La fattoria 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #bfe0f0; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: system-ui, sans-serif; }
  #tela { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #sopra { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  #conti { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 6px; z-index: 20; pointer-events: none; flex-wrap: wrap; }
  #conti span { background: rgba(255,251,240,.92); color: #3a2a1a; font: 800 17px system-ui, sans-serif; padding: 6px 12px; border-radius: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  #riga { position: fixed; left: 8px; bottom: calc(4px + env(safe-area-inset-bottom)); font: 10px/1.3 ui-monospace, monospace; color: #20303a; background: rgba(255,255,255,.5); padding: 1px 5px; border-radius: 4px; pointer-events: none; z-index: 20; }
  #angolo { position: fixed; right: 8px; top: calc(60px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; z-index: 20; align-items: flex-end; }
  #angolo button { border: 0; border-radius: 14px; padding: 6px 10px; font: 700 12px system-ui, sans-serif; background: rgba(255,255,255,.7); color: #4a3a2a; touch-action: manipulation; }
  #azioni { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 4px; z-index: 30; background: rgba(255,251,240,.9); padding: 6px; border-radius: 28px; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
  #azioni button { width: 60px; height: 56px; border-radius: 26px; border: 2px solid transparent; background: transparent; color: #3a2a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; touch-action: manipulation; position: relative; }
  #azioni button span { font-size: 24px; line-height: 1; } #azioni button small { font: 700 10px system-ui, sans-serif; color: #7a5a3a; }
  #azioni button.acceso { background: #9be07a; border-color: #5fae3a; }
  #azioni #az-seme { position: absolute; left: 2px; top: 2px; font-size: 15px; background: #fff; border-radius: 10px; padding: 0 2px; line-height: 1.1; }
  #azioni .n { position: absolute; right: 0; top: -2px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #e8472b; color: #fff; font: 800 12px/20px system-ui, sans-serif; font-style: normal; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  #azioni .n[hidden] { display: none; }
  #az-tutti { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 30; min-height: 44px; border: 0; border-radius: 22px; padding: 0 18px; background: #ffd36a; font: 800 15px system-ui, sans-serif; color: #3a2a1a; box-shadow: 0 3px 10px rgba(0,0,0,.3); touch-action: manipulation; }
  #centra { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top)); z-index: 29; min-height: 44px; border: 0; border-radius: 22px; padding: 0 16px; background: rgba(255,251,240,.95); color: #3a2a1a; font: 800 14px system-ui, sans-serif; box-shadow: 0 3px 10px rgba(0,0,0,.3); touch-action: manipulation; }
  #centra[hidden] { display: none; }
  #az-tutti[hidden] { display: none; }
  body.costruendo #azioni, body.costruendo #az-tutti { display: none; }
  #vassoio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(255,247,230,.97); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.25); }
  #vassoio[hidden] { display: none; }
  #vassoio .testa { display: flex; align-items: center; gap: 8px; padding: 0 64px 8px 14px; }
  #vassoio .testa b { font-size: 17px; color: #3a2a1a; }
  #vista { display: flex; gap: 4px; } #vista button { border: 0; border-radius: 14px; padding: 6px 11px; font: 700 13px system-ui, sans-serif; background: #efe4cf; color: #5a3a2a; touch-action: manipulation; }
  #vista button.acceso { background: #ffd36a; }
  #vassoio-chiudi { position: absolute; right: 10px; top: 8px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #efe4cf; font-size: 18px; color: #5a3a2a; touch-action: manipulation; }
  #carte { touch-action: pan-x; display: flex; gap: 8px; overflow-x: auto; padding: 2px 14px 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  #carte button { flex: 0 0 92px; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 2px solid #e6cfa0; background: #fffdf6; border-radius: 16px; padding: 8px 4px; color: #3a2a1a; scroll-snap-align: start; touch-action: manipulation; }
  #carte button { touch-action: pan-x !important; }
  #carte button.pieno { border-color: #5fae3a; background: #eefae3; }
  #carte button.salta { animation: salta2 .6s ease 1; }
  @keyframes salta2 { 40% { transform: translateY(-10px); } }
  #vassoio.bersaglio { outline: 4px dashed #5fae3a; outline-offset: -6px; }
  #trascinato { position: fixed; left: 0; top: 0; z-index: 50; font-size: 44px; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  #trascinato[hidden] { display: none; }
  body.trascinando { touch-action: none; }
  #carte button.scelto { border-color: #5fae3a; background: #e6f7d8; box-shadow: 0 0 0 2px #9be07a; }
  #carte button:disabled { opacity: .45; }
  #carte .em { font-size: 28px; line-height: 1; } #carte b { font-size: 13px; } #carte small { font-size: 11px; color: #7a5a3a; }
  #suggerimento { margin: 2px 14px 0; font-size: 13px; color: #6a4a2a; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
  #suggerimento button { border: 0; border-radius: 14px; padding: 8px 12px; font: 800 13px system-ui, sans-serif; background: #ffd36a; color: #3a2a1a; white-space: nowrap; touch-action: manipulation; }
  .badge { position: absolute; left: 0; top: 0; background: rgba(255,251,240,.95); color: #3a2a1a; font: 800 14px system-ui, sans-serif; padding: 3px 9px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.22); white-space: nowrap; }
  .badge.pronto { background: #ffe27a; animation: salta 0.9s ease-in-out infinite; }
  .badge.vendita { background: #ffd36a; }
  @keyframes salta { 50% { margin-top: -8px; } }
  .badge[hidden], .fumetto[hidden] { display: none; }
  .fumetto { position: absolute; transform: translate(-50%, -100%); background: rgba(255,251,240,.97); color: #3a2a1a; font: 700 15px system-ui, sans-serif; padding: 7px 13px; border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.25); white-space: nowrap; }
  .volo { position: absolute; transform: translate(-50%, -100%); font: 800 20px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); animation: sale 1.4s ease-out forwards; }
  @keyframes sale { to { margin-top: -60px; opacity: 0; } }
  #dialogo { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(20,30,20,.4); padding: 20px; }
  #dialogo[hidden] { display: none; }
  #dialogo > div { background: #fffaf0; border-radius: 22px; padding: 20px; max-width: 340px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.35); color: #3a2a1a; }
  #dialogo h2 { margin: 0 0 6px; font-size: 22px; } #dialogo p { margin: 0 0 16px; font-size: 15px; line-height: 1.35; }
  #dialogo-bottoni { display: flex; flex-direction: column; gap: 8px; }
  #dialogo-bottoni button { min-height: 54px; border: 0; border-radius: 16px; font: 800 17px system-ui, sans-serif; background: #ffd36a; color: #3a2a1a; touch-action: manipulation; }
  #dialogo-bottoni button.quieto { background: #efe4cf; font-weight: 600; }
  #semi, #opzioni, #pasticceria { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: rgba(255,247,230,.98); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.28); padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); color: #3a2a1a; }
  #semi[hidden], #opzioni[hidden], #pasticceria[hidden] { display: none; }
  #semi h2, #opzioni h2, #pasticceria h2 { margin: 0 44px 10px 2px; font-size: 20px; }
  #semi .chiudi, #opzioni .chiudi, #pasticceria .chiudi { position: absolute; right: 10px; top: 10px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #efe4cf; font-size: 18px; color: #5a3a2a; touch-action: manipulation; }
  .semi-griglia { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .semi-griglia button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid #e6cfa0; background: #fffdf6; border-radius: 16px; padding: 10px 4px; color: #3a2a1a; touch-action: manipulation; }
  .semi-griglia button.ultimo { border-color: #f0a020; background: #fff3cf; }
  .semi-griglia .em { font-size: 32px; line-height: 1; } .semi-griglia b { font-size: 14px; } .semi-griglia small { font-size: 12px; color: #7a5a3a; }
  #opzioni { max-height: 78vh; overflow: auto; }
  #opzioni .riduci { position: absolute; right: 60px; top: 10px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #efe4cf; font-size: 18px; color: #5a3a2a; touch-action: manipulation; }
  #opzioni.piccolo { max-height: none; padding-bottom: calc(10px + env(safe-area-inset-bottom)); bottom: auto; top: auto; bottom: 0; pointer-events: auto; }
  #opzioni.piccolo > :not(h2):not(.stat):not(canvas):not(.chiudi):not(.riduci) { display: none; }
  #opzioni.piccolo canvas { height: 36px; }
  #opzioni h3 { margin: 14px 2px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #8a6a3a; }
  #opzioni .stat { font: 13px/1.45 ui-monospace, monospace; background: #fff; border-radius: 12px; padding: 8px 10px; min-height: 40px; }
  #opzioni canvas { width: 100%; height: 56px; margin-top: 6px; background: #fff; border-radius: 10px; display: block; }
  #opzioni .preset { display: flex; gap: 8px; flex-wrap: wrap; }
  #opzioni .preset button, #opzioni .largo { flex: 1; min-height: 48px; border: 2px solid #e6cfa0; background: #fffdf6; border-radius: 14px; font: 700 15px system-ui, sans-serif; color: #3a2a1a; touch-action: manipulation; }
  #opzioni .preset button.acceso { background: #ffd36a; border-color: #f0a020; }
  #opzioni .riga { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; border-bottom: 1px solid #eadfc6; font-size: 15px; }
  #opzioni .riga input[type=checkbox] { width: 26px; height: 26px; } #opzioni .riga select { font-size: 15px; padding: 6px; border-radius: 8px; } #opzioni .riga input[type=range] { width: 46%; }
  #opzioni .nota { font-size: 12px; color: #7a5a3a; margin: 6px 2px; }
  #opzioni textarea { width: 100%; box-sizing: border-box; margin-top: 8px; font: 11px/1.35 ui-monospace, monospace; border-radius: 10px; border: 1px solid #d8c8a0; padding: 6px; }
  #pasticceria { max-height: 80vh; overflow: auto; }
  #pasticceria h3 { margin: 12px 2px 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #8a6a3a; }
  .forno { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .posto { background: #fffdf6; border: 2px solid #e6cfa0; border-radius: 16px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .posto.vuoto { border-style: dashed; opacity: .7; } .posto .em { font-size: 28px; line-height: 1.1; } .posto small { font-size: 12px; color: #7a5a3a; }
  .posto i { display: block; width: 80%; height: 6px; background: #eadfc6; border-radius: 3px; overflow: hidden; } .posto u { display: block; height: 100%; background: #f0a020; width: 0; }
  .pronti { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 14px; }
  .pronti button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 14px; background: #7ccf56; font: 800 15px system-ui, sans-serif; color: #123; touch-action: manipulation; }
  .pronti button:disabled { background: #d8d2c4; color: #888; }
  .ricette { display: flex; flex-direction: column; gap: 6px; }
  .ricetta { display: flex; align-items: center; gap: 10px; background: #fffdf6; border: 2px solid #e6cfa0; border-radius: 16px; padding: 8px 10px; }
  .ricetta .em { font-size: 32px; } .ricetta > div { flex: 1; display: flex; flex-direction: column; } .ricetta b { font-size: 15px; } .ricetta small { font-size: 12px; color: #7a5a3a; }
  .ricetta .ing .manca { color: #c0392b; font-weight: 700; } .ricetta .ing .ok { color: #2d7a2d; }
  .ricetta button { min-height: 46px; padding: 0 12px; border: 0; border-radius: 14px; background: #ffd36a; font: 800 14px system-ui, sans-serif; color: #3a2a1a; touch-action: manipulation; }
  .ricetta button:disabled { background: #e8e2d2; color: #999; }
  #pasticceria .nota { font-size: 12px; color: #7a5a3a; margin: 10px 2px 0; }
  #zonaVia { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; height: calc(96px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; background: rgba(255,247,230,.96); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.25); font: 700 15px system-ui, sans-serif; color: #5a3a2a; text-align: center; padding: 0 20px calc(env(safe-area-inset-bottom)); }
  #zonaVia[hidden] { display: none; } #zonaVia.bersaglio { background: #e6f7d8; outline: 4px dashed #5fae3a; outline-offset: -6px; }
  body.trascinando #azioni, body.trascinando #az-tutti { display: none; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="sopra"></div>
<div id="conti"><span id="monete"></span><span id="grano"></span><span id="torte"></span><span id="lana"></span></div>
<div id="angolo"><button id="esercizi">+50 🪙 (esercizi)</button><button id="opzioni-apri">⚙ opzioni</button><button id="azzera">↺ da capo</button></div>
<div id="riga">…</div>
<button id="az-tutti" hidden>▶ Tutti</button>
<div id="azioni">
  <button id="az-libero"><span>✋</span><small>Libero</small></button>
  <button id="az-semina"><span>🌱</span><small>Semina</small><em class="n" id="n-semina" hidden></em><span id="az-seme">🌾</span></button>
  <button id="az-raccogli"><span>✂️</span><small>Raccogli</small><em class="n" id="n-raccogli" hidden></em></button>
  <button id="costruisci"><span>🏗</span><small>Costruisci</small></button>
</div>
<div id="vassoio" hidden>
  <button id="vassoio-chiudi" aria-label="Chiudi">✕</button>
  <div class="testa"><b>Costruisci</b><div id="vista"><button data-v="vicino">Vicino</button><button data-v="tutto">Tutto</button></div></div>
  <div id="carte"></div>
  <div id="suggerimento"></div>
</div>
<div id="trascinato" hidden></div>
<button id="centra" hidden>⌖ Torna all'eroe</button>
<div id="zonaVia" hidden><span>📦 Rilascia qui per mettere via</span></div>
<div id="pasticceria" hidden></div>
<div id="semi" hidden></div>
<div id="opzioni" hidden></div>
<div id="dialogo" hidden><div><h2 id="dialogo-titolo"></h2><p id="dialogo-testo"></p><div id="dialogo-bottoni"></div></div></div>
<script type="module" src="./fattoria-3d/main.js"></script>
</body>
</html>
