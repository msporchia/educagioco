<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Appiattimento 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #palco { position: fixed; inset: 0; }
  #riga { position: fixed; left: 8px; top: calc(6px + env(safe-area-inset-top)); font: 11px/1.3 ui-monospace, monospace; color: #e8e0d0;
          background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px); }
  body.confronto #palco { display: flex; gap: 6px; padding: 30px 6px 64px; box-sizing: border-box; }
  .cornice { flex: 1 1 0; position: relative; min-width: 0; border-radius: 8px; overflow: hidden; background: #000; }
  .cornice iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .titolo { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; text-align: center; font: 700 14px system-ui, sans-serif; color: #fff;
            background: linear-gradient(transparent, rgba(0,0,0,.7)); padding: 14px 0 6px; pointer-events: none; }
  #bottoni { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; z-index: 20; }
  #bottoni button { min-height: 44px; min-width: 72px; border-radius: 22px; border: 0; padding: 0 14px; font: 700 14px system-ui, sans-serif;
                    color: #24323a; background: rgba(255,255,255,.82); touch-action: manipulation; }
  #bottoni button.acceso { background: #ffe9a8; }
</style>
</head>
<body>
<div id="palco"></div>
<div id="riga">…</div>
<div id="bottoni"></div>
<script type="module" src="./appiattimento-3d/main.js"></script>
</body>
</html>
