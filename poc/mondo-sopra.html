<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Il mondo di sopra</title>
<style>
  html, body { margin: 0; height: 100%; background: #c9dcea; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #tela { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #riga { position: fixed; left: 8px; top: calc(6px + env(safe-area-inset-top)); font: 11px/1.3 ui-monospace, monospace; color: #20303a;
          background: rgba(255,255,255,.55); padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 20; }
  #bottoni { position: fixed; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; z-index: 20; }
  #bottoni button { min-width: 92px; min-height: 52px; border-radius: 26px; border: 0; padding: 0 18px; font: 700 16px system-ui, sans-serif;
                    color: #24323a; background: rgba(255,255,255,.82); box-shadow: 0 2px 8px rgba(0,0,0,.18); touch-action: manipulation; }
  #bottoni button.acceso { background: #ffe9a8; }
  #sopra { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .fumetto { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 14px 8px;
             border-radius: 12px; background: rgba(255,251,240,.95); color: #3a2a1a; box-shadow: 0 3px 12px rgba(0,0,0,.22); white-space: nowrap; }
  .fumetto b { font: 800 17px system-ui, sans-serif; }
  .fumetto small { font: 600 12px system-ui, sans-serif; color: #7a5a3a; text-transform: uppercase; letter-spacing: .04em; }
  .fumetto::after { content: ''; position: absolute; bottom: -7px; left: 50%; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(255,251,240,.95); }
  .fumetto.pop { animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
  .fumetto[hidden], .nome[hidden] { display: none; }
  .nome { position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 8px; background: rgba(30,30,40,.6); color: #fff;
          font: 700 12px system-ui, sans-serif; white-space: nowrap; }
  .nome.villaggio { background: rgba(160,90,30,.75); font-size: 14px; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="sopra"></div>
<div id="riga">…</div>
<div id="bottoni"><button id="cielo">cielo</button><button id="nebbia">nebbia</button></div>
<script type="module" src="./mondo-sopra/main.js"></script>
</body>
</html>
