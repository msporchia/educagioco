  }
}

/* la vista non è la mappa: il mondo può essere molto più grande */
function limita () {
  const cv = document.getElementById('tela'); if (!cv) return
  const R = cv.getBoundingClientRect()
  const w = R.width / cam.z, h = R.height / cam.z
  cam.x = mondo.w <= w ? (mondo.w - w) / 2 : Math.max(0, Math.min(mondo.w - w, cam.x))
  cam.y = mondo.h <= h ? (mondo.h - h) / 2 : Math.max(0, Math.min(mondo.h - h, cam.y))
}
function inquadra (primo) {
  const cv = document.getElementById('tela'); if (!cv) return
  const R = cv.getBoundingClientRect()
  if (primo) {
    const z = Math.min(R.width / mondo.w, R.height / mondo.h)
    cam.z = Math.max(16, Math.min(40, Math.floor(z)))      // mai celle microscopiche
  }
  limita()
}
function centraSu (x, y) {
  const cv = document.getElementById('tela'); if (!cv) return
  const R = cv.getBoundingClientRect()
  cam.x = x - R.width / cam.z / 2 + .5; cam.y = y - R.height / cam.z / 2 + .5
  limita()
}

/* ══ i comandi ══ */
function via () {
  if (auto) { auto = false; disegnaTutto(); return }
  if (mondo.finita || !mondo.tick) partiMondo(0)
  auto = true; segui = true; disegnaTutto()
}
function unPasso () {
  auto = false
  if (mondo.finita || !mondo.tick) partiMondo(0)
  fai1(); disegnaTutto()
}
function ferma () {
  auto = false; serieI = 0; esiti = []
  liv = M.costruisci(L, 0)
  mondo = M.creaMondo(liv); M.avvia(mondo, M.pianoCompleto(liv, piano))
  mondo.finita = false; mondo.tick = 0; logLetto = 0
  disegnaTutto()
}
function partiMondo (k) {
  serieI = k
  if (k === 0) { esiti = []; logLetto = 0 }
  liv = M.costruisci(L, serie[serieI])
  mondo = M.creaMondo(liv)
  M.avvia(mondo, M.pianoCompleto(liv, piano))
  animT0 = performance.now(); prec = mondo.elenco.map(u => ({ x:u.x, y:u.y }))
}
function fai1 () {
  if (mondo.finita) return
  const rosseP = M.registro(mondo).filter(r => r.esito === 'no').length
  prec = mondo.elenco.map(u => ({ x:u.x, y:u.y }))
  M.passo(mondo)
  animT0 = performance.now()
  suoni(mondo.eventi)
  /* quando qualcosa va storto, la vista ci salta sopra da sola */
  const reg = M.registro(mondo)
  const rosse = reg.filter(r => r.esito === 'no')
  if (rosse.length > rosseP) {
    const u = mondo.unita[rosse[rosse.length - 1].unita]
    if (u) { centraSu(u.x, u.y); u.lampo = mondo.tick }
    bip(240, .09, 'sawtooth', .05)
  } else if (segui && mondo.unita[unitaOra] && mondo.unita[unitaOra].viva) {
    const u = mondo.unita[unitaOra]; centraSu(u.x, u.y)
  }
  if (mondo.finita) chiudi()
}
/* riavvolgere: la scena è deterministica, quindi si rigioca da capo */
function riavvolgi (t) {
  auto = false
  const k = serieI
  liv = M.costruisci(L, serie[k])
  mondo = M.creaMondo(liv); M.avvia(mondo, M.pianoCompleto(liv, piano))
  for (let n = 0; n < t && !mondo.finita; n++) M.passo(mondo)
  prec = mondo.elenco.map(u => ({ x:u.x, y:u.y })); animT0 = 0
  disegnaTutto()
}
function chiudi () {
  esiti[serieI] = mondo.vinta
  suoni([mondo.vinta ? 'vinta' : 'persa'])
  if (mondo.vinta && serieI < serie.length - 1) {
    setTimeout(() => { if (!auto) return; partiMondo(serieI + 1); disegnaTutto() }, 760)
    return
  }
  auto = false
  if (mondo.vinta && esiti.filter(Boolean).length === serie.length) vittoria()
  else if (!mondo.vinta && mondo.colpevole) {
    const c = mondo.colpevole
    /* il pannello dell'ordine colpevole si apre da sé: se resta chiuso
       il piano si vede ma non si legge */
    if (piano[c.unita]) { unitaOra = c.unita; scriptOra = c.script; sel = c.i
                          aperti.add(c.unita + ':' + c.script) }
    else letta = c.unita
    const u = mondo.unita[c.unita]; if (u) centraSu(u.x, u.y)
  }
}
function vittoria () {
  const n = M.contaOrdini(piano), par = M.parDi(liv)
  /* le due stelle sono per chi ci arriva da solo: un aiuto pagato
     costa il vanto, non il passaggio */
  const dentro = n <= par && !pagato
  const prima = record['l' + L]
  if (!prima || n < prima) record['l' + L] = n
  if (dentro) record['s' + L] = 1
  try { localStorage.setItem('progr.record', JSON.stringify(record)) } catch (e) {}
  const v = document.createElement('div')
  v.className = 'velo'
  v.innerHTML = `<div class="urlo">${dentro ? '🏅' : '🎖️'}</div>
    <h2>${dentro ? 'Piano elegante!' : 'Il piano regge!'}</h2>
    <div class="stelline">${dentro ? '⭐⭐' : '⭐'}</div>
    <p>Ha funzionato ${serie.length > 1 ? 'su tutte e ' + serie.length + ' le battaglie' : ''}
       con <b>${n} ordin${n === 1 ? 'e' : 'i'}</b>. Il par è <b>${par}</b>.
       ${pagato ? 'Hai chiesto un aiuto: questa vale una stella. Rifallo senza, e sono due.'
                : dentro ? 'Non si poteva fare più corto.' : 'C’è un modo più corto: cercalo.'}
       ${prima ? `<br>Il tuo record era ${prima}.` : ''}</p>
    <div class="duebottoni"><button class="grigio" id="ancora">Riprova</button>
      <button id="poi">${L + 1 < M.quanti ? 'Avanti →' : 'Torna'}</button></div>`
  app.appendChild(v)
  v.querySelector('#ancora').onclick = () => { v.remove(); ferma() }
  v.querySelector('#poi').onclick = () => { v.remove(); L + 1 < M.quanti ? apri(L + 1) : casa() }
}
function intercetta () {
  const nascoste = M.altruiUnita(liv).filter(u => !scoperte.has(u))
  if (!gettoni || !nascoste.length) return
  gettoni--; scoperte.add(nascoste[0]); letta = nascoste[0]
  bip(660, .12, 'sine', .05); pannelli()
}

/* ══ il giro ══ */
function giro (ts) {
  if (mondo && auto && !mondo.finita && ts - animT0 >= vel) { fai1(); disegna(); pannelli() }
  else if (mondo) disegna()
  requestAnimationFrame(giro)
}
function disegnaTutto () { if (mondo) { disegna(); pannelli() } }

/* ══ la scena ══ */
function disegna () {
  const cv = document.getElementById('tela'); if (!cv) return
  const R = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2)
  if (cv.width !== Math.round(R.width * dpr)) { cv.width = Math.round(R.width * dpr); cv.height = Math.round(R.height * dpr); limita() }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0)
  const W = R.width, H = R.height, m = mondo, c = cam.z
  g.fillStyle = '#0a0e19'; g.fillRect(0, 0, W, H)
  const px = x => Math.round((x - cam.x) * c), py = y => Math.round((y - cam.y) * c)
  const x0 = Math.max(0, Math.floor(cam.x)), x1 = Math.min(m.w - 1, Math.ceil(cam.x + W / c))
  const y0 = Math.max(0, Math.floor(cam.y)), y1 = Math.min(m.h - 1, Math.ceil(cam.y + H / c))
  const alz = Math.max(3, Math.round(c * .18))

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (m.celle[y][x].muro) continue
    g.fillStyle = (x + y) % 2 ? '#1b2233' : '#1f2740'
    g.fillRect(px(x), py(y), c, c)
  }
  for (const nz in (liv.zone || {})) {
    const z = liv.zone[nz]
    g.strokeStyle = 'rgba(224,85,77,.5)'; g.lineWidth = 2; g.setLineDash([5, 5]); g.beginPath()
    z.forEach((t, i) => i ? g.lineTo(px(t.x) + c/2, py(t.y) + c/2) : g.moveTo(px(t.x) + c/2, py(t.y) + c/2))
    if (z.length > 2) g.closePath()
    g.stroke(); g.setLineDash([])
  }
  m.viva.filter(u => u.fazione !== m.mia && u.vista).forEach(u => {
    const d = M.distanze(m, u.x, u.y)
    g.fillStyle = 'rgba(224,85,77,.13)'
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const q = d[y * m.w + x]
      if (q >= 0 && q <= u.vista) g.fillRect(px(x), py(y), c, c)
    }
  })
  for (const k in (liv.posti || {})) {
    const p = liv.posti[k]
    g.fillStyle = 'rgba(240,192,74,.16)'; g.fillRect(px(p.x) + 2, py(p.y) + 2, c - 4, c - 4)
    g.strokeStyle = 'rgba(240,192,74,.5)'; g.lineWidth = 1.5; g.setLineDash([3, 3])
    g.strokeRect(px(p.x) + 2, py(p.y) + 2, c - 4, c - 4); g.setLineDash([])
    if (k === 'tesoro') { g.font = `${Math.round(c*.55)}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'
      g.fillText('💎', px(p.x) + c/2, py(p.y) + c/2) }
  }
  m.oggetti.filter(o => !o.preso).forEach(o => {
    g.font = `${Math.round(c*.55)}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText('🔑', px(o.x) + c/2, py(o.y) + c/2)
  })
  for (const k in m.porte) {
    const p = m.porte[k]
    if (p.aperta) { g.fillStyle = '#4a3a24'; g.fillRect(px(p.x), py(p.y), c, 4); g.fillRect(px(p.x), py(p.y) + c - 4, c, 4) }
    else {
      g.fillStyle = '#6d4b26'; g.fillRect(px(p.x) + 1, py(p.y) + 1, c - 2, c - 2)
      g.fillStyle = '#8c6231'; g.fillRect(px(p.x) + 1, py(p.y) + 1, c - 2, Math.round(c * .18))
      g.fillStyle = '#f0c04a'; g.beginPath(); g.arc(px(p.x) + c*.72, py(p.y) + c/2, Math.max(2, c*.07), 0, 7); g.fill()
    }
  }
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!m.celle[y][x].muro) continue
    g.fillStyle = '#161b29'; g.fillRect(px(x), py(y), c, c)
    g.fillStyle = '#2b3450'; g.fillRect(px(x), py(y) - alz, c, c)
    g.fillStyle = '#39456a'; g.fillRect(px(x), py(y) - alz, c, Math.max(2, alz * .7))
  }

  const u01 = animT0 ? Math.min(1, (performance.now() - animT0) / vel) : 1
  const reg = M.registro(m)
  m.elenco.forEach((u, i) => {
    if (!u.viva) return
    const p0 = prec[i] || u
    const X = px(p0.x + (u.x - p0.x) * u01) + c/2, Y = py(p0.y + (u.y - p0.y) * u01) + c/2
    if (X < -c || X > W + c || Y < -c || Y > H + c) return
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(X, Y + c*.3, c*.3, c*.12, 0, 0, 7); g.fill()
    const rosso = u.lampo && m.tick - u.lampo < 3
    g.fillStyle = rosso && m.tick % 2 ? '#e0554d' : (FAZ[u.fazione] || '#888')
    g.beginPath(); g.arc(X, Y, c * .36, 0, 7); g.fill()
    g.strokeStyle = u.id === letta || u.id === unitaOra ? '#f0c04a' : 'rgba(255,255,255,.35)'
    g.lineWidth = (u.id === letta || u.id === unitaOra) ? 3 : 1.5; g.stroke()
    g.font = `${Math.round(c*.46)}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'
    g.fillText(u.emoji, X, Y + 1)
    if (u.vitaMax > 1) {
      const w = c * .62
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(X - w/2, Y - c*.52, w, 4)
      g.fillStyle = u.fazione === m.mia ? '#43b96a' : '#e0554d'
      g.fillRect(X - w/2, Y - c*.52, w * Math.max(0, u.vita / u.vitaMax), 4)
    }
    /* il fumetto: l'ultima cosa che ha detto, e in rosso se non ha potuto */
    const r = [...reg].reverse().find(z => z.unita === u.id && z.tFine >= m.tick - 2)
    if (r && m.tick) {
      const t = (mio(u) || scoperte.has(u.id)) ? r.testo : (r.visto ? r.fatto : null)
      if (t) {
        g.font = '600 10px system-ui,sans-serif'; g.textAlign = 'center'
        const lw = Math.min(W - 6, g.measureText(t).width + 9)
        const bx = Math.max(2, Math.min(W - lw - 2, X - lw/2)), by = Y - c*.52 - 16 - (i % 2) * 15
        g.fillStyle = r.esito === 'no' ? 'rgba(120,26,26,.94)' : 'rgba(8,11,20,.86)'
        g.fillRect(bx, by, lw, 14)
        if (r.esito === 'no') { g.strokeStyle = '#e0554d'; g.lineWidth = 1; g.strokeRect(bx, by, lw, 14) }
        g.fillStyle = r.esito === 'no' ? '#ffd7d3' : (ESITO[r.esito] || '#e9eef8')
        g.fillText(t, bx + lw/2, by + 11)
      }
    }
  })
  /* le caselle scritte a mano del piano: il numero sulla mappa è lo
     stesso che si legge nell'ordine */
  if (piano[unitaOra]) {
    const num = numeriCelle()
    for (const id in num) {
      const mm = CELLA_UI.exec(id); if (!mm) continue
      const [cx, cy] = id.split(',').map(Number)
      const suo = sel != null && piano[unitaOra][scriptOra] &&
                  piano[unitaOra][scriptOra].ordini[sel] &&
                  piano[unitaOra][scriptOra].ordini[sel].c === id
      g.strokeStyle = suo ? '#f0c04a' : 'rgba(240,192,74,.55)'
      g.lineWidth = suo ? 3 : 1.5
      g.setLineDash(suo ? [] : [4, 3])
      g.strokeRect(px(cx) + 3, py(cy) + 3, c - 6, c - 6); g.setLineDash([])
      g.fillStyle = suo ? '#f0c04a' : 'rgba(240,192,74,.75)'
      g.font = `700 ${Math.round(c * .5)}px system-ui,sans-serif`
      g.textAlign = 'center'; g.textBaseline = 'middle'
      g.fillText(num[id], px(cx) + c / 2, py(cy) + c / 2)
    }
  }

  /* il modo scelta: velo su tutto, luce solo sui bersagli buoni */
  if (scegliendo) {
    g.fillStyle = 'rgba(6,9,16,.62)'; g.fillRect(0, 0, W, H)
    if (celleLibere()) {
      const d = M.distanze(mondo, mondo.unita[unitaOra].x, mondo.unita[unitaOra].y)
      g.fillStyle = 'rgba(122,180,255,.16)'
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
        if (d[y * m.w + x] >= 0) g.fillRect(px(x) + 1, py(y) + 1, c - 2, c - 2)
    }
    bersagli().forEach(t => {
      g.fillStyle = 'rgba(240,192,74,.3)'; g.fillRect(px(t.x), py(t.y), c, c)
      g.strokeStyle = '#f0c04a'; g.lineWidth = 2.5
      g.strokeRect(px(t.x) + 1.5, py(t.y) + 1.5, c - 3, c - 3)
      g.font = `${Math.round(c * .5)}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle'
      g.fillText(t.em, px(t.x) + c / 2, py(t.y) + c / 2)
    })
    const s = scegliendo.scelta
    if (s) {
      g.strokeStyle = '#fff'; g.lineWidth = 3
      g.beginPath(); g.arc(px(s.x) + c / 2, py(s.y) + c / 2, c * .48, 0, 7); g.stroke()
      g.strokeStyle = '#f0c04a'; g.lineWidth = 2
      g.beginPath()
      g.moveTo(px(s.x) + c * .2, py(s.y) + c * .2); g.lineTo(px(s.x) + c * .8, py(s.y) + c * .8)
      g.moveTo(px(s.x) + c * .8, py(s.y) + c * .2); g.lineTo(px(s.x) + c * .2, py(s.y) + c * .8)
      g.stroke()
    }
  }
  minimappa()
  frecce(W, H)
}
const mio = u => !!piano[u.id]

/* la minimappa: dove sono tutti, e dove sto guardando */
function minimappa () {
  const cv = document.getElementById('mini'); if (!cv) return
  const m = mondo
  const grande = m.w > 16 || m.h > 12
  cv.style.display = grande ? 'block' : 'none'
  if (!grande) return
  const dpr = Math.min(devicePixelRatio || 1, 2)
  const LARGO = 92, k = Math.max(1, Math.floor(LARGO / m.w)), Wm = m.w * k, Hm = m.h * k
  cv.style.width = Wm + 'px'; cv.style.height = Hm + 'px'
  if (cv.width !== Wm * dpr) { cv.width = Wm * dpr; cv.height = Hm * dpr }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0)
  g.fillStyle = '#0c1120'; g.fillRect(0, 0, Wm, Hm)
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++)
    if (!m.celle[y][x].muro) { g.fillStyle = '#243052'; g.fillRect(x*k, y*k, k, k) }
  m.viva.forEach(u => { g.fillStyle = FAZ[u.fazione] || '#888'; g.fillRect(u.x*k - 1, u.y*k - 1, k + 2, k + 2) })
  const tela = document.getElementById('tela').getBoundingClientRect()
  g.strokeStyle = '#f0c04a'; g.lineWidth = 1.5
  g.strokeRect(cam.x*k, cam.y*k, (tela.width/cam.z)*k, (tela.height/cam.z)*k)
}
/* frecce ai bordi per chi è fuori campo */
function frecce (W, H) {
  const box = document.getElementById('frecce'); if (!box) return
  const out = []
  mondo.viva.forEach(u => {
    const X = (u.x - cam.x) * cam.z, Y = (u.y - cam.y) * cam.z
    if (X >= 0 && X <= W && Y >= 0 && Y <= H) return
    const cx = Math.max(10, Math.min(W - 10, X)), cy = Math.max(10, Math.min(H - 10, Y))
    out.push(`<i style="left:${cx}px;top:${cy}px;background:${FAZ[u.fazione]}">${u.emoji}</i>`)
  })
  box.innerHTML = out.join('')
}

/* ══ i pannelli ══ */
function pannelli () {
  const q = s => document.getElementById(s); if (!q('nome')) return
  q('nome').textContent = liv.nome
  const n = M.contaOrdini(piano)
  q('idea').textContent = liv.idea
  q('conta').innerHTML = `${n} <small>par ${M.parDi(liv)}</small>`
  const vinto = esiti.length === serie.length && esiti.every(Boolean)
  q('conta').className = 'conta' + (vinto && n <= M.parDi(liv) ? ' bene' : '')
  q('mondi').innerHTML = serie.map((_, i) =>
    `<i class="${esiti[i] === true ? 'ok' : esiti[i] === false ? 'ko' : (mondo.tick && i === serieI ? 'ora' : '')}"></i>`).join('')
  q('via').textContent = auto ? '⏸ Pausa' : '▶ Via'
  q('via').className = 'via' + (auto ? ' gira' : '')
  const sp = q('spia')
  sp.style.display = liv.mostraNemici === 'gettoni' ? '' : 'none'
  q('gett').textContent = gettoni
  const rosse = M.registro(mondo).filter(r => r.esito === 'no').length
  const nuove = Math.max(0, rosse - logLetto)
  q('pallo').textContent = nuove || ''
  q('pallo').style.display = nuove ? '' : 'none'
  q('reg').className = 'q reg' + (logAperto ? ' qui' : '')

  const d = q('dritta')
  if (mondo.finita && !mondo.vinta) { d.className = 'dritta male'; d.innerHTML = '💥 ' + mondo.motivo }
  else if (mondo.finita && mondo.vinta) { d.className = 'dritta bene'; d.innerHTML = '✔ Battaglia ' + (serieI + 1) + ' vinta.' }
  else { d.className = 'dritta'; d.innerHTML = liv.dritta }

  q('idea').className = 'q reg' + (cartello ? ' qui' : '')
  /* mentre si sceglie sulla mappa, il resto si smorza */
  document.getElementById('zona').className = 'zona' + (scegliendo ? ' smorza' : '')
  document.getElementById('cassetta').className = 'cassetta' + (scegliendo ? ' smorza' : '')
  chiRiga(); programma(); cassetta(); registroPannello(); cartelloPannello()
  schedaPannello(); pannelloScelta(); fili()
}

/* ══ LA SCHEDA DEL PERSONAGGIO ══
   Chi è, cosa sa fare e cosa non sa fare, con le stesse icone che
   stanno in cassetta: così il legame fra «questo è il cavaliere» e
   «al cavaliere manca quel tasto» è ovvio, e non sembra un guasto. */
function schedaPannello () {
  const box = document.getElementById('scheda')
  box.className = 'registro persona' + (scheda ? ' aperto' : '')
  if (!scheda) { box.innerHTML = ''; return }
  const u = liv.unita.find(z => z.id === scheda)
  if (!u) { scheda = null; box.innerHTML = ''; return }
  const viva = mondo.unita[u.id]
  const sa = M.verbiPer(liv, u.id), no = M.nonSa(liv, u.id)
  const pezzi = l => l.map(v => `<span class="ab">${M.VERBI[v].et} ${M.VERBI[v].nome.replace(/ a$/, '')}</span>`).join('')
  const h = [`<div class="capo">${u.emoji} ${u.nome}
    <small>${piano[u.id] ? 'lo comandi tu' : 'non prende ordini da te'}</small>
    <button id="chiudiS">✕</button></div><div class="corpo">`]
  h.push(`<div class="dati">
    <span>❤️ ${viva ? viva.vita : (u.vita || 3)}/${u.vita || 3} di vita</span>
    <span>👁 vede a ${u.vista || 0} caselle</span></div>`)
  h.push(`<div class="tit2">sa fare</div><div class="abil">${pezzi(sa) || '<i>niente, in questo livello</i>'}</div>`)
  if (no.length) h.push(`<div class="tit2">non sa fare</div><div class="abil no">${pezzi(no)}</div>`)
  h.push('</div>')
  box.innerHTML = h.join('')
  box.querySelector('#chiudiS').onclick = () => { scheda = null; pannelli() }
}

/* ══ IL CARTELLO ══ la spiegazione del livello, e i suggerimenti.
   Il primo indirizza il pensiero, il secondo dice dove guardare, il
   terzo quale ordine serve — nessuno dice mai dove metterlo, e il
   piano non si mostra mai. Dal secondo in poi costano una stella, e il
   prezzo si legge PRIMA di chiedere. */
function cartelloPannello () {
  const box = document.getElementById('cartello')
  box.className = 'registro cartello' + (cartello ? ' aperto' : '')
  if (!cartello) { box.innerHTML = ''; return }
  const lista = liv.aiuti || []
  const h = [`<div class="capo">💡 ${liv.nome} <small>${liv.idea}</small>
    <button id="chiudiC">✕</button></div><div class="corpo">`]
  h.push(`<p class="racconto">${liv.racconto || liv.dritta}</p>`)
  for (let k = 0; k < Math.min(aiuti, lista.length); k++)
    h.push(`<div class="aiuto"><b>Aiuto ${k + 1}</b> ${lista[k]}</div>`)
  if (aiuti < lista.length) {
    const gratis = aiuti === 0
    h.push(`<button class="chiedi ${gratis ? 'gratis' : ''}" id="chiediAiuto">
      ${gratis ? '💡 Il primo aiuto è gratis' : '💡 Un altro aiuto'}
      <small>${gratis ? 'non costa niente' : 'ti costa una stella: chiuderai il livello con ⭐ invece di ⭐⭐'}</small></button>`)
  } else if (lista.length) {
    h.push(`<div class="aiuto muto">Gli aiuti sono finiti. Il resto è tuo: la soluzione non te la dà nessuno.</div>`)
  }
  if (pagato) h.push(`<div class="aiuto muto">⭐ Questa battaglia vale una stella: hai chiesto un aiuto.</div>`)
  h.push('</div>')
  box.innerHTML = h.join('')
  box.querySelector('#chiudiC').onclick = () => { cartello = false; pannelli() }
  const c = box.querySelector('#chiediAiuto')
  if (c) c.onclick = () => {
    if (aiuti > 0) pagato = true
    aiuti++; bip(700, .1, 'triangle', .05); pannelli()
    const corpo = box.querySelector('.corpo'); if (corpo) corpo.scrollTop = corpo.scrollHeight
  }
}

/* ── chi comanda: una riga di unità, non di script ─────────────────
   Gli script non stanno più qui: sono pannelli, e stanno nel
   programma. Qui si sceglie solo DI CHI stai scrivendo il piano. */
function chiRiga () {
  const box = document.getElementById('chi'); if (!box) return
  const b = []
  M.mieUnita(liv).forEach(id => {
    const u = liv.unita.find(z => z.id === id)
    const n = piano[id].reduce((k, s) => k + s.ordini.length, 0)
    const sig = piano[id].filter(s => s.quando.tipo === 'segnale').length
    b.push(`<button class="${id === unitaOra && !letta ? 'qui' : ''}" data-u="${id}" data-chip="${id}">
      <span class="pall" style="background:${FAZ[u.fazione]}"></span>${u.emoji} ${u.nome}
      <span class="n">${n}${sig ? ' · 🎬' + sig : ''}</span></button>`)
  })
  M.altruiUnita(liv).forEach(id => {
    const u = liv.unita.find(z => z.id === id); if (!u) return
    b.push(`<button class="altrui ${letta === id ? 'qui' : ''}" data-leggi="${id}" data-chip="${id}">
      ${scoperte.has(id) ? '👁' : '🔒'} ${u.emoji} ${u.nome}</button>`)
  })
  box.innerHTML = b.join('')
  box.querySelectorAll('[data-u]').forEach(x => x.onclick = () => {
    unitaOra = x.dataset.u; sel = null; letta = null; segui = true
    scriptOra = 0; aperti.add(unitaOra + ':0'); creando = false; pannelli() })
  box.querySelectorAll('[data-leggi]').forEach(x => x.onclick = () => {
    letta = letta === x.dataset.leggi ? null : x.dataset.leggi; sel = null; creando = false; pannelli() })
}

/* ── una riga d'ordine: presa, verbo, complemento, guardia ───────── */
/* La guardia sta CHIUSA finché non apri l'ordine: in riga si vede solo
   un segno che c'è, e la lista resta leggibile come una sequenza di
   azioni. Le condizioni sono dettaglio, non prima linea — lo stesso
   principio dei pannelli. */
function riga (o, extra, i, aperta) {
  const V = M.VERBI[o.v], C = M.laCosa(liv, o.c)
  const seg = C && C.tipo === 'segnale' ? M.ilSegnale(C.id) : null
  const g = M.gradoDi(o.v, C ? C.tipo : null)
  return `<div class="riga ${V.cl} g${g} ${extra}" ${i != null ? `data-i="${i}"` : ''}
       ${seg ? `style="--c:${seg.col}" data-seg="${C.id}"` : ''}>
    ${i != null ? '<span class="presa" data-presa aria-label="sposta">⣿</span>' : ''}
    <span class="ico">${V.et}</span><span class="lab">${V.nome}</span>
    <span class="chip">${C ? (C.tipo === 'cella'
        ? `${numeroDi(C.id)} <small>(${C.x},${C.y})</small>` : C.em + ' ' + C.nome) : '…'}</span>
    ${o.se && !aperta ? '<span class="segno" title="ha una condizione">se</span>' : ''}
    ${o.se && aperta ? `<span class="se">se ${M.testoCond(liv, o.se)}</span>` : ''}</div>`
}

/* ── IL PROGRAMMA: pannelli impilati ──────────────────────────────
   Il main sta per primo e non si cancella; gli altri sono
   sottoprogrammi che partono quando arriva il loro segnale. Chiuso,
   un pannello dice il nome e quanti ordini contiene: con tutti chiusi
   si vede la FORMA del programma in quattro righe, che su un telefono
   è quello che salva la leggibilità. Aperto, dentro c'è la solita
   lista piatta. Nessun annidamento: la gerarchia è fra i pannelli. */
function programma () {
  const P = document.getElementById('prog')
  if (letta) { leggiAltrui(P); return }
  const reg = M.registro(mondo)
  const base = M.scriptDi(liv, unitaOra).length
  const inCorso = mondo.tick && !mondo.finita && mondo.unita[unitaOra] && mondo.unita[unitaOra].ordineOra
                  ? mondo.unita[unitaOra].ordineOra : null
  const h = []
  piano[unitaOra].forEach((sc, k) => {
    const ap = aperti.has(unitaOra + ':' + k)
    const seg = sc.quando.tipo === 'segnale' ? M.ilSegnale(sc.quando.id) : null
    const corre = inCorso && inCorso.script === k
    h.push(`<div class="pan ${ap ? 'ap' : ''} ${k === scriptOra ? 'mira' : ''}"
      data-pan="${k}" ${seg ? `style="--c:${seg.col}" data-ascolta="${sc.quando.id}"` : ''}>
      <div class="capo" data-apri="${k}">
        <span class="frec">${ap ? '▼' : '▶'}</span>
        <span class="tit">${seg ? `🎬 quando arriva «${seg.nome}» ${seg.em}` : '▶ dall’inizio della battaglia'}</span>
        <span class="quanti">${corre ? '<b class="corre">▶</b> ' : ''}${sc.ordini.length || 'vuoto'}${sc.ordini.length ? (sc.ordini.length === 1 ? ' ordine' : ' ordini') : ''}</span>
        ${k >= base ? `<button class="ces" data-butta="${k}" aria-label="togli lo script">🗑</button>` : ''}
      </div>`)
    if (ap) {
      h.push('<div class="dentro">')
      if (!sc.ordini.length) h.push(`<div class="vuotoprog">Nessun ordine. Tocca un <b>verbo</b> qui sotto,
        poi tocca il <b>bersaglio sulla mappa</b>.</div>`)
      sc.ordini.forEach((oo, i) => {
        const mie = z => z.unita === unitaOra && z.script === k && z.i === i
        const guasta = reg.some(z => mie(z) && z.esito === 'no')
        const saltata = !guasta && reg.some(z => mie(z) && z.esito === 'salto')
        const vivo = inCorso && inCorso.script === k && inCorso.i === i
        h.push(`<div class="ordi" data-i="${i}" data-s="${k}">`)
        const qui = sel === i && scriptOra === k
        h.push(riga(oo, (qui ? 'scelto ' : '') +
                        (vivo ? 'attivo ' : '') + (guasta ? 'guasta' : ''), i, qui))
        if (guasta || saltata) {
          const r = reg.filter(z => mie(z) && (z.esito === 'no' || z.esito === 'salto')).pop()
          h.push(`<div class="perche ${saltata ? 'salto' : ''}">${saltata ? '⤳' : '⚠'} ${r.testo}</div>`)
        }
        if (oo.v === 'manda' && M.laCosa(liv, oo.c) && M.laCosa(liv, oo.c).tipo === 'segnale')
          h.push(sveglia(oo.c))
        h.push('</div>')
        if (sel === i && scriptOra === k) h.push(modifica(oo))
      })
      h.push('</div>')
    }
    h.push('</div>')
  })
  if (segnaliLiberi().length)
    h.push(`<button class="nuovo ${creando ? 'qui' : ''}" id="nuovoScript">＋ 🎬 un altro script</button>`)
  if (creando) h.push(pannelloNuovo())
  P.innerHTML = h.join('')

  /* la riga su cui si sta lavorando resta in vista, e il pannellino
     che si apre sotto di lei pure: si porta in alto, non al centro */
  const mira0 = P.querySelector('.riga.scelto')
  if (mira0) mira0.scrollIntoView({ block:'start' })
  else {
    const rotta = P.querySelector('.riga.guasta') || P.querySelector('.riga.attivo')
    if (rotta) rotta.scrollIntoView({ block:'nearest' })
  }

  P.querySelectorAll('[data-apri]').forEach(x => x.onclick = e => {
    if (e.target.closest('[data-butta]')) return
    const k = +x.dataset.apri, ch = unitaOra + ':' + k
    if (aperti.has(ch)) {
      aperti.delete(ch)
      /* se si chiude il pannello in cui finivano gli ordini nuovi, il
         bersaglio passa a un altro aperto — e se non ce n'è, ci pensa
         `mira()` quando arriverà il prossimo ordine */
      if (scriptOra === k) {
        const j = piano[unitaOra].findIndex((_, z) => aperti.has(unitaOra + ':' + z))
        if (j >= 0) scriptOra = j
      }
    } else { aperti.add(ch); scriptOra = k }
    sel = null; pannelli() })
  P.querySelectorAll('[data-butta]').forEach(x => x.onclick = e => {
    e.stopPropagation()
    const k = +x.dataset.butta
    piano[unitaOra].splice(k, 1)
    aperti = new Set([...aperti].filter(c => !c.startsWith(unitaOra + ':')))
    scriptOra = 0; aperti.add(unitaOra + ':0'); sel = null; pannelli() })
  P.querySelectorAll('.riga[data-i]').forEach(x => x.onclick = e => {
    if (e.target.closest('[data-presa]')) return
    const k = +x.closest('.ordi').dataset.s, i = +x.dataset.i
    if (scriptOra === k && sel === i) sel = null
    else { scriptOra = k; sel = i }
    pannelli() })
  P.querySelectorAll('[data-set]').forEach(x => x.onclick = () => {
    piano[unitaOra][scriptOra].ordini[sel].c = x.dataset.set; pannelli() })
  P.querySelectorAll('[data-ripesca]').forEach(x => x.onclick = () => {
    const o = piano[unitaOra][scriptOra].ordini[sel]
    const C = M.laCosa(liv, o.c)
    scegliendo = { v: o.v, i: sel }
    /* il bersaglio di adesso si vede già segnato: si sa da dove si parte */
    const b = bersagli().find(t => t.id === o.c)
    if (b) scegliendo.scelta = b
    else if (C && C.tipo === 'cella') scegliendo.scelta = { id:C.id, x:C.x, y:C.y, nome:'questa posizione', em:'⬚' }
    cartello = false; scheda = null; pannelli() })
  P.querySelectorAll('[data-se]').forEach(x => x.onclick = () => {
    const o = piano[unitaOra][scriptOra].ordini[sel]
    const k = x.dataset.se
    const c = M.condizioniDi(liv, unitaOra).find(z => M.chiaveCond(z) === k)
    if (c) o.se = M.clona(c); else delete o.se
    pannelli() })
  const via = P.querySelector('#togli'); if (via) via.onclick = () => {
    piano[unitaOra][scriptOra].ordini.splice(sel, 1); sel = null; pannelli() }
  P.querySelectorAll('[data-sposta]').forEach(x => x.onclick = () => {
    sposta(scriptOra, sel, sel + (+x.dataset.sposta)) })
  const nuovo = P.querySelector('#nuovoScript')
  if (nuovo) nuovo.onclick = () => { creando = !creando; pannelli() }
  P.querySelectorAll('[data-crea]').forEach(x => x.onclick = () => {
    const id = x.dataset.crea
    piano[unitaOra].push({ quando: { tipo:'segnale', id }, ordini: [] })
    scriptOra = piano[unitaOra].length - 1
    aperti.add(unitaOra + ':' + scriptOra); creando = false; sel = null
    bip(660, .09, 'triangle', .05); pannelli() })
  P.querySelectorAll('[data-presa]').forEach(x => x.addEventListener('pointerdown', presaGiu))
}
/* il pannello in cui finiscono gli ordini nuovi dev'essere aperto */
function mira () {
  if (aperti.has(unitaOra + ':' + scriptOra)) return
  const k = piano[unitaOra].findIndex((_, j) => aperti.has(unitaOra + ':' + j))
  scriptOra = k < 0 ? 0 : k
  aperti.add(unitaOra + ':' + scriptOra)
}
function sposta (k, da, a) {
  const l = piano[unitaOra][k].ordini
  if (a < 0 || a >= l.length) return
  const t = l[da]; l[da] = l[a]; l[a] = t
  if (sel === da) sel = a
  bip(440, .04, 'triangle', .04); pannelli()
}

/* i segnali che questa unità non ascolta ancora */
function segnaliLiberi () {
  if (!(liv.segnali || []).length || !M.verbiDi(liv).includes('manda')) return []
  const usati = new Set(piano[unitaOra].filter(s => s.quando.tipo === 'segnale').map(s => s.quando.id))
  return liv.segnali.filter(k => !usati.has(k))
}
function pannelloNuovo () {
  const h = ['<div class="modif"><div class="tit">parte quando arriva…</div><div class="fila lunghe">']
  segnaliLiberi().forEach(k => {
    const S = M.ilSegnale(k)
    h.push(`<button data-crea="${k}" style="--c:${S.col}" class="segn">${S.em} «${S.nome}»</button>`)
  })
  h.push('</div></div>')
  return h.join('')
}

/* ── il filo, in parole: chi si sveglia quando parte questo segnale ── */
function ascoltatori (id) {
  const out = []
  for (const u in piano) piano[u].forEach((sc, k) => {
    if (sc.quando.tipo === 'segnale' && sc.quando.id === id) out.push({ u, k, mio:true })
  })
  const alt = M.pianoCompleto(liv, {})
  M.altruiUnita(liv).forEach(u => {
    if (!scoperte.has(u)) return
    ;(alt[u] || []).forEach((sc, k) => {
      if (sc.quando && sc.quando.tipo === 'segnale' && sc.quando.id === id) out.push({ u, k })
    })
  })
  return out
}
function sveglia (id) {
  const S = M.ilSegnale(id), chi = ascoltatori(id)
  if (!chi.length) return `<div class="sveglia muta">⤳ nessuno ascolta «${S.nome}»: questo segnale non sveglia niente</div>`
  const nomi = chi.map(c => {
    const u = liv.unita.find(z => z.id === c.u)
    return `${u.emoji} ${u.id === unitaOra ? 'qui sotto' : u.nome}`
  })
  return `<div class="sveglia" style="--c:${S.col}">⤳ sveglia ${nomi.join(' e ')}</div>`
}

/* ── IL FILO DISEGNATO ────────────────────────────────────────────
   Si vede PRIMA di premere ▶, che è tutto il punto: un salto che si
   scopre solo guardando la scena è la parte peggiore del goto. Va da
   `manda [segnale]` alla testa dello script che quel segnale lo
   ascolta — o alla pastiglia dell'unità, se lo ascolta un altro. */
function fili () {
  const svg = document.getElementById('fili'), zona = document.getElementById('zona')
  if (!svg || !zona) return
  const R = zona.getBoundingClientRect()
  const out = []
  document.querySelectorAll('#prog .riga[data-seg]').forEach(el => {
    const id = el.dataset.seg, S = M.ilSegnale(id)
    const b = el.getBoundingClientRect()
    ascoltatori(id).forEach(c => {
      const capo = c.u === unitaOra
        ? document.querySelector(`#prog [data-pan="${c.k}"] .capo`)
        : document.querySelector(`#chi [data-chip="${c.u}"]`)
      if (!capo) return
      const t = capo.getBoundingClientRect()
      const x1 = b.left - R.left + 4, y1 = b.top - R.top + b.height / 2
      const x2 = t.left - R.left + 6, y2 = t.top - R.top + t.height / 2
      const g = 8                       // il filo corre nella sua corsia, non fuori schermo
      out.push(`<path d="M${x1} ${y1} C ${g} ${y1}, ${g} ${y2}, ${x2} ${y2}"
        fill="none" stroke="${S.col}" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>`)
      out.push(`<circle cx="${x2}" cy="${y2}" r="3.5" fill="${S.col}"/>`)
      out.push(`<circle cx="${x1}" cy="${y1}" r="3" fill="${S.col}"/>`)
    })
  })
  svg.innerHTML = out.join('')
}

function leggiAltrui (P) {
  const id = letta, u = liv.unita.find(z => z.id === id)
  if (!scoperte.has(id)) {
    P.innerHTML = `<div class="pan ap"><div class="capo"><span class="tit">${u.emoji} ${u.nome} — ordini coperti</span></div>
      <div class="dentro"><div class="vuotoprog">I suoi ordini non li conosci. Puoi <b>dedurli</b> guardando cosa fa:
      apri il <b>registro 📜</b> e leggi quello che di lui si vede. Oppure spendi un gettone 🕵
      e li leggi. Il livello si vince anche senza spenderne nessuno.</div></div></div>`
    return
  }
  const p = M.pianoCompleto(liv, {})[id] || []
  const h = []
  p.forEach((sc, k) => {
    const seg = sc.quando.tipo === 'segnale' ? M.ilSegnale(sc.quando.id) : null
    h.push(`<div class="pan ap" ${seg ? `style="--c:${seg.col}"` : ''}>
      <div class="capo"><span class="frec">▼</span>
      <span class="tit">${u.emoji} ${M.nomeScript(sc.quando)}</span></div><div class="dentro">`)
    ;(sc.ordini || []).forEach(oo => {
      const vivo = mondo.tick && !mondo.finita && mondo.unita[id] && mondo.unita[id].ordineOra &&
                   mondo.unita[id].ordineOra.ordine === oo
      h.push(`<div class="ordi">` + riga(oo, vivo ? 'attivo' : '') + '</div>')
    })
    h.push('</div></div>')
  })
  P.innerHTML = h.join('')
}

/* Il complemento si sceglie da una lista FILTRATA dal verbo: `prendi`
   offre le cose che si raccolgono, `apri` quelle che si aprono. E
   sotto c'è la guardia: `se ⟨condizione⟩` è un attributo dell'ordine,
   non un verbo, così la forma verbo+complemento resta una sola. */
function modifica (o) {
  const cose = M.complementiPer(liv, o.v).map(k => M.laCosa(liv, k))
  const cond = M.condizioniDi(liv, unitaOra)
  const C = M.laCosa(liv, o.c)
  const h = ['<div class="modif"><div class="tit">su quale cosa</div>']
  if (suMappa(o.v)) {
    /* da un ordine si torna sempre a ciascuna delle sue parti senza
       cancellarlo: il bersaglio si ripesca sulla mappa, e la guardia
       resta dov'è */
    h.push(`<button class="mappa" data-ripesca="1">🎯 cambia bersaglio sulla mappa
      <small>adesso è ${C ? (CELLA_UI.test(C.id) ? numeroDi(C.id) + ' ' : C.em + ' ') + C.nome : '—'}</small></button>`)
  } else {
    h.push('<div class="fila lunghe">')
    cose.forEach(c => h.push(`<button class="${c.id === o.c ? 'qui' : ''}" data-set="${c.id}">${c.em} ${c.nome}</button>`))
    h.push('</div>')
  }
  if (cond.length) {
    h.push('<div class="tit">solo se</div><div class="fila lunghe cond">')
    h.push(`<button class="${o.se ? '' : 'qui'}" data-se="">sempre</button>`)
    cond.forEach(c => h.push(`<button class="${o.se && M.chiaveCond(o.se) === M.chiaveCond(c) ? 'qui' : ''}"
      data-se="${M.chiaveCond(c)}">se ${M.testoCond(liv, c)}</button>`))
    h.push('</div>')
  }
  h.push('<div class="fila" style="margin-top:7px">')
  h.push('<button data-sposta="-1">↑ su</button><button data-sposta="1">↓ giù</button></div>')
  h.push('<button class="via" id="togli">🗑 Togli questo ordine</button></div>')
  return h.join('')
}

/* ── TRASCINARE UN ORDINE ─────────────────────────────────────────
   Con una presa dedicata: il resto della riga continua ad aprire il
   pannellino e la lista continua a scorrere. Un ordine appartiene al
   suo script e non esce dal suo pannello. I tasti ↑↓ restano: il
   trascinamento è la scorciatoia per chi ce la fa, non l'unica strada. */
let trasc = null
function presaGiu (e) {
  const ordi = e.currentTarget.closest('.ordi')
  const cont = ordi.parentElement
  const righe = [...cont.children].filter(x => x.classList.contains('ordi'))
  const b = ordi.getBoundingClientRect()
  trasc = { k: +ordi.dataset.s, da: +ordi.dataset.i, a: +ordi.dataset.i, ordi, righe,
            y0: e.clientY, h: b.height + 8,
            centri: righe.map(r => { const q = r.getBoundingClientRect(); return q.top + q.height / 2 }) }
  ordi.classList.add('vola')
  e.currentTarget.setPointerCapture(e.pointerId)
  e.currentTarget.addEventListener('pointermove', presaMuovi)
  e.currentTarget.addEventListener('pointerup', presaSu)
  e.currentTarget.addEventListener('pointercancel', presaSu)
  e.preventDefault()
}
function presaMuovi (e) {
  if (!trasc) return
  const dy = e.clientY - trasc.y0
  trasc.ordi.style.transform = `translateY(${dy}px) scale(1.03)`
  const y = trasc.centri[trasc.da] + dy
  let a = trasc.da
  while (a > 0 && y < trasc.centri[a - 1]) a--
  while (a < trasc.centri.length - 1 && y > trasc.centri[a + 1]) a++
  trasc.a = a
  trasc.righe.forEach((r, j) => {
    if (j === trasc.da) return
    const su = trasc.da < a && j > trasc.da && j <= a
    const giu = trasc.da > a && j >= a && j < trasc.da
    r.style.transform = su ? `translateY(${-trasc.h}px)` : giu ? `translateY(${trasc.h}px)` : ''
  })
  /* vicino al bordo, la lista scorre da sola */
  const P = document.getElementById('prog'), R = P.getBoundingClientRect()
  if (e.clientY < R.top + 46) P.scrollTop -= 9
  else if (e.clientY > R.bottom - 46) P.scrollTop += 9
  fili()
}
function presaSu (e) {
  if (!trasc) return
  const { k, da, a } = trasc
  e.currentTarget.removeEventListener('pointermove', presaMuovi)
  e.currentTarget.removeEventListener('pointerup', presaSu)
  e.currentTarget.removeEventListener('pointercancel', presaSu)
  trasc.righe.forEach(r => { r.style.transform = ''; r.classList.remove('vola') })
  trasc = null
  if (a !== da) {
    const l = piano[unitaOra][k].ordini
    l.splice(a, 0, l.splice(da, 1)[0])
    if (sel === da) sel = a
    bip(520, .05, 'triangle', .04)
  }
  pannelli()
}

/* ── la cassetta: tre gradi, e solo i verbi che qui hanno un senso ── */
function cassetta () {
  const C = document.getElementById('cassetta')
  const per = { 1:[], 2:[], 3:[] }
  /* la cassetta è di CHI stai comandando: mostra solo quello che sa fare */
  M.verbiPer(liv, letta || unitaOra).forEach(v => per[M.VERBI[v].grado].push(v))
  const blocchi = []
  for (const g of [1, 2, 3]) {
    if (!per[g].length) continue
    blocchi.push(`<div class="grado"><span class="et">${M.GRADI[g]}</span><div class="verbi">` +
      per[g].map(v => {
        const V = M.VERBI[v]
        return `<button class="pezzo ${V.cl} ${letta ? 'spento' : ''}" data-a="${v}">
          <span class="e">${V.et}</span><span class="n">${V.nome.replace(/ a$/, '')}</span></button>`
      }).join('') + '</div></div>')
  }
  C.innerHTML = blocchi.join('')
  C.querySelectorAll('[data-a]').forEach(x => x.onclick = () => {
    if (letta) return
    mira()
    const v = x.dataset.a
    bip(520, .05, 'triangle', .04)
    /* se il bersaglio sta sulla mappa, lo si tocca sulla mappa */
    if (suMappa(v)) { scegliendo = { v }; sel = null; cartello = false; scheda = null; pannelli(); return }
    const l = piano[unitaOra][scriptOra].ordini
    l.push({ v, c: M.complementiPer(liv, v)[0] })
    sel = l.length - 1
    pannelli()
  })
}

/* ══ IL REGISTRO ══ chiuso di default: aprirlo è il gesto da imparare */
function registroPannello () {
  const box = document.getElementById('registro')
  box.className = 'registro' + (logAperto ? ' aperto' : '')
  if (!logAperto) { box.innerHTML = ''; return }
  const righe = M.registro(mondo).filter(r => mio(mondo.unita[r.unita]) || scoperte.has(r.unita) || r.visto)
  const h = [`<div class="capo">📜 Registro <small>tocca una riga per tornare a quel momento</small>
    <button id="chiudi">✕</button></div><div class="corpo">`]
  if (!righe.length) h.push('<div class="vuotoprog">Niente ancora. Premi ▶.</div>')
  righe.slice(-80).forEach(r => {
    const u = mondo.unita[r.unita]
    /* dei nemici a ordini coperti si vede solo quello che FANNO */
    const testo = (mio(u) || scoperte.has(r.unita)) ? r.testo : r.fatto
    h.push(`<div class="rr ${r.esito}" data-t="${r.t}">
      <span class="chi" style="background:${FAZ[u.fazione]}">${u.emoji}</span>
      <span class="tt">${testo}${r.n > 1 ? ` <b>×${r.n}</b>` : ''}</span>
      <span class="tk">${r.t}</span></div>`)
  })
  h.push('</div>')
  box.innerHTML = h.join('')
  box.querySelector('#chiudi').onclick = () => { logAperto = false; pannelli() }
  box.querySelectorAll('[data-t]').forEach(x => x.onclick = () => { riavvolgi(+x.dataset.t) })
  const c = box.querySelector('.corpo'); c.scrollTop = c.scrollHeight
}

casa()
window.__prog = { apri, via, unPasso, ferma, riavvolgi,
  get liv () { return liv }, get mondo () { return mondo }, get piano () { return piano },
  get cam () { return cam }, get scegliendo () { return scegliendo },
  log: () => { logAperto = !logAperto; pannelli() },
  mostrami: (k) => {
    const s = M.clona(M.costruisci(L, 0).soluzioni[k || 0])
    for (const id in s) if (piano[id]) piano[id] = s[id]
    sel = null; pannelli()
  }, M }

</script>
