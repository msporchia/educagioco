<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il programma — il robot fa quello che gli dici</title>
<style>
  :root{
    --fondo:#0e1220; --pannello:#171d2e; --alto:#1f2739; --bordo:#2c3550;
    --testo:#e9eef8; --tenue:#8b97b4;
    --moto:#4a86e8; --azione:#e8a33f; --ciclo:#3fb872; --cond:#e8703f; --msg:#e0554d;
    --oro:#f0c04a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#070a12;overflow-x:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--testo)}
  button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;
         touch-action:manipulation;font-weight:650}
  #app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:var(--fondo);
       display:flex;flex-direction:column;overflow:hidden;position:relative}

  /* ── barra ── */
  .barra{display:flex;align-items:center;gap:9px;padding:7px 10px;min-height:52px;flex:0 0 auto;
         background:var(--pannello);border-bottom:1px solid var(--bordo)}
  .indietro{width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:var(--moto);
            color:#fff;font-size:22px;line-height:44px;text-align:center}
  .dove{font-size:15px;font-weight:750;line-height:1.15;min-width:0}
  .dove small{display:block;font-size:11px;font-weight:600;color:var(--tenue)}
  .destra{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .conta{font-size:14px;font-weight:800;background:var(--alto);border:1px solid var(--bordo);
         border-radius:11px;padding:6px 9px;min-width:52px;text-align:center}
  .conta.pieno{background:#4a1f22;border-color:#8d3a3a;color:#ffb9b3}
  .mondi{display:flex;gap:5px}
  .mondi i{width:10px;height:10px;border-radius:50%;background:#39435e;display:block}
  .mondi i.ok{background:var(--ciclo)} .mondi i.ko{background:var(--msg)}
  .mondi i.ora{background:var(--oro);box-shadow:0 0 0 3px rgba(240,192,74,.22)}

  /* ── casa ── */
  .casa{flex:1;overflow-y:auto;padding:16px 14px 30px}
  .casa h1{font-size:27px;margin:0 0 4px;letter-spacing:-.5px}
  .casa p.sotto{color:var(--tenue);font-size:13.5px;margin:0 0 18px;line-height:1.45}
  .liv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:9px;
       background:var(--pannello);border:1px solid var(--bordo);border-radius:16px;padding:11px 12px;min-height:66px}
  .liv:active{transform:scale(.985)}
  .liv .num{width:38px;height:38px;flex:0 0 auto;border-radius:12px;background:var(--alto);
            display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--tenue)}
  .liv.fatto .num{background:var(--ciclo);color:#06210f}
  .liv .tit{font-size:15.5px;font-weight:750}
  .liv .che{font-size:12px;color:var(--tenue);margin-top:2px;line-height:1.35}
  .liv .stelle{margin-left:auto;font-size:14px;flex:0 0 auto}

  /* ── scena ── */
  .scena{flex:0 0 auto;position:relative;background:#0a0e19;border-bottom:1px solid var(--bordo)}
  canvas{display:block;width:100%;height:238px}
  .dritta{padding:6px 12px 7px;font-size:12.5px;line-height:1.35;color:var(--tenue);
          background:var(--pannello);border-bottom:1px solid var(--bordo);min-height:34px}
  .dritta b{color:var(--oro);font-weight:700}
  .dritta.male{color:#ffb9b3}
  .dritta.bene{color:#a9edc4}

  /* ── comandi ── */
  .comandi{display:flex;gap:7px;padding:7px 10px;flex:0 0 auto;background:var(--pannello);
           border-bottom:1px solid var(--bordo)}
  .comandi button{height:46px;border-radius:13px;background:var(--alto);border:1px solid var(--bordo);
                  display:grid;place-items:center;font-size:16px;font-weight:750;padding:0 10px}
  .comandi button:active{transform:translateY(1px)}
  .comandi .via{flex:1;background:var(--ciclo);color:#06210f;border-color:#2b8a53;font-size:17px}
  .comandi .via.gira{background:var(--msg);color:#fff;border-color:#a83b34}
  .comandi .q{width:50px;flex:0 0 auto}
  .comandi button.spento{opacity:.4}

  /* ── programma ── */
  .prog{flex:1;min-height:86px;overflow-y:auto;padding:8px 10px 14px;background:var(--fondo)}
  .riga{display:flex;align-items:center;gap:8px;min-height:46px;border-radius:12px;padding:5px 9px;
        background:var(--pannello);border:1px solid var(--bordo);margin:4px 0;position:relative}
  .riga .ico{font-size:19px;flex:0 0 auto;width:24px;text-align:center}
  .riga .lab{font-size:14px;font-weight:700;flex:1;min-width:0;line-height:1.2}
  .riga .val{flex:0 0 auto;background:var(--alto);border:1px solid var(--bordo);border-radius:9px;
             padding:5px 9px;font-size:13px;font-weight:800;min-width:34px;text-align:center}
  .riga.moto{border-left:5px solid var(--moto)}
  .riga.azione{border-left:5px solid var(--azione)}
  .riga.ciclo{border-left:5px solid var(--ciclo)}
  .riga.cond{border-left:5px solid var(--cond)}
  .riga.msg{border-left:5px solid var(--msg)}
  .riga.scelto{outline:2px solid var(--oro);outline-offset:1px}
  .riga.attivo{background:#3a3116;border-color:var(--oro);box-shadow:0 0 0 2px rgba(240,192,74,.3)}
  .riga.attivo::after{content:'▶';position:absolute;left:-11px;color:var(--oro);font-size:12px}
  .vuotoprog{color:var(--tenue);font-size:12.5px;padding:8px 4px;line-height:1.45}

  /* ── pannellino di modifica ── */
  .modif{background:var(--alto);border:1px solid var(--oro);border-radius:12px;padding:8px;margin:2px 0 6px}
  .modif .tit{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
              color:var(--tenue);margin-bottom:6px}
  .modif .fila{display:flex;flex-wrap:wrap;gap:6px}
  .modif .fila button{min-width:44px;min-height:44px;border-radius:11px;background:var(--pannello);
                      border:1px solid var(--bordo);font-size:14px;font-weight:800;padding:0 9px}
  .modif .fila button.qui{background:var(--oro);color:#25200a;border-color:var(--oro)}
  .modif .fila.lunghe button{width:100%;justify-content:flex-start;text-align:left;font-size:13px;font-weight:700}
  .modif .via{width:100%;min-height:46px;border-radius:11px;background:#4a1f22;border:1px solid #8d3a3a;
              color:#ffb9b3;font-size:14px;font-weight:800;margin-top:7px}

  /* ── cassetta ── */
  .cassetta{flex:0 0 auto;display:flex;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
            overflow-x:auto;background:var(--pannello);border-top:1px solid var(--bordo);scrollbar-width:none}
  .cassetta::-webkit-scrollbar{display:none}
  .pezzo{flex:0 0 auto;width:62px;min-height:62px;border-radius:14px;background:var(--alto);
         border:1px solid var(--bordo);display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:2px;padding:4px 2px}
  .pezzo .e{font-size:21px;line-height:1}
  .pezzo .n{font-size:9.5px;font-weight:700;color:var(--tenue);text-align:center;line-height:1.1}
  .pezzo:active{transform:scale(.94)}
  .pezzo.spento{opacity:.32}
  .pezzo.moto{border-bottom:4px solid var(--moto)}
  .pezzo.azione{border-bottom:4px solid var(--azione)}
  .pezzo.ciclo{border-bottom:4px solid var(--ciclo)}
  .pezzo.cond{border-bottom:4px solid var(--cond)}
  .pezzo.msg{border-bottom:4px solid var(--msg)}

  /* ── velo di fine ── */
  .velo{position:absolute;inset:0;background:rgba(7,10,18,.9);display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:9}
  .velo .urlo{font-size:62px;animation:sbuca .3s ease-out}
  @keyframes sbuca{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .velo h2{margin:0;font-size:24px}
  .velo .stelline{font-size:30px;letter-spacing:4px}
  .velo p{margin:0;color:var(--tenue);font-size:13.5px;line-height:1.45;max-width:290px}
  .velo button{min-height:50px;border-radius:14px;padding:0 22px;background:var(--ciclo);color:#06210f;font-size:16px}
  .velo button.grigio{background:var(--alto);border:1px solid var(--bordo);color:var(--testo)}
  .velo .duebottoni{display:flex;gap:9px}

  /* ── scena, minimappa, frecce ── */
  .scena{flex:0 0 auto;position:relative;background:#0a0e19;border-bottom:1px solid var(--bordo)}
  canvas#tela{display:block;width:100%;height:236px;touch-action:none}
  canvas.mini{position:absolute;top:6px;right:6px;border:1px solid var(--bordo);border-radius:5px;
              background:#0c1120;opacity:.92;pointer-events:none}
  .frecce{position:absolute;inset:0;pointer-events:none}
  .frecce i{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;
            display:grid;place-items:center;font-size:12px;font-style:normal;opacity:.9;
            box-shadow:0 0 0 2px rgba(0,0,0,.4)}
  .conta.bene{background:#183a26;border-color:#2b8a53;color:#a9edc4}
  .conta small{display:block;font-size:9px;font-weight:700;color:var(--tenue);letter-spacing:.3px}
  .liv .stelle small{display:block;font-size:9.5px;color:var(--tenue);font-weight:700}

  /* ── righe d'ordine: verbo + chip del complemento ── */
  .riga .chip{flex:0 0 auto;max-width:52%;background:var(--alto);border:1px solid var(--bordo);
              border-radius:9px;padding:5px 8px;font-size:12.5px;font-weight:750;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .riga .lab{flex:0 0 auto;font-size:13px;color:var(--tenue)}
  .riga.g1{border-left-color:#8b97b4}
  .riga.guasta{border-color:#8d3a3a;background:#33191a}
  .perche{margin:-2px 0 5px 34px;font-size:11.5px;color:#ffb9b3;line-height:1.3}

  /* ── cassetta a tre gradi ── */
  .cassetta{flex-direction:column;gap:4px;overflow-x:hidden;overflow-y:auto;max-height:196px}
  .grado{display:flex;align-items:center;gap:7px}
  .grado .et{flex:0 0 52px;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
             color:var(--tenue);line-height:1.1}
  .grado .verbi{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .grado .verbi::-webkit-scrollbar{display:none}
  .pezzo{width:auto;min-width:56px;padding:4px 8px;min-height:48px}
  .pezzo.basso{border-bottom:4px solid #8b97b4}
  .pezzo.attesa{border-bottom:4px solid #b06be0}

  /* ── il registro: chiuso di default, si apre col tasto ── */
  .comandi .reg{position:relative}
  .comandi .reg.qui{background:var(--oro);color:#25200a;border-color:var(--oro)}
  .pallo{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;
         background:var(--msg);color:#fff;font-size:11px;font-weight:800;line-height:18px;padding:0 4px}
  .registro{position:absolute;left:0;right:0;bottom:0;max-height:56%;display:none;z-index:8;
            background:var(--pannello);border-top:2px solid var(--oro);
            border-radius:16px 16px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.5);flex-direction:column}
  .registro.aperto{display:flex}
  .registro .capo{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:14px;font-weight:800;
                  border-bottom:1px solid var(--bordo)}
  .registro .capo small{font-weight:600;font-size:10.5px;color:var(--tenue)}
  .registro .capo button{margin-left:auto;width:36px;height:36px;border-radius:10px;background:var(--alto);
                         border:1px solid var(--bordo)}
  .registro .corpo{overflow-y:auto;padding:6px 8px 12px}
  .rr{display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 8px;border-radius:10px;
      margin-bottom:3px;background:var(--alto);border-left:4px solid var(--bordo)}
  .rr.fa{border-left-color:var(--ciclo)} .rr.aspetto{border-left-color:var(--oro)}
  .rr.no{border-left-color:var(--msg);background:#2e1919}
  .rr .chi{width:24px;height:24px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px}
  .rr .tt{flex:1;font-size:12.5px;font-weight:600;line-height:1.25}
  .rr.no .tt{color:#ffb9b3}
  .rr .tk{flex:0 0 auto;font-size:10px;color:var(--tenue);font-weight:700}
  .rr.salto{border-left-color:#6c7a99;background:#1b2133}
  .rr.salto .tt{color:#b6c0da}

  /* ── il cartello: spiegazione e suggerimenti ── */
  .cartello{border-top-color:#7fb0ff}
  .cartello .racconto{margin:2px 0 10px;font-size:13.5px;line-height:1.5;color:var(--testo)}
  .cartello .racconto b{color:var(--oro)}
  .aiuto{background:var(--alto);border:1px solid var(--bordo);border-left:4px solid var(--oro);
         border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.4}
  .aiuto b{color:var(--oro);display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
  .aiuto.muto{border-left-color:#5a668a;color:var(--tenue)}
  .chiedi{display:block;width:100%;min-height:56px;border-radius:12px;padding:8px 12px;text-align:left;
          background:var(--alto);border:1px solid var(--bordo);font-size:14px;font-weight:750;margin-top:4px}
  .chiedi small{display:block;font-size:11px;font-weight:600;color:var(--tenue);margin-top:2px}
  .chiedi.gratis{border-color:var(--ciclo);color:#a9edc4}
  .chiedi.gratis small{color:#7fc59a}

  /* ── la scheda del personaggio ── */
  .persona{border-top-color:var(--moto)}
  .persona .dati{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--tenue);
                 font-weight:700;margin-bottom:8px}
  .tit2{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
        color:var(--tenue);margin:6px 0 5px}
  .abil{display:flex;gap:6px;flex-wrap:wrap}
  .abil .ab{font-size:12.5px;font-weight:750;background:var(--alto);border:1px solid var(--bordo);
            border-radius:10px;padding:7px 9px;min-height:36px;display:flex;align-items:center;gap:5px}
  .abil.no .ab{opacity:.55;text-decoration:line-through;border-style:dashed}

  /* ── il modo scelta: la barra della conferma sopra la mappa ── */
  .scelta{display:none}
  .scelta.aperta{display:flex;align-items:center;gap:7px;flex:0 0 auto;
                 background:var(--pannello);border-bottom:2px solid var(--oro);padding:6px 8px}
  .scelta .dett{flex:1;min-width:0;font-size:12.5px;line-height:1.25;color:var(--testo);padding-left:4px}
  .scelta .dett b{color:var(--oro)}
  .scelta .dett i{font-style:normal;color:var(--oro);font-weight:800}
  .scelta button{flex:0 0 auto;min-height:44px;border-radius:11px;padding:0 12px;font-size:14px;font-weight:800}
  .scelta .ok{background:var(--ciclo);color:#06210f;border:1px solid #2b8a53}
  .scelta .no{width:44px;background:var(--alto);border:1px solid var(--bordo);color:var(--testo)}
  .smorza{opacity:.35;pointer-events:none}
  .modif .mappa{display:block;width:100%;min-height:52px;border-radius:11px;padding:8px 10px;text-align:left;
                background:var(--pannello);border:1px solid var(--oro);font-size:13.5px;font-weight:750}
  .modif .mappa small{display:block;font-size:11px;font-weight:600;color:var(--tenue);margin-top:2px}
  .riga .chip small{font-size:10.5px;color:var(--tenue);font-weight:700}

  /* ══ GLI SCRIPT SONO PANNELLI ══
     Il main per primo, i sottoprogrammi sotto. Chiusi, si legge la
     forma del programma; aperti, dentro c'è la lista piatta. */
  .zona{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .zona .prog{flex:1;min-height:0;padding-left:20px}   /* la corsia dei fili */
  svg.fili{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

  .chi{display:flex;gap:6px;padding:7px 10px 2px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .chi::-webkit-scrollbar{display:none}
  .chi button{flex:0 0 auto;min-height:40px;border-radius:12px;padding:0 11px;font-size:12.5px;
              background:var(--pannello);border:1px solid var(--bordo);color:var(--tenue)}
  .chi button.qui{background:var(--alto);color:var(--testo);border-color:var(--oro)}
  .chi .pall{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .chi .n{font-size:10px;font-weight:800;color:var(--tenue);margin-left:5px}

  .pan{border:1px solid var(--bordo);border-radius:13px;margin:6px 0;background:var(--pannello);
       border-left:5px solid var(--c,#5a668a);overflow:hidden}
  .pan.mira{border-color:var(--oro);border-left-color:var(--c,var(--oro))}
  .pan .capo{display:flex;align-items:center;gap:7px;min-height:46px;padding:5px 9px;
             background:var(--alto);font-size:12.5px;font-weight:750;line-height:1.2}
  .pan .capo .frec{flex:0 0 auto;width:14px;color:var(--tenue);font-size:11px}
  .pan .capo .tit{flex:1;min-width:0}
  .pan .capo .quanti{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--tenue);
                     background:var(--pannello);border:1px solid var(--bordo);border-radius:8px;padding:3px 6px}
  .pan .capo .corre{color:var(--oro)}
  .pan .capo .ces{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--pannello);
                  border:1px solid var(--bordo);font-size:14px}
  .pan .dentro{margin:0;padding:2px 8px 8px;border:none;background:transparent}
  .pan.ap>.capo{border-bottom:1px solid var(--bordo)}
  .nuovo{display:block;width:100%;min-height:46px;border-radius:13px;margin:8px 0 4px;
         border:2px dashed var(--bordo);color:var(--oro);font-size:13px;background:transparent}
  .nuovo.qui{border-color:var(--oro);background:rgba(240,192,74,.08)}

  /* la riga d'ordine: presa, verbo, cosa, e sotto la guardia */
  .riga{flex-wrap:wrap}
  .riga .presa{flex:0 0 auto;width:22px;min-height:44px;display:grid;place-items:center;
               color:#5a668a;font-size:15px;cursor:grab;touch-action:none;margin-left:-4px}
  .riga .segno{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#f0a877;
               background:rgba(232,112,63,.16);border:1px solid rgba(232,112,63,.55);
               border-radius:7px;padding:3px 6px}
  .riga .se{flex:0 0 100%;order:9;margin-top:4px;font-size:11.5px;font-weight:700;color:#f0a877;
            background:rgba(232,112,63,.14);border:1px solid rgba(232,112,63,.5);
            border-radius:8px;padding:4px 7px}
  .riga.msg{border-left-color:var(--c,var(--msg))}
  .ordi{position:relative;transition:transform .12s ease}
  .ordi.vola{z-index:12;transition:none}
  .ordi.vola .riga{box-shadow:0 10px 22px rgba(0,0,0,.55);border-color:var(--oro)}
  .sveglia{display:flex;align-items:center;gap:5px;margin:-2px 0 6px 26px;min-height:24px;
           font-size:11.5px;font-weight:750;color:var(--c,var(--tenue))}
  .sveglia.muta{color:#8b97b4}
  .perche.salto{color:#b6c0da}
  .modif .fila.cond button{border-color:rgba(232,112,63,.45)}
  .modif .fila button.segn{border-left:5px solid var(--c,var(--bordo))}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ══════════════════════════════════════════════════════════════════
   MOTORE — INIZIO
   Nessun DOM qui dentro: questo blocco, copiato in un file .mjs, gira
   in Node tale e quale. È la condizione per poter provare i livelli.

   IL MODELLO. Il bambino non pilota nessuno: scrive ORDINI PERMANENTI
   alle unità, come un generale prima della battaglia. Poi guarda.
   Un'unità sa già camminare (ci pensa una BFS): il bambino decide il
   COSA e il QUANDO, mai il COME.

   Non esiste una «AI dei mostri»: c'è UN solo linguaggio di ordini e UN
   solo esecutore. Ogni fazione ha un AUTORE — il giocatore oppure il
   livello. L'esecutore non sa e non gli importa chi ha scritto cosa.
   ══════════════════════════════════════════════════════════════════ */
const MOTORE = (function () {
'use strict'

  const V = VERBI[v]; if (!V) return 2

}

/* le cose del livello, ricavate da quello che c'è davvero dentro.

  for (const k in (liv.porte || {}))   agg(k, 'porta',   etichetta(liv, k), '🚪')
  for (const k in (liv.posti || {}))   agg(k, 'posto',   etichetta(liv, k), '📍')

  for (const k in (liv.fazioni || {})) agg(k, 'fazione', etichetta(liv, k), '🚩')

   Un bersaglio si sceglie toccandolo sulla mappa, e sulla mappa c'è

   `"12,10"` è una cosa a tutti gli effetti, solo che non ha un nome —
   e questa è esattamente la sua debolezza. Un oggetto lo segui
   ovunque vada; una casella è un numero scritto a mano, e se nella

/* la lista delle cose del livello: il livello può restringerla, ed è

   verbo che non porta da nessuna parte. */

/* ── CHI SA COSA ──────────────────────────────────────────────────

   verbo × CHI LO ESEGUE (qui). Un'unità dichiara nei dati cosa sa
   fare (`sa: […]`); chi non lo dichiara sa tutto quello che il
   livello offre. Il cavaliere è dentro un'armatura: combatte e
   aspetta, ma non fruga per terra e non scassina.

   coordinarsi — se il compito lo sa fare uno solo, dare il compito
   giusto alla persona giusta diventa parte del pensiero. */

    const dove = `${id}[${s}:${i}]`
    const V = VERBI[o.v]

    const C = c[o.c] || laCosa(liv, o.c)

      const u = c.chi ? m.unita[c.chi] : io

    case 'segnale': return m.segnaliMandati.includes(c.id)

/* ── LA GUARDIA IN CASSETTA ───────────────────────────────────────
   `se ⟨condizione⟩` NON è un verbo: è un ATTRIBUTO dell'ordine, e si
   sceglie nel pannellino sotto il complemento. Così ogni ordine resta
   verbo + complemento — la forma unica — e la lista resta piatta.
   Un `se` come blocco rimetterebbe l'annidamento; una fila di ordini
   ciascuno con la sua guardia si legge male. Perciò il suo uso tipico
   è UNO SOLO: decidere QUALE SEGNALE mandare. Il ramo vero non è la
   guardia, sono gli script che si chiamano per nome.

   Le condizioni non si inventano: escono dalle stesse cose del livello

   (`condizioni:`) quando la combinatoria è troppa per chi ha sei anni. */

  for (const k of complementiDi(liv)) {

      case 'porta':

const chiaveCond = c => c

/* ── la mappa ────────────────────────────────────────────────────── */

function libera (m, x, y) {
  if (!dentro(m, x, y)) return false
  const c = m.celle[y][x]

  if (c.porta && !m.porte[c.porta].aperta) return false

}
/* Le unità NON si bloccano fra loro: due sulla stessa cella sono

   che non hanno niente da insegnare. */

/* BFS: la mappa delle distanze da una cella. È il «sa già camminare». */
function distanze (m, x0, y0) {
  const d = new Int16Array(m.w * m.h).fill(-1)

    const [x, y] = coda.shift(), q = d[y * m.w + x]
    for (const [dx, dy] of P) {

      if (!libera(m, nx, ny)) continue
      if (d[ny * m.w + nx] !== -1) continue

  const d = distanze(m, bx, by)

  const P = [[0,-1],[1,0],[0,1],[-1,0]]
  for (const [dx, dy] of P) {

/* ── creare il mondo ─────────────────────────────────────────────── */
function creaMondo (liv) {
  const h = liv.mappa.length, w = liv.mappa[0].length

  for (let y = 0; y < h; y++) {
    const riga = []
    for (let x = 0; x < w; x++) {
      const ch = liv.mappa[y][x]
      riga.push({ muro: ch === '#', porta: null, erba: ch === ',' })
    }
    celle.push(riga)
  }
  const porte = {}
  for (const nome in (liv.porte || {})) {
    const p = liv.porte[nome]
    porte[nome] = { nome, x: p.x, y: p.y, chiave: p.chiave || null, aperta: !!p.aperta, iniziale: !!p.aperta }
    celle[p.y][p.x].porta = nome
  }
  const m = {
    liv, w, h, celle, porte,
    unita: {}, elenco: [], viva: [],
    oggetti: (liv.oggetti || []).map(o => ({ ...o, preso: null })),
    fili: [], segnaliMandati: [], pendenti: [],
    tick: 0, finita: false, vinta: false, motivo: '', colpevole: null,
    eventi: [], versioneMappa: 0, diario: [],
    mia: Object.keys(liv.fazioni).find(f => liv.fazioni[f].autore === 'giocatore'),
  }
  for (const u0 of liv.unita) {
    const u = { ...u0, x: u0.x, y: u0.y, vita: u0.vita || 3, vitaMax: u0.vita || 3,

/* ── avviare la scena ────────────────────────────────────────────── */
/* `piano` è { idUnità: [ script… ] } dove uno script è
   { quando:{tipo:'inizio'} | {tipo:'segnale',id}, ordini:[…] }.

   il main e c'è sempre; gli altri hanno una testa che dice quando

    const o = m.liv.unita.find(z => z.id === u.id)

  m.finita = true; m.vinta = vinta; m.motivo = motivo

  if (!vinta && !m.colpevole) {
    /* chi ci ha rimesso la pelle viene prima: l'ordine che stava eseguendo
       quando è caduto è quasi sempre quello da riscrivere */
    const u = m.elenco.find(z => !z.viva && z.ordineOra) || m.elenco.find(z => z.ordineOra)

/* ── un tick ─────────────────────────────────────────────────────── */

      const svegli = []
      for (const id in m.piano) m.piano[id].forEach((sc, s) => {
        if (!sc.quando || sc.quando.tipo !== 'segnale' || sc.quando.id !== p.seg) return
        if (!m.unita[id] || !m.unita[id].viva) return
        svegli.push(m.unita[id].nome)
        const vecchio = m.fili.find(f => f.unita === id && f.script === s)
        if (vecchio) { vecchio.i = 0; vecchio.nuovo = true; vecchio.st = {}; vecchio.finito = false }
        else m.fili.push(nuovoFilo(id, s, sc))
      })
      const chi = m.unita[p.da]
      const N = ilSegnale(p.seg).nome
      if (chi) nota(m, chi.ordineOra, chi, svegli.length ? 'fa' : 'salto',
        svegli.length ? `arriva «${N}»: si sveglia ${[...new Set(svegli)].join(' e ')}`
                      : `arriva «${N}», ma non lo ascolta nessuno`,
        svegli.length ? `manda ${N}` : `grida nel vuoto`)
    }
  }
  if (m.finita) return

  /* quello che si vede si tiene a mente: è la memoria su cui lavora
     `vai [qualcuno]`, e il motivo per cui una ronda serve davvero */
  for (const u of m.viva) for (const z of m.viva)
    if (z !== u && vede(m, u, z)) u.visti[z.id] = { x: z.x, y: z.y }

  /* esito della scena */
  if (condizioni(m, m.liv.sconfitta)) { fine(m, false, m.liv.motivoSconfitta || 'La missione è fallita.'); return }
  if (condizioni(m, m.liv.obiettivo)) { fine(m, true, ''); return }

  const attivi = m.fili.filter(f => !f.finito)
  if (!attivi.length) {
    const r = [...m.diario].reverse().find(x => x.esito === 'no')
    fine(m, false, 'Gli ordini sono finiti e la missione non è compiuta.' +
                   (r ? ` L'ultimo intoppo: ${m.unita[r.unita].nome} — «${r.testo}».` : '')); return
  }
  /* STALLO: se tutti aspettano, niente potrà più cambiare. Non è un
     ciclo infinito da far girare: è un errore, e va detto. */
  if (!qualcunoAgisce) {
    const f = attivi[0], u = m.unita[f.unita]
    const che = f.ordine ? `«${descrivi(m.liv, f.ordine)}»` : 'qualcosa'
    const altri = attivi.length > 1 ? ` (e con lui ${attivi.length - 1} altro/i)` : ''
    fine(m, false, `Stallo: ${u.nome} è piantato su ${che} e non succederà mai${altri}.`,
         { unita: f.unita, script: f.script, i: f.i })
  }
}

const condizioni = (m, lista) => !!(lista && lista.length) && lista.every(c => valuta(m, null, c))

/* ── un tick di un filo ──────────────────────────────────────────── */
function passoFilo (m, f, u) {
  let giri = 0
  while (giri++ < 40) {
    if (f.i >= f.ordini.length) { f.finito = true; f.ordine = null; u.ordineOra = null; return 'fine' }
    const o = f.ordini[f.i]
    if (f.nuovo) {
      f.nuovo = false; f.st = {}
      if (o.se && !valuta(m, u, o.se)) {          // la guardia: l'ordine si salta
        /* saltare non è sbagliare: è la guardia che fa il suo mestiere.
           Perciò non è una riga rossa e non incolpa nessuno — è una
           riga a parte, che dice quale condizione non era vera. */
        nota(m, f, u, 'salto', `${testoCond(m.liv, o.se)}? no — salto «${descrivi(m.liv, o, true)}»`, 'resta fermo')
        f.i++; f.nuovo = true; return 'agisce'
      }
    }
    f.ordine = o; u.ordineOra = { ordine: o, unita: f.unita, script: f.script, i: f.i }
    const r = fai(m, f, u, o)
    if (r === 'subito') { f.i++; f.nuovo = true; continue }
    if (r === 'fatto')  { f.i++; f.nuovo = true; return 'agisce' }
    if (r === 'salta')  { f.i++; f.nuovo = true; return 'agisce' }
    if (r === 'attesa') { f.attesa = true; return 'attesa' }
    if (r === 'errore') { f.finito = true; f.ordine = null; u.ordineOra = null; return 'agisce' }
    f.attesa = false
    return 'agisce'
  }
  nota(m, f, u, 'no', 'giro a vuoto fra i miei ordini', 'resta fermo')
  f.finito = true
  return 'errore'
}

/* ── IL REGISTRO ──────────────────────────────────────────────────
   Una riga per ordine, in prima persona, con l'esito a colori:
     fa      verde   ho fatto qualcosa
     aspetto giallo  sto aspettando, e dico cosa
     no      rosso   non ho potuto, e dico perché

   Ogni riga porta due versioni. `testo` è quello che l'unità pensa —
   e nomina l'ordine. `fatto` è quello che si VEDE da fuori. Di
   un'unità coi piani coperti si mostra solo `fatto`, e solo se
   qualcuno dei tuoi la sta guardando: il registro serve a DEDURRE il
   piano nemico, non a leggerlo. Il gettone 🕵 resta l'altra strada. */
/* due righe di grammatica: «vado a la chiave» non si può leggere */
const ALLA = t => t
  .replace(/\ba la /g, 'alla ').replace(/\ba il /g, 'al ').replace(/\ba l'/g, "all'").replace(/\ba le /g, 'alle ')
  .replace(/\bdi la /g, 'della ').replace(/\bdi il /g, 'del ').replace(/\bdi l'/g, "dell'").replace(/\bdi le /g, 'delle ')
function nota (m, f, u, esito, testo, fatto) {
  testo = ALLA(testo); if (fatto) fatto = ALLA(fatto)
  const visto = chiVede(m, u)
  let p = null
  for (let k = m.diario.length - 1; k >= 0 && k > m.diario.length - 12; k--)
    if (m.diario[k].unita === u.id) { p = m.diario[k]; break }
  if (p && p.testo === testo && p.esito === esito && p.visto === visto) {
    p.n++; p.tFine = m.tick; return
  }
  m.diario.push({ t: m.tick, tFine: m.tick, n: 1, unita: u.id, fazione: u.fazione,
                  emoji: u.emoji, esito, testo, fatto: fatto || testo,
                  script: f ? f.script : 0, i: f ? f.i : 0, visto })
  if (m.diario.length > 400) m.diario.shift()
}
/* chi dei «tuoi» sta guardando questa unità in questo momento */
function chiVede (m, u) {
  if (u.fazione === m.mia) return true
  return m.viva.some(z => z.fazione === m.mia && vede(m, z, u))
}
const VERSO = DIR

/* Una strada chiusa non è subito un errore: il portone potrebbe aprirlo
   qualcun altro fra due secondi. L'unità aspetta, e solo se non succede
   niente per un pezzo si arrende dicendo perché. */
function attende (m, f, u, testo, limite) {
  f.st.fermo = (f.st.fermo || 0) + 1
  if (f.st.fermo > (limite || 25)) return guasto(m, f, u, testo)
  nota(m, f, u, 'aspetto', testo, 'resta fermo')
  return 'attesa'
}
/* Un ordine che non parte NON ferma la scena: ferma quell'ordine, lo
   dice, e si passa al prossimo. Fermare tutto per un ordine sbagliato
   toglierebbe al bambino la parte più utile — vedere cosa succede dopo. */
function guasto (m, f, u, testo) {
  nota(m, f, u, 'no', testo, 'si ferma')
  if (!m.colpevole) m.colpevole = { unita: u.id, script: f.script, i: f.i }
  return 'errore'
}
function salta (m, f, u, testo, fatto) {
  nota(m, f, u, 'no', testo, fatto || 'resta fermo')
  if (!m.colpevole) m.colpevole = { unita: u.id, script: f.script, i: f.i }
  return 'salta'
}

/* muove di una cella verso (bx,by). Restituisce 'arrivato' | 'passo' | null */
function verso (m, u, bx, by) {
  if (u.x === bx && u.y === by) return 'arrivato'
  const p = passoVerso(m, u, bx, by)
  if (!p) return null
  u.dir = p[0] > u.x ? 1 : p[0] < u.x ? 3 : p[1] > u.y ? 2 : 0
  u.x = p[0]; u.y = p[1]; u._mk = null
  m.eventi.push('passo')
  return u.x === bx && u.y === by ? 'arrivato' : 'passo'
}

/* dov'è una cosa, adesso */
function dove (m, u, C) {
  switch (C.tipo) {
    case 'posto': return m.liv.posti[C.id]
    case 'porta': return m.porte[C.id]
    case 'zona':  { const z = m.liv.zone[C.id]; return z && z[0] }
    case 'cella': return { x: C.x, y: C.y }
    case 'oggetto': {
      const o = m.oggetti.find(z => z.nome === C.id)
      if (!o) return null
      return o.preso ? (m.unita[o.preso] && m.unita[o.preso].viva ? m.unita[o.preso] : null) : o
    }
    case 'unita':   return m.unita[C.id] && m.unita[C.id].viva ? m.unita[C.id] : null
    case 'fazione': {
      const b = m.viva.filter(z => z.fazione === C.id && z !== u)
      if (!b.length) return null
      b.sort((p, q) => mappaDi(m, u)[p.y * m.w + p.x] - mappaDi(m, u)[q.y * m.w + q.x])
      return b[0]
    }
    default: return null
  }
}
const MOBILE = { unita:1, fazione:1 }
/* «essere a portata»: sulla cella o attaccati. È la precondizione di
   tutte le azioni, ed è la ragione per cui prima si dice `vai`. */
const aPortata = (u, t) => t && Math.abs(u.x - t.x) + Math.abs(u.y - t.y) <= 1
const arrivato = (m, u, C, t) =>
  MOBILE[C.tipo] || (C.tipo === 'porta' && !m.porte[C.id].aperta)
    ? aPortata(u, t) : (u.x === t.x && u.y === t.y)

function fai (m, f, u, o) {
  const C = laCosa(m.liv, o.c)
  if (!C) return salta(m, f, u, o.c ? `«${o.c}»? qui non c'è niente che si chiami così`
                                     : 'questo ordine non dice su cosa')
  const N = C.nome

  /* Il tipo e il mestiere sono già filtrati in cassetta e dal
     validatore. I controlli qui restano lo stesso: sono la rete
     sotto, e servono a un livello scritto a mano che sbaglia. */
  if (!saFare(m.liv.unita.find(z => z.id === u.id), o.v))
    return salta(m, f, u, `non è il mio mestiere: non so ${VERBI[o.v] ? VERBI[o.v].nome : o.v}`)

  switch (o.v) {

    case 'vai': {
      if (!VERBI.vai.prende.includes(C.tipo)) return salta(m, f, u, `a ${N} non ci si va`)
      /* una casella scritta a mano può non esistere più: in questa
         scena lì c'è un muro, e il piano cade */
      if (C.tipo === 'cella' && !libera(m, C.x, C.y))
        return salta(m, f, u, `${N}? qui non c'è più niente: è un muro`, 'si guarda intorno')
      let t = dove(m, u, C)
      if (MOBILE[C.tipo]) {
        /* nessuna onniscienza: si va da chi si vede, o dove lo si è
           visto l'ultima volta. Ecco perché serve prima la ronda. */
        if (t && vede(m, u, t)) u.visti[t.id] = { x: t.x, y: t.y }
        else {
          const ric = t && u.visti[t.id] ? u.visti[t.id] : (u.visti[C.id] || null)
          if (!ric) return salta(m, f, u, `${N}? non so dov'è`, 'si guarda intorno')
          if (aPortata(u, ric) && (!t || !vede(m, u, t)))
            return salta(m, f, u, `${N} non è più qui`, 'si guarda intorno')
          t = ric
        }
      }
      if (!t) return salta(m, f, u, `${N} non c'è più`, 'si guarda intorno')
      if (arrivato(m, u, C, t)) { nota(m, f, u, 'fa', `sono a ${N}`, 'si ferma'); return 'fatto' }
      const r = verso(m, u, t.x, t.y)
      if (r === null) return attende(m, f, u, `non riesco ad arrivare a ${N}: la strada è chiusa`)
      f.st.fermo = 0
      nota(m, f, u, 'fa', `vado a ${N}`, 'va verso ' + VERSO[u.dir])
      return arrivato(m, u, C, t) ? 'fatto' : 'lavora'
    }

    case 'pattuglia': {
      if (C.tipo !== 'zona') return salta(m, f, u, `${N} non è un giro di ronda`)
      /* la ronda finisce quando si vede un estraneo: è il senso stesso
         di «fai il giro finché non trovi qualcuno» */
      const visto = m.viva.find(z => z.fazione !== u.fazione && vede(m, u, z))
      if (visto) { nota(m, f, u, 'fa', `ho visto ${visto.nome}: smetto il giro`, 'si ferma di colpo'); return 'fatto' }
      const z = m.liv.zone[C.id]
      if (!z || !z.length) return salta(m, f, u, `${N} non ha tappe`)
      if (f.st.k == null) f.st.k = tappaPiuVicina(m, u, z)
      const r = verso(m, u, z[f.st.k].x, z[f.st.k].y)
      if (r === null) return attende(m, f, u, `non riesco a fare il giro di ${N}`)
      if (r === 'arrivato') f.st.k = (f.st.k + 1) % z.length
      f.st.fermo = 0
      nota(m, f, u, 'fa', `faccio il giro di ${N}`, 'va verso ' + VERSO[u.dir])
      return 'lavora'
    }

    case 'prendi': {
      if (C.tipo !== 'oggetto') return salta(m, f, u, `${N} non si prende`)
      const og = m.oggetti.find(z => z.nome === C.id)
      if (og.preso === u.id) return 'subito'
      if (og.preso) return salta(m, f, u, `${N} ce l'ha già qualcun altro`)
      if (!aPortata(u, og)) return salta(m, f, u, `${N} non è qui`, 'fruga per terra')
      og.preso = u.id; u.zaino.push(C.id); m.eventi.push('presa')
      nota(m, f, u, 'fa', `presa ${N}`, 'raccoglie qualcosa')
      return 'fatto'
    }

    case 'apri': {
      if (C.tipo !== 'porta') return salta(m, f, u, `${N} non si apre`)
      const pt = m.porte[C.id]
      if (pt.aperta) return 'subito'
      if (!aPortata(u, pt)) return salta(m, f, u, `${N} non è qui`, 'spinge il vuoto')
      if (pt.chiave && !u.zaino.includes(pt.chiave))
        return salta(m, f, u, `${N} è bloccato: mi manca ${etichetta(m.liv, pt.chiave)}`, 'spinge il portone')
      pt.aperta = true; m.versioneMappa++; m.elenco.forEach(z => { z._mk = null })
      m.eventi.push('apre')
      nota(m, f, u, 'fa', `aperto ${N}`, `apre ${N}`)
      return 'fatto'
    }

    case 'attacca': {
      if (!MOBILE[C.tipo]) return salta(m, f, u, `${N} non si attacca`)
      let t = f.st.bersaglio ? m.unita[f.st.bersaglio] : null
      if (t && !t.viva) t = null
      if (!t) {
        const b = dove(m, u, C)
        if (!b) return 'subito'                               // non c'è più nessuno: fatto
        /* Si attacca chi si VEDE, e gli si resta addosso finché non cade.
           L'inseguimento è una SCELTA dichiarata di questo ordine — un
           comportamento continuo, non un `vai`+`colpisci` mascherato:
           `attacca` non è mai un modo per spostarsi da qualche parte.
           Chi non vede nessuno resta in guardia, ed è per questo che
           prima gli serve una ronda. */
        if (!vede(m, u, b)) return attende(m, f, u, `non vedo ${N} da nessuna parte`, 60)
        t = b; f.st.bersaglio = t.id                          // ingaggiato: adesso lo insegue
      }
      f.st.fermo = 0
      if (aPortata(u, t)) {
        t.vita -= DANNO; m.eventi.push('colpo')
        if (t.vita <= 0) { t.viva = false; m.viva = m.elenco.filter(z => z.viva); m.eventi.push('morte')
          nota(m, f, u, 'fa', `${t.nome} è fuori combattimento`, `abbatte ${t.nome}`); return 'fatto' }
        nota(m, f, u, 'fa', `colpisco ${t.nome}`, `colpisce ${t.nome}`)
        return 'lavora'
      }
      const r = verso(m, u, t.x, t.y)                          // ingaggiato: lo inseguo
      if (r === null) return attende(m, f, u, `non riesco a raggiungere ${t.nome}`)
      nota(m, f, u, 'fa', `inseguo ${t.nome}`, 'va verso ' + VERSO[u.dir])
      return 'lavora'
    }

    case 'manda': {
      if (C.tipo !== 'segnale') return salta(m, f, u, `${N} non è un segnale`)
      m.pendenti.push({ seg: C.id, da: u.id }); m.eventi.push('segnale')
      nota(m, f, u, 'fa', `mando «${N}»`, 'fa un segnale')
      return 'fatto'
    }

    case 'aspetta': {
      if (C.tipo === 'attimo') { nota(m, f, u, 'fa', 'aspetto un momento', 'resta fermo'); return 'fatto' }
      let pronto = null, che = ''
      if (C.tipo === 'porta')   { pronto = m.porte[C.id].aperta; che = `che ${N} si apra` }
      else if (MOBILE[C.tipo])  { pronto = !dove(m, u, C); che = `che ${N} sia fuori combattimento` }
      else if (C.tipo === 'segnale') { pronto = m.segnaliMandati.includes(C.id); che = `il segnale «${N}»` }
      else if (C.tipo === 'oggetto') { const g = m.oggetti.find(z => z.nome === C.id)
                                       pronto = !!(g && g.preso); che = `che qualcuno prenda ${N}` }
      else return salta(m, f, u, `${N} non è una cosa che finisce: non c'è niente da aspettare`)
      if (pronto) { nota(m, f, u, 'fa', `finalmente: ${che.replace(/^che /, '')}`, 'si rimette in moto'); return 'fatto' }
      return attende(m, f, u, `aspetto ${che}`, 999)
    }

    case 'avvista': {
      if (!MOBILE[C.tipo]) return salta(m, f, u, `${N} non si avvista: si avvista qualcuno che si muove`)
      const b = m.viva.find(z => z !== u && (z.id === C.id || z.fazione === C.id) && vede(m, u, z))
      if (b) { u.visti[b.id] = { x: b.x, y: b.y }
        nota(m, f, u, 'fa', `eccolo: vedo ${b.nome}`, 'si volta di scatto'); return 'fatto' }
      return attende(m, f, u, `sto di vedetta: non vedo ${N}`, 999)
    }

    default:
      return salta(m, f, u, `«${o.v}»? non so cosa voglia dire`)
  }
}

const celleAccanto = (m, p) => [[p.x, p.y - 1], [p.x + 1, p.y], [p.x, p.y + 1], [p.x - 1, p.y]]
function tappaPiuVicina (m, u, z) {
  const d = mappaDi(m, u)
  let k = 0, best = 1e9
  z.forEach((t, i) => { const q = d[t.y * m.w + t.x]; if (q >= 0 && q < best) { best = q; k = i } })
  return (k + 1) % z.length          // si parte dalla tappa DOPO quella su cui si è
}

/* righe uguali di fila si accorpano: una ronda di trenta tick non deve
   riempire lo schermo di trenta righe identiche */
const registro = (m, quante) => quante ? m.diario.slice(-quante) : m.diario

/* ── far girare tutto: è quello che usa il test ── */
function esegui (mondo, piano, max) {
  avvia(mondo, piano)
  const lim = max || MAX_TICK
  const traccia = []
  while (!mondo.finita && mondo.tick < lim) {
    passo(mondo)
    traccia.push({ tick: mondo.tick,
      unita: mondo.elenco.map(u => ({ id: u.id, x: u.x, y: u.y, viva: u.viva,
        ordine: u.ordineOra ? u.ordineOra.i : null })) })
  }
  if (!mondo.finita) fine(mondo, false, 'La scena non finisce più.')
  return { vinta: mondo.vinta, motivo: mondo.motivo, tick: mondo.tick,
           colpevole: mondo.colpevole, traccia }
}

/* ── piano: quello del giocatore + quello scritto dal livello ────── */
function pianoCompleto (liv, delGiocatore) {
  const p = {}
  /* prima tutto quello che ha scritto il livello — anche dentro la
     fazione del giocatore: un alleato può avere ordini già suoi */
  for (const nome in liv.fazioni)
    for (const id in (liv.fazioni[nome].ordini || {})) p[id] = clona(liv.fazioni[nome].ordini[id])
  for (const id in (delGiocatore || {})) p[id] = clona(delGiocatore[id])
  return p
}
const clona = x => JSON.parse(JSON.stringify(x))

/* le unità di cui il giocatore firma gli ordini: quelle della sua
   fazione che il livello non ha già istruito */
function mieUnita (liv) {
  const out = []
  for (const nome in liv.fazioni) {
    const fz = liv.fazioni[nome]
    if (fz.autore !== 'giocatore') continue
    liv.unita.filter(u => u.fazione === nome && !(fz.ordini || {})[u.id]).forEach(u => out.push(u.id))
  }
  return out
}
/* le unità di cui il giocatore può LEGGERE gli ordini scritti da altri */
function altruiUnita (liv) {
  const out = []
  for (const nome in liv.fazioni)
    for (const id in (liv.fazioni[nome].ordini || {})) out.push(id)
  return out
}
/* IL PAR. Nessun tetto agli ordini: il bambino ne mette quanti vuole.
   Il livello dichiara però in anticipo in quanti si potrebbe fare —
   come il par del golf — e chi ci sta dentro prende la seconda stella.
   Si ricava dalla soluzione dichiarata più corta, così non può mentire. */
const parDi = liv => Math.min.apply(null, liv.soluzioni.map(contaOrdini))
/* su quanti mondi si prova il piano. I primi due livelli sono un
   tutorial: si gioca un mondo solo, così il primo piano che si scrive
   funziona davvero. Dal terzo in poi sono tre, e i piani rigidi
   cominciano a cadere. */
const mondiDi = liv => liv.mondi || 3
function contaOrdini (piano) {
  let n = 0
  for (const id in piano) piano[id].forEach(s => { n += (s.ordini || []).length })
  return n
}

/* 14 ─ IL RAMO, e si fa a segnali.

       cambia da un mondo all'altro. Nessuna fila di ordini, per quanto
       lunga, può indovinarlo: il seguito DIPENDE da cosa si trova.

       che si chiamano per nome. La vedetta guarda e sceglie QUALE
       SEGNALE mandare (ed è lì che serve la guardia `se`); l'eroe ha
       uno script per ciascuno dei due segnali. Ogni script resta una
       lista piatta, e il programma ha due punti d'ingresso.

       Perché non basta la guardia da sola: l'eroe ha la vista corta
       come il naso, l'orco ce l'ha lunga. Chiunque si avvicini
       abbastanza da VEDERE è già stato visto — e chi è stato visto non
       torna indietro. Solo la vedetta, ferma e lontana, può guardare
       senza essere presa: perciò chi decide non è chi cammina, e
       l'informazione deve viaggiare.

       E `vai [al tesoro]` non è una scappatoia: l'orco sta sempre alla
       porta PIÙ VICINA al tesoro, e la strada più corta è quella che
       `vai` sceglie da sé. Andare dritti vuol dire andargli addosso,
       sempre. Bisogna dire da dove passare, e per dirlo bisogna
       saperlo. */

/* IL MODO SCELTA. Scelto il verbo, il bersaglio si tocca sulla mappa:
   si illumina solo quello che quel verbo può prendere davvero, e il
   filtro che era una tendina diventa luminoso. Per i complementi che

const POSATO = { posto:1, oggetto:1, porta:1, unita:1, fazione:1, zona:1, cella:1 }

/* ── suoni ── */
let AC = null

function bip (f, d, tipo, vol) {
  if (!AC) return

  o.type = tipo || 'square'; o.frequency.value = f
  g.gain.setValueAtTime(vol || .05, AC.currentTime)
  g.gain.exponentialRampToValueAtTime(.0008, AC.currentTime + d)
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d)
}
function suoni (ev) {
  if (ev.includes('vinta')) { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>bip(f,.16,'triangle',.07),i*95)); return }
  if (ev.includes('persa')) { bip(200,.2,'sawtooth',.06); setTimeout(()=>bip(140,.28,'sawtooth',.06),150); return }
  if (ev.includes('morte')) bip(150,.22,'sawtooth',.06)
  else if (ev.includes('colpo')) bip(320,.05,'square',.035)
  else if (ev.includes('allarme')) { bip(880,.1,'sine',.06); setTimeout(()=>bip(660,.12,'sine',.06),110) }
  else if (ev.includes('apre')) bip(420,.13,'triangle',.05)
  else if (ev.includes('presa')) bip(760,.09,'triangle',.05)
  else if (ev.includes('passo')) bip(150,.028,'sine',.022)
}

/* ── la mappa si trascina; il tocco resta il tocco (soglia 9px) ── */
function trascina (cv) {
  let giu = null, mosso = 0, vx = 0, vy = 0, ultimo = 0
  cv.style.touchAction = 'none'
  cv.addEventListener('pointerdown', e => {
    giu = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y }; mosso = 0; vx = vy = 0
    cv.setPointerCapture(e.pointerId)
  })
  cv.addEventListener('pointermove', e => {
    if (!giu) return
    const dx = e.clientX - giu.x, dy = e.clientY - giu.y
    mosso = Math.max(mosso, Math.abs(dx) + Math.abs(dy))
    if (mosso < 9) return
    segui = false
    const nx = giu.cx - dx / cam.z, ny = giu.cy - dy / cam.z
    vx = nx - cam.x; vy = ny - cam.y
    cam.x = nx; cam.y = ny; limita(); ultimo = performance.now()
  })
  cv.addEventListener('pointerup', e => {
    if (!giu) return
    if (mosso < 9) tocca(e)
    else if (performance.now() - ultimo < 90) inerzia(vx, vy)
    giu = null
  })
  cv.addEventListener('pointercancel', () => { giu = null })
}
function inerzia (vx, vy) {
  let k = 0
  const passo = () => {
    if (k++ > 14) return
    cam.x += vx * (1 - k / 14) * 1.6; cam.y += vy * (1 - k / 14) * 1.6; limita()
    requestAnimationFrame(passo)
  }
  passo()
}
function tocca (e) {
  const cv = document.getElementById('tela'), r = cv.getBoundingClientRect()
  const x = Math.floor(cam.x + (e.clientX - r.left) / cam.z)
  const y = Math.floor(cam.y + (e.clientY - r.top) / cam.z)
  if (scegliendo) { toccaBersaglio(x, y); return }
  const u = mondo.elenco.find(z => z.viva && z.x === x && z.y === y)
  if (!u) return
  if (piano[u.id]) { unitaOra = u.id; scriptOra = 0; sel = null; letta = null; segui = true
                     mira() }
  else letta = letta === u.id ? null : u.id
  /* toccare qualcuno sul campo apre anche la sua scheda: chi è, cosa
     sa fare e cosa no. Una regola che non si capisce sembra un bug. */
  scheda = u.id; cartello = false; logAperto = false
  pannelli()
}
/* ══ IL MODO SCELTA ══════════════════════════════════════════════
   Si illumina solo quello che il verbo può prendere davvero. Poi si
   conferma: due tocchi invece di uno, e va benissimo — qui non si
   gioca in tempo reale, si scrive un piano. E la conferma DICE IL
   NOME della cosa, che è la stessa parola che poi si legge
   nell'ordine e nel registro. */
function bersagli () {
  if (!scegliendo) return []
  const v = scegliendo.v, out = []
  const agg = (id, x, y) => {
    const C = M.laCosa(liv, id); if (!C) return
    out.push({ id, x, y, nome: C.nome, em: C.em })
  }
  M.complementiPer(liv, v).forEach(k => {
    const C = M.laCosa(liv, k)
    switch (C.tipo) {
      case 'posto': { const p = liv.posti[k]; agg(k, p.x, p.y); break }
      case 'porta': { const p = mondo.porte[k]; agg(k, p.x, p.y); break }
      case 'oggetto': { const o = mondo.oggetti.find(z => z.nome === k)
        if (o && !o.preso) agg(k, o.x, o.y)
        else if (o && o.preso && mondo.unita[o.preso].viva) agg(k, mondo.unita[o.preso].x, mondo.unita[o.preso].y)
        break }
      case 'zona': (liv.zone[k] || []).forEach(t => agg(k, t.x, t.y)); break
      case 'unita': { const u = mondo.unita[k]; if (u && u.viva) agg(k, u.x, u.y); break }
      case 'fazione': mondo.viva.filter(z => z.fazione === k).forEach(z => agg(k, z.x, z.y)); break
    }
  })
  return out
}
const celleLibere = () => M.VERBI[scegliendo.v].prende.includes('cella')
function toccaBersaglio (x, y) {
  const b = bersagli().filter(t => t.x === x && t.y === y)
  if (b.length) { scegliendo.scelta = b[0]; bip(660, .06, 'triangle', .05); pannelli(); return }
  if (celleLibere() && M.libera(mondo, x, y)) {
    const id = x + ',' + y, C = M.laCosa(liv, id)
    scegliendo.scelta = { id, x, y, nome: 'questa posizione', em: '⬚' }
    bip(560, .06, 'triangle', .05); pannelli(); return
  }
  bip(180, .07, 'square', .04)          // lì non c'è niente da scegliere
}
function confermaScelta () {
  const s = scegliendo.scelta; if (!s) return
  const l = piano[unitaOra][scriptOra].ordini
  if (scegliendo.i != null) l[scegliendo.i].c = s.id        // cambia bersaglio: il resto resta
  else { l.push({ v: scegliendo.v, c: s.id }); sel = l.length - 1 }
  scegliendo = null
  bip(720, .07, 'triangle', .05); pannelli()
}
/* i numeri delle caselle: ①②③ nell'ordine in cui compaiono nel piano
   di questa unità, gli stessi sull'ordine e sulla mappa */
const CERCHI = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩']
function numeriCelle () {
  const n = {}; let k = 0
  ;(piano[unitaOra] || []).forEach(sc => (sc.ordini || []).forEach(o => {
    if (CELLA_UI.test(o.c || '') && !n[o.c]) n[o.c] = CERCHI[k++] || '⬚'
  }))
  return n
}
const CELLA_UI = /^\d+,\d+$/
const numeroDi = id => numeriCelle()[id] || '⬚'

/* la barra della conferma, sopra la mappa */
function pannelloScelta () {
  const box = document.getElementById('scelta'); if (!box) return
  if (!scegliendo) { box.className = 'scelta'; box.innerHTML = ''; return }
  box.className = 'scelta aperta'

    ? `<div class="dett">hai scelto <b>${s.em} ${s.nome}</b>${CELLA_UI.test(s.id) ? ` <i>(${s.x},${s.y})</i>` : ''}</div>
       <button class="ok" id="okScelta">✓ ${V.nome} qui</button>
       <button class="no" id="noScelta" aria-label="annulla">✕</button>`
    : `<div class="dett">tocca il bersaglio di <b>${V.et} ${V.nome}</b>${celleLibere() ? ' — anche una casella vuota' : ''}</div>
       <button class="no" id="noScelta" aria-label="annulla">✕</button>`
  const ok = box.querySelector('#okScelta'); if (ok) ok.onclick = confermaScelta
  box.querySelector('#noScelta').onclick = () => {
    if (scegliendo.scelta) scegliendo.scelta = null       // torna a scegliere
    else scegliendo = null                                 // esce dal modo scelta
