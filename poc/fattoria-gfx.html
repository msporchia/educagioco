<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>La fattoria — sprite veri</title>
<!--
  Prototipo della fattoria con gli sprite veri al posto delle emoji.

  Grafica: "Zelda-like tilesets and sprites" di ArMM1998, CC0 1.0
  https://opengameart.org/content/zelda-like-tilesets-and-sprites
  L'atlante qui sotto e' ritagliato da quel set con poc/atlante-gfx.py:
  22 KB di PNG, 58 pezzi, niente file esterni.

  Cosa NON c'e' in quel set, e quindi manca ancora qui: gli animali.
  Nessuno, nemmeno uno. Vedi poc/fattoria.md.
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2a1f;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#f4efe2;user-select:none;touch-action:none}
  #tela{display:block;position:absolute;inset:0}   /* solo la tela del gioco:
     `canvas` da sola prendeva anche le anteprime dentro le carte */

  .barra{position:absolute;top:0;left:0;right:0;height:52px;display:flex;
    align-items:center;gap:8px;padding:0 10px;z-index:5;
    background:linear-gradient(#0d160fdd,#0d160f00);pointer-events:none}
  .barra > *{pointer-events:auto}
  .monete{display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;
    background:#0d160fcc;border:2px solid #3d5c42;border-radius:20px;padding:4px 14px 4px 10px}
  .monete b{font-variant-numeric:tabular-nums}
  .monete.su{animation:sob .35s ease}
  @keyframes sob{50%{transform:scale(1.18)}}
  .tondo{width:40px;height:40px;border-radius:12px;border:2px solid #3d5c42;
    background:#0d160fcc;color:#f4efe2;font-size:19px;display:grid;place-items:center;cursor:pointer}
  .tondo:active{transform:scale(.92)}
  .destra{margin-left:auto;display:flex;gap:8px}

  .scaffale{position:absolute;left:0;right:0;bottom:0;z-index:5;
    background:#12201599;backdrop-filter:blur(6px);border-top:2px solid #3d5c42;
    transform:translateY(calc(100% - 46px));transition:transform .22s ease}
  .scaffale.aperto{transform:none}
  .maniglia{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer}
  .maniglia b{font-size:15px}
  .maniglia .freccia{margin-left:auto;transition:transform .22s ease}
  .scaffale.aperto .maniglia .freccia{transform:rotate(180deg)}
  .schede{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;touch-action:pan-x}
  .scheda{flex:0 0 auto;padding:5px 12px;border-radius:14px;font-size:13px;
    background:#0d160f;border:2px solid #2b4430;cursor:pointer}
  .scheda.viva{background:#3d5c42;border-color:#6f9b6f}
  .roba{display:flex;gap:8px;padding:0 10px 12px;overflow-x:auto;min-height:96px;touch-action:pan-x}
  /* `touch-action:none` sulla carta e non sul contenitore: senza, il
     browser legge il trascinamento come uno scorrimento della lista e
     **annulla il puntatore** a meta' gesto — la roba non si riusciva a
     tirare fuori. Cosi' invece il dito che parte da una carta e' nostro,
     e la lista si scorre lo stesso partendo da uno spazio vuoto. */
  .voce{flex:0 0 auto;width:76px;border-radius:12px;background:#0d160fcc;
    border:2px solid #2b4430;padding:5px 3px 4px;text-align:center;cursor:grab;
    touch-action:none}
  .voce.cara{opacity:.42}
  .voce canvas{display:block;margin:0 auto;image-rendering:pixelated}
  .voce .nome{font-size:10px;line-height:1.15;margin-top:2px;opacity:.85}
  .voce .prezzo{font-size:11px;font-weight:700;color:#ffd98a}
  .voce.tua{border-color:#6f9b6f;background:#1b3220cc}
  .voce .prezzo.tuo{color:#a7dba7}

  .velo{position:absolute;inset:0;z-index:9;display:none;place-items:center;
    background:#05100799;padding:18px}
  .velo.c-e{display:grid}
  .foglio{width:min(340px,92vw);background:#16261a;border:2px solid #3d5c42;
    border-radius:18px;padding:16px 16px 14px;text-align:center;box-shadow:0 18px 40px #0008}
  .foglio h2{margin:0 0 6px;font-size:19px}
  .foglio p{margin:0 0 12px;font-size:14px;line-height:1.4;opacity:.85}
  .foglio .fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .bot{border:none;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;
    background:#3d5c42;color:#f4efe2;cursor:pointer}
  .bot.forte{background:#c9a227;color:#1b2a1f}
  .bot.piano{background:#2b4430}
  .bot:disabled{opacity:.4;cursor:default}
  .griglia{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;
    max-height:44vh;overflow-y:auto;touch-action:pan-y}
  .griglia .voce{cursor:pointer}
  .bisogni{display:grid;gap:7px;margin:2px 0 14px}
  .bisogno{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;font-size:13px}
  /* non si chiama `.barra`: quella e' gia' la barra in cima, e chiamarle
     uguale faceva finire il livello dei bisogni a tutto schermo */
  .livello{height:9px;border-radius:6px;background:#0d160f;border:1px solid #2b4430;overflow:hidden}
  .livello i{display:block;height:100%;border-radius:6px;transition:width .35s ease}
  .bisogno em{font-style:normal;opacity:.6;font-size:11px;min-width:34px;text-align:right}

  #attrezzi{position:absolute;z-index:6;display:none;gap:6px;
    background:#0d160fe6;border:2px solid #6f9b6f;border-radius:14px;padding:5px}
  #attrezzi button{width:38px;height:38px;border:none;border-radius:9px;
    background:#3d5c42;color:#f4efe2;font-size:18px;cursor:pointer}
  #attrezzi button:active{transform:scale(.92)}
  .avviso{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:7;
    background:#0d160fdd;border:2px solid #3d5c42;border-radius:14px;padding:8px 14px;
    font-size:13px;opacity:0;transition:opacity .25s ease;pointer-events:none;max-width:80vw;text-align:center}
  .avviso.c-e{opacity:1}
</style>
</head>
<body>
<canvas id="tela"></canvas>

<div class="barra">
  <div class="monete" id="borsa">🪙 <b id="quante">0</b></div>
  <div class="destra">
    <button class="tondo" id="tCasa" title="torna alla fattoria">🏠</button>
    <button class="tondo" id="tMagazzino" title="la roba">📦</button>
    <button class="tondo" id="tDaCapo" title="ricomincia">↺</button>
  </div>
</div>

<div class="scaffale" id="scaffale">
  <div class="maniglia" id="maniglia"><b>Catalogo</b><span style="opacity:.6;font-size:12px">trascina sul prato</span><span class="freccia">▲</span></div>
  <div class="schede" id="schede"></div>
  <div class="roba" id="roba"></div>
</div>

<div id="attrezzi"></div>
<div class="avviso" id="avviso"></div>
<div class="velo" id="velo"><div class="foglio" id="foglio"></div></div>

const SCALA_MIN = 1, SCALA_MAX = 5;

function misure() { CELLA = T * SCALA; LATO = CELLA * CELLE; MONDO = LATO * PIAZZOLE; }

// Si stringe **attorno a un punto**, non attorno all'angolo in alto a
// sinistra: quello che stavi guardando resta dove lo stavi guardando.
function zoomA(voluta, ancoraX, ancoraY) {
  const nuova = Math.max(SCALA_MIN, Math.min(SCALA_MAX, Math.round(voluta)));
  if (nuova === SCALA) return;
  const prima = { x: (ancoraX + S.vista.x) / CELLA, y: (ancoraY + S.vista.y) / CELLA };
  SCALA = nuova; misure();
  S.vista.x = prima.x * CELLA - ancoraX;
  S.vista.y = prima.y * CELLA - ancoraY;
  limita();
}

function ch(x, y) { return x + ',' + y; }
// numero stabile fra 0 e 1: la stessa cella da sempre lo stesso risultato
function caso(x, y, sale) {
  let n = (x * 73856093) ^ (y * 19349663) ^ (sale * 83492791);
  n = (n ^ (n >>> 13)) * 1274126177; n ^= n >>> 16;
  return ((n >>> 0) % 100000) / 100000;
}

function mondoNuovo() {
  const s = { piazzole: {}, cose: [], ostacoli: {}, magazzino: {},
              monete: 260, prossimo: 1, vista: { x: 0, y: 0 },
              bestie: {}, visto: false };
  for (let px = PRIMA; px <= ULTIMA; px++)
    for (let py = PRIMA; py <= ULTIMA; py++) s.piazzole[ch(px, py)] = 1;

  // il selvatico si riempie di ostacoli, il tuo prato no
  for (let cx = 0; cx < CELLE * PIAZZOLE; cx++)
    for (let cy = 0; cy < CELLE * PIAZZOLE; cy++) {
      const px = (cx / CELLE) | 0, py = (cy / CELLE) | 0;
      if (s.piazzole[ch(px, py)]) continue;
      const r = caso(cx, cy, 1);
      if (r > 0.24) continue;
      const t = TIPI_OSTACOLO[((caso(cx, cy, 2) * 977) | 0) % TIPI_OSTACOLO.length];
      const [pw] = OSTACOLI[t].piede;
      if (cx % pw) continue;                    // niente pezzi grossi a meta'
      let libero = true;
      for (let i = 0; i < pw; i++) if (s.ostacoli[ch(cx + i, cy)]) libero = false;
      if (libero) s.ostacoli[ch(cx, cy)] = t;
    }

  // due cose gia' in mezzo, perche' aprire su un prato vuoto non dice niente
  const c0 = PRIMA * CELLE;
  const metti = (id, dx, dy, g) => s.cose.push(
    { i: s.prossimo++, id, g: g || 0, x: c0 + dx, y: c0 + dy });
  metti('casetta', 7, 4);
  metti('orto', 4, 9);
  metti('staccio', 4, 8);
  metti('staccio', 6, 8);
  metti('staccio', 8, 8);
  metti('staccio', 10, 8, 1);   // la stessa staccionata, in piedi
  metti('fiori0', 11, 6);
  metti('fiori1', 3, 12);
  metti('panchina', 8, 11);
  metti('barile', 10, 4);
  metti('cassa', 11, 4);
  metti('vaso_f', 6, 4);
  metti('albero', 12, 10);
  return s;
}

  } catch (e) { /* un salvataggio rotto non deve impedire di giocare */ }
  S = mondoNuovo();
  vaiACasa();
}

// ---------------------------------------------------------------- il terreno
const mia = (px, py) => !!S.piazzole[ch(px, py)];
function comprabile(px, py) {
  if (px < 0 || py < 0 || px >= PIAZZOLE || py >= PIAZZOLE || mia(px, py)) return false;
  return mia(px - 1, py) || mia(px + 1, py) || mia(px, py - 1) || mia(px, py + 1);
}
const quante = () => Object.keys(S.piazzole).length;
function prezzoPiazzola() {
  const n = quante() - (ULTIMA - PRIMA + 1) ** 2;
  return Math.round(45 * Math.pow(1.38, Math.max(0, n)));
}
const cellaMia = (cx, cy) => mia((cx / CELLE) | 0, (cy / CELLE) | 0);

function ingombro(cosa) {
  const p = piedeDi(cosa, PER_ID[cosa.id]);
  return { x: cosa.x, y: cosa.y, w: p[0], h: p[1] };
}
function libera(cx, cy, w, h, salta) {
  for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) {
    const x = cx + i, y = cy + j;
    if (!cellaMia(x, y)) return false;
    if (S.ostacoli[ch(x, y)]) return false;
  }
  for (const c of S.cose) {
    if (c === salta || !PER_ID[c.id]) continue;
    const g = ingombro(c);
    if (cx < g.x + g.w && cx + w > g.x && cy < g.y + g.h && cy + h > g.y) return false;
  }
  // gli ostacoli larghi occupano anche le celle a destra della loro chiave
  for (const k in S.ostacoli) {
    const [ox, oy] = k.split(',').map(Number);
    const [ow, oh] = OSTACOLI[S.ostacoli[k]].piede;
    if (cx < ox + ow && cx + w > ox && cy < oy + oh && cy + h > oy) return false;
  }
  return true;
}

// ---------------------------------------------------------------- disegnare
function pezzo(nome, sx, sy, alfa) {
  const p = PEZZI[nome]; if (!p) return;
  if (alfa != null) ctx.globalAlpha = alfa;
  ctx.drawImage(atlante, p[0], p[1], p[2], p[3],
    Math.round(sx), Math.round(sy), p[2] * SCALA, p[3] * SCALA);
  if (alfa != null) ctx.globalAlpha = 1;
}
// uno sprite si appoggia col fondo sul fondo del suo piede
function posa(nome, cx, cy, piede, alfa) {
  const p = PEZZI[nome]; if (!p) return;
  const larg = p[2] * SCALA;
  const x = cx * CELLA - S.vista.x + (piede[0] * CELLA - larg) / 2;
  const y = (cy + piede[1]) * CELLA - S.vista.y - p[3] * SCALA;
  pezzo(nome, x, y, alfa);
}

  const c0x = Math.max(0, ((S.vista.x / CELLA) | 0) - 1);
  const c0y = Math.max(0, ((S.vista.y / CELLA) | 0) - 1);
  const c1x = Math.min(CELLE * PIAZZOLE, c0x + (tela.width / DPR / CELLA | 0) + 3);
  const c1y = Math.min(CELLE * PIAZZOLE, c0y + (tela.height / DPR / CELLA | 0) + 3);
  for (let cx = c0x; cx < c1x; cx++)
    for (let cy = c0y; cy < c1y; cy++) {
      const e = ERBE[((caso(cx, cy, 7) * 100) | 0) % ERBE.length];
      pezzo(e, cx * CELLA - S.vista.x, cy * CELLA - S.vista.y);
    }
}

// Il selvatico non e' un terreno diverso: e' lo stesso prato al buio. Il
// confine e' netto e cade sul bordo della piazzola, perche' e' un confine
// vero — di la' e' tuo, di qua no, e la sfumatura mentiva su dove passa.
// Il pezzo che puoi comprare adesso e' meno buio degli altri: e' il modo
// di dire «questo, non tutto il bosco» senza scriverlo.
const N_CELLE = CELLE * PIAZZOLE;
function disegnaNebbia() {
  const w = tela.width / DPR, h = tela.height / DPR;
  for (let px = 0; px < PIAZZOLE; px++)
    for (let py = 0; py < PIAZZOLE; py++) {
      if (mia(px, py)) continue;
      const x = px * LATO - S.vista.x, y = py * LATO - S.vista.y;
      if (x > w || y > h || x + LATO < 0 || y + LATO < 0) continue;
      ctx.fillStyle = comprabile(px, py) ? 'rgba(10,26,18,.34)' : 'rgba(10,26,18,.62)';
      ctx.fillRect(x, y, LATO, LATO);
    }
}

// Quello che compri e' esattamente il riquadro tratteggiato: nessuna
// sorpresa su quanto viene, e gli ostacoli che ci stanno dentro si vedono
// gia' prima di pagare.
function cartelli() {
  const w = tela.width / DPR, h = tela.height / DPR;
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  for (let px = 0; px < PIAZZOLE; px++)
    for (let py = 0; py < PIAZZOLE; py++) {
      if (!comprabile(px, py)) continue;
      const x = px * LATO - S.vista.x, y = py * LATO - S.vista.y;
      if (x > w || y > h || x + LATO < 0 || y + LATO < 0) continue;
      const p = prezzoPiazzola(), posso = S.monete >= p;

      ctx.save();
      ctx.setLineDash([9, 7]);
      ctx.lineDashOffset = -orologio * 14;      // il tratteggio cammina piano
      ctx.lineWidth = 3;
      ctx.strokeStyle = posso ? 'rgba(255,224,138,.95)' : 'rgba(255,255,255,.42)';
      ctx.strokeRect(x + 2, y + 2, LATO - 4, LATO - 4);
      ctx.restore();

      const cx = x + LATO / 2, cy = y + LATO / 2;
      const pc = PEZZI['cartello'];
      posaLibera('cartello', cx - pc[2] * SCALA / 2, cy - pc[3] * SCALA + 14);
      ctx.font = `700 ${9 + SCALA * 3}px system-ui,sans-serif`;
      ctx.fillStyle = posso ? '#3a2a12' : '#7a2a2a';
      ctx.fillText(String(p), cx, cy + 2 + SCALA);
    }
  ctx.textAlign = 'left';
}
function posaLibera(nome, x, y) {
  const p = PEZZI[nome]; if (!p) return;
  ctx.drawImage(atlante, p[0], p[1], p[2], p[3],
    Math.round(x), Math.round(y), p[2] * SCALA, p[3] * SCALA);
}

// ---------------------------------------------------------------- gli attori
// Un attore è chiunque cammini: la bambina, il cane, domani una gallina.
// Sono tutti lo stesso formato — 16×32, quattro fotogrammi per verso, bande
// giù / lato / su — perché è quello che restituiscono i generatori di
// immagini, e perché così questa classe non sa chi sta disegnando. Aggiungere
// una bestia è mettere un png in `poc/attori/` e rilanciare `atlante-gfx.py`:
// qui non si tocca niente.
//
// Le pose di lato guardano a destra. La sinistra è la stessa specchiata, e
// non c'è un verso «sinistra» nell'atlante: c'è nella testa dell'attore.
const attori = [];
let bambina = null;   // quella che segue il dito; gli altri girano da soli

class Attore {
  // x e y stanno in **celle**, non in pixel: così lo zoom non li tocca, e
  // non c'è niente da riscalare quando cambia
  constructor(nome, cx, cy, opz = {}) {
    this.nome = nome;
    this.x = cx + .5;
    this.y = cy + .5;
    this.verso = 'giu';
    this.passo = 0;
    this.meta = null;
    this.velocita = opz.velocita || 3.4;   // celle al secondo
    this.vaga = opz.vaga || 0;             // ogni quanti secondi si sposta da sé
    this.attesa = 1 + Math.random() * 3;
    this.cura = opz.cura || null;          // se ha dei bisogni, si può accudire
    this.chi = opz.chi || nome;
    attori.push(this);
  }

  get cella() { return { x: this.x | 0, y: this.y | 0 }; }

  vaiA(cx, cy) { this.meta = { x: cx + .5, y: cy + .5 }; }

  // il rettangolo che occupa a schermo: serve per sapere se l'hai toccato
  get riquadro() {
    const p = PEZZI[`${this.nome}_giu0`];
    const w = (p ? p[2] : 16) * SCALA, h = (p ? p[3] : 32) * SCALA;
    return { x: this.x * CELLA - S.vista.x - w / 2,
             y: this.y * CELLA - S.vista.y - h + CELLA / 2, w, h };
  }

  muovi(dt) {
    if (this === scelto) { this.meta = null; return; }   // ti sto guardando
    if (!this.meta) {
      if (!this.vaga) return;
      this.attesa -= dt;
      if (this.attesa > 0) return;
      this.attesa = this.vaga * (.6 + Math.random());
      // gira lì attorno, e resta su quello che è tuo: un cane che sparisce
      // nel bosco è un cane che non si trova più
      const c = this.cella;
      for (let prova = 0; prova < 12; prova++) {
        const x = c.x + ((Math.random() * 9) | 0) - 4;
        const y = c.y + ((Math.random() * 9) | 0) - 4;
        if (cellaMia(x, y)) { this.vaiA(x, y); break; }
      }
      return;
    }
    const dx = this.meta.x - this.x, dy = this.meta.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < .1) { this.meta = null; return; }
    const v = this.velocita * dt;
    this.x += dx / d * Math.min(v, d);
    this.y += dy / d * Math.min(v, d);
    this.passo += dt;
    if (Math.abs(dx) > Math.abs(dy)) this.verso = dx > 0 ? 'lato' : 'sinistra';
    else this.verso = dy > 0 ? 'giu' : 'su';
  }

  disegna() {
    const fr = this.meta ? 1 + (((this.passo * 6) | 0) % 3) : 0;
    const specchio = this.verso === 'sinistra';
    const p = PEZZI[`${this.nome}_${specchio ? 'lato' : this.verso}${fr}`];
    if (!p) return;
    const r = this.riquadro;
    const x = Math.round(r.x), y = Math.round(r.y), w = p[2] * SCALA, h = p[3] * SCALA;
    if (specchio) {
      ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1);
      ctx.drawImage(atlante, p[0], p[1], p[2], p[3], 0, 0, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(atlante, p[0], p[1], p[2], p[3], x, y, w, h);
    }
    if (this === scelto) {
      ctx.save();
      ctx.setLineDash([5, 4]); ctx.lineDashOffset = -orologio * 12;
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.strokeRect(x + 1, y + h * .38, w - 2, h * .62 - 1);
      ctx.restore();
      statistiche(this, x + w / 2, y + h * .38, w);
    } else if (this.cura && bisognoUrgente(this)) {
      fumetto(x + w / 2, y - 4);
    }
  }
}

// chi si può accudire ha una nuvoletta quando gli manca qualcosa: è un
// invito, non un rimprovero — non succede niente se la ignori
function fumetto(x, y) {
  const s = 2 + Math.sin(orologio * 4) * 1.2;
  ctx.font = `${Math.round(11 + SCALA * 2)}px system-ui,sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('💭', x, y - s);
  ctx.textAlign = 'left';
}

function attoreSotto(sx, sy) {
  for (let i = attori.length - 1; i >= 0; i--) {
    const r = attori[i].riquadro;
    if (sx >= r.x - 4 && sx <= r.x + r.w + 4 && sy >= r.y && sy <= r.y + r.h + 4)
      return attori[i];
  }
  return null;
}

// ---------------------------------------------------------------- accudire
// Tre bisogni che calano piano, e tre gesti che li riempiono. Calano con le
// **ore vere**, non coi fotogrammi: se il gioco resta chiuso una settimana,
// al ritorno Watson ha fame, e questo e' giusto. Quello che invece non
// succede mai e' che stia male: il fondo e' 0,15, non zero. Questo posto e'
// il premio per gli esercizi fatti altrove — un cane che ti fa sentire in
// colpa se non apri l'app lo trasformerebbe in un altro compito.
const BISOGNI = {
  pancia: { nome: 'Pancia',  icona: '🍖', ore: 14, colore: '#e0a33c' },
  pelo:   { nome: 'Pelo',    icona: '🪮', ore: 30, colore: '#7fb4e0' },
  gioco:  { nome: 'Voglia di giocare', icona: '🎾', ore: 20, colore: '#8fcf6f' },
};
const GESTI = [
  { chiave: 'pancia', tasto: '🍖 Dagli da mangiare', quanto: .45, prezzo: 2 },
  { chiave: 'pelo',   tasto: '🪮 Spazzolalo',        quanto: .5,  prezzo: 0 },
  { chiave: 'gioco',  tasto: '🎾 Gioca con lui',     quanto: .55, prezzo: 0 },
];
const FONDO = .15;

function statoBestia(chiave) {
  if (!S.bestie) S.bestie = {};
  let b = S.bestie[chiave];
  if (!b) b = S.bestie[chiave] = { pancia: .8, pelo: .9, gioco: .7, quando: Date.now() };
  const ore = Math.max(0, (Date.now() - (b.quando || Date.now())) / 3600000);
  if (ore > 0.02) {
    for (const k in BISOGNI)
      b[k] = Math.max(FONDO, Math.min(1, (b[k] ?? .8) - ore / BISOGNI[k].ore));
    b.quando = Date.now();
  }
  return b;
}
function bisognoUrgente(a) {
  const b = statoBestia(a.cura);
  return Object.keys(BISOGNI).some(k => b[k] < .35);
}
const umore = b => Object.keys(BISOGNI).reduce((s, k) => s + b[k], 0) / 3;

function comeSta(b) {
  const u = umore(b);
  if (u > .78) return 'Sta benissimo. Scodinzola appena ti vede.';
  if (u > .55) return 'Sta bene.';
  if (b.pancia < .35) return 'Ha fame. Ti guarda e poi guarda la ciotola.';
  if (b.gioco < .35) return 'Si annoia. Ti ha portato la pallina due volte.';
  if (b.pelo < .35) return 'Ha il pelo tutto arruffato — è un bobtail, succede.';
  return 'Potrebbe stare meglio.';
}

// Watson si accudisce come si sposta una panchina: si tiene premuto, e
// quello che si può fare compare **addosso a lui** — i gesti sotto, le sue
// barrette sopra la testa. Un pannello a schermo intero lo coprirebbe, e la
// cosa che vuoi guardare mentre gli dai da mangiare è lui.
function gesto(a, g) {
  const b = statoBestia(a.cura);
  if (b[g.chiave] > .93) { avvisa(`${a.chi} non ne ha bisogno adesso.`); return; }
  if (g.prezzo && !paga(g.prezzo)) return;
  b[g.chiave] = Math.min(1, b[g.chiave] + g.quanto);
  b.quando = Date.now();
  salva();
  // la bambina lo raggiunge: si accudisce stando lì, non da lontano
  const c = a.cella;
  bambina.vaiA(c.x + 1, c.y);
  if (g.chiave === 'gioco') { a.attesa = .1; a.velocita = 4.6; }
  avvisa(comeSta(b));
}

// le barrette sopra la testa, disegnate nel mondo: seguono la bestia anche
// mentre cammina, che è quello che fa mentre la guardi
function statistiche(a, x, y, larg) {
  const b = statoBestia(a.cura);
  const w = Math.max(46, larg * 1.8), h = 5, passo = h + 3;
  const x0 = Math.round(x - w / 2);
  let y0 = Math.round(y - Object.keys(BISOGNI).length * passo - 8);
  ctx.save();
  ctx.fillStyle = 'rgba(8,20,12,.72)';
  ctx.fillRect(x0 - 4, y0 - 4, w + 8, Object.keys(BISOGNI).length * passo + 6);
  for (const k in BISOGNI) {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(x0, y0, w, h);
    ctx.fillStyle = BISOGNI[k].colore;
    ctx.fillRect(x0, y0, Math.round(w * b[k]), h);
    y0 += passo;
  }
  ctx.restore();
}

let orologio = 0;
function disegna() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, tela.width / DPR, tela.height / DPR);
  disegnaPrato();

  // tutto quello che sta in scena, ordinato per quanto e' avanti
  const scena = [];
  for (const k in S.ostacoli) {
    const [x, y] = k.split(',').map(Number);
    const o = OSTACOLI[S.ostacoli[k]];
    scena.push({ nome: o.pezzo, x, y, piede: o.piede, fondo: y + o.piede[1] });
  }
  for (const c of S.cose) {
    if (preso && preso.da === c) continue;   // e' in mano, non per terra
    const v = PER_ID[c.id]; if (!v) continue;
    let nome = pezzoDi(c, v);
    const piede = piedeDi(c, v);
    if (v.anima) nome = v.anima[((orologio * 4) | 0) % v.anima.length];
    scena.push({ nome, x: c.x, y: c.y, piede, cosa: c,
                 fondo: v.sotto ? -1 : c.y + piede[1] });
  }
  for (const a of attori) scena.push({ attore: a, fondo: a.y + 1 });
  scena.sort((a, b) => a.fondo - b.fondo);

  for (const e of scena) {
    if (e.attore) { e.attore.disegna(); continue; }
    posa(e.nome, e.x, e.y, e.piede);
    if (e.cosa && e.cosa === scelto) schiarisci(e.nome, e.x, e.y, e.piede);
  }

  disegnaAtterraggio();
  disegnaNebbia();
  cartelli();
  disegnaAnello();
}

// Un oggetto selezionato si schiarisce e prende un contorno. Due segnali e
// non uno perche' da soli non bastano: il contorno si perde sull'erba
// chiara, e la schiaritura si perde sugli sprite gia' chiari.
function schiarisci(nome, cx, cy, piede) {
  const p = PEZZI[nome]; if (!p) return;
  const battito = .16 + .12 * (1 + Math.sin(orologio * 5)) / 2;
  const larg = p[2] * SCALA;
  const x = cx * CELLA - S.vista.x + (piede[0] * CELLA - larg) / 2;
  const y = (cy + piede[1]) * CELLA - S.vista.y - p[3] * SCALA;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = battito;
  ctx.drawImage(atlante, p[0], p[1], p[2], p[3],
    Math.round(x), Math.round(y), larg, p[3] * SCALA);
  ctx.restore();
  ctx.save();
  ctx.setLineDash([5, 4]);
  ctx.lineDashOffset = -orologio * 12;
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.strokeRect(cx * CELLA - S.vista.x + 1, cy * CELLA - S.vista.y + 1,
    piede[0] * CELLA - 2, piede[1] * CELLA - 2);
  ctx.restore();
}

// Dove finirebbe se lasci adesso. Il riquadro dice se ci sta, lo sprite in
// trasparenza dice come verrebbe — insieme tolgono la domanda «dove va?».
function disegnaAtterraggio() {
  if (!preso || preso.cx === null) return;
  const { v, da, cx, cy, ok } = preso;
  const piede = piedeDi(da, v);
  const x = cx * CELLA - S.vista.x, y = cy * CELLA - S.vista.y;
  ctx.save();
  ctx.fillStyle = ok ? 'rgba(140,220,120,.28)' : 'rgba(220,110,110,.32)';
  ctx.fillRect(x, y, piede[0] * CELLA, piede[1] * CELLA);
  ctx.lineWidth = 2;
  ctx.strokeStyle = ok ? 'rgba(180,255,160,.9)' : 'rgba(255,150,150,.9)';
  ctx.strokeRect(x + 1, y + 1, piede[0] * CELLA - 2, piede[1] * CELLA - 2);
  ctx.restore();
  posa(pezzoDi(da, v), cx, cy, piede, ok ? .85 : .45);
}

// L'anello che si riempie mentre tieni premuto: finche' non e' pieno non e'
// successo niente, e lasciando adesso non hai mosso nulla.
function disegnaAnello() {
  if (!anello) return;
  const q = Math.min(1, (performance.now() - anello.t0) / ATTESA);
  const r = 20;
  ctx.save();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.arc(anello.x, anello.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,224,138,.95)';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(anello.x, anello.y, r, -Math.PI / 2, -Math.PI / 2 + q * Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------- la vista
function limita() {
  const w = tela.width / DPR, h = tela.height / DPR;
  // se il mondo ci sta tutto — e succede appena si allarga lo zoom — non si
  // incolla in alto a sinistra lasciando il nero sotto: si mette in mezzo
  S.vista.x = Math.round(MONDO <= w ? (MONDO - w) / 2
    : Math.max(0, Math.min(S.vista.x, MONDO - w)));
  S.vista.y = Math.round(MONDO <= h ? (MONDO - h) / 2
    : Math.max(0, Math.min(S.vista.y, MONDO - h)));
}
function vaiACasa() {
  const c = ((PRIMA + ULTIMA + 1) / 2) * LATO;
  S.vista.x = c - tela.width / DPR / 2;
  S.vista.y = c - tela.height / DPR / 2;
  limita();
}
const cellaDa = (sx, sy) => ({
  x: ((sx + S.vista.x) / CELLA) | 0, y: ((sy + S.vista.y) / CELLA) | 0 });

function ostacoloSotto(cx, cy) {
  for (const k in S.ostacoli) {
    const [ox, oy] = k.split(',').map(Number);
    const [ow, oh] = OSTACOLI[S.ostacoli[k]].piede;
    if (cx >= ox && cx < ox + ow && cy >= oy && cy < oy + oh)
      return { k, x: ox, y: oy, t: S.ostacoli[k] };
  }
  return null;
}
function cosaSotto(cx, cy) {
  for (let i = S.cose.length - 1; i >= 0; i--) {
    const g = ingombro(S.cose[i]);
    if (cx >= g.x && cx < g.x + g.w && cy >= g.y && cy < g.y + g.h) return S.cose[i];
  }
  return null;
}

// ---------------------------------------------------------------- monete
const borsa = document.getElementById('borsa');
const quanteEl = document.getElementById('quante');
function aggiornaBorsa(sobbalza) {
  quanteEl.textContent = S.monete;
  if (sobbalza) { borsa.classList.remove('su'); void borsa.offsetWidth; borsa.classList.add('su'); }
  riempiScaffale();
}
function paga(n) {
  if (S.monete < n) { avvisa('Ti servono ' + (n - S.monete) + ' monete in più — si guadagnano giocando.'); return false; }
  S.monete -= n; aggiornaBorsa(true); salva(); return true;
}
function incassa(n) { S.monete += n; aggiornaBorsa(true); salva(); }

const avvisoEl = document.getElementById('avviso');
let avvisoFra = 0;
function avvisa(testo) {
  avvisoEl.textContent = testo;
  avvisoEl.classList.add('c-e');
  avvisoFra = 2.6;
}

// ---------------------------------------------------------------- lo scaffale
const scaffale = document.getElementById('scaffale');
const schedeEl = document.getElementById('schede');
const robaEl = document.getElementById('roba');
let categoria = CATEGORIE[0].chiave;

document.getElementById('maniglia').addEventListener('click',
  () => scaffale.classList.toggle('aperto'));

function provino(nome, lato) {
  const p = PEZZI[nome];
  const c = document.createElement('canvas');
  const z = Math.max(1, Math.min(3, Math.floor(lato / Math.max(p[2], p[3]))));
  c.width = p[2] * z; c.height = p[3] * z;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(atlante, p[0], p[1], p[2], p[3], 0, 0, c.width, c.height);
  return c;
}

// Quanti ne hai da parte. Uno che ce l'hai non si ricompra: si tira fuori.
const quantiNe = id => S.magazzino[id] || 0;

// Una carta sola per tutti e due i posti, lo scaffale e il magazzino: dice
// «ne hai 3» oppure «costa 8», mai tutte e due le cose insieme, perche' sono
// due situazioni diverse e non due meta' della stessa.
function cartaVoce(v) {
  const ne = quantiNe(v.id);
  const d = document.createElement('div');
  d.className = 'voce' + (!ne && v.prezzo > S.monete ? ' cara' : '') + (ne ? ' tua' : '');
  d.dataset.id = v.id;
  d.appendChild(provino(v.pezzo, 42));
  const n = document.createElement('div'); n.className = 'nome'; n.textContent = v.nome;
  const p = document.createElement('div');
  p.className = 'prezzo' + (ne ? ' tuo' : '');
  p.textContent = ne ? '×' + ne : '🪙' + v.prezzo;
  d.append(n, p);
  return d;
}

function riempiScaffale() {
  if (!atlante.complete) return;
  schedeEl.innerHTML = '';
  for (const c of CATEGORIE) {
    const b = document.createElement('div');
    b.className = 'scheda' + (c.chiave === categoria ? ' viva' : '');
    b.textContent = c.nome;
    b.addEventListener('click', () => { categoria = c.chiave; riempiScaffale(); });
    schedeEl.appendChild(b);
  }
  robaEl.innerHTML = '';
  const cat = CATEGORIE.find(c => c.chiave === categoria);
  for (const v of cat.voci) robaEl.appendChild(cartaVoce(v));
}

// ---------------------------------------------------------------- prendere
// Tre momenti distinti, e ognuno si vede:
//   1. PREMI  — un anello si riempie sotto il dito. Dice «sto per prenderlo»,
//      e finché non è pieno non è successo niente: si può lasciare e via.
//   2. PRESO  — l'anello si chiude, l'oggetto si schiarisce e prende un
//      contorno. Da qui è selezionato: si può tirare, o girare, o mettere via.
//   3. TIRI   — l'oggetto non segue il dito a caso: **salta di cella in
//      cella**, e sotto gli si accende il riquadro di dove finirà, verde se
//      ci sta e rosso se no. Il punto non è farlo carino: è che a posare
//      alla cieca si sbaglia, e sbagliare qui costa una moneta.
const ATTESA = 420;                 // ms di pressione per prenderlo

let preso = null;      // { v, da, cx, cy, ok } quello che si sta tirando
let scelto = null;     // la cosa selezionata, che resta tale anche da ferma
let giu = null;        // il dito premuto
let lungo = null;      // il timer dell'anello
let anello = null;     // { x, y, t0 } l'anello che si riempie
let scorrendo = false;

const larghezzaDi = v => PEZZI[v.pezzo] ? PEZZI[v.pezzo][2] : 16;

function prendi(v, da) {
  preso = { v, da, cx: null, cy: null, ok: false };
  scelto = da || null;
  scaffale.classList.remove('aperto');
}

// dove finirebbe: la cella sotto il dito, con il piede centrato sopra
function muoviPreso(sx, sy) {
  if (!preso) return;
  const { v, da } = preso;
  const piede = piedeDi(da, v);
  const c = cellaDa(sx, sy);
  preso.cx = c.x - ((piede[0] - 1) / 2 | 0);
  preso.cy = c.y;
  preso.ok = libera(preso.cx, preso.cy, piede[0], piede[1], da);
}

function posaPreso() {
  if (!preso) return;
  const { v, da, cx, cy, ok } = preso;
  preso = null;
  if (cx === null) return;
  if (!ok) { avvisa('Lì non ci sta.'); return; }
  if (da) {
    if (da.x === cx && da.y === cy) return;      // rimettere dov'era e' gratis
    if (!paga(1)) return;
    da.x = cx; da.y = cy;
  } else {
    const inMagazzino = (S.magazzino[v.id] || 0) > 0;
    if (inMagazzino) { S.magazzino[v.id]--; if (!S.magazzino[v.id]) delete S.magazzino[v.id]; }
    else if (!paga(v.prezzo)) return;
    const nuova = { i: S.prossimo++, id: v.id, x: cx, y: cy };
    S.cose.push(nuova);
    scelto = nuova;
  }
  salva();
}

// ---------------------------------------------------------------- girare
// «Girare» non è ruotare dei pixel: la pixel art ruotata si sfarina. È
// **cambiare tessera**, e si può solo dove il set ce l'ha davvero — una
// staccionata orizzontale e la stessa in piedi. Dove non c'è, il tasto non
// compare: meglio niente che un tasto che fa una cosa storta.
// Tutte reggono una voce sconosciuta senza esplodere: un salvataggio di
// ieri può contenere un id che oggi non c'è più — è successo alla prima
// prova, con il `palo` diventato una staccionata girata.
const versoDi = c => (c && c.g) || 0;
function giriDi(v) { return (v && v.giri) || null; }
function piedeDi(cosa, v) {
  if (!v) return [1, 1];
  const g = giriDi(v);
  return g ? g[versoDi(cosa) % g.length].piede : v.piede;
}
function pezzoDi(cosa, v) {
  if (!v) return null;
  const g = giriDi(v);
  return g ? g[versoDi(cosa) % g.length].pezzo : v.pezzo;
}

function gira(cosa) {
  const v = PER_ID[cosa.id], g = giriDi(v);
  if (!g) return;
  const dopo = (versoDi(cosa) + 1) % g.length;
  const p = g[dopo].piede;
  const prima = cosa.g;
  cosa.g = dopo;
  if (!libera(cosa.x, cosa.y, p[0], p[1], cosa)) {
    cosa.g = prima;
    avvisa('Girato non ci sta: fagli spazio.');
    return;
  }
  salva();
}

// ---------------------------------------------------------------- i pannelli
const chiudi = () => velo.classList.remove('c-e');
function apri(html) { foglio.innerHTML = html; velo.classList.add('c-e'); }
function tasto(sel, fn) { const b = foglio.querySelector(sel); if (b) b.addEventListener('click', fn); }
velo.addEventListener('click', e => { if (e.target === velo) chiudi(); });

function pannelloPiazzola(px, py) {
  const p = prezzoPiazzola();
  apri(`<h2>Un altro pezzo di terra</h2>
    <p>Costa <b>🪙${p}</b>. Ogni pezzo dopo costa un po' di più.</p>
    <div class="fila">
      <button class="bot piano" data-no>Lascia stare</button>
      <button class="bot forte" data-si ${S.monete < p ? 'disabled' : ''}>Compra</button>
    </div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-si]', () => {
    if (!paga(p)) return;
    S.piazzole[ch(px, py)] = 1; chiudi(); salva();
  });
}

function pannelloOstacolo(o) {
  const d = OSTACOLI[o.t];
  apri(`<h2>${d.nome}</h2>
    <p>Sgombrarlo costa <b>🪙${d.costo}</b>, e quello che ne ricavi vale
       <b>🪙${d.resa}</b>. Conviene: è così che si finanzia la fattoria.</p>
    <div class="fila">
      <button class="bot piano" data-no>Lascia stare</button>
      <button class="bot forte" data-si ${S.monete < d.costo ? 'disabled' : ''}>Sgombra</button>
    </div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-si]', () => {
    if (!paga(d.costo)) return;
    delete S.ostacoli[o.k];
    incassa(d.resa); chiudi(); salva();
  });
}

// Gli attrezzi della cosa selezionata: stanno **appesi all'oggetto**, non in
// un pannello che copre lo schermo. Girare una staccionata vuol dire vederla
// girare, e con un pannello davanti non la vedi.
const attrezziEl = document.getElementById('attrezzi');
let scelPrec = null;

function aggiornaAttrezzi() {
  if (!scelto || preso) {
    if (attrezziEl.style.display !== 'none') attrezziEl.style.display = 'none';
    if (!scelto) scelPrec = null;
    return;
  }
  const bestia = scelto instanceof Attore;
  if (scelto !== scelPrec) {
    scelPrec = scelto;
    if (bestia) {
      attrezziEl.innerHTML = GESTI.map(g =>
        `<button data-g="${g.chiave}" title="${g.tasto}">${g.tasto.split(' ')[0]}</button>`
      ).join('') + '<button data-fine title="ho finito">✓</button>';
      for (const g of GESTI)
        attrezziEl.querySelector(`[data-g="${g.chiave}"]`)
          .addEventListener('click', () => gesto(scelto, g));
    } else {
      const v = PER_ID[scelto.id];
      attrezziEl.innerHTML =
        (giriDi(v) ? '<button data-gira title="giralo">↻</button>' : '') +
        '<button data-via title="mettilo via">📦</button>' +
        '<button data-fine title="ho finito">✓</button>';
      attrezziEl.querySelector('[data-gira]')?.addEventListener('click',
        () => gira(scelto));
      attrezziEl.querySelector('[data-via]').addEventListener('click', () => {
        S.cose = S.cose.filter(c => c !== scelto);
        S.magazzino[scelto.id] = (S.magazzino[scelto.id] || 0) + 1;
        scelto = null; salva();
      });
    }
    attrezziEl.querySelector('[data-fine]').addEventListener('click',
      () => { scelto = null; });
    attrezziEl.style.display = 'flex';
  }
  // seguono quello che è selezionato: se si muove, si muovono
  let x, y;
  if (bestia) {
    const r = scelto.riquadro;
    x = r.x + r.w / 2; y = r.y + r.h;
  } else {
    const piede = piedeDi(scelto, PER_ID[scelto.id]);
    x = (scelto.x + piede[0] / 2) * CELLA - S.vista.x;
    y = scelto.y * CELLA - S.vista.y;
  }
  const w = attrezziEl.offsetWidth || 120;
  attrezziEl.style.left =
    Math.round(Math.max(8, Math.min(innerWidth - w - 8, x - w / 2))) + 'px';
  attrezziEl.style.top = Math.round(bestia
    ? Math.min(innerHeight - 110, y + 6)
    : Math.max(58, y - 58 - CELLA)) + 'px';
}

// Il magazzino non e' l'elenco di quello che possiedi: e' l'elenco di tutto,
// con sopra scritto quanti ne hai. Cosi' e' un posto solo — quello che c'e'
// da avere, e a che punto sei — invece di un negozio da una parte e una
// cassapanca dall'altra, che sono la stessa domanda fatta due volte.
// Toccare compra, tenere premuto e tirare piazza: sono due gesti, e il
// secondo non passa dal primo.
function pannelloMagazzino() {
  const avuti = CATALOGO.filter(v => quantiNe(v.id)).length;
  apri(`<h2>La roba</h2>
    <p>Tocca per <b>comprarne uno</b>. Quello che hai resta tuo:
       <b>tienilo premuto e tira</b> per metterlo giù dove vuoi.
       ${avuti ? `Ne hai da parte di ${avuti} tipi.` : 'Per ora non hai niente da parte.'}</p>
    <div class="schede" id="cat"></div>
    <div class="griglia" id="gri"></div>
    <div class="fila"><button class="bot" data-no>Chiudi</button></div>`);
  const cat = foglio.querySelector('#cat');
  const gri = foglio.querySelector('#gri');

  const riempi = () => {
    cat.innerHTML = '';
    for (const c of CATEGORIE) {
      const b = document.createElement('div');
      b.className = 'scheda' + (c.chiave === categoria ? ' viva' : '');
      b.textContent = c.nome;
      b.addEventListener('click', () => { categoria = c.chiave; riempi(); });
      cat.appendChild(b);
    }
    gri.innerHTML = '';
    for (const v of CATEGORIE.find(c => c.chiave === categoria).voci)
      gri.appendChild(cartaVoce(v));
  };
  riempi();

  // un dito solo per due gesti: se si sposta, sta tirando fuori la cosa;
  // se non si sposta, sta comprando
  let dito = null;
  gri.addEventListener('pointerdown', e => {
    const carta = e.target.closest('.voce'); if (!carta) return;
    dito = { id: carta.dataset.id, x: e.clientX, y: e.clientY, tirato: false };
  });
  gri.addEventListener('pointermove', e => {
    if (!dito || dito.tirato) return;
    if (Math.abs(e.clientX - dito.x) + Math.abs(e.clientY - dito.y) < 12) return;
    const v = PER_ID[dito.id];
    if (!quantiNe(v.id) && v.prezzo > S.monete) {
      avvisa('Costa 🪙' + v.prezzo + ' — te ne mancano ' + (v.prezzo - S.monete) + '.');
      dito = null; return;
    }
    dito.tirato = true;
    chiudi();
    prendi(v, null);
    muoviPreso(e.clientX, e.clientY);
  });
  gri.addEventListener('pointerup', e => {
    if (!dito || dito.tirato) { dito = null; return; }
    const v = PER_ID[dito.id]; dito = null;
    if (!paga(v.prezzo)) return;
    S.magazzino[v.id] = quantiNe(v.id) + 1;
    salva(); riempi();
  });

  tasto('[data-no]', chiudi);
}

// ---------------------------------------------------------------- il dito
// Un solo registro di dita: con uno si scorre, con due si stringe. Tenerli
// in una mappa invece che in due variabili e' l'unico modo perche' alzare
// un dito solo non mandi tutto in bambola.
const dita = new Map();
let pizzico = null;

function pos(e) { return { x: e.clientX, y: e.clientY }; }

function centro() {
  const v = [...dita.values()];
  return { x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2,
           d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) };
}

tela.addEventListener('pointerdown', e => {
  dita.set(e.pointerId, pos(e));
  if (dita.size === 2) {
    // due dita: si smette di fare qualunque altra cosa si stesse facendo
    if (lungo) { clearTimeout(lungo); lungo = null; }
    giu = null; scorrendo = false;
    const c = centro();
    pizzico = { d0: c.d, scala0: SCALA };
    return;
  }
  if (dita.size > 2) return;

  const p = pos(e);
  giu = { x: p.x, y: p.y, x0: p.x, y0: p.y, t: performance.now(), mosso: false };
  scorrendo = false;
  const bestia = attoreSotto(p.x, p.y);
  if (bestia && bestia.cura) {
    if (bestia === scelto) return;
    anello = { x: p.x, y: p.y, t0: performance.now() };
    lungo = setTimeout(() => { lungo = null; anello = null; scelto = bestia; }, ATTESA);
    return;
  }

  const c = cellaDa(p.x, p.y);
  const cosa = cosaSotto(c.x, c.y);
  if (!cosa || !cellaMia(c.x, c.y)) return;

  if (cosa === scelto) {
    // già selezionato: non si aspetta due volte, si tira e basta
    prendi(PER_ID[cosa.id], cosa);
    muoviPreso(p.x, p.y);
    return;
  }
  anello = { x: p.x, y: p.y, t0: performance.now() };
  lungo = setTimeout(() => {
    lungo = null; anello = null;
    prendi(PER_ID[cosa.id], cosa);
    muoviPreso(giu ? giu.x : p.x, giu ? giu.y : p.y);
  }, ATTESA);
});

addEventListener('pointermove', e => {
  if (dita.has(e.pointerId)) dita.set(e.pointerId, pos(e));

  if (pizzico && dita.size >= 2) {
    const c = centro();
    if (c.d > 24) zoomA(pizzico.scala0 * (c.d / pizzico.d0), c.x, c.y);
    return;
  }
  const p = pos(e);
  if (preso) { muoviPreso(p.x, p.y); return; }
  if (!giu) return;
  const dx = p.x - giu.x, dy = p.y - giu.y;
  if (Math.abs(p.x - giu.x0) + Math.abs(p.y - giu.y0) > 10) {
    giu.mosso = true; scorrendo = true;
    if (lungo) { clearTimeout(lungo); lungo = null; anello = null; }
  }
  if (anello) { anello.x = p.x; anello.y = p.y; }
  if (scorrendo) { S.vista.x -= Math.round(dx); S.vista.y -= Math.round(dy); limita(); }
  giu.x = p.x; giu.y = p.y;
});

function finita(e) {
  dita.delete(e.pointerId);
  if (dita.size < 2) pizzico = null;
}

addEventListener('pointercancel', e => {
  finita(e);
  if (lungo) { clearTimeout(lungo); lungo = null; }
  anello = null; preso = null; giu = null;
});

addEventListener('pointerup', e => {
  const eraPizzico = !!pizzico;
  finita(e);
  if (lungo) { clearTimeout(lungo); lungo = null; }
  anello = null;
  const p = pos(e);
  if (preso) { posaPreso(); giu = null; return; }
  if (eraPizzico || !giu) { giu = null; return; }
  const fermo = !giu.mosso;
  giu = null;
  if (!fermo) return;

  const bestia = attoreSotto(p.x, p.y);
  if (bestia && bestia.cura) { scelto = bestia; return; }
  const c = cellaDa(p.x, p.y);
  const cosa = cosaSotto(c.x, c.y);
  if (scelto && cosa !== scelto) scelto = null;   // premi altrove e torna com'era
  if (cosa) return;                               // un tocco secco non seleziona:
                                                  // per prenderlo si tiene premuto
  const px = (c.x / CELLE) | 0, py = (c.y / CELLE) | 0;
  if (comprabile(px, py)) { pannelloPiazzola(px, py); return; }
  const o = ostacoloSotto(c.x, c.y);
  if (o) { pannelloOstacolo(o); return; }
  if (cellaMia(c.x, c.y)) bambina.vaiA(c.x, c.y);
});

// Col mouse non si pizzica: la rotella fa lo stesso mestiere, ma a **passi
// interi**. Moltiplicare per 1,18 non funzionerebbe: 2 x 1,18 arrotondato fa
// ancora 2, e la rotella non muoverebbe mai niente. Il pizzico invece puo'
// moltiplicare, perche' parte sempre dalla scala di quando l'hai iniziato.
tela.addEventListener('wheel', e => {
  e.preventDefault();
  zoomA(SCALA + (e.deltaY < 0 ? 1 : -1), e.clientX, e.clientY);
}, { passive: false });

// trascinare dallo scaffale
robaEl.addEventListener('pointerdown', e => {
  const carta = e.target.closest('.voce'); if (!carta) return;
  const v = PER_ID[carta.dataset.id]; if (!v) return;
  if (v.prezzo > S.monete && !(S.magazzino[v.id] > 0)) {
    avvisa('Costa 🪙' + v.prezzo + ' — te ne mancano ' + (v.prezzo - S.monete) + '.');
    return;
  }
  e.preventDefault();
  scelto = null;
  prendi(v, null);
  muoviPreso(e.clientX, e.clientY);
});

// ---------------------------------------------------------------- i tasti
document.getElementById('tCasa').addEventListener('click', vaiACasa);
document.getElementById('tMagazzino').addEventListener('click', pannelloMagazzino);
document.getElementById('tDaCapo').addEventListener('click', () => {
  apri(`<h2>Ricominciare?</h2><p>La fattoria torna com'era il primo giorno.</p>
    <div class="fila"><button class="bot piano" data-no>No</button>
    <button class="bot forte" data-si>Sì, da capo</button></div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-si]', () => {
    localStorage.removeItem(CHIAVE); S = mondoNuovo(); vaiACasa();
    aggiornaBorsa(); chiudi(); salva();
  });
});

// il trucco delle monete, come negli altri prototipi
if (location.hash.startsWith('#monete=')) {
  const n = parseInt(location.hash.slice(8), 10);
  if (n > 0) setTimeout(() => { S.monete = n; aggiornaBorsa(true); salva(); }, 60);
}

// ---------------------------------------------------------------- il giro
function ridimensiona() {
  tela.width = innerWidth * DPR; tela.height = innerHeight * DPR;
  tela.style.width = innerWidth + 'px'; tela.style.height = innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S) limita();
}
addEventListener('resize', ridimensiona);

let ultimo = 0;
function giro(ora) {
  const dt = Math.min(0.05, (ora - ultimo) / 1000 || 0);
  ultimo = ora; orologio += dt;
  for (const a of attori) a.muovi(dt);
  if (avvisoFra > 0) { avvisoFra -= dt; if (avvisoFra <= 0) avvisoEl.classList.remove('c-e'); }
  if (salvaFra > 0) { salvaFra -= dt; if (salvaFra <= 0) salvaOra(); }
  disegna();
  aggiornaAttrezzi();
  requestAnimationFrame(giro);
}

atlante.onload = () => {
  ridimensiona();
  carica();
  if (!S.vista || (!S.vista.x && !S.vista.y)) vaiACasa();
  limita();
  const c0 = PRIMA * CELLE;
  bambina = new Attore('bambina', c0 + 7, c0 + 9, { velocita: 3.6 });
  new Attore('bobtail', c0 + 9, c0 + 10,
    { velocita: 2.4, vaga: 2.4, cura: 'bobtail', chi: 'Watson' });
  aggiornaBorsa();
  riempiScaffale();
  requestAnimationFrame(giro);
  setTimeout(() => avvisa('Tieni premuto su una cosa per prenderla. Due dita per lo zoom, e Watson si accudisce.'), 500);
};
atlante.src = ATLANTE;
addEventListener('beforeunload', salvaOra);
</script>
