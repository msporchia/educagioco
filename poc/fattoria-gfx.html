<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>La fattoria — sprite veri</title>
<!--
  Prototipo della fattoria con gli sprite veri al posto delle emoji.

  Grafica: "Zelda-like tilesets and sprites" di ArMM1998, CC0 1.0
  https://opengameart.org/content/zelda-like-tilesets-and-sprites
  L'atlante qui sotto e' ritagliato da quel set con poc/atlante-gfx.py:
  22 KB di PNG, 58 pezzi, niente file esterni.

  Cosa NON c'e' in quel set, e quindi manca ancora qui: gli animali.
  Nessuno, nemmeno uno. Vedi poc/fattoria.md.
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2a1f;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#f4efe2;user-select:none;touch-action:none}
  #tela{display:block;position:absolute;inset:0}   /* solo la tela del gioco:
     `canvas` da sola prendeva anche le anteprime dentro le carte */

  .barra{position:absolute;top:0;left:0;right:0;height:52px;display:flex;
    align-items:center;gap:8px;padding:0 10px;z-index:5;
    background:linear-gradient(#0d160fdd,#0d160f00);pointer-events:none}
  .barra > *{pointer-events:auto}
  .monete{display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;
    background:#0d160fcc;border:2px solid #3d5c42;border-radius:20px;padding:4px 14px 4px 10px}
  .monete b{font-variant-numeric:tabular-nums}
  .monete.su{animation:sob .35s ease}
  @keyframes sob{50%{transform:scale(1.18)}}
  .tondo{width:40px;height:40px;border-radius:12px;border:2px solid #3d5c42;
    background:#0d160fcc;color:#f4efe2;font-size:19px;display:grid;place-items:center;cursor:pointer}
  .tondo:active{transform:scale(.92)}
  .destra{margin-left:auto;display:flex;gap:8px}

  .scaffale{position:absolute;left:0;right:0;bottom:0;z-index:5;
    background:#12201599;backdrop-filter:blur(6px);border-top:2px solid #3d5c42;
    transform:translateY(calc(100% - 46px));transition:transform .22s ease}
  .scaffale.aperto{transform:none}
  .maniglia{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer}
  .maniglia b{font-size:15px}
  .maniglia .freccia{margin-left:auto;transition:transform .22s ease}
  .scaffale.aperto .maniglia .freccia{transform:rotate(180deg)}
  .schede{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto}
  .scheda{flex:0 0 auto;padding:5px 12px;border-radius:14px;font-size:13px;
    background:#0d160f;border:2px solid #2b4430;cursor:pointer}
  .scheda.viva{background:#3d5c42;border-color:#6f9b6f}
  .roba{display:flex;gap:8px;padding:0 10px 12px;overflow-x:auto;min-height:96px}
  .voce{flex:0 0 auto;width:76px;border-radius:12px;background:#0d160fcc;
    border:2px solid #2b4430;padding:5px 3px 4px;text-align:center;cursor:grab}
  .voce.cara{opacity:.42}
  .voce canvas{display:block;margin:0 auto;image-rendering:pixelated}
  .voce .nome{font-size:10px;line-height:1.15;margin-top:2px;opacity:.85}
  .voce .prezzo{font-size:11px;font-weight:700;color:#ffd98a}
  .voce.tua{border-color:#6f9b6f;background:#1b3220cc}
  .voce .prezzo.tuo{color:#a7dba7}

  .velo{position:absolute;inset:0;z-index:9;display:none;place-items:center;
    background:#05100799;padding:18px}
  .velo.c-e{display:grid}
  .foglio{width:min(340px,92vw);background:#16261a;border:2px solid #3d5c42;
    border-radius:18px;padding:16px 16px 14px;text-align:center;box-shadow:0 18px 40px #0008}
  .foglio h2{margin:0 0 6px;font-size:19px}
  .foglio p{margin:0 0 12px;font-size:14px;line-height:1.4;opacity:.85}
  .foglio .fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .bot{border:none;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;
    background:#3d5c42;color:#f4efe2;cursor:pointer}
  .bot.forte{background:#c9a227;color:#1b2a1f}
  .bot.piano{background:#2b4430}
  .bot:disabled{opacity:.4;cursor:default}
  .griglia{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;
    max-height:44vh;overflow-y:auto}
  .griglia .voce{cursor:pointer}

  #fantasma{position:absolute;z-index:8;pointer-events:none;display:none;
    image-rendering:pixelated;filter:drop-shadow(0 3px 3px #0006)}
  .avviso{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:7;
    background:#0d160fdd;border:2px solid #3d5c42;border-radius:14px;padding:8px 14px;
    font-size:13px;opacity:0;transition:opacity .25s ease;pointer-events:none;max-width:80vw;text-align:center}
  .avviso.c-e{opacity:1}
</style>
</head>
<body>
<canvas id="tela"></canvas>

<div class="barra">
  <div class="monete" id="borsa">🪙 <b id="quante">0</b></div>
  <div class="destra">
    <button class="tondo" id="tCasa" title="torna alla fattoria">🏠</button>
    <button class="tondo" id="tMagazzino" title="la roba">📦</button>
    <button class="tondo" id="tDaCapo" title="ricomincia">↺</button>
  </div>
</div>

<div class="scaffale" id="scaffale">
  <div class="maniglia" id="maniglia"><b>Catalogo</b><span style="opacity:.6;font-size:12px">trascina sul prato</span><span class="freccia">▲</span></div>
  <div class="schede" id="schede"></div>
  <div class="roba" id="roba"></div>
</div>

<img id="fantasma">
<div class="avviso" id="avviso"></div>
<div class="velo" id="velo"><div class="foglio" id="foglio"></div></div>

  for (let cx = 0; cx < CELLE * PIAZZOLE; cx++)
    for (let cy = 0; cy < CELLE * PIAZZOLE; cy++) {
      const px = (cx / CELLE) | 0, py = (cy / CELLE) | 0;
      if (s.piazzole[ch(px, py)]) continue;
      const r = caso(cx, cy, 1);
      if (r > 0.24) continue;
      const t = TIPI_OSTACOLO[((caso(cx, cy, 2) * 977) | 0) % TIPI_OSTACOLO.length];
      const [pw] = OSTACOLI[t].piede;
      if (cx % pw) continue;                    // niente pezzi grossi a meta'
      let libero = true;
      for (let i = 0; i < pw; i++) if (s.ostacoli[ch(cx + i, cy)]) libero = false;
      if (libero) s.ostacoli[ch(cx, cy)] = t;
    }

  // due cose gia' in mezzo, perche' aprire su un prato vuoto non dice niente
  const c0 = PRIMA * CELLE;
  const metti = (id, dx, dy) => s.cose.push(
    { i: s.prossimo++, id, x: c0 + dx, y: c0 + dy });
  metti('casetta', 7, 4);
  metti('orto', 4, 9);
  metti('staccio', 4, 8);
  metti('staccio', 6, 8);
  metti('staccio', 8, 8);
  metti('palo', 10, 8);
  metti('fiori0', 11, 6);
  metti('fiori1', 3, 12);
  metti('panchina', 8, 11);
  metti('barile', 10, 4);
  metti('cassa', 11, 4);
  metti('vaso_f', 6, 4);
  metti('albero', 12, 10);
  return s;
}

function carica() {
  try {
    const g = JSON.parse(localStorage.getItem(CHIAVE));
    if (g && g.piazzole) { S = g; S.cose = S.cose || []; return; }
  } catch (e) { /* un salvataggio rotto non deve impedire di giocare */ }
  S = mondoNuovo();
  vaiACasa();
}
function salva() { salvaFra = 1.2; }
function salvaOra() {
  salvaFra = 0;
  try { localStorage.setItem(CHIAVE, JSON.stringify(S)); } catch (e) {}
}

// ---------------------------------------------------------------- il terreno
const mia = (px, py) => !!S.piazzole[ch(px, py)];
function comprabile(px, py) {
  if (px < 0 || py < 0 || px >= PIAZZOLE || py >= PIAZZOLE || mia(px, py)) return false;
  return mia(px - 1, py) || mia(px + 1, py) || mia(px, py - 1) || mia(px, py + 1);
}
const quante = () => Object.keys(S.piazzole).length;
function prezzoPiazzola() {
  const n = quante() - (ULTIMA - PRIMA + 1) ** 2;
  return Math.round(45 * Math.pow(1.38, Math.max(0, n)));
}
const cellaMia = (cx, cy) => mia((cx / CELLE) | 0, (cy / CELLE) | 0);

function ingombro(cosa) {
  const v = PER_ID[cosa.id];
  return { x: cosa.x, y: cosa.y, w: v.piede[0], h: v.piede[1] };
}
function libera(cx, cy, w, h, salta) {
  for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) {
    const x = cx + i, y = cy + j;
    if (!cellaMia(x, y)) return false;
    if (S.ostacoli[ch(x, y)]) return false;
  }
  for (const c of S.cose) {
    if (c === salta) continue;
    const g = ingombro(c);
    if (cx < g.x + g.w && cx + w > g.x && cy < g.y + g.h && cy + h > g.y) return false;
  }
  // gli ostacoli larghi occupano anche le celle a destra della loro chiave
  for (const k in S.ostacoli) {
    const [ox, oy] = k.split(',').map(Number);
    const [ow, oh] = OSTACOLI[S.ostacoli[k]].piede;
    if (cx < ox + ow && cx + w > ox && cy < oy + oh && cy + h > oy) return false;
  }
  return true;
}

// ---------------------------------------------------------------- disegnare
function pezzo(nome, sx, sy, alfa) {
  const p = PEZZI[nome]; if (!p) return;
  if (alfa != null) ctx.globalAlpha = alfa;
  ctx.drawImage(atlante, p[0], p[1], p[2], p[3],
    Math.round(sx), Math.round(sy), p[2] * SCALA, p[3] * SCALA);
  if (alfa != null) ctx.globalAlpha = 1;
}
// uno sprite si appoggia col fondo sul fondo del suo piede
function posa(nome, cx, cy, piede, alfa) {
  const p = PEZZI[nome]; if (!p) return;
  const larg = p[2] * SCALA;
  const x = cx * CELLA - S.vista.x + (piede[0] * CELLA - larg) / 2;
  const y = (cy + piede[1]) * CELLA - S.vista.y - p[3] * SCALA;
  pezzo(nome, x, y, alfa);
}

// il prato e' quasi tutto una tessera piatta: le varianti spuntano di rado,
// se no da lontano si vede il motivo che si ripete e sembra una tabella
const ERBE = ['erba0', 'erba0', 'erba0', 'erba0', 'erba0', 'erba0',
              'erba1', 'erba2', 'erba3'];
function disegnaPrato() {
  const c0x = Math.max(0, ((S.vista.x / CELLA) | 0) - 1);
  const c0y = Math.max(0, ((S.vista.y / CELLA) | 0) - 1);
  const c1x = Math.min(CELLE * PIAZZOLE, c0x + (tela.width / DPR / CELLA | 0) + 3);
  const c1y = Math.min(CELLE * PIAZZOLE, c0y + (tela.height / DPR / CELLA | 0) + 3);
  for (let cx = c0x; cx < c1x; cx++)
    for (let cy = c0y; cy < c1y; cy++) {
      const e = ERBE[((caso(cx, cy, 7) * 100) | 0) % ERBE.length];
      pezzo(e, cx * CELLA - S.vista.x, cy * CELLA - S.vista.y);
    }
}

// Il selvatico non e' un terreno diverso: e' lo stesso prato al buio. Il
// confine e' netto e cade sul bordo della piazzola, perche' e' un confine
// vero — di la' e' tuo, di qua no, e la sfumatura mentiva su dove passa.
// Il pezzo che puoi comprare adesso e' meno buio degli altri: e' il modo
// di dire «questo, non tutto il bosco» senza scriverlo.
const N_CELLE = CELLE * PIAZZOLE;
function disegnaNebbia() {
  const w = tela.width / DPR, h = tela.height / DPR;
  for (let px = 0; px < PIAZZOLE; px++)
    for (let py = 0; py < PIAZZOLE; py++) {
      if (mia(px, py)) continue;
      const x = px * LATO - S.vista.x, y = py * LATO - S.vista.y;
      if (x > w || y > h || x + LATO < 0 || y + LATO < 0) continue;
      ctx.fillStyle = comprabile(px, py) ? 'rgba(10,26,18,.34)' : 'rgba(10,26,18,.62)';
      ctx.fillRect(x, y, LATO, LATO);
    }
}

// Quello che compri e' esattamente il riquadro tratteggiato: nessuna
// sorpresa su quanto viene, e gli ostacoli che ci stanno dentro si vedono
// gia' prima di pagare.
function cartelli() {
  const w = tela.width / DPR, h = tela.height / DPR;
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  for (let px = 0; px < PIAZZOLE; px++)
    for (let py = 0; py < PIAZZOLE; py++) {
      if (!comprabile(px, py)) continue;
      const x = px * LATO - S.vista.x, y = py * LATO - S.vista.y;
      if (x > w || y > h || x + LATO < 0 || y + LATO < 0) continue;
      const p = prezzoPiazzola(), posso = S.monete >= p;

      ctx.save();
      ctx.setLineDash([9, 7]);
      ctx.lineDashOffset = -orologio * 14;      // il tratteggio cammina piano
      ctx.lineWidth = 3;
      ctx.strokeStyle = posso ? 'rgba(255,224,138,.95)' : 'rgba(255,255,255,.42)';
      ctx.strokeRect(x + 2, y + 2, LATO - 4, LATO - 4);
      ctx.restore();

      const cx = x + LATO / 2, cy = y + LATO / 2;
      const pc = PEZZI['cartello'];
      posaLibera('cartello', cx - pc[2] * SCALA / 2, cy - pc[3] * SCALA + 14);
      ctx.font = '700 15px system-ui,sans-serif';
      ctx.fillStyle = posso ? '#3a2a12' : '#7a2a2a';
      ctx.fillText('🪙' + p, cx, cy + 4);
    }
  ctx.textAlign = 'left';
}
function posaLibera(nome, x, y) {
  const p = PEZZI[nome]; if (!p) return;
  ctx.drawImage(atlante, p[0], p[1], p[2], p[3],
    Math.round(x), Math.round(y), p[2] * SCALA, p[3] * SCALA);
}

// ---------------------------------------------------------------- gli attori
// Un attore è chiunque cammini: la bambina, il cane, domani una gallina.
// Sono tutti lo stesso formato — 16×32, quattro fotogrammi per verso, bande
// giù / lato / su — perché è quello che restituiscono i generatori di
// immagini, e perché così questa classe non sa chi sta disegnando. Aggiungere
// una bestia è mettere un png in `poc/attori/` e rilanciare `atlante-gfx.py`:
// qui non si tocca niente.
//
// Le pose di lato guardano a destra. La sinistra è la stessa specchiata, e
// non c'è un verso «sinistra» nell'atlante: c'è nella testa dell'attore.
const attori = [];
let bambina = null;   // quella che segue il dito; gli altri girano da soli

class Attore {
  constructor(nome, cx, cy, opz = {}) {
    this.nome = nome;
    this.x = (cx + .5) * CELLA;
    this.y = (cy + .5) * CELLA;
    this.verso = 'giu';
    this.passo = 0;
    this.meta = null;
    this.velocita = opz.velocita || 108;
    this.vaga = opz.vaga || 0;        // ogni quanti secondi si sposta da sé
    this.attesa = 1 + Math.random() * 3;
    attori.push(this);
  }

  get cella() { return { x: (this.x / CELLA) | 0, y: (this.y / CELLA) | 0 }; }

  vaiA(cx, cy) { this.meta = { x: (cx + .5) * CELLA, y: (cy + .5) * CELLA }; }

  // quanto dista, in celle, da un punto: serve per sapere se è «arrivata»
  distanzaDa(cx, cy) {
    return Math.hypot(this.x - (cx + .5) * CELLA, this.y - (cy + .5) * CELLA) / CELLA;
  }

  muovi(dt) {
    if (!this.meta) {
      if (!this.vaga) return;
      this.attesa -= dt;
      if (this.attesa > 0) return;
      this.attesa = this.vaga * (.6 + Math.random());
      // gira lì attorno, e resta su quello che è tuo: un cane che sparisce
      // nel bosco è un cane che non si trova più
      const c = this.cella;
      for (let prova = 0; prova < 12; prova++) {
        const x = c.x + ((Math.random() * 9) | 0) - 4;
        const y = c.y + ((Math.random() * 9) | 0) - 4;
        if (cellaMia(x, y)) { this.vaiA(x, y); break; }
      }
      return;
    }
    const dx = this.meta.x - this.x, dy = this.meta.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 3) { this.meta = null; return; }
    const v = this.velocita * dt;
    this.x += dx / d * Math.min(v, d);
    this.y += dy / d * Math.min(v, d);
    this.passo += dt;
    if (Math.abs(dx) > Math.abs(dy)) this.verso = dx > 0 ? 'lato' : 'sinistra';
    else this.verso = dy > 0 ? 'giu' : 'su';
  }

  disegna() {
    const fr = this.meta ? 1 + (((this.passo * 6) | 0) % 3) : 0;
    const specchio = this.verso === 'sinistra';
    const p = PEZZI[`${this.nome}_${specchio ? 'lato' : this.verso}${fr}`];
    if (!p) return;
    const w = p[2] * SCALA, h = p[3] * SCALA;
    const x = Math.round(this.x - S.vista.x - w / 2);
    const y = Math.round(this.y - S.vista.y - h + CELLA / 2);
    if (specchio) {
      ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1);
      ctx.drawImage(atlante, p[0], p[1], p[2], p[3], 0, 0, w, h);
      ctx.restore();
    } else {
      ctx.drawImage(atlante, p[0], p[1], p[2], p[3], x, y, w, h);
    }
  }
}

let orologio = 0;
function disegna() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, tela.width / DPR, tela.height / DPR);
  disegnaPrato();

  // tutto quello che sta in scena, ordinato per quanto e' avanti
  const scena = [];
  for (const k in S.ostacoli) {
    const [x, y] = k.split(',').map(Number);
    const o = OSTACOLI[S.ostacoli[k]];
    scena.push({ nome: o.pezzo, x, y, piede: o.piede, fondo: y + o.piede[1] });
  }
  for (const c of S.cose) {
    if (preso && preso.da === c) continue;   // e' in mano, non per terra
    const v = PER_ID[c.id]; if (!v) continue;
    let nome = v.pezzo;
    if (v.anima) nome = v.anima[((orologio * 4) | 0) % v.anima.length];
    scena.push({ nome, x: c.x, y: c.y, piede: v.piede,
                 fondo: v.sotto ? -1 : c.y + v.piede[1] });
  }
  for (const a of attori) scena.push({ attore: a, fondo: a.y / CELLA + 1 });
  scena.sort((a, b) => a.fondo - b.fondo);

  for (const e of scena) {
    if (e.attore) { e.attore.disegna(); continue; }
    posa(e.nome, e.x, e.y, e.piede);
  }

  disegnaNebbia();
  cartelli();
}

// ---------------------------------------------------------------- la vista
function limita() {
  const w = tela.width / DPR, h = tela.height / DPR;
  S.vista.x = Math.round(Math.max(Math.min(0, w - MONDO), Math.min(S.vista.x, MONDO - w)));
  S.vista.y = Math.round(Math.max(Math.min(0, h - MONDO), Math.min(S.vista.y, MONDO - h)));
}
function vaiACasa() {
  const c = ((PRIMA + ULTIMA + 1) / 2) * LATO;
  S.vista.x = c - tela.width / DPR / 2;
  S.vista.y = c - tela.height / DPR / 2;
  limita();
}
const cellaDa = (sx, sy) => ({
  x: ((sx + S.vista.x) / CELLA) | 0, y: ((sy + S.vista.y) / CELLA) | 0 });

function ostacoloSotto(cx, cy) {
  for (const k in S.ostacoli) {
    const [ox, oy] = k.split(',').map(Number);
    const [ow, oh] = OSTACOLI[S.ostacoli[k]].piede;
    if (cx >= ox && cx < ox + ow && cy >= oy && cy < oy + oh)
      return { k, x: ox, y: oy, t: S.ostacoli[k] };
  }
  return null;
}
function cosaSotto(cx, cy) {
  for (let i = S.cose.length - 1; i >= 0; i--) {
    const g = ingombro(S.cose[i]);
    if (cx >= g.x && cx < g.x + g.w && cy >= g.y && cy < g.y + g.h) return S.cose[i];
  }
  return null;
}

// ---------------------------------------------------------------- monete
const borsa = document.getElementById('borsa');
const quanteEl = document.getElementById('quante');
function aggiornaBorsa(sobbalza) {
  quanteEl.textContent = S.monete;
  if (sobbalza) { borsa.classList.remove('su'); void borsa.offsetWidth; borsa.classList.add('su'); }
  riempiScaffale();
}
function paga(n) {
  if (S.monete < n) { avvisa('Ti servono ' + (n - S.monete) + ' monete in più — si guadagnano giocando.'); return false; }
  S.monete -= n; aggiornaBorsa(true); salva(); return true;
}
function incassa(n) { S.monete += n; aggiornaBorsa(true); salva(); }

const avvisoEl = document.getElementById('avviso');
let avvisoFra = 0;
function avvisa(testo) {
  avvisoEl.textContent = testo;
  avvisoEl.classList.add('c-e');
  avvisoFra = 2.6;
}

// ---------------------------------------------------------------- lo scaffale
const scaffale = document.getElementById('scaffale');
const schedeEl = document.getElementById('schede');
const robaEl = document.getElementById('roba');
let categoria = CATEGORIE[0].chiave;

document.getElementById('maniglia').addEventListener('click',
  () => scaffale.classList.toggle('aperto'));

function provino(nome, lato) {
  const p = PEZZI[nome];
  const c = document.createElement('canvas');
  const z = Math.max(1, Math.min(3, Math.floor(lato / Math.max(p[2], p[3]))));
  c.width = p[2] * z; c.height = p[3] * z;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(atlante, p[0], p[1], p[2], p[3], 0, 0, c.width, c.height);
  return c;
}

// Quanti ne hai da parte. Uno che ce l'hai non si ricompra: si tira fuori.
const quantiNe = id => S.magazzino[id] || 0;

// Una carta sola per tutti e due i posti, lo scaffale e il magazzino: dice
// «ne hai 3» oppure «costa 8», mai tutte e due le cose insieme, perche' sono
// due situazioni diverse e non due meta' della stessa.
function cartaVoce(v) {
  const ne = quantiNe(v.id);
  const d = document.createElement('div');
  d.className = 'voce' + (!ne && v.prezzo > S.monete ? ' cara' : '') + (ne ? ' tua' : '');
  d.dataset.id = v.id;
  d.appendChild(provino(v.pezzo, 42));
  const n = document.createElement('div'); n.className = 'nome'; n.textContent = v.nome;
  const p = document.createElement('div');
  p.className = 'prezzo' + (ne ? ' tuo' : '');
  p.textContent = ne ? '×' + ne : '🪙' + v.prezzo;
  d.append(n, p);
  return d;
}

function riempiScaffale() {
  if (!atlante.complete) return;
  schedeEl.innerHTML = '';
  for (const c of CATEGORIE) {
    const b = document.createElement('div');
    b.className = 'scheda' + (c.chiave === categoria ? ' viva' : '');
    b.textContent = c.nome;
    b.addEventListener('click', () => { categoria = c.chiave; riempiScaffale(); });
    schedeEl.appendChild(b);
  }
  robaEl.innerHTML = '';
  const cat = CATEGORIE.find(c => c.chiave === categoria);
  for (const v of cat.voci) robaEl.appendChild(cartaVoce(v));
}

// ---------------------------------------------------------------- trascinare
let preso = null;      // { v, da }  da = la cosa che stiamo spostando, o null
let giu = null;        // il dito premuto
let lungo = null;      // il timer dell'anellino
let scorrendo = false;

function prendi(v, da) {
  inArrivo = null;
  preso = { v, da };
  const p = PEZZI[v.pezzo];
  const c = provino(v.pezzo, 999);
  fantasma.src = c.toDataURL();
  fantasma.style.width = p[2] * SCALA + 'px';
  fantasma.style.display = 'block';
  scaffale.classList.remove('aperto');
}
function muoviPreso(sx, sy) {
  if (!preso) return;
  fantasma.style.left = (sx - parseInt(fantasma.style.width) / 2) + 'px';
  fantasma.style.top = (sy - parseInt(fantasma.style.width)) + 'px';
}
function posaPreso(sx, sy) {
  if (!preso) return;
  const { v, da } = preso;
  preso = null; fantasma.style.display = 'none';
  const c = cellaDa(sx, sy);
  const cx = c.x - ((v.piede[0] - 1) / 2 | 0), cy = c.y;
  if (!libera(cx, cy, v.piede[0], v.piede[1], da)) {
    avvisa('Lì non ci sta.'); return;
  }
  if (da) {
    if (da.x === cx && da.y === cy) return;      // rimettere dov'era e' gratis
    if (!paga(1)) return;
    da.x = cx; da.y = cy;
  } else {
    const inMagazzino = (S.magazzino[v.id] || 0) > 0;
    if (inMagazzino) { S.magazzino[v.id]--; if (!S.magazzino[v.id]) delete S.magazzino[v.id]; }
    else if (!paga(v.prezzo)) return;
    S.cose.push({ i: S.prossimo++, id: v.id, x: cx, y: cy });
  }
  salva();
}

// ---------------------------------------------------------------- i pannelli
const chiudi = () => { inArrivo = null; velo.classList.remove('c-e'); };
function apri(html) { foglio.innerHTML = html; velo.classList.add('c-e'); }
function tasto(sel, fn) { const b = foglio.querySelector(sel); if (b) b.addEventListener('click', fn); }
velo.addEventListener('click', e => { if (e.target === velo) chiudi(); });

function pannelloPiazzola(px, py) {
  const p = prezzoPiazzola();
  apri(`<h2>Un altro pezzo di terra</h2>
    <p>Costa <b>🪙${p}</b>. Ogni pezzo dopo costa un po' di più.</p>
    <div class="fila">
      <button class="bot piano" data-no>Lascia stare</button>
      <button class="bot forte" data-si ${S.monete < p ? 'disabled' : ''}>Compra</button>
    </div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-si]', () => {
    if (!paga(p)) return;
    S.piazzole[ch(px, py)] = 1; chiudi(); salva();
  });
}

function pannelloOstacolo(o) {
  const d = OSTACOLI[o.t];
  apri(`<h2>${d.nome}</h2>
    <p>Sgombrarlo costa <b>🪙${d.costo}</b>, e quello che ne ricavi vale
       <b>🪙${d.resa}</b>. Conviene: è così che si finanzia la fattoria.</p>
    <div class="fila">
      <button class="bot piano" data-no>Lascia stare</button>
      <button class="bot forte" data-si ${S.monete < d.costo ? 'disabled' : ''}>Sgombra</button>
    </div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-si]', () => {
    if (!paga(d.costo)) return;
    delete S.ostacoli[o.k];
    incassa(d.resa); chiudi(); salva();
  });
}

function pannelloCosa(cosa) {
  const v = PER_ID[cosa.id];
  apri(`<h2>${v.nome}</h2>
    <p>Tienilo premuto per spostarlo (costa una monetina). Oppure rimettilo
       fra la tua roba: non si perde e non si rimborsa, di là ci resta.</p>
    <div class="fila">
      <button class="bot piano" data-no>Va bene così</button>
      <button class="bot" data-via>Mettilo via</button>
    </div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-via]', () => {
    S.cose = S.cose.filter(c => c !== cosa);
    S.magazzino[cosa.id] = (S.magazzino[cosa.id] || 0) + 1;
    chiudi(); salva();
  });
}

// Il magazzino non e' l'elenco di quello che possiedi: e' l'elenco di tutto,
// con sopra scritto quanti ne hai. Cosi' e' un posto solo — quello che c'e'
// da avere, e a che punto sei — invece di un negozio da una parte e una
// cassapanca dall'altra, che sono la stessa domanda fatta due volte.
// Toccare compra, tenere premuto e tirare piazza: sono due gesti, e il
// secondo non passa dal primo.
function pannelloMagazzino() {
  const avuti = CATALOGO.filter(v => quantiNe(v.id)).length;
  apri(`<h2>La roba</h2>
    <p>Tocca per <b>comprarne uno</b>. Quello che hai resta tuo:
       <b>tienilo premuto e tira</b> per metterlo giù dove vuoi.
       ${avuti ? `Ne hai da parte di ${avuti} tipi.` : 'Per ora non hai niente da parte.'}</p>
    <div class="schede" id="cat"></div>
    <div class="griglia" id="gri"></div>
    <div class="fila"><button class="bot" data-no>Chiudi</button></div>`);
  const cat = foglio.querySelector('#cat');
  const gri = foglio.querySelector('#gri');

  const riempi = () => {
    cat.innerHTML = '';
    for (const c of CATEGORIE) {
      const b = document.createElement('div');
      b.className = 'scheda' + (c.chiave === categoria ? ' viva' : '');
      b.textContent = c.nome;
      b.addEventListener('click', () => { categoria = c.chiave; riempi(); });
      cat.appendChild(b);
    }
    gri.innerHTML = '';
    for (const v of CATEGORIE.find(c => c.chiave === categoria).voci)
      gri.appendChild(cartaVoce(v));
  };
  riempi();

  // un dito solo per due gesti: se si sposta, sta tirando fuori la cosa;
  // se non si sposta, sta comprando
  let dito = null;
  gri.addEventListener('pointerdown', e => {
    const carta = e.target.closest('.voce'); if (!carta) return;
    dito = { id: carta.dataset.id, x: e.clientX, y: e.clientY, tirato: false };
  });
  gri.addEventListener('pointermove', e => {
    if (!dito || dito.tirato) return;
    if (Math.abs(e.clientX - dito.x) + Math.abs(e.clientY - dito.y) < 12) return;
    const v = PER_ID[dito.id];
    if (!quantiNe(v.id) && v.prezzo > S.monete) {
      avvisa('Costa 🪙' + v.prezzo + ' — te ne mancano ' + (v.prezzo - S.monete) + '.');
      dito = null; return;
    }
    dito.tirato = true;
    chiudi();
    prendi(v, null);
    muoviPreso(e.clientX, e.clientY);
  });
  gri.addEventListener('pointerup', e => {
    if (!dito || dito.tirato) { dito = null; return; }
    const v = PER_ID[dito.id]; dito = null;
    if (!paga(v.prezzo)) return;
    S.magazzino[v.id] = quantiNe(v.id) + 1;
    salva(); riempi();
  });

  tasto('[data-no]', chiudi);
}

// ---------------------------------------------------------------- il dito
function pos(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

tela.addEventListener('pointerdown', e => {
  const p = pos(e);
  giu = { x: p.x, y: p.y, x0: p.x, y0: p.y, t: performance.now(), mosso: false };
  scorrendo = false;
  const c = cellaDa(p.x, p.y);
  const cosa = cosaSotto(c.x, c.y);
  if (cosa && cellaMia(c.x, c.y)) {
    lungo = setTimeout(() => {
      lungo = null;
      prendi(PER_ID[cosa.id], cosa);
      muoviPreso(p.x, p.y);
    }, 320);
  }
});

addEventListener('pointermove', e => {
  const p = pos(e);
  if (preso) { muoviPreso(p.x, p.y); return; }
  if (!giu) return;
  const dx = p.x - giu.x, dy = p.y - giu.y;
  if (Math.abs(p.x - giu.x0) + Math.abs(p.y - giu.y0) > 10) {
    giu.mosso = true; scorrendo = true;
    if (lungo) { clearTimeout(lungo); lungo = null; }
  }
  if (scorrendo) { S.vista.x -= Math.round(dx); S.vista.y -= Math.round(dy); limita(); }
  giu.x = p.x; giu.y = p.y;
});

addEventListener('pointercancel', () => {
  if (lungo) { clearTimeout(lungo); lungo = null; }
  preso = null; fantasma.style.display = 'none'; giu = null;
});

addEventListener('pointerup', e => {
  if (lungo) { clearTimeout(lungo); lungo = null; }
  const p = pos(e.changedTouches ? { touches: e.changedTouches } : e);
  if (preso) { posaPreso(p.x, p.y); giu = null; return; }
  if (!giu) return;
  const veloce = performance.now() - giu.t < 400;
  const fermo = !giu.mosso;
  giu = null;
  if (!fermo || !veloce) return;

  const c = cellaDa(p.x, p.y);
  const px = (c.x / CELLE) | 0, py = (c.y / CELLE) | 0;
  if (comprabile(px, py)) return vaiEpoi(c.x, c.y, () => pannelloPiazzola(px, py));
  const o = ostacoloSotto(c.x, c.y);
  if (o) return vaiEpoi(c.x, c.y, () => pannelloOstacolo(o));
  const cosa = cosaSotto(c.x, c.y);
  if (cosa) return vaiEpoi(c.x, c.y, () => pannelloCosa(cosa));
  if (cellaMia(c.x, c.y)) bambina.vaiA(c.x, c.y);
});

// Prima ci va, poi si decide. Non e' un vezzo: se il pannello si apre da
// lontano, la bambina in scena e' un disegno che si muove e basta — e' il
// fatto di doverci arrivare che la rende quella che fa le cose. E si vede
// anche meglio di cosa stiamo parlando, perche' lei ci sta accanto.
let inArrivo = null;
const VICINO = 2.2;                 // celle: piu' vicino di cosi' e' «li'»

function vaiEpoi(cx, cy, fai) {
  if (bambina.distanzaDa(cx, cy) <= VICINO) { fai(); return; }
  // sul selvatico non ci si mette i piedi: ci si ferma sul bordo di casa
  let mx = cx, my = cy;
  if (!cellaMia(cx, cy)) {
    let meglio = Infinity;
    for (let dx = -3; dx <= 3; dx++) for (let dy = -3; dy <= 3; dy++) {
      const x = cx + dx, y = cy + dy;
      if (!cellaMia(x, y)) continue;
      const d = Math.abs(dx) + Math.abs(dy);
      if (d < meglio) { meglio = d; mx = x; my = y; }
    }
    if (meglio === Infinity) { fai(); return; }
  }
  bambina.vaiA(mx, my);
  inArrivo = { cx, cy, fai, scadenza: orologio + 6 };
}

function controllaArrivo() {
  if (!inArrivo) return;
  if (bambina.distanzaDa(inArrivo.cx, inArrivo.cy) <= VICINO ||
      (!bambina.meta && orologio > inArrivo.scadenza - 5.5) ||
      orologio > inArrivo.scadenza) {
    const fai = inArrivo.fai; inArrivo = null;
    bambina.meta = null;
    fai();
  }
}

// trascinare dallo scaffale
robaEl.addEventListener('pointerdown', e => {
  const carta = e.target.closest('.voce'); if (!carta) return;
  const v = PER_ID[carta.dataset.id]; if (!v) return;
  if (v.prezzo > S.monete && !(S.magazzino[v.id] > 0)) {
    avvisa('Costa 🪙' + v.prezzo + ' — te ne mancano ' + (v.prezzo - S.monete) + '.');
    return;
  }
  e.preventDefault();
  prendi(v, null);
  muoviPreso(e.clientX, e.clientY);
});

// ---------------------------------------------------------------- i tasti
document.getElementById('tCasa').addEventListener('click', vaiACasa);
document.getElementById('tMagazzino').addEventListener('click', pannelloMagazzino);
document.getElementById('tDaCapo').addEventListener('click', () => {
  apri(`<h2>Ricominciare?</h2><p>La fattoria torna com'era il primo giorno.</p>
    <div class="fila"><button class="bot piano" data-no>No</button>
    <button class="bot forte" data-si>Sì, da capo</button></div>`);
  tasto('[data-no]', chiudi);
  tasto('[data-si]', () => {
    localStorage.removeItem(CHIAVE); S = mondoNuovo(); vaiACasa();
    aggiornaBorsa(); chiudi(); salva();
  });
});

// il trucco delle monete, come negli altri prototipi
if (location.hash.startsWith('#monete=')) {
  const n = parseInt(location.hash.slice(8), 10);
  if (n > 0) setTimeout(() => { S.monete = n; aggiornaBorsa(true); salva(); }, 60);
}

// ---------------------------------------------------------------- il giro
function ridimensiona() {
  tela.width = innerWidth * DPR; tela.height = innerHeight * DPR;
  tela.style.width = innerWidth + 'px'; tela.style.height = innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S) limita();
}
addEventListener('resize', ridimensiona);

let ultimo = 0;
function giro(ora) {
  const dt = Math.min(0.05, (ora - ultimo) / 1000 || 0);
  ultimo = ora; orologio += dt;
  for (const a of attori) a.muovi(dt);
  controllaArrivo();
  if (avvisoFra > 0) { avvisoFra -= dt; if (avvisoFra <= 0) avvisoEl.classList.remove('c-e'); }
  if (salvaFra > 0) { salvaFra -= dt; if (salvaFra <= 0) salvaOra(); }
  disegna();
  requestAnimationFrame(giro);
}

atlante.onload = () => {
  ridimensiona();
  carica();
  if (!S.vista || (!S.vista.x && !S.vista.y)) vaiACasa();
  limita();
  const c0 = PRIMA * CELLE;
  bambina = new Attore('bambina', c0 + 7, c0 + 9);
  new Attore('bobtail', c0 + 9, c0 + 10, { velocita: 74, vaga: 2.4 });
  aggiornaBorsa();
  riempiScaffale();
  requestAnimationFrame(giro);
  setTimeout(() => avvisa('Tocca il prato: la bambina ci va. Il bosco intorno si compra.'), 500);
};
atlante.src = ATLANTE;
addEventListener('beforeunload', salvaOra);
</script>
