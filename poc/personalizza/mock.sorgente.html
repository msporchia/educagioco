<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personalizza: il mock</title>
<!-- Il mock dell'interfaccia unica per personalizzare (poc/personalizza/README.md). Si scrive QUI; mock.html lo compone
     `node poc/personalizza/fai.mjs`, mettendo al posto dei due segnaposto i dati (scenari.js) e le foto 3D. -->
<style>
/* ══════════ i temi: cambiano solo i valori, mai la struttura ══════════ */
:root, .tema-fattoria {
  --pagina: #3b2a1a; --foglio: #f7ecd6; --testa-fondo: linear-gradient(#9a6a3c, #7a4f2a); --testa-testo: #fff6e4;
  --testo: #3b2614; --tenue: #8a6a4a; --bordo: #d9bf94; --gettone: #fffaf0; --gettone-bordo: #e2cba2;
  --sel: #d9822b; --sel-fondo: #fde7c4; --prova: #3f8fd0; --tasto: #4f8a3a; --tasto-testo: #fff; --tasto-ombra: #2f5a22;
  --spento: #c9b89a; --anteprima: radial-gradient(ellipse at 50% 88%, #e9d2a6 0 22%, transparent 23%), linear-gradient(#fbf3e2, #f0dfbd);
  --scheda: #ead6b0; --scheda-testo: #6a4a2a; --scheda-sel: #fffaf0; --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --raggio: 14px; --cassetto: #f2e2c2;
}
.tema-sotterraneo {
  --pagina: #0c0a10; --foglio: #1b1720; --testa-fondo: linear-gradient(#2a2330, #1f1a25); --testa-testo: #f1dfb0;
  --testo: #eee3cc; --tenue: #a8987a; --bordo: #4a3e2c; --gettone: #26202c; --gettone-bordo: #4c4030;
  --sel: #e0b44c; --sel-fondo: #3a2f1c; --prova: #6ab0ff; --tasto: #c8992e; --tasto-testo: #1b1408; --tasto-ombra: #7a5a12;
  --spento: #4a4250; --anteprima: radial-gradient(ellipse at 50% 88%, rgba(224,180,76,.28) 0 22%, transparent 23%), radial-gradient(circle at 50% 40%, #3a3044, #17131c 70%);
  --scheda: #2a2330; --scheda-testo: #c9b48a; --scheda-sel: #3a2f1c; --font: Georgia, "Times New Roman", serif;
  --raggio: 10px; --cassetto: #221c28;
}
.tema-animali {
  --pagina: #2d5a3a; --foglio: #fbfaf3; --testa-fondo: linear-gradient(#7cc28a, #5aa86c); --testa-testo: #ffffff;
  --testo: #2f3a2f; --tenue: #7a8a78; --bordo: #cfe3c6; --gettone: #ffffff; --gettone-bordo: #d7e8cf;
  --sel: #f07a5a; --sel-fondo: #ffe6dc; --prova: #3f8fd0; --tasto: #f07a5a; --tasto-testo: #fff; --tasto-ombra: #b84a30;
  --spento: #cdd6c8; --anteprima: radial-gradient(ellipse at 50% 90%, #a8d88a 0 24%, transparent 25%), linear-gradient(#e8f6ff, #d6f0c8);
  --scheda: #e6f2df; --scheda-testo: #4a6a4a; --scheda-sel: #ffffff; --font: "Verdana", "Segoe UI", system-ui, sans-serif;
  --raggio: 18px; --cassetto: #eef6e8;
}

/* ══════════ la pagina del mock ══════════ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #222; }
body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }

/* la barra del mock (non fa parte dell'interfaccia: serve a passare fra scenari, varianti e temi) */
.mock { flex: 0 0 auto; background: #111; color: #ddd; font: 12px system-ui, sans-serif; padding: 4px 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mock .gruppo { display: flex; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
.mock .gruppo button { padding: 0 7px; min-height: 30px; color: #bbb; }
.mock .gruppo button[aria-pressed="true"] { background: #f0c050; color: #111; font-weight: 700; }
.mock .conta { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.mock .conta b { color: #f0c050; font-size: 15px; }
.mock .conta button, .mock .piccolo { border: 1px solid #444; border-radius: 8px; min-height: 30px; padding: 0 8px; color: #bbb; }
.mock.chiuso { padding: 0; }
.mock.chiuso > :not(.apri) { display: none; }
.mock .apri { display: none; }
.mock.chiuso .apri { display: block; width: 100%; min-height: 18px; font-size: 11px; color: #888; }
.mock .riga-nota { width: 100%; color: #999; font-size: 12px; line-height: 1.3; }

/* ══════════ il foglio: una colonna, un solo scorrimento ══════════ */
.telefono { flex: 1 1 auto; min-height: 0; display: flex; justify-content: center; background: var(--pagina); }
.foglio { position: relative; width: 100%; max-width: 430px; min-height: 0; display: flex; flex-direction: column; background: var(--foglio); color: var(--testo); font-family: var(--font); overflow: hidden; }
.testa { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 4px 0 12px; background: var(--testa-fondo); color: var(--testa-testo); }
.testa h2 { margin: 0; font-size: 18px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.testa .saldo { font-weight: 700; font-size: 15px; background: rgba(0,0,0,.22); border-radius: 99px; padding: 5px 10px; white-space: nowrap; }
.testa .x, .testa .indietro { width: 48px; height: 48px; font-size: 22px; color: var(--testa-testo); border-radius: 12px; flex: 0 0 auto; }
.testa .indietro { font-size: 26px; margin-left: -8px; }
.testa .passi { display: flex; gap: 5px; }
.testa .passi i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); }
.testa .passi i.si { background: var(--testa-testo); }

/* l'anteprima: si gira col dito e con le frecce; chi sei e il giro stanno DENTRO, non in righe a sé */
.anteprima { position: relative; flex: 0 0 auto; background: var(--anteprima); touch-action: none; overflow: hidden; cursor: grab; }
.anteprima img { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
.anteprima .gira { position: absolute; top: 50%; translate: 0 -50%; width: 48px; height: 64px; font-size: 34px; line-height: 1; color: var(--testo); opacity: .65; border-radius: 12px; }
.anteprima .gira:active { background: rgba(0,0,0,.08); }
.anteprima .gira.sx { left: 2px; } .anteprima .gira.dx { right: 2px; }
.anteprima .chi { position: absolute; left: 10px; top: 8px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--gettone); border: 1px solid var(--gettone-bordo); }
.anteprima .giro { position: absolute; bottom: 7px; left: 50%; translate: -50% 0; display: flex; gap: 5px; }
.anteprima .giro i { width: 7px; height: 7px; border-radius: 50%; background: var(--tenue); opacity: .35; }
.anteprima .giro i.si { opacity: 1; background: var(--sel); }
.anteprima .vicina { position: absolute; right: 10px; top: 8px; font-size: 11px; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.45); color: #fff; }
.anteprima .avviso { position: absolute; left: 50%; top: 40px; translate: -50% 0; background: var(--tasto); color: var(--tasto-testo); padding: 6px 14px; border-radius: 99px; font-weight: 700; font-size: 14px; animation: sparisci 1.8s forwards; pointer-events: none; white-space: nowrap; }
@keyframes sparisci { 0%, 70% { opacity: 1 } 100% { opacity: 0 } }

/* le schede: vanno a capo, tutte in vista, scritte senza icone */
.schede { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px 0; border-bottom: 2px solid var(--bordo); }
.schede button { flex: 1 1 auto; min-height: 44px; padding: 0 8px; border-radius: 10px 10px 0 0; background: var(--scheda); color: var(--scheda-testo); font-weight: 700; font-size: 14px; }
.schede button[aria-pressed="true"] { background: var(--scheda-sel); color: var(--testo); box-shadow: inset 0 3px 0 var(--sel); }

/* la parte che scorre: una sola */
.corpo { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px; }
.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.griglia.grandi { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }

/* un gettone: la foto 3D, il nome, il prezzo o il livello */
.gettone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 4px 5px; min-height: 44px; border-radius: var(--raggio); background: var(--gettone); border: 2px solid var(--gettone-bordo); }
.gettone .foto { width: 100%; aspect-ratio: 1; border-radius: calc(var(--raggio) - 4px); background-repeat: no-repeat; background-color: var(--anteprima-gettone, transparent); }
.gettone .foto.vuota { display: grid; place-items: center; background: repeating-linear-gradient(45deg, #ccc 0 6px, #bbb 6px 12px); color: #555; font-size: 11px; }
.gettone b { font-size: 12px; font-weight: 700; line-height: 1.15; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.gettone .prezzo { position: absolute; top: -6px; right: -6px; background: var(--sel); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.gettone.addosso { border-color: var(--sel); background: var(--sel-fondo); }
.gettone.prova { border-color: var(--prova); border-style: solid; box-shadow: 0 0 0 2px var(--prova); }
.gettone.chiuso { border-style: dashed; }
.gettone.chiuso .foto { filter: grayscale(.85) brightness(.9); opacity: .6; }
.gettone.chiuso .prezzo { background: var(--spento); color: var(--testo); }

/* le righe delle varianti: forma (gettoni con foto) e colore (pastiglie), sempre a capo, mai di lato */
.righe { flex: 0 0 auto; padding: 6px 8px 4px; border-bottom: 1px solid var(--bordo); background: var(--sel-fondo); }
.righe.libere { background: none; border: 0; padding: 0; }
.riga { display: flex; align-items: flex-start; gap: 6px; padding: 3px 0; }
.riga > span { flex: 0 0 52px; font-size: 11px; font-weight: 700; color: var(--tenue); text-transform: uppercase; letter-spacing: .03em; padding-top: 14px; }
.riga .scelte { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
.riga .gettone { width: 62px; padding: 2px 2px 3px; }
.riga .gettone b { font-size: 11px; }
.pastiglia { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--gettone); box-shadow: 0 0 0 2px var(--gettone-bordo); background-size: cover; }
.pastiglia[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sel); }
.pastiglia.prova { box-shadow: 0 0 0 3px var(--prova); }
.pastiglia.chiuso { opacity: .45; box-shadow: 0 0 0 2px var(--spento); border-style: dashed; }
.pastiglia .prezzo { position: absolute; top: -8px; right: -10px; background: var(--sel); color: #fff; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 99px; white-space: nowrap; }
.pastiglia.chiuso .prezzo { background: var(--spento); color: var(--testo); }
.grandi-righe .gettone { width: 76px; } .grandi-righe .pastiglia { width: 52px; height: 52px; }

/* il fondo: la sola cosa che costa; si paga solo da qui */
.fondo { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px 10px; border-top: 2px solid var(--bordo); background: var(--foglio); }
.fondo .cosa { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; }
.fondo .cosa b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fondo .cosa small { color: var(--tenue); }
.fondo .muto { color: var(--tenue); font-size: 13px; }
.compra { min-height: 48px; padding: 0 14px; border-radius: 12px; background: var(--tasto); color: var(--tasto-testo); font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 var(--tasto-ombra); white-space: nowrap; }
.fondo .compra { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.compra small { font-size: 11px; font-weight: 600; opacity: .85; }
.compra[disabled] { background: var(--spento); color: var(--testo); box-shadow: none; opacity: .8; }
.secondario { min-height: 48px; padding: 0 10px; border-radius: 12px; border: 2px solid var(--bordo); font-weight: 700; font-size: 13px; color: var(--testo); }

/* B: a passi */
.passo-titolo { flex: 0 0 auto; padding: 8px 12px 0; font-size: 15px; font-weight: 700; }
.scheda-cosa { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
.scheda-cosa .cosa { flex: 1; }
.scheda-cosa .cosa b { display: block; font-size: 17px; }
.scheda-cosa .cosa small { color: var(--tenue); font-size: 13px; }
.conto { margin: 4px 12px; border: 2px solid var(--bordo); border-radius: var(--raggio); padding: 8px 12px; font-size: 15px; }
.conto div { display: flex; justify-content: space-between; padding: 3px 0; }
.conto .tot { border-top: 1px solid var(--bordo); margin-top: 4px; padding-top: 6px; font-weight: 800; }

/* C: il cassetto */
.cassetto { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; background: var(--cassetto); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 14px rgba(0,0,0,.18); margin-top: -14px; position: relative; z-index: 1; }
.cassetto .maniglia { flex: 0 0 auto; height: 26px; display: grid; place-items: center; touch-action: none; }
.cassetto .maniglia i { width: 44px; height: 5px; border-radius: 3px; background: var(--tenue); opacity: .6; }
.cassetto .torna { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 10px; font-weight: 700; font-size: 15px; }
.cassetto .torna span { font-size: 24px; line-height: 1; }
.cassetto .schede { padding-top: 0; }

/* chiuso col ✕: nel gioco si torna dov'eri */
.velo-chiuso { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 5; }
.velo-chiuso div { background: var(--foglio); color: var(--testo); border-radius: 16px; padding: 18px; max-width: 300px; text-align: center; font-size: 15px; }
.velo-chiuso .compra { margin-top: 12px; }
</style>
</head>
<body>
<div class="mock" id="mock"></div>
<div class="telefono" id="telefono"><div class="foglio" id="foglio"></div></div>

<!--SCENARI-->
<!--FOTO-->
<script>
'use strict'
const { SCENARI, ANGOLI, FOTO, FOTO_OGGETTI } = window
const $ = id => document.getElementById(id)

// ══════════ lo stato del mock ══════════
const mock = { scenario: 'fattoria', variante: 'A', tema: null, tocchi: 0, chiusoMock: false }
const stati = {}
const P = v => { const [o, f, c] = String(v || '-/-/-').split('/'); return { o, f, c } }
const S = () => SCENARI[mock.scenario]
function nuovoStato(s) {
  const st = { chi: s.chiDiSerie, indossato: {}, prova: {}, provaSet: null, posseduti: new Set(), saldo: s.valuta.saldo, angolo: 0,
    scheda: s.schede[0].id, aperto: {}, passo: 1, cosa: null, cassetto: 'basso', livelloC: 'oggetti', ultimoPosto: null, avviso: '', chiuso: false }
  for (const chi of s.chi) st.indossato[chi.id] = { ...s.base[chi.id] }
  for (const [id, o] of Object.entries(s.oggetti)) if (o.posseduto) {
    st.posseduti.add(id)
    for (const chi of s.chi) { const fs = formeDi(o, chi.id); if (fs[0]) st.posseduti.add(id + '/' + fs[0].id) }
  }
  for (const chi of s.chi) for (const v of Object.values(s.base[chi.id])) segnaPosseduto(st, v, chi.id, s)
  return st
}
const T = () => (stati[mock.scenario] = stati[mock.scenario] || nuovoStato(S()))

// ══════════ il catalogo ══════════
const nomeDi = (o, chi) => (o && typeof o.nome === 'object' ? o.nome[chi] : o && o.nome) || ''
const formeDi = (o, chi) => (!o || !o.forme ? [] : Array.isArray(o.forme) ? o.forme : o.forme[chi] || [])
const formaDi = (o, f, chi) => formeDi(o, chi).find(x => x.id === f) || null
function coloriDi(o, f, chi) { const fo = formaDi(o, f, chi); return (fo && fo.colori) || o.colori || [] }
const chiaveColore = (o, f, c, chi) => { const og = S().oggetti[o], fo = formaDi(og, f, chi); return fo && fo.colori ? `${o}/${f}:${c}` : `${o}:${c}` }
const perChi = (o, chi) => !o.per || o.per.includes(chi)
const oggettiDelPosto = (posto, chi) => Object.entries(S().oggetti).filter(([, o]) => o.posto === posto && !o.tratto && perChi(o, chi)).map(([id]) => id)
function segnaPosseduto(st, v, chi, s = S()) {
  const { o, f, c } = P(v), og = s.oggetti[o]
  if (!og) return
  st.posseduti.add(o); if (f !== '-') st.posseduti.add(o + '/' + f)
  if (c !== '-') { const fo = formeDi(og, chi).find(x => x.id === f); st.posseduti.add(fo && fo.colori ? `${o}/${f}:${c}` : `${o}:${c}`) }
}
/** Il primo valore di un oggetto: la forma e il colore di base (o quello che si ha addosso, se è lui). */
function valoreDi(oid, chi) {
  const og = S().oggetti[oid], addosso = { ...T().indossato[chi], ...T().prova }[og.posto]
  if (P(addosso).o === oid) return addosso
  const f = formeDi(og, chi)[0], cs = coloriDi(og, f && f.id, chi)
  return `${oid}/${f ? f.id : '-'}/${cs[0] ? cs[0].id : '-'}`
}

/** Quanto costa mettersi addosso `v`: { righe: [[nome, prezzo]], tot, liv }. Chi compra un oggetto (o una forma) lo prende nel colore che
    prova; la forma e il colore di base vengono con l'oggetto; un altro colore dopo si paga (`prezzoColore`, o il prezzo del colore). */
function costo(v, chi = T().chi) {
  const s = S(), st = T(), { o, f, c } = P(v), og = s.oggetti[o], r = { righe: [], tot: 0, liv: 0 }
  if (!og) return r
  const fs = formeDi(og, chi), fo = fs.find(x => x.id === f), cs = coloriDi(og, f, chi), co = cs.find(x => x.id === c)
  for (const x of [og, fo, co]) if (x && x.liv > s.livello) r.liv = Math.max(r.liv, x.liv)
  const aggiungi = (nome, p) => { r.righe.push([nome, p]); r.tot += p }
  let nuovo = false
  if (!og.tratto) {
    if (og.prezzo && !st.posseduti.has(o)) { aggiungi(nomeDi(og, chi), og.prezzo); nuovo = true }
    if (fo && fo.prezzo && !st.posseduti.has(o + '/' + f)) { aggiungi(fs.length > 1 ? `${nomeDi(og, chi)} ${fo.nome.toLowerCase()}` : nomeDi(og, chi), fo.prezzo); nuovo = true }
  }
  if (co && !st.posseduti.has(chiaveColore(o, f, c, chi))) {
    const base = co === cs[0]
    const p = co.prezzo || (og.tratto || base || nuovo ? 0 : og.prezzoColore || 0)
    if (p) aggiungi('colore ' + co.nome.toLowerCase(), p)
  }
  return r
}
function costoSet(set, chi = T().chi) {
  let somma = 0, liv = 0
  for (const v of Object.values(set.pezzi)) { const r = costo(v, chi); somma += r.tot; liv = Math.max(liv, r.liv) }
  return { tot: Math.min(set.prezzo, somma), somma, liv }
}
/** La prova di adesso, tutta: quanto costa, cosa dire, se si può. */
function contoProva() {
  const st = T(), s = S(), posti = Object.keys(st.prova)
  if (!posti.length) return null
  if (st.provaSet) {
    const set = s.set.find(x => x.id === st.provaSet), c = costoSet(set)
    return { nome: set.nome, righe: [[`il set (${Object.keys(set.pezzi).length} pezzi)`, c.tot]], tot: c.tot, liv: c.liv, invece: c.somma > c.tot ? c.somma : 0 }
  }
  const out = { righe: [], tot: 0, liv: 0, nomi: [] }
  for (const p of posti) {
    const r = costo(st.prova[p]); out.righe.push(...r.righe); out.tot += r.tot; out.liv = Math.max(out.liv, r.liv)
    out.nomi.push(nomeValore(st.prova[p]))
  }
  out.nome = out.nomi.join(' e ')
  return out
}
function nomeValore(v, chi = T().chi) {
  const { o, f, c } = P(v), og = S().oggetti[o], fo = formaDi(og, f, chi), co = coloriDi(og, f, chi).find(x => x.id === c)
  const pezzi = [fo && formeDi(og, chi).length > 1 ? fo.nome : nomeDi(og, chi)]
  if (co && coloriDi(og, f, chi).length > 1) pezzi.push(co.nome.toLowerCase())
  return pezzi.join(' ')
}

// ══════════ le azioni ══════════
function scegli(posto, v) {
  const st = T(), r = costo(v)
  st.provaSet = null; st.ultimoPosto = posto
  if (!r.tot && !r.liv) { st.indossato[st.chi][posto] = v; delete st.prova[posto] }
  else st.prova[posto] = v
}
function provaSet(id) {
  const st = T(), set = S().set.find(x => x.id === id)
  st.prova = { ...set.pezzi }; st.provaSet = id; st.ultimoPosto = Object.keys(set.pezzi)[0]
  if (!costoSet(set).tot) { Object.assign(st.indossato[st.chi], set.pezzi); st.prova = {}; st.provaSet = null }
}
function paga() {
  const st = T(), c = contoProva()
  if (!c || c.liv || c.tot > st.saldo) return
  st.saldo -= c.tot
  for (const [p, v] of Object.entries(st.prova)) { segnaPosseduto(st, v, st.chi); st.indossato[st.chi][p] = v }
  st.prova = {}; st.provaSet = null
  st.avviso = c.tot ? `Fatto! −${c.tot} ${S().valuta.simbolo}` : 'Indossato'
}
function comEra() { const st = T(); st.prova = {}; st.provaSet = null }
function cambiaChi(id) { const st = T(); st.chi = id; st.prova = {}; st.provaSet = null; st.ultimoPosto = null }

// ══════════ le foto ══════════
const blob = new Map()
function url(dato) {
  if (!blob.has(dato)) {
    const [testa, b64] = dato.split(','), bin = atob(b64), a = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i)
    blob.set(dato, URL.createObjectURL(new Blob([a], { type: testa.slice(5, testa.indexOf(';')) })))
  }
  return blob.get(dato)
}
const posaStato = (s, p) => ({ ...s.base[p.chi], ...p.diff })
/** La posa fotografata più vicina allo stato: { posa, esatta }. A pari merito vince quella che mostra l'ultimo pezzo toccato. */
function posaPer(stato, chi, ultimo) {
  const s = S(); let meglio = null, punti = -1
  for (const p of s.pose) {
    if (p.chi !== chi || !FOTO[p.id]) continue
    // lo stesso pezzo vale 10, la stessa forma in un altro colore 6, lo stesso oggetto 3
    const ps = posaStato(s, p), simile = k => { const a = P(ps[k]), b = P(stato[k]); return ps[k] === stato[k] ? 10 : a.o === b.o && a.f === b.f ? 6 : a.o === b.o ? 3 : 0 }
    let n = 0, uguali = 0
    for (const k of s.posti) { const x = simile(k); n += x; if (x === 10) uguali++ }
    if (ultimo) n += simile(ultimo) / 2
    if (n > punti) { punti = n; meglio = p; meglio.uguali = uguali }
  }
  return { posa: meglio, esatta: !!meglio && meglio.uguali === s.posti.length }
}
/** La foto di un gettone: lo stato di adesso con quel pezzo cambiato, ritagliato sulla zona. */
function fotoGettone(posto, v, zona) {
  const s = S(), st = T(), og = s.oggetti[P(v).o]
  if (og && og.foto === 'addobbo') { const k = `addobbo:${P(v).f}:${P(v).c}`; if (FOTO_OGGETTI[k]) return { src: url(FOTO_OGGETTI[k]), taglio: [1.05, 0.5, 0.5] } }
  const base = { ...s.base[st.chi], [posto]: v }
  const { posa, esatta } = posaPer(base, st.chi, posto)
  let scelta = posa && (esatta || posaStato(s, posa)[posto] === v) ? posa : null
  // senza la foto di quel colore: la stessa forma in un altro colore, poi lo stesso oggetto
  if (!scelta) for (const uguale of [(a, b) => a.o === b.o && a.f === b.f, (a, b) => a.o === b.o]) {
    scelta = s.pose.find(p => p.chi === st.chi && FOTO[p.id] && uguale(P(posaStato(s, p)[posto]), P(v)))
    if (scelta) break
  }
  if (!scelta) return null
  return { src: url(FOTO[scelta.id][0]), taglio: s.tagli[zona] || s.tagli.tutto }
}
function stileFoto(f) {
  if (!f) return null
  const [z, cx, cy] = f.taglio, pos = c => (z <= 1 ? 50 : Math.max(0, Math.min(100, (c - 1 / (2 * z)) / (1 - 1 / z) * 100)))
  return `background-image:url(${f.src});background-size:${z * 100}%;background-position:${pos(cx)}% ${pos(cy)}%`
}
const fotoHtml = f => (f ? `<span class="foto" style="${stileFoto(f)}"></span>` : '<span class="foto vuota">foto 3D</span>')

// ══════════ i pezzi dell'interfaccia (gli stessi per A, B e C) ══════════
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
const prezzoHtml = (tot, liv) => (liv ? `<span class="prezzo">liv. ${liv}</span>` : tot ? `<span class="prezzo">${tot} ${S().valuta.simbolo}</span>` : '')

function testa({ indietro = false, passi = 0 } = {}) {
  const s = S(), st = T()
  return `<header class="testa">
    ${indietro ? '<button class="indietro" data-azione="indietro" aria-label="indietro">‹</button>' : ''}
    <h2>${esc(s.titolo)}</h2>
    ${passi ? `<span class="passi">${[1, 2, 3, 4].map(i => `<i class="${i <= passi ? 'si' : ''}"></i>`).join('')}</span>` : ''}
    <span class="saldo">${st.saldo} ${s.valuta.simbolo}</span>
    <button class="x" data-azione="chiudi" data-chiudi aria-label="chiudi">✕</button>

}

function anteprima(altezza) {
  const s = S(), st = T(), stato = { ...st.indossato[st.chi], ...st.prova }
  const { posa, esatta } = posaPer(stato, st.chi, st.ultimoPosto)
  const chi = s.nomeChi || s.chi.find(c => c.id === st.chi).nome
  const img = posa ? `<img id="figura" src="${url(FOTO[posa.id][st.angolo])}" alt="">` : ''
  const avviso = st.avviso ? `<span class="avviso">${esc(st.avviso)}</span>` : ''
  st.avviso = ''
  return `<div class="anteprima" data-ruota style="${altezza}">
    ${img}
    <span class="chi">${esc(chi)}</span>
    ${esatta ? '' : '<span class="vicina" title="Il mock ha le foto di un pezzo cambiato alla volta">foto più vicina</span>'}
    <button class="gira sx" data-azione="gira" data-verso="1" aria-label="gira a sinistra">‹</button>
    <button class="gira dx" data-azione="gira" data-verso="-1" aria-label="gira a destra">›</button>
    <span class="giro" id="giro">${ANGOLI.map((_, i) => `<i class="${i === st.angolo ? 'si' : ''}"></i>`).join('')}</span>
    ${avviso}
  </div>`
}

function schede(dove = '') {
  const st = T(), visibili = S().schede.filter(sc => sc.tipo !== 'chi' || S().chi.length > 1)
  return `<nav class="schede ${dove}">${visibili.map(sc => `<button data-azione="scheda" data-id="${sc.id}" aria-pressed="${st.scheda === sc.id}">${esc(sc.nome)}</button>`).join('')}</nav>`
}
const schedaDi = id => S().schede.find(x => x.id === id)
/** Gli oggetti di una scheda di tipo «oggetti». */
function oggettiDi(sc) { const chi = T().chi; return (sc.posti || [sc.posto]).flatMap(p => oggettiDelPosto(p, chi)) }

/** Un gettone di un oggetto nella griglia (la foto è l'oggetto nella forma e nel colore che si ha, o di base). */
function gettoneOggetto(oid, azione = 'oggetto') {
  const s = S(), st = T(), og = s.oggetti[oid], v = valoreDi(oid, st.chi)
  const addosso = P(st.indossato[st.chi][og.posto]).o === oid, inProva = P(st.prova[og.posto]).o === oid
  const r = costo(v), liv = r.liv && !st.posseduti.has(oid) ? r.liv : (og.liv > s.livello ? og.liv : 0)
  const prezzo = st.posseduti.has(oid) ? 0 : (og.prezzo || (formeDi(og, st.chi)[0] || {}).prezzo || 0)
  return `<button class="gettone ${addosso ? 'addosso' : ''} ${inProva ? 'prova' : ''} ${liv ? 'chiuso' : ''}" data-azione="${azione}" data-id="${oid}" aria-pressed="${addosso}">
    ${fotoHtml(fotoGettone(og.posto, v, og.taglio || og.posto))}<b>${esc(nomeDi(og, st.chi))}</b>${prezzoHtml(prezzo, liv)}</button>`
}
function gettoneChi(c) {
  const s = S(), st = T(), { posa } = posaPer(st.indossato[c.id], c.id, null)
  const f = posa ? { src: url(FOTO[posa.id][0]), taglio: s.tagli.tutto } : null
  return `<button class="gettone ${st.chi === c.id ? 'addosso' : ''}" data-azione="chi" data-id="${c.id}" aria-pressed="${st.chi === c.id}">${fotoHtml(f)}<b>${esc(c.nome)}</b></button>`
}
function gettoneSet(set) {
  const s = S(), st = T(), c = costoSet(set), p = s.pose.find(x => x.chi === st.chi && JSON.stringify(x.diff) === JSON.stringify(set.pezzi))
  const f = p && FOTO[p.id] ? { src: url(FOTO[p.id][0]), taglio: s.tagli.tutto } : null
  return `<button class="gettone ${st.provaSet === set.id ? 'prova' : ''} ${c.liv ? 'chiuso' : ''}" data-azione="set" data-id="${set.id}">${fotoHtml(f)}<b>${esc(set.nome)}</b>${prezzoHtml(c.tot, c.liv)}</button>`
}
const setsDi = () => S().set.filter(x => !x.per || x.per.includes(T().chi))

/** Le righe delle varianti di un oggetto: la forma (foto) e il colore (pastiglie). `tratto`: le caratteristiche fisiche, col loro nome. */
function righeOggetto(oid, { titolo = false } = {}) {
  const s = S(), st = T(), og = s.oggetti[oid], chi = st.chi
  if (!perChi(og, chi)) return ''
  const ora = { ...st.indossato[chi], ...st.prova }[og.posto], cur = P(ora).o === oid ? P(ora) : P(valoreDi(oid, chi))
  const fs = formeDi(og, chi), cs = coloriDi(og, cur.f, chi), righe = []
  const inProva = P(st.prova[og.posto])
  if (fs.length > 1) righe.push(`<div class="riga"><span>${esc(og.nomeForme || 'Forma')}</span><div class="scelte">${fs.map(fo => {
    const cc = coloriDi(og, fo.id, chi), col = cc.find(x => x.id === cur.c) || cc[0], v = `${oid}/${fo.id}/${col ? col.id : '-'}`
    const r = costo(v), sel = cur.f === fo.id && P(ora).o === oid
    return `<button class="gettone ${sel ? (inProva.o === oid ? 'prova' : 'addosso') : ''} ${r.liv ? 'chiuso' : ''}" data-azione="valore" data-posto="${og.posto}" data-v="${v}" aria-pressed="${sel}">
      ${fotoHtml(fotoGettone(og.posto, v, og.taglio || og.posto))}<b>${esc(fo.nome)}</b>${prezzoHtml(st.posseduti.has(oid + '/' + fo.id) ? 0 : r.tot, r.liv)}</button>`
  }).join('')}</div></div>`)
  if (cs.length > 1) righe.push(`<div class="riga"><span>${esc(og.tratto ? og.nomeColori || og.nome : 'Colore')}</span><div class="scelte">${cs.map(co => {
    const v = `${oid}/${cur.f}/${co.id}`, r = costo(v), sel = cur.c === co.id && P(ora).o === oid
    const fondo = co.css ? `background:${co.css}` : stileFoto(fotoGettone(og.posto, v, og.taglio || og.posto)) || 'background:#999'
    return `<button class="pastiglia ${sel && inProva.o === oid ? 'prova' : ''} ${r.liv ? 'chiuso' : ''}" style="${fondo}" data-azione="valore" data-posto="${og.posto}" data-v="${v}" aria-pressed="${sel}" aria-label="${esc(co.nome)}">${prezzoHtml(r.righe.filter(x => x[0].startsWith('colore')).reduce((t, x) => t + x[1], 0), r.liv)}</button>`
  }).join('')}</div></div>`)

}
/** La scheda delle caratteristiche fisiche: una riga per tratto, sempre aperte (pelle, taglio, colore dei capelli, barba). */
function righeTratti(sc) {
  const s = S(), chi = T().chi
  return sc.tratti.filter(t => perChi(s.oggetti[t], chi)).map(t => {
    const og = s.oggetti[t]
    // la pelle ha solo i colori: la riga si chiama «Pelle»
    return og.forme ? righeOggetto(t) : righeOggetto(t).replace('>Colore<', `>${esc(og.nome)}<`)
  }).join('')
}

function fondo() {
  const s = S(), st = T(), c = contoProva()
  if (!c) return `<div class="fondo"><span class="muto">Tocca per provare. Quello che è tuo si mette subito; il resto si paga qui sotto.</span></div>`
  const dettaglio = c.righe.filter(r => r[1]).map(r => `${r[0]} ${r[1]}`).join(' + ') + (c.invece ? ` (invece di ${c.invece})` : '')
  let tasto
  if (c.liv) tasto = `<button class="compra" disabled>Dal livello ${c.liv}</button>`
  else if (c.tot > st.saldo) tasto = `<button class="compra" disabled>Ti mancano ${c.tot - st.saldo} ${s.valuta.simbolo}</button>`
  else tasto = `<button class="compra" data-azione="paga"><span>Acquista e indossa · ${c.tot} ${s.valuta.simbolo}</span><small>${esc(dettaglio)}</small></button>`
  return `<div class="fondo"><button class="secondario" data-azione="comera">Com'era</button>${tasto}</div>`

// ══════════ A · un foglio solo ══════════
// testa · anteprima · schede · [le righe dell'oggetto aperto] · griglia che scorre · fondo che paga
function variaA() {
  const st = T(), sc = schedaDi(st.scheda)
  let righe = '', corpo
  if (sc.tipo === 'chi') corpo = `<div class="griglia grandi">${S().chi.map(gettoneChi).join('')}</div>`
  else if (sc.tipo === 'set') corpo = `<div class="griglia grandi">${setsDi().map(gettoneSet).join('')}</div>`
  else if (sc.tipo === 'tratti') corpo = `<div class="righe libere">${righeTratti(sc)}</div>`
  else {
    const ids = oggettiDi(sc), aperto = st.aperto[sc.id] ?? ids.find(id => P(st.indossato[st.chi][S().oggetti[id].posto]).o === id)
    if (aperto) righe = righeOggetto(aperto)

  }
  return `${testa()}${anteprima('flex:0 0 34%;min-height:190px')}${schede()}${righe ? `<div class="righe">${righe}</div>` : ''}<div class="corpo">${corpo}</div>${fondo()}`

// ══════════ B · a passi ══════════
// 1. scegli (schede e griglia, niente anteprima) → 2. lo vedi grande e lo giri → 3. forma e colore → 4. il conto
function variaB() {
  const st = T(), s = S(), sc = schedaDi(st.scheda)
  if (st.passo === 1) {
    let corpo
    if (sc.tipo === 'chi') corpo = s.chi.map(gettoneChi).join('')
    else if (sc.tipo === 'set') corpo = setsDi().map(gettoneSet).join('')
    else if (sc.tipo === 'tratti') corpo = sc.tratti.filter(t => perChi(s.oggetti[t], st.chi)).map(t => gettoneOggetto(t)).join('')
    else corpo = oggettiDi(sc).map(id => gettoneOggetto(id)).join('')
    return `${testa({ passi: 1 })}<div class="passo-titolo">Cosa vuoi provare?</div>${schede()}<div class="corpo"><div class="griglia grandi">${corpo}</div></div>`
  }
  const c = contoProva(), cosa = st.cosa
  if (st.passo === 2) {
    const og = cosa && cosa.oggetto && s.oggetti[cosa.oggetto]
    const varianti = og && (formeDi(og, st.chi).length > 1 || coloriDi(og, P(valoreDi(cosa.oggetto, st.chi)).f, st.chi).length > 1)
    const nome = cosa.chi ? s.chi.find(x => x.id === cosa.chi).nome : cosa.set ? s.set.find(x => x.id === cosa.set).nome : og.tratto ? og.nome : nomeValore({ ...st.indossato[st.chi], ...st.prova }[og.posto])
    let tasto
    if (cosa.chi) tasto = `<button class="compra" data-azione="b-fatto">È questo</button>`
    else if (c && c.liv) tasto = `<button class="compra" disabled>Dal livello ${c.liv}</button>`
    else if (c) tasto = `<button class="compra" data-azione="b-conto">Acquista e indossa · ${c.tot} ${s.valuta.simbolo}</button>`
    else tasto = `<button class="compra" data-azione="b-fatto">Fatto</button>`
    return `${testa({ indietro: true, passi: 2 })}${anteprima('flex:1 1 auto;min-height:220px')}
      <div class="scheda-cosa"><span class="cosa"><b>${esc(nome)}</b><small>${c ? (c.tot ? `${c.tot} ${s.valuta.simbolo}` : '') : 'È tuo'}</small></span>
      ${varianti ? `<button class="secondario" data-azione="b-varianti">${og.tratto ? 'Scegli' : 'Forma e colore'}</button>` : ''}</div>
      <div class="fondo">${tasto}</div>`
  }
  if (st.passo === 3) {
    return `${testa({ indietro: true, passi: 3 })}${anteprima('flex:0 0 42%;min-height:200px')}
      <div class="corpo grandi-righe">${righeOggetto(cosa.oggetto)}</div>
      <div class="fondo"><span class="cosa"><b>${esc(nomeValore({ ...st.indossato[st.chi], ...st.prova }[s.oggetti[cosa.oggetto].posto]))}</b><small>${c ? `${c.tot} ${s.valuta.simbolo}` : 'È tuo'}</small></span><button class="compra" data-azione="b-avanti">Fatto</button></div>`
  }

  return `${testa({ indietro: true, passi: 4 })}${anteprima('flex:0 0 36%;min-height:180px')}
    <div class="passo-titolo">${esc(c.nome)}</div>
    <div class="conto">${c.righe.filter(r => r[1]).map(r => `<div><span>${esc(r[0])}</span><span>${r[1]} ${s.valuta.simbolo}</span></div>`).join('')}
      ${c.invece ? `<div><small>invece di ${c.invece} ${s.valuta.simbolo}</small></div>` : ''}
      <div class="tot"><span>Ti restano</span><span>${st.saldo - c.tot} ${s.valuta.simbolo}</span></div></div>
    <div class="corpo"></div>
    <div class="fondo">${c.tot > st.saldo ? `<button class="compra" disabled>Ti mancano ${c.tot - st.saldo} ${s.valuta.simbolo}</button>` : `<button class="compra" style="flex:1" data-azione="b-paga">Acquista e indossa · ${c.tot} ${s.valuta.simbolo}</button>`}</div>`
}

// ══════════ C · la figura fissa e il cassetto ══════════
// testa · anteprima che prende tutto il resto · il cassetto (schede e griglia, oppure la pagina di un oggetto) col suo fondo che paga
function variaC() {
  const st = T(), s = S(), sc = schedaDi(st.scheda)
  let dentro
  if (st.livelloC === 'oggetto' && st.cosa && st.cosa.oggetto) {

// ══════════ disegnare ══════════
function disegna() {
  const s = S(), st = T(), tema = mock.tema || s.tema

// ══════════ il dito ══════════
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mock]')
  if (b) {
    const k = b.dataset.mock, id = b.dataset.id
    if (k === 'scenario') mock.scenario = id
    else if (k === 'variante') { mock.variante = id; const st = T(); st.passo = 1; st.livelloC = 'oggetti' }
    else if (k === 'tema') mock.tema = id || null
    else if (k === 'azzera') mock.tocchi = 0
    else if (k === 'ricomincia') { delete stati[mock.scenario]; mock.tocchi = 0 }
    else if (k === 'chiudi') mock.chiusoMock = true
    else if (k === 'apri') mock.chiusoMock = false
    disegna(); return
  }
  if (trascinato) { trascinato = false; return }
  const a = e.target.closest('[data-azione]')
  if (!a || !$('foglio').contains(a)) return
  mock.tocchi++
  const st = T(), s = S(), id = a.dataset.id
  switch (a.dataset.azione) {
    case 'gira': giraDi(Number(a.dataset.verso)); disegnaMock(); return
    case 'chiudi': st.chiusoProva = Object.keys(st.prova).length > 0; comEra(); st.chiuso = true; break
    case 'riapri': st.chiuso = false; st.passo = 1; st.livelloC = 'oggetti'; mock.tocchi--; break
    case 'scheda': st.scheda = id; st.livelloC = 'oggetti'; break
    case 'chi': cambiaChi(id); if (mock.variante === 'B') { st.cosa = { chi: id }; st.passo = 2 } break
    case 'set': provaSet(id); if (mock.variante === 'B') { st.cosa = { set: id }; st.passo = 2 } break
    case 'oggetto': {
      const og = s.oggetti[id]
      st.aperto[st.scheda] = id
      if (!og.tratto) scegli(og.posto, valoreDi(id, st.chi))
      if (mock.variante === 'B') { st.cosa = { oggetto: id }; st.passo = og.tratto ? 3 : 2 }
      break
    }
    case 'c-oggetto': { const og = s.oggetti[id]; scegli(og.posto, valoreDi(id, st.chi)); st.cosa = { oggetto: id }; st.livelloC = 'oggetto'; break }
    case 'c-torna': st.livelloC = 'oggetti'; break
    case 'cassetto': st.cassetto = st.cassetto === 'alto' ? 'basso' : 'alto'; break
    case 'valore': scegli(a.dataset.posto, a.dataset.v); break
    case 'paga': paga(); break
    case 'comera': comEra(); break
    case 'indietro': st.passo = st.passo === 4 ? 2 : st.passo === 3 ? (s.oggetti[st.cosa.oggetto].tratto ? 1 : 2) : 1; if (st.passo === 1) comEra(); break
    case 'b-varianti': st.passo = 3; break
    case 'b-avanti': st.passo = contoProva() ? 2 : 2; break
    case 'b-conto': st.passo = 4; break
    case 'b-fatto': st.passo = 1; st.avviso = 'Indossato'; break
    case 'b-paga': paga(); st.passo = 1; break
  }
  disegna()
})

// girare: trascinando sull'anteprima (uno scatto ogni 28 px, la pagina non scorre) o con le frecce
let trascina = null, trascinato = false
const PASSO = 28
function giraDi(d) {
  const st = T(); st.angolo = (st.angolo + d + ANGOLI.length) % ANGOLI.length
  const s = S(), stato = { ...st.indossato[st.chi], ...st.prova }, { posa } = posaPer(stato, st.chi, st.ultimoPosto)
  const img = $('figura'); if (img && posa) img.src = url(FOTO[posa.id][st.angolo])
  const giro = $('giro'); if (giro) [...giro.children].forEach((i, k) => i.classList.toggle('si', k === st.angolo))
}
document.addEventListener('pointerdown', e => {
  const zona = e.target.closest('[data-ruota]')
  if (!zona || e.target.closest('button')) return
  trascina = { x: e.clientX, fatti: 0, mosso: false }
  zona.setPointerCapture(e.pointerId)
})
document.addEventListener('pointermove', e => {
  if (!trascina) return
  const n = Math.trunc((e.clientX - trascina.x) / PASSO)
  if (Math.abs(e.clientX - trascina.x) > 12) trascina.mosso = true
  while (n !== trascina.fatti) { const d = n > trascina.fatti ? -1 : 1; giraDi(d); trascina.fatti -= d }
})
const lascia = () => { if (trascina && trascina.mosso) { mock.tocchi++; trascinato = true; setTimeout(() => (trascinato = false), 50); disegnaMock() } trascina = null }
document.addEventListener('pointerup', lascia)
document.addEventListener('pointercancel', lascia)
document.addEventListener('contextmenu', e => e.preventDefault())

disegna()
</script>
